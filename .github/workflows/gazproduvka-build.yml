# Сборка установщиков ГазПродувки: Windows (.exe) и macOS (.dmg, Apple Silicon + Intel).
# Готовые файлы публикуются в GitHub Release «gazproduvka-v<версия>».
name: Сборка ГазПродувки
on:
  workflow_dispatch:
  push:
    paths: ['gazproduvka/desktop/**', '.github/workflows/gazproduvka-build.yml']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --bundles nsis
            out: |
              gazproduvka/desktop/src-tauri/target/release/GazProduvka.exe
              gazproduvka/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin --bundles dmg
            out: |
              gazproduvka/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gazproduvka/desktop/src-tauri
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Сборка
        working-directory: gazproduvka/desktop/src-tauri
        run: cargo tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: GazProduvka-${{ matrix.name }}
          path: ${{ matrix.out }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Публикация установщиков
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gazproduvka-v2.2.0
          target_commitish: ${{ github.sha }}
          name: ГазПродувка 2.2.0 — установщики Windows и macOS
          body: |
            ГазПродувка 2.2.0 — мониторинг и оптимизация продувок газовых скважин, прямое подключение к PostgreSQL.
            • Windows 10/11: GazProduvka_*_x64-setup.exe (установщик) или GazProduvka.exe (без установки).
            • macOS 11+ (Apple Silicon и Intel): GazProduvka_*_universal.dmg. Первый запуск: правый клик → «Открыть».
          files: |
            out/GazProduvka-windows/**/*.exe
            out/GazProduvka-macos/**/*.dmg
          make_latest: false
