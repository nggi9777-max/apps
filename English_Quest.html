<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>English Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: a travel route of boarding-pass tickets; each city is a topic, games open in a full-screen "gate" stage */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F6F8FC; --ink:#14213D; --muted:#56637F; --line:#D8DFEB;
  --accent:#F2A900; --accent-ink:#14213D; --sky:#2B57CF; --sky-soft:#E3EAFB;
  --ok:#17905F; --ok-soft:#DDF3E9; --bad:#C9402F; --bad-soft:#FBE3DF;
  --heat0:#E2E7F0; --shadow:0 1px 2px rgba(20,33,61,.06),0 8px 24px rgba(20,33,61,.07);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1525; --surface:#172137; --surface2:#1D2943; --ink:#E7ECF6; --muted:#9BA8C4; --line:#2A3858;
  --accent:#FFC23D; --accent-ink:#14213D; --sky:#86A3FF; --sky-soft:#22305A;
  --ok:#3CCB8E; --ok-soft:#173A31; --bad:#FF7E6E; --bad-soft:#43201E;
  --heat0:#222E4A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1525; --surface:#172137; --surface2:#1D2943; --ink:#E7ECF6; --muted:#9BA8C4; --line:#2A3858;
  --accent:#FFC23D; --accent-ink:#14213D; --sky:#86A3FF; --sky-soft:#22305A;
  --ok:#3CCB8E; --ok-soft:#173A31; --bad:#FF7E6E; --bad-soft:#43201E;
  --heat0:#222E4A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.25rem} h3{font-size:1rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
.muted{color:var(--muted)}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;margin-right:auto;background:none;border:0;padding:0}
.logo b{color:var(--sky)}
.pills{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:16px;height:16px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}

/* nav */
#nav{display:flex;gap:4px;padding-block:6px;overflow-x:auto}
#nav button{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;border:0;background:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
#nav button svg{width:20px;height:20px}
#nav button.on{background:var(--sky-soft);color:var(--sky)}
.navbar{background:var(--surface);border-bottom:1px solid var(--line)}
@media (max-width:720px){
  .navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  #nav{justify-content:space-between;padding-block:4px}
  #nav button{flex-direction:column;gap:2px;font-size:.66rem;padding:6px 4px;flex:1;min-width:0}
  main{padding-bottom:96px!important}
  footer{padding-bottom:100px!important}
}

main{padding-block:20px 40px;display:flex;flex-direction:column;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sec-h{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.sec-h p{margin:4px 0 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid transparent;background:var(--sky);color:#fff;font-weight:600;min-height:44px}
.btn svg{width:18px;height:18px}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.greet{display:flex;gap:16px;align-items:center;background:var(--sky);color:#fff;border:0}
.greet h1{font-size:1.35rem}
.greet p{margin:6px 0 0;opacity:.92;font-size:.95rem}
.greet .mascot{flex:none}
.daily{display:flex;flex-direction:column;gap:10px}
.daily .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.75rem}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.phrase{display:flex;justify-content:space-between;gap:12px;align-items:center}
.phrase .en{font-family:var(--f-display);font-size:1.05rem;font-weight:500}

/* route & tickets */
.route{display:flex;flex-direction:column;gap:0}
.leg{display:flex;align-items:center;gap:10px;padding:6px 0 6px 34px;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;position:relative;min-height:34px}
.leg::before{content:"";position:absolute;left:44px;top:0;bottom:0;border-left:2px dashed var(--line)}
.leg span{margin-left:28px}
.ticket{display:grid;grid-template-columns:1fr auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden;text-align:left;padding:0;width:100%;box-shadow:var(--shadow);transition:transform .15s}
.ticket:hover:not(.lock){transform:translateY(-2px)}
.ticket .main{padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;min-width:0}
.ticket .code{font-family:var(--f-display);font-size:1.8rem;font-weight:700;color:var(--sky);grid-row:span 2;letter-spacing:.02em}
.ticket .city{font-weight:700;font-size:1.05rem}
.ticket .topic{color:var(--muted);font-size:.9rem;min-width:0}
.ticket .meta{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.ticket .meta div{display:flex;flex-direction:column}
.ticket .meta b{font-variant-numeric:tabular-nums;font-size:.92rem}
.ticket .stub{border-left:2px dashed var(--line);padding:14px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:96px;background:var(--surface2)}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;right:88px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket .stub::before{top:-10px}.ticket .stub::after{bottom:-10px}
.stars{display:flex;gap:2px;color:var(--line)}
.stars svg{width:18px;height:18px}
.stars .on{color:var(--accent)}
.ticket.lock{opacity:.6;cursor:not-allowed}
.ticket.lock .code{color:var(--muted)}
.stub .st{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
@media (max-width:480px){.ticket .stub{min-width:78px;padding:12px 8px}.ticket .stub::before,.ticket .stub::after{right:70px}.ticket .code{font-size:1.4rem}.ticket .main{padding:12px 14px}}

/* city page */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:.9rem}
.chip small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:border-color .15s,transform .15s;min-width:0}
.gcard:hover{border-color:var(--sky);transform:translateY(-1px)}
.gcard .gi{width:42px;height:42px;border-radius:12px;background:var(--sky-soft);color:var(--sky);display:grid;place-items:center;flex:none}
.gcard .gi svg{width:22px;height:22px}
.gcard b{display:block}
.gcard span{font-size:.85rem;color:var(--muted)}
.gcard.boss{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);grid-column:1/-1}
.gcard.boss .gi{background:rgba(20,33,61,.12);color:var(--accent-ink)}
.gcard.boss span{color:var(--accent-ink);opacity:.8}
.backlink{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--sky);font-weight:600;font-size:.88rem;padding:6px 14px 6px 8px;display:inline-flex;gap:4px;align-items:center;min-height:36px;margin-bottom:-8px}
.backlink svg{width:18px;height:18px;flex:none}
.backlink:hover{border-color:var(--sky)}
.select{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;min-height:44px;max-width:100%}

/* stage */
#stage{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.st-head{display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:2}
.st-title{font-family:var(--f-display);font-weight:700;font-size:1rem;display:flex;flex-direction:column;min-width:0}
.st-title small{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.8rem}
.st-score{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.st-body{max-width:680px;margin:0 auto;padding-block:20px 40px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:14px}
.prog span{display:block;height:100%;background:var(--sky);border-radius:99px;transition:width .3s}
.timer{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px}
.timer span{display:block;height:100%;background:var(--accent);width:100%}
.qcount{font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:8px;font-variant-numeric:tabular-nums}
.qprompt{font-family:var(--f-display);font-size:1.5rem;font-weight:500;margin:4px 0 6px;overflow-wrap:anywhere}
.qprompt .e{font-size:2.2rem;display:block;margin-bottom:4px}
.qsub{color:var(--muted);margin-bottom:12px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media (max-width:460px){.choices{grid-template-columns:1fr}}
.choice{padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:1rem;text-align:left;min-height:54px;overflow-wrap:anywhere}
.choice:hover{border-color:var(--sky)}
.choice.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.fb{min-height:28px;margin-top:14px;font-weight:600}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.duelbar{display:flex;gap:10px;margin-bottom:12px}
.duelbar span{flex:1;padding:8px 12px;border-radius:10px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.duelbar span.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:600;min-height:52px;text-align:left;overflow-wrap:anywhere}
.tile.sel{border-color:var(--sky);background:var(--sky-soft)}
.tile.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);opacity:.65;pointer-events:none}
.tile.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:460px){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{aspect-ratio:3/4;max-width:100%;border-radius:12px;border:2px solid var(--line);background:var(--sky);color:#fff;font-weight:600;display:grid;place-items:center;padding:6px;font-size:.88rem;text-align:center;overflow-wrap:anywhere;transition:transform .25s}
.mcard .back{font-family:var(--f-display);font-size:1.3rem;opacity:.5}
.mcard.up{background:var(--surface);color:var(--ink)}
.mcard.got{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);pointer-events:none}
.mcard .e{font-size:1.5rem;display:block}

/* scramble & builder */
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:56px;padding:10px;border-radius:12px;border:2px dashed var(--line);background:var(--surface);margin:14px 0}
.slots.ok{border-color:var(--ok);background:var(--ok-soft)}
.slots.bad{border-color:var(--bad);background:var(--bad-soft)}
.letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ltr{min-width:44px;height:48px;padding:0 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:1.1rem;text-transform:lowercase}
.ltr.used{visibility:hidden}
.wtok{padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:1rem}
.slots .wtok,.slots .ltr{background:var(--sky-soft);border-color:var(--sky)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}

/* falling */
.fall-hud{display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px;font-variant-numeric:tabular-nums}
.fall-hud .hearts{color:var(--bad);letter-spacing:3px}
.fall-sky{position:relative;height:290px;border-radius:var(--r);background:linear-gradient(var(--sky-soft),var(--surface));border:1px solid var(--line);overflow:hidden}
.drop{position:absolute;top:8px;padding:8px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--sky);font-family:var(--f-display);font-weight:500;font-size:1.05rem;box-shadow:var(--shadow);white-space:nowrap}
.drop .e{margin-right:6px}
.drop.hit{border-color:var(--ok);background:var(--ok-soft)}
.drop.miss{border-color:var(--bad);background:var(--bad-soft)}
.ground{position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,var(--bad) 0 14px,transparent 14px 24px);opacity:.5}

/* hangman balloons */
.balloons{display:flex;justify-content:center}
.balloons svg{width:220px;max-width:100%;height:auto}
.word-mask{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.word-mask span{width:34px;height:44px;border-bottom:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.kbd{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.kbd button{width:38px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.kbd button.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.kbd button.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}

/* flashcard */
.flash{perspective:1000px;margin:10px 0}
.fcard{width:100%;min-height:240px;border:0;background:none;padding:0;position:relative;transform-style:preserve-3d;transition:transform .45s}
.fcard.flip{transform:rotateY(180deg)}
.fface{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;box-shadow:var(--shadow)}
.fface.b{transform:rotateY(180deg);background:var(--sky);color:#fff;border:0}
.fface .e{font-size:3rem}
.fface .w{font-family:var(--f-display);font-size:1.8rem;font-weight:700;overflow-wrap:anywhere;text-align:center}
.box-ind{display:flex;gap:4px;justify-content:center;margin-top:6px}
.box-ind i{width:22px;height:6px;border-radius:9px;background:var(--line)}
.box-ind i.on{background:var(--ok)}

/* listen */
.big-say{width:96px;height:96px;border-radius:50%;border:0;background:var(--sky);color:#fff;display:grid;place-items:center;margin:10px auto}
.big-say svg{width:40px;height:40px}
.inp{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.15rem;text-align:center}
.inp:focus{border-color:var(--sky);outline:none}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form-grid .inp{text-align:left;font-size:1rem;padding:11px 12px}

/* dialog */
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:85%;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.bub.me{align-self:flex-end;background:var(--sky);color:#fff;border:0;border-bottom-right-radius:4px}
.bub.npc{border-bottom-left-radius:4px}
.bub.hint{align-self:center;background:var(--bad-soft);color:var(--bad);border:0;font-size:.92rem;max-width:100%}
.bub .tr{font-size:.86rem;color:var(--muted);margin-top:4px}
.bub .who{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.bub .tools{display:flex;gap:6px;margin-top:6px}
.mini{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:3px 8px;font-size:.78rem;display:inline-flex;gap:4px;align-items:center}
.mini svg{width:14px;height:14px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opts .choice{text-align:left}

/* grammar */
details.gram{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.gram summary{padding:16px 18px;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:10px;list-style:none}
details.gram summary::-webkit-details-marker{display:none}
details.gram summary::after{content:"+";font-family:var(--f-display);color:var(--sky)}
details.gram[open] summary::after{content:"–"}
details.gram .gb{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px;max-width:65ch}
.ex{display:flex;flex-direction:column;padding:8px 12px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 8px 8px 0}
.ex b{font-weight:600}
.ex span{font-size:.88rem;color:var(--muted)}
.gq{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .e{font-size:1.4rem;width:32px;text-align:center}
.li .t{flex:1;min-width:0}
.li .t b{display:block;overflow-wrap:anywhere}
.li .t span{font-size:.86rem;color:var(--muted)}
.cnt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--bad);background:var(--bad-soft);padding:2px 8px;border-radius:99px;font-size:.8rem;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.two>*{min-width:0}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile-s{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile-s .v{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.lvlbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.lvlbar span{display:block;height:100%;background:var(--accent)}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:4px;width:max-content}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--heat0)}
.heat i.l1{background:color-mix(in srgb,var(--ok) 35%,var(--heat0))}
.heat i.l2{background:color-mix(in srgb,var(--ok) 60%,var(--heat0))}
.heat i.l3{background:color-mix(in srgb,var(--ok) 82%,var(--heat0))}
.heat i.l4{background:var(--ok)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin-top:10px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar i{width:100%;max-width:38px;background:var(--sky);border-radius:6px 6px 2px 2px;min-height:2px}
.bar i.today{background:var(--accent)}
.bar b{color:var(--ink);font-size:.78rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.badge .bi{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);flex:none;font-family:var(--f-display);font-weight:700}
.badge.got .bi{background:var(--accent);color:var(--accent-ink)}
.badge:not(.got){opacity:.6}
.badge b{font-size:.86rem;display:block}
.badge span{font-size:.75rem;color:var(--muted)}
textarea.inp{text-align:left;font-size:.85rem;min-height:90px;resize:vertical;font-family:ui-monospace,Menlo,monospace}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-weight:600;font-size:.88rem}
.seg button.on{background:var(--sky);color:#fff}

/* result */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:10px}
.result .big{font-family:var(--f-display);font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.result .xp{font-family:var(--f-display);color:var(--accent-ink);background:var(--accent);padding:6px 14px;border-radius:99px;font-weight:700}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding-block:10px 30px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

function mascot(size=72,mood="smile"){
  const mouth=mood==="sad"?'<path d="M30 50q6-5 12 0" stroke="#14213D" stroke-width="3" fill="none" stroke-linecap="round"/>':'<path d="M29 46q7 7 14 0" stroke="#14213D" stroke-width="3" fill="none" stroke-linecap="round"/>';

/* ============ STATE ============ */
const KEY="englishQuest.v1";
function def(){return{xp:0,days:{},stars:{},srs:{},mist:{},custom:[],badges:[],dialogs:{},daily:"",stats:{ans:0,ok:0,games:0},set:{ui:"ru",tr:"ru",theme:"system",sound:true,accent:"en-GB"}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==="object"){const d=def();return Object.assign(d,s,{set:Object.assign(d.set,s.set||{}),stats:Object.assign(d.stats,s.stats||{})})}}catch(e){}return def()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=k=>(T[S.set.ui]&&T[S.set.ui][k]!==undefined)?T[S.set.ui][k]:(T.ru[k]!==undefined?T.ru[k]:k);
const L=o=>o?(o[S.set.ui]||o.ru):"";
const dStr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>dStr(new Date());
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return dStr(d)}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const norm=s=>String(s).toLowerCase().replace(/[^a-z' ]/g,"").replace(/\s+/g," ").trim();

const ALL=[];CITIES.forEach(c=>c.words.forEach(w=>ALL.push({en:w[0],e:w[1],ru:w[2],uz:w[3],c:c.id})));
const SENTS=[];CITIES.forEach(c=>c.sents.forEach(s=>SENTS.push({en:s[0],ru:s[1],uz:s[2],gap:s[3],c:c.id})));
const tr=w=>(S.set.tr==="uz"&&w.uz)?w.uz:(w.ru||w.uz||"");
const strL=s=>(S.set.tr==="uz"&&s.uz)?s.uz:s.ru;
const myWords=()=>S.custom.map(w=>({en:w.en,e:w.e||"⭐",ru:w.ru||w.uz,uz:w.uz||w.ru,c:"my"}));
const allWords=()=>ALL.concat(myWords());
const findWord=en=>allWords().find(w=>w.en===en);
const cityIdx=id=>CITIES.findIndex(c=>c.id===id);
const isUnlocked=i=>i===0||(S.stars[CITIES[i-1].id]||0)>=1;
const unlockedCities=()=>CITIES.filter((c,i)=>isUnlocked(i));
function streak(){let d=today(),n=0;if(!S.days[d])d=addDays(d,-1);while(S.days[d]){n++;d=addDays(d,-1)}return n}
function learnedCount(){return Object.values(S.srs).filter(x=>x.b>=3||x.c>=5).length}
function levelInfo(){const per=150,lv=Math.floor(S.xp/per)+1;const names=t("lvl_names");return{lv,name:names[Math.min(names.length-1,Math.floor((lv-1)/2))],pct:(S.xp%per)/per*100,left:per-S.xp%per}}

/* sound & speech */
let actx=null;
function beep(ok){if(!S.set.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.connect(g);g.connect(actx.destination);const n=actx.currentTime;if(ok){o.frequency.setValueAtTime(660,n);o.frequency.setValueAtTime(880,n+.09)}else{o.frequency.setValueAtTime(220,n);o.frequency.setValueAtTime(170,n+.12)}g.gain.setValueAtTime(.14,n);g.gain.exponentialRampToValueAtTime(.001,n+.28);o.start(n);o.stop(n+.3)}catch(e){}}
const hasTTS=()=>"speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";
function say(text){if(!hasTTS())return false;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=S.set.accent;u.rate=.88;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.replace("_","-").startsWith(S.set.accent));if(v)u.voice=v;speechSynthesis.speak(u);return true}catch(e){return false}}

/* toast & confetti */
let toastT=0;
function toast(msg){const el=$("#toast");el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#F2A900","#2B57CF","#17905F","#C9402F","#86A3FF"];const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight/2.5,vx:(Math.random()-.5)*11,vy:Math.random()*-11-3,s:Math.random()*6+4,c:pick(cols),r:Math.random()*6}));let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<80)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}

/* progress recording */
function addXP(n){S.xp+=n;const d=today();S.days[d]=(S.days[d]||0)+n;save();checkBadges();renderHeader()}
function touch(w,ok){if(!w)return;const s=S.srs[w.en]||{b:0,d:today(),c:0};if(ok)s.c=(s.c||0)+1;S.srs[w.en]=s}
function record(w,ok){if(!w)return;S.stats.ans++;if(ok){S.stats.ok++;const m=S.mist[w.en];if(m){m.h=(m.h||0)+1;if(m.h>=2)delete S.mist[w.en]}}else{const m=S.mist[w.en]||{n:0,h:0};m.n++;m.h=0;S.mist[w.en]=m}touch(w,ok);save()}
function recordS(s,ok){S.stats.ans++;const k="§"+s.en;if(ok){S.stats.ok++;const m=S.mist[k];if(m){m.h=(m.h||0)+1;if(m.h>=2)delete S.mist[k]}}else{const m=S.mist[k]||{n:0,h:0,s:{en:s.en,ru:s.ru,uz:s.uz}};m.n++;m.h=0;S.mist[k]=m}save()}
function award(id){if(S.badges.includes(id))return;S.badges.push(id);save();const b=BADGES.find(b=>b[0]===id);if(b)setTimeout(()=>toast(t("new_badge")+": "+b[1]),700)}
function checkBadges(){if(S.stats.games>=1)award("first");if(S.xp>=100)award("xp100");if(S.xp>=500)award("xp500");if(S.xp>=1000)award("xp1000");const st=streak();if(st>=3)award("s3");if(st>=7)award("s7");const lc=learnedCount();if(lc>=25)award("w25");if(lc>=50)award("w50");if(Object.values(S.stars).some(v=>v>=1))award("boss");if(CITIES.every(c=>(S.stars[c.id]||0)>=1))award("world");if(DIALOGS.every(d=>S.dialogs[d.id]))award("talk");if(S.custom.length>=5)award("my5")}

/* ============ SHELL ============ */
let route="map",routeArg=null,gameSrc="all";
const NAV=[["map","nav_map","map"],["games","nav_games","games"],["talk","nav_talk","talk"],["grammar","nav_grammar","book"],["notes","nav_notes","note"],["progress","nav_progress","chart"]];
function applyTheme(){const r=document.documentElement;if(S.set.theme==="system")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.set.theme);r.lang=S.set.ui}
function renderHeader(){
  $("#logoBtn").innerHTML=mascot(34)+"<span>English <b>Quest</b></span>";
  const li=levelInfo();
  $("#pills").innerHTML=`<span class="pill" title="${t("streak")}">${I.flame}${streak()} ${t("days")}</span><span class="pill" title="${t("level")}">${I.bolt}${S.xp} XP · ${t("level")} ${li.lv}</span>`;
  $("#gearBtn").innerHTML=I.gear;$("#gearBtn").setAttribute("aria-label",t("settings"));
  $("#nav").innerHTML=NAV.map(([r,k,ic])=>`<button data-r="${r}" class="${route===r||(r==="map"&&route==="city")?"on":""}">${I[ic]}<span>${t(k)}</span></button>`).join("");
  $$("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.r));
}
function go(r,arg){route=r;routeArg=arg||null;render();window.scrollTo(0,0)}
function render(){applyTheme();renderHeader();const v=$("#view");const fn={map:vMap,city:vCity,games:vGames,talk:vTalk,grammar:vGrammar,notes:vNotes,progress:vProgress,settings:vSettings}[route]||vMap;v.innerHTML="";fn(v)}
$("#logoBtn").onclick=()=>go("map");
$("#gearBtn").onclick=()=>go("settings");

/* ============ VIEWS ============ */
const hashDay=()=>today().split("").reduce((a,c)=>a+c.charCodeAt(0)*7,0);
function dailyPlan(){const games=["match","scramble","falling","memory","quiz","gap","builder","tf"];const h=hashDay();const cs=unlockedCities();return{g:games[h%games.length],c:cs[h%cs.length]}}
function starsHTML(n){return `<span class="stars">${[0,1,2].map(i=>`<span class="${i<n?"on":""}">${I.star}</span>`).join("")}</span>`}

function vMap(v){
  const h=new Date().getHours();const gr=h<12?t("g_morning"):h<18?t("g_day"):t("g_evening");
  const tips=t("tips");const tip=tips[hashDay()%tips.length];
  const dp=dailyPlan();const doneD=S.daily===today();
  const ph=PHRASES[hashDay()%PHRASES.length];
  let html=`<section class="hero">
    <div class="card greet">${mascot(80)}<div><h1>${gr}</h1><p>${tip}</p></div></div>
    <div class="card daily"><div class="row"><span class="label">${t("daily")}</span>${doneD?`<span class="tag ok">✓</span>`:`<span class="tag">${t("x2")}</span>`}</div>
      <div><b style="font-size:1.1rem">${t("g_"+dp.g)}</b><div class="muted">${L(dp.c.name)} · ${L(dp.c.topic)}</div></div>
      ${doneD?`<div class="muted">${t("daily_done")}</div>`:`<div><button class="btn accent" id="dailyBtn">${t("start")}</button></div>`}
    </div>
  </section>
  <section class="card phrase"><div><div class="label">${t("phrase")}</div><div class="en">${esc(ph[0])}</div><div class="muted">${S.set.tr==="uz"?ph[2]:ph[1]}</div></div><button class="icon-btn" id="phSay" aria-label="${t("listen")}">${I.sound}</button></section>
  <section><div class="sec-h"><div><h2>${t("route")}</h2><p class="muted">${t("route_sub")}</p></div></div><div class="route" style="margin-top:14px">`;
  CITIES.forEach((c,i)=>{const un=isUnlocked(i),st=S.stars[c.id]||0;
    html+=`<div class="leg"><span>${c.from} → ${c.code} · ${c.km} km</span></div>
    <button class="ticket ${un?"":"lock"}" data-c="${c.id}" ${un?"":'aria-disabled="true"'}>
      <div class="main"><div class="code">${c.code}</div><div class="city">${L(c.name)}</div><div class="topic">${L(c.topic)}</div>
        <div class="meta"><div><span class="label">${t("flight")}</span><b>EQ ${101+i}</b></div><div><span class="label">${t("words")}</span><b>${c.words.length}</b></div><div><span class="label">${t("dist")}</span><b>${c.km} km</b></div></div></div>
      <div class="stub">${starsHTML(st)}<span class="st">${!un?t("locked"):st?t("passed"):t("open")}</span></div>
    </button>`});
  html+=`</div></section>`;
  v.innerHTML=html;
  $$(".ticket").forEach(b=>b.onclick=()=>{const i=cityIdx(b.dataset.c);if(!isUnlocked(i)){toast(t("locked_msg"));return}go("city",b.dataset.c)});
  $("#phSay").onclick=()=>{if(!say(ph[0]))toast(t("no_tts"))};
  const db=$("#dailyBtn");if(db)db.onclick=()=>launch(dp.g,ctxFrom("city:"+dp.c.id,true));
}

const GAMES=[["match","link"],["scramble","shuffle"],["falling","down"],["memory","grid"],["hangman","balloon"],["builder","blocks"],["listen","ear"]];
const TESTS=[["quiz","timer"],["gap","pencil"],["tf","check"],["duel","users"]];
function gcard(k,ic,extra=""){return `<button class="gcard ${extra}" data-g="${k}"><span class="gi">${I[ic]}</span><span style="min-width:0"><b>${t("g_"+k)}</b><span>${t("g_"+k+"_d")}</span></span></button>`}

function vCity(v){
  const c=CITIES.find(x=>x.id===routeArg);if(!c)return go("map");
  const st=S.stars[c.id]||0;
  v.innerHTML=`<button class="backlink" id="bk">${I.back} ${t("nav_map")}</button>
  <section class="ticket" style="cursor:default"><div class="main"><div class="code">${c.code}</div><div class="city">${L(c.name)}</div><div class="topic">${L(c.topic)}</div></div><div class="stub">${starsHTML(st)}<span class="st">EQ ${101+cityIdx(c.id)}</span></div></section>
  <section class="card"><div class="sec-h"><h3>${t("city_words")}</h3><span class="muted" style="font-size:.85rem">${t("tap_hear")}</span></div>
    <div class="chips" style="margin-top:12px">${c.words.map((w,i)=>`<button class="chip" data-w="${i}">${w[1]} ${esc(w[0])} <small>${esc(S.set.tr==="uz"?w[3]:w[2])}</small></button>`).join("")}</div></section>
  <section><h2>${t("learn")}</h2><div class="grid" style="margin-top:12px"><button class="gcard" data-g="flash"><span class="gi">${I.cards}</span><span><b>${t("flash")}</b><span>${t("flash_d")}</span></span></button></div></section>
  <section><h2>${t("play")}</h2><div class="grid" style="margin-top:12px">${GAMES.map(g=>gcard(g[0],g[1])).join("")}</div></section>
  <section><h2>${t("test")}</h2><div class="grid" style="margin-top:12px">${TESTS.map(g=>gcard(g[0],g[1])).join("")}
    <button class="gcard boss" data-g="boss"><span class="gi">${I.trophy}</span><span><b>${t("exam")}</b><span>${t("exam_d")}</span></span></button></div></section>`;
  $("#bk").onclick=()=>go("map");
  $$(".chip[data-w]").forEach(b=>b.onclick=()=>{if(!say(c.words[+b.dataset.w][0]))toast(t("no_tts"))});
  $$(".gcard").forEach(b=>b.onclick=()=>launch(b.dataset.g,ctxFrom("city:"+c.id)));
}

function vGames(v){
  const opts=[["all",t("src_all")],...unlockedCities().map(c=>["city:"+c.id,c.code+" · "+L(c.name)]),["my",t("src_my")+" ("+S.custom.length+")"],["mist",t("src_mist")+" ("+mistWords().length+")"]];
  v.innerHTML=`<div class="sec-h"><div><h2>${t("games_title")}</h2><p class="muted">${t("games_sub")}</p></div>
    <label style="display:flex;flex-direction:column;gap:4px"><span class="label">${t("src")}</span><select class="select" id="src">${opts.map(o=>`<option value="${o[0]}" ${o[0]===gameSrc?"selected":""}>${esc(o[1])}</option>`).join("")}</select></label></div>
  <section><h3>${t("sec_games")}</h3><div class="grid" style="margin-top:12px"><button class="gcard" data-g="flash"><span class="gi">${I.cards}</span><span><b>${t("flash")}</b><span>${t("flash_d")}</span></span></button>${GAMES.map(g=>gcard(g[0],g[1])).join("")}</div></section>
  <section><h3>${t("sec_tests")}</h3><div class="grid" style="margin-top:12px">${TESTS.map(g=>gcard(g[0],g[1])).join("")}</div></section>`;
  $("#src").onchange=e=>gameSrc=e.target.value;
  $$(".gcard").forEach(b=>b.onclick=()=>launch(b.dataset.g,ctxFrom(gameSrc)));
}

function vTalk(v){
  v.innerHTML=`<div><h2>${t("talk_title")}</h2><p class="muted" style="margin:4px 0 0">${t("talk_sub")}</p></div>
  <div class="grid">${DIALOGS.map(d=>`<button class="gcard" data-d="${d.id}"><span class="gi">${I[d.icon]}</span><span><b>${L(d.title)}</b><span>${S.dialogs[d.id]?"✓ "+t("passed"):(d.steps.length-1)+" × ?"}</span></span></button>`).join("")}</div>`;
  $$(".gcard").forEach(b=>b.onclick=()=>gDialog(DIALOGS.find(d=>d.id===b.dataset.d)));
}

function vGrammar(v){
  const ui=S.set.ui==="uz"?"uz":"ru";
  v.innerHTML=`<div class="sec-h"><div><h2>${t("grammar_title")}</h2><p class="muted">${t("grammar_sub")}</p></div><button class="btn accent" id="lvlBtn">${t("level_test")}</button></div>
  <div style="display:flex;flex-direction:column;gap:10px">${GRAMMAR.map((g,i)=>`<details class="gram" ${i===0?"open":""}><summary>${esc(g.t)}</summary><div class="gb"><p style="margin:0">${g[ui]}</p>
    ${g.ex.map(e=>`<div class="ex"><b>${esc(e[0])}</b><span>${esc(S.set.tr==="uz"?e[2]:e[1])}</span></div>`).join("")}
    <div class="label" style="margin-top:6px">${t("check")}</div><div><b>${esc(g.q[0])}</b></div><div class="gq">${shuffle(g.q[1]).map(o=>`<button class="btn ghost sm" data-gi="${i}" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div></div></details>`).join("")}</div>`;
  $("#lvlBtn").onclick=levelTest;
  $$("[data-gi]").forEach(b=>b.onclick=()=>{const g=GRAMMAR[+b.dataset.gi];const ok=b.dataset.o===g.q[1][0];b.style.background=ok?"var(--ok-soft)":"var(--bad-soft)";b.style.color=ok?"var(--ok)":"var(--bad)";beep(ok);if(ok&&!b.dataset.done){b.dataset.done=1;addXP(2)}});
}

function mistWords(){return Object.keys(S.mist).filter(k=>k[0]!=="§").map(findWord).filter(Boolean)}
function vNotes(v){
  const ents=Object.entries(S.mist).sort((a,b)=>b[1].n-a[1].n);
  v.innerHTML=`<div class="two">

/* ============ STAGE ============ */
let cleanups=[];
function cleanup(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[]}
function later(fn,ms){const id=setTimeout(fn,ms);cleanups.push(()=>clearTimeout(id));return id}
function openStage(title,sub){cleanup();const st=$("#stage");st.hidden=false;st.scrollTop=0;
  st.innerHTML=`<div class="st-head gut"><button class="icon-btn" id="stClose" aria-label="Close">${I.close}</button><div class="st-title">${title}<small>${esc(sub||"")}</small></div><div class="st-score" id="stScore"></div></div><div class="st-body gut" id="stBody"></div>`;
  $("#stClose").onclick=closeStage;document.body.classList.add("noscroll");return $("#stBody")}
function closeStage(){cleanup();try{speechSynthesis.cancel()}catch(e){}$("#stage").hidden=true;document.body.classList.remove("noscroll");render()}
const score=s=>{const el=$("#stScore");if(el)el.textContent=s};

function ctxFrom(src,daily=false){
  let pool,sents,label;
  if(src.startsWith("city:")){const c=CITIES.find(x=>x.id===src.slice(5));pool=ALL.filter(w=>w.c===c.id);sents=SENTS.filter(s=>s.c===c.id);label=L(c.name)}
  else if(src==="my"){pool=myWords();sents=[];label=t("src_my")}
  else if(src==="mist"){pool=mistWords();sents=Object.values(S.mist).filter(m=>m.s).map(m=>SENTS.find(s=>s.en===m.s.en)).filter(Boolean);label=t("src_mist")}
  else{const ids=unlockedCities().map(c=>c.id);pool=ALL.filter(w=>ids.includes(w.c)).concat(myWords());sents=SENTS.filter(s=>ids.includes(s.c));label=t("src_all")}
  if(!sents.length){const ids=unlockedCities().map(c=>c.id);sents=SENTS.filter(s=>ids.includes(s.c))}
  return{pool,sents,label,src,daily}
}
function launch(g,ctx){
  const needWords=!["builder"].includes(g);
  if(needWords&&ctx.pool.length<4){toast(t("need4"));return}
  ({flash:gFlash,match:gMatch,scramble:gScramble,falling:gFalling,memory:gMemory,hangman:gHangman,builder:gBuilder,listen:gListen,quiz:gQuiz,gap:gGap,tf:gTF,duel:gDuel,boss:gBoss}[g])(ctx);
}
function options(w,pool,n,mode){const val=x=>mode==="en"?x.en:tr(x);const right=val(w);const set=new Set([right]);const src=shuffle(pool.concat(shuffle(allWords())));for(const x of src){if(set.size>=n)break;const v=val(x);if(v&&!set.has(v))set.add(v)}return shuffle([...set])}

function finish(o){
  const body=$("#stBody");if(!body)return;
  let gained=o.xp;let dailyHit=false;
  if(o.ctx&&o.ctx.daily&&S.daily!==today()){gained*=2;S.daily=today();dailyHit=true}
  S.stats.games++;addXP(gained);
  const pct=o.total?Math.round(o.ok/o.total*100):0;
  if(o.total&&pct===100&&o.total>=4)award("perfect");
  checkBadges();
  const msg=pct>=80?t("res_great"):pct>=50?t("res_good"):t("res_low");
  body.innerHTML=`<div class="result">${mascot(110,pct<50?"sad":"smile")}
   ${o.total?`<div class="big">${o.ok} / ${o.total}</div>`:""}<div class="xp">+${gained} XP${dailyHit?" · "+t("x2"):""}</div>
   <p style="font-size:1.1rem;font-weight:600;margin:4px 0">${o.msg||msg}</p>${o.extra||""}
   <div class="row"><button class="btn ghost" id="rAgain">${t("again")}</button><button class="btn" id="rDone">${t("done_btn")}</button></div></div>`;
  $("#rAgain").onclick=()=>o.replay&&o.replay();$("#rDone").onclick=closeStage;
  score("");if(pct>=70||o.celebrate)confetti();
}

/* ---------- generic MCQ ---------- */
function runMCQ(qs,o){
  const body=openStage(o.title,o.sub);let i=0,ok=0,sc=[0,0],raf=0;
  function show(){
    if(i>=qs.length)return o.onEnd({ok,total:qs.length,sc});
    const q=qs[i],pl=o.duel?i%2:0;let locked=false;
    score(o.duel?"":`${ok} ✓`);
    body.innerHTML=`<div class="prog"><span style="width:${i/qs.length*100}%"></span></div>
     ${o.duel?`<div class="duelbar"><span class="${pl===0?"on":""}">${t("p1")}: ${sc[0]}</span><span class="${pl===1?"on":""}">${t("p2")}: ${sc[1]}</span></div>`:""}
     <div class="qcount">${i+1} / ${qs.length}</div>${o.timer?'<div class="timer"><span id="tbar"></span></div>':""}
     <div class="qprompt">${q.prompt}</div>${q.sub?`<div class="qsub">${q.sub}</div>`:""}
     ${q.say?`<button class="btn ghost sm" id="qsay">${I.sound} ${t("listen")}</button>`:""}
     <div class="choices">${q.choices.map((c,k)=>`<button class="choice" data-k="${k}">${esc(c)}</button>`).join("")}</div><div class="fb" id="fb"></div>`;
    if(q.say)$("#qsay").onclick=()=>{if(!say(q.say))toast(t("no_tts"))};
    const answer=k=>{if(locked)return;locked=true;cancelAnimationFrame(raf);
      const good=k>=0&&q.choices[k]===q.answer;
      $$(".choice").forEach((b,j)=>{if(q.choices[j]===q.answer)b.classList.add("ok");else if(j===k)b.classList.add("bad")});
      const fb=$("#fb");fb.className="fb "+(good?"ok":"bad");fb.textContent=good?t("correct"):(k<0?t("timeout"):t("wrong"))+" "+q.answer;
      if(q.word)record(q.word,good);if(q.sent)recordS(q.sent,good);beep(good);
      if(good){ok++;sc[pl]++}
      if(q.say&&good)say(q.say);
      later(()=>{i++;show()},good?850:1600)};
    $$(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    if(o.timer){const t0=performance.now(),dur=o.timer*1000,bar=$("#tbar");const tick=n=>{const p=1-(n-t0)/dur;if(bar)bar.style.width=Math.max(0,p*100)+"%";if(p<=0){answer(-1);return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick);cleanups.push(()=>cancelAnimationFrame(raf))}
  }
  show();
}
function wordQs(pool,n){return sample(pool,Math.min(n,pool.length)).map(w=>{if(Math.random()<.5)return{prompt:`<span class="e">${w.e}</span>${esc(w.en)}`,choices:options(w,pool,4,"tr"),answer:tr(w),word:w,say:w.en};return{prompt:`<span class="e">${w.e}</span>${esc(tr(w))}`,choices:options(w,pool,4,"en"),answer:w.en,word:w}})}
function gapQs(sents,pool,n){return sample(sents,Math.min(n,sents.length)).map(s=>{const re=new RegExp("\\b"+s.gap+"\\b","i");const w=findWord(s.gap)||{en:s.gap};const ch=new Set([s.gap]);shuffle(pool.concat(ALL)).forEach(x=>{if(ch.size<4&&!x.en.includes(" "))ch.add(x.en)});return{prompt:esc(s.en.replace(re,"____")),sub:esc(strL(s)),choices:shuffle([...ch]),answer:s.gap,word:findWord(s.gap),sent:s,say:s.en}})}

function gQuiz(ctx){runMCQ(wordQs(ctx.pool,10),{title:t("g_quiz"),sub:ctx.label,timer:15,onEnd:r=>finish({ok:r.ok,total:r.total,xp:r.ok*3,ctx,replay:()=>gQuiz(ctx)})})}
function gGap(ctx){if(!ctx.sents.length)return toast(t("need4"));runMCQ(gapQs(ctx.sents,ctx.pool,8),{title:t("g_gap"),sub:ctx.label,onEnd:r=>finish({ok:r.ok,total:r.total,xp:r.ok*3,ctx,replay:()=>gGap(ctx)})})}
function gDuel(ctx){runMCQ(wordQs(ctx.pool.length>=10?ctx.pool:ctx.pool.concat(sample(ALL,10)),10),{title:t("g_duel"),sub:ctx.label,timer:12,duel:true,onEnd:r=>{award("duel");const w=r.sc[0]===r.sc[1]?t("draw"):`${t("winner")}: ${r.sc[0]>r.sc[1]?t("p1"):t("p2")}`;finish({ok:r.ok,total:r.total,xp:r.ok*2,ctx,msg:w,celebrate:true,extra:`<div class="duelbar" style="width:100%;max-width:360px"><span>${t("p1")}: ${r.sc[0]}</span><span>${t("p2")}: ${r.sc[1]}</span></div>`,replay:()=>gDuel(ctx)})}})}
function gBoss(ctx){const c=CITIES.find(x=>"city:"+x.id===ctx.src);const qs=shuffle(wordQs(ctx.pool,7).concat(gapQs(ctx.sents,ctx.pool,3)));
  runMCQ(qs,{title:t("exam"),sub:ctx.label,timer:20,onEnd:r=>{const st=r.ok>=10?3:r.ok>=9?2:r.ok>=7?1:0;const prev=S.stars[c.id]||0;const wasLocked=cityIdx(c.id)<CITIES.length-1&&!isUnlocked(cityIdx(c.id)+1);if(st>prev)S.stars[c.id]=st;save();
   const extra=`<div>${t("stars_got")}: ${starsHTML(st)}</div><p class="muted">${st?(wasLocked&&st?t("unlocked"):""):t("failed_exam")}</p>`;
   finish({ok:r.ok,total:r.total,xp:r.ok*4+(st?20:0),ctx,extra,celebrate:st>0,replay:()=>gBoss(ctx)})}})}
function practiceMistakes(){const ws=mistWords();const ss=Object.values(S.mist).filter(m=>m.s).map(m=>SENTS.find(s=>s.en===m.s.en)).filter(Boolean);
  let qs=wordQs(ws,10).concat(gapQs(ss,ALL,5));if(!qs.length)return;qs=shuffle(qs);
  runMCQ(qs,{title:t("practice"),sub:t("src_mist"),onEnd:r=>finish({ok:r.ok,total:r.total,xp:r.ok*3,replay:practiceMistakes})})}
function levelTest(){const qs=LEVEL_TEST.map(q=>({prompt:esc(q[0]),choices:shuffle(q[1]),answer:q[1][0]}));
  runMCQ(qs,{title:t("level_test"),sub:"A1 — B2",onEnd:r=>{const lv=r.ok<=4?"A1":r.ok<=8?"A2":r.ok<=10?"B1":"B2";S.level=lv;save();
   finish({ok:r.ok,total:r.total,xp:15,celebrate:true,msg:`${t("your_level")}: ${lv}`,extra:`<p class="muted" style="max-width:40ch">${t("lvl_desc")[lv]}</p>`,replay:levelTest})}})}

/* ---------- flashcards ---------- */
const BOXI=[0,0,1,3,7,14];
function gFlash(ctx,all){
  const td=today();let cards=ctx.pool.filter(w=>{const s=S.srs[w.en];return all||!s||!s.b||s.d<=td});
  const body=openStage(t("flash"),ctx.label);
  if(!cards.length){body.innerHTML=`<div class="result">${mascot(100)}<p style="font-weight:600">${t("no_due")}</p><div class="row"><button class="btn" id="fa">${t("learn_all")}</button></div></div>`;$("#fa").onclick=()=>gFlash(ctx,true);return}
  cards=shuffle(cards).slice(0,12);let i=0,known=0;
  function show(){if(i>=cards.length)return finish({ok:known,total:cards.length,xp:cards.length+known,ctx,replay:()=>gFlash(ctx,true)});
    const w=cards[i],s=S.srs[w.en]||{b:0,c:0};score(`${i+1}/${cards.length}`);
    body.innerHTML=`<div class="prog"><span style="width:${i/cards.length*100}%"></span></div>
     <div class="flash"><button class="fcard" id="fc" aria-label="${t("flip")}"><div class="fface"><span class="e">${w.e}</span><span class="w">${esc(w.en)}</span><span class="muted">${t("flip")}</span></div><div class="fface b"><span class="e">${w.e}</span><span class="w">${esc(tr(w))}</span><span>${esc(w.en)}</span></div></button></div>
     <div class="box-ind" title="${t("box")}">${[1,2,3,4,5].map(n=>`<i class="${n<=s.b?"on":""}"></i>`).join("")}</div>
     <div class="row"><button class="btn ghost" id="fs">${I.sound} ${t("listen")}</button></div>
     <div class="row"><button class="btn danger" id="fn">${t("dontknow")}</button><button class="btn" id="fy" style="background:var(--ok)">${t("know")}</button></div>`;
    const fc=$("#fc");fc.onclick=()=>fc.classList.toggle("flip");
    $("#fs").onclick=()=>{if(!say(w.en))toast(t("no_tts"))};say(w.en);
    const rate=good=>{const x=S.srs[w.en]||{b:0,c:0};x.b=good?Math.min(5,(x.b||0)+1):1;x.d=addDays(td,good?BOXI[x.b]:0);S.srs[w.en]=x;record(w,good);if(good)known++;beep(good);i++;show()};
    $("#fy").onclick=()=>rate(true);$("#fn").onclick=()=>rate(false)}
  show();
}

/* ---------- word match ---------- */
function gMatch(ctx){
  const body=openStage(t("g_match"),ctx.label);const ws=sample(ctx.pool,Math.min(6,ctx.pool.length));
  const L1=shuffle(ws.map((w,i)=>({i,txt:`${w.e} ${w.en}`}))),R=shuffle(ws.map((w,i)=>({i,txt:tr(w)})));
  let sel=null,done=0,miss=0;const t0=Date.now();
  body.innerHTML=`<p class="muted" style="margin-top:0">${t("g_match_d")}</p><div class="match"><div class="col">${L1.map(x=>`<button class="tile" data-s="l" data-i="${x.i}">${esc(x.txt)}</button>`).join("")}</div><div class="col">${R.map(x=>`<button class="tile" data-s="r" data-i="${x.i}">${esc(x.txt)}</button>`).join("")}</div></div>`;
  const tm=setInterval(()=>score(`${t("time")}: ${Math.floor((Date.now()-t0)/1000)}s`),500);cleanups.push(()=>clearInterval(tm));
  $$(".tile").forEach(b=>b.onclick=()=>{
    if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");if(b.dataset.s==="l")say(ws[+b.dataset.i].en);return}
    const a=sel;sel=null;a.classList.remove("sel");
    if(a.dataset.i===b.dataset.i){a.classList.add("done");b.classList.add("done");record(ws[+a.dataset.i],true);beep(true);done++;
      if(done===ws.length){clearInterval(tm);const sec=Math.round((Date.now()-t0)/1000);later(()=>finish({ok:ws.length-Math.min(miss,ws.length),total:ws.length,xp:10+(sec<30?5:0)+Math.max(0,6-miss),ctx,extra:`<p class="muted">${t("time")}: ${sec}s</p>`,replay:()=>gMatch(ctx)}),500)}}
    else{miss++;const l=a.dataset.s==="l"?a:b;record(ws[+l.dataset.i],false);beep(false);[a,b].forEach(x=>{x.classList.add("shake");later(()=>x.classList.remove("shake"),400)})}
  });
}

/* ---------- scramble ---------- */
function gScramble(ctx){
  const body=openStage(t("g_scramble"),ctx.label);let ws=ctx.pool.filter(w=>/^[a-z]+$/.test(w.en)&&w.en.length>=3);if(ws.length<3)ws=ALL.filter(w=>/^[a-z]+$/.test(w.en));
  ws=sample(ws,6);let i=0,ok=0;
  function show(){if(i>=ws.length)return finish({ok,total:ws.length,xp:ok*3,ctx,replay:()=>gScramble(ctx)});
    const w=ws[i];let letters=w.en.split("");let mix=shuffle(letters);let g=0;while(mix.join("")===w.en&&g++<10)mix=shuffle(letters);
    let built=[],hinted=0,failed=false;score(`${i+1}/${ws.length}`);
    const draw=()=>{body.innerHTML=`<div class="prog"><span style="width:${i/ws.length*100}%"></span></div><div class="qprompt" style="text-align:center"><span class="e">${w.e}</span>${esc(tr(w))}</div>
      <div class="slots" id="sl">${built.map((b,k)=>`<button class="ltr" data-b="${k}">${mix[b]}</button>`).join("")}</div>
      <div class="letters">${mix.map((l,k)=>`<button class="ltr ${built.includes(k)?"used":""}" data-k="${k}">${l}</button>`).join("")}</div>
      <div class="row"><button class="btn ghost sm" id="er">${t("erase")}</button><button class="btn ghost sm" id="hn">${t("hint")}</button><button class="btn ghost sm" id="sk">${t("skip")}</button></div>`;
      $$("[data-k]").forEach(b=>b.onclick=()=>{built.push(+b.dataset.k);test()});
      $$("[data-b]").forEach(b=>b.onclick=()=>{built.splice(+b.dataset.b,1);draw()});
      $("#er").onclick=()=>{built.pop();draw()};
      $("#hn").onclick=()=>{hinted++;const need=w.en.slice(0,hinted).split("");built=[];const used=new Set();need.forEach(ch=>{const k=mix.findIndex((l,j)=>l===ch&&!used.has(j));used.add(k);built.push(k)});test()};
      $("#sk").onclick=()=>{record(w,false);i++;show()};};
    const test=()=>{draw();if(built.length!==w.en.length)return;const got=built.map(k=>mix[k]).join("");const sl=$("#sl");
      if(got===w.en){sl.classList.add("ok");const good=!failed&&hinted<2;record(w,good);if(good)ok++;beep(true);say(w.en);later(()=>{i++;show()},900)}
      else{sl.classList.add("bad");failed=true;beep(false);later(()=>{built=[];draw()},700)}};
    draw()}
  show();
}

/* ---------- falling words ---------- */
function gFalling(ctx){
  const body=openStage(t("g_falling"),ctx.label);let lives=3,ok=0,n=0,speed=34,y=0,raf=0,last=0,cur=null,busy=false;const MAX=15;
  body.innerHTML=`<div class="fall-hud"><span class="hearts" id="hl">♥♥♥</span><span id="fsc">0 / ${MAX}</span></div><div class="fall-sky" id="sky"><div class="drop" id="drop"></div><div class="ground"></div></div><div class="choices" id="fch"></div>`;
  const sky=$("#sky"),drop=$("#drop"),ch=$("#fch");
  function hud(){$("#hl").textContent="♥".repeat(lives)+"♡".repeat(3-lives);$("#fsc").textContent=`${ok} / ${MAX}`}
  function next(){if(lives<=0||n>=MAX){cancelAnimationFrame(raf);return finish({ok,total:n,xp:ok*2+(lives===3?5:0),ctx,replay:()=>gFalling(ctx)})}
    cur=pick(ctx.pool);n++;y=0;busy=false;drop.className="drop";drop.innerHTML=`<span class="e">${cur.e}</span>${esc(cur.en)}`;
    drop.style.left="0px";const maxL=Math.max(0,sky.clientWidth-drop.offsetWidth-8);drop.style.left=(4+Math.random()*maxL)+"px";drop.style.transform="translateY(0)";
    const opts=options(cur,ctx.pool,4,"tr");ch.innerHTML=opts.map(o=>`<button class="choice">${esc(o)}</button>`).join("");
    $$("#fch .choice").forEach(b=>b.onclick=()=>hit(b));last=performance.now();raf=requestAnimationFrame(loop)}
  function loop(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;y+=speed*dt;const H=sky.clientHeight-drop.offsetHeight-20;drop.style.transform=`translateY(${y}px)`;if(y>=H){fail(null);return}raf=requestAnimationFrame(loop)}
  function hit(b){if(busy)return;const good=b.textContent===tr(cur);if(!good)return fail(b);busy=true;cancelAnimationFrame(raf);b.classList.add("ok");drop.classList.add("hit");ok++;speed+=6;record(cur,true);beep(true);hud();later(next,450)}
  function fail(b){if(busy)return;busy=true;cancelAnimationFrame(raf);if(b)b.classList.add("bad");$$("#fch .choice").forEach(x=>{if(x.textContent===tr(cur))x.classList.add("ok")});drop.classList.add("miss");lives--;record(cur,false);beep(false);hud();later(next,1100)}
  cleanups.push(()=>cancelAnimationFrame(raf));hud();later(next,300);
}

/* ---------- memory ---------- */
function gMemory(ctx){
  const body=openStage(t("g_memory"),ctx.label);const ws=sample(ctx.pool,Math.min(6,ctx.pool.length));
  const cards=shuffle(ws.flatMap((w,i)=>[{i,h:`<span class="e">${w.e}</span>${esc(w.en)}`},{i,h:esc(tr(w))}]));
  let open=[],got=0,moves=0,lock=false;
  body.innerHTML=`<p class="muted" style="margin-top:0">${t("g_memory_d")}</p><div class="mem">${cards.map((c,k)=>`<button class="mcard" data-k="${k}"><span class="back">?</span></button>`).join("")}</div>`;
  const upd=()=>score(`${t("moves")}: ${moves}`);upd();
  $$(".mcard").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(lock||open.includes(k)||b.classList.contains("got"))return;
    b.classList.add("up");b.innerHTML=cards[k].h;open.push(k);if(cards[k].h.includes('class="e"'))say(ws[cards[k].i].en);
    if(open.length===2){moves++;upd();const[a,c]=open;const A=$(`.mcard[data-k="${a}"]`),C=$(`.mcard[data-k="${c}"]`);
      if(cards[a].i===cards[c].i){A.classList.add("got");C.classList.add("got");open=[];got++;record(ws[cards[a].i],true);beep(true);
        if(got===ws.length)later(()=>finish({ok:Math.max(0,ws.length*2-moves+ws.length),total:ws.length*2,xp:15+Math.max(0,ws.length*2-moves),ctx,extra:`<p class="muted">${t("moves")}: ${moves}</p>`,replay:()=>gMemory(ctx)}),600)}
      else{lock=true;later(()=>{[A,C].forEach(x=>{x.classList.remove("up");x.innerHTML='<span class="back">?</span>'});open=[];lock=false},900)}}});
}

/* ---------- hangman (balloons) ---------- */
function gHangman(ctx){
  const body=openStage(t("g_hangman"),ctx.label);let ws=ctx.pool.filter(w=>/^[a-z]+$/.test(w.en));if(ws.length<3)ws=ALL.filter(w=>/^[a-z]+$/.test(w.en));
  ws=sample(ws,3);let r=0,ok=0;const cols=["#2B57CF","#F2A900","#17905F","#C9402F","#7C5CD6","#E87D2B"];
  function round(){if(r>=ws.length)return finish({ok,total:ws.length,xp:ok*6,ctx,replay:()=>gHangman(ctx)});
    const w=ws[r],guessed=new Set();let left=6;score(`${r+1}/${ws.length}`);
    const draw=()=>{const pos=[[40,40],[80,25],[120,40],[160,25],[60,75],[140,75]];
      body.innerHTML=`<div class="balloons"><svg viewBox="0 0 200 200">${pos.map((p,k)=>k<left?`<line x1="${p[0]}" y1="${p[1]+18}" x2="100" y2="150" stroke="currentColor" stroke-width="1" opacity=".5"/><ellipse cx="${p[0]}" cy="${p[1]}" rx="15" ry="18" fill="${cols[k]}"/>`:`<text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="14" fill="currentColor" opacity=".4">✶</text>`).join("")}<rect x="82" y="150" width="36" height="26" rx="4" fill="#8A5A2B"/><path d="M82 158h36" stroke="#5E3B1A" stroke-width="2"/></svg></div>
       <div class="qsub" style="text-align:center;font-size:1.05rem">${w.e} ${esc(tr(w))}</div>
       <div class="word-mask">${w.en.split("").map(ch=>`<span>${guessed.has(ch)?ch:""}</span>`).join("")}</div>
       <div class="kbd">${"abcdefghijklmnopqrstuvwxyz".split("").map(ch=>`<button data-ch="${ch}" class="${guessed.has(ch)?(w.en.includes(ch)?"ok":"bad"):""}" ${guessed.has(ch)?"disabled":""}>${ch}</button>`).join("")}</div>`;
      $$(".kbd button").forEach(b=>b.onclick=()=>{const ch=b.dataset.ch;guessed.add(ch);if(!w.en.includes(ch)){left--;beep(false)}else beep(true);draw();check()})};
    const check=()=>{const won=w.en.split("").every(ch=>guessed.has(ch));if(won){ok++;record(w,true);say(w.en);later(()=>{r++;round()},1000)}else if(left<=0){record(w,false);$$(".word-mask span").forEach((s,k)=>{s.textContent=w.en[k];s.style.color="var(--bad)"});$$(".kbd button").forEach(b=>b.disabled=true);later(()=>{r++;round()},1600)}};
    draw()}
  round();
}

/* ---------- sentence builder ---------- */
function gBuilder(ctx){
  const body=openStage(t("g_builder"),ctx.label);const ss=sample(ctx.sents,Math.min(5,ctx.sents.length));let i=0,ok=0;
  function show(){if(i>=ss.length)return finish({ok,total:ss.length,xp:ok*5,ctx,replay:()=>gBuilder(ctx)});
    const s=ss[i],toks=s.en.split(" ");let mix=shuffle(toks.map((x,k)=>k));let g=0;while(mix.every((v,k)=>v===k)&&g++<10)mix=shuffle(mix);
    let built=[],tried=false;score(`${i+1}/${ss.length}`);
    const draw=()=>{body.innerHTML=`<div class="prog"><span style="width:${i/ss.length*100}%"></span></div><div class="qsub">${t("tap_words")}</div><div class="qprompt" style="font-size:1.2rem">${esc(strL(s))}</div>
      <div class="slots" id="sl">${built.map((k,j)=>`<button class="wtok" data-b="${j}">${esc(toks[k])}</button>`).join("")}</div>
      <div class="letters">${mix.map(k=>`<button class="wtok" data-k="${k}" ${built.includes(k)?'style="visibility:hidden"':""}>${esc(toks[k])}</button>`).join("")}</div>
      <div class="row"><button class="btn ghost" id="bs">${I.sound} ${t("listen")}</button><button class="btn" id="bc" ${built.length===toks.length?"":"disabled"}>${t("check")}</button></div><div class="fb" id="fb" style="text-align:center"></div>`;
      $$("[data-k]").forEach(b=>b.onclick=()=>{built.push(+b.dataset.k);draw()});
      $$("[data-b]").forEach(b=>b.onclick=()=>{built.splice(+b.dataset.b,1);draw()});
      $("#bs").onclick=()=>{if(!say(s.en))toast(t("no_tts"))};
      $("#bc").onclick=()=>{const got=built.map(k=>toks[k]).join(" ");const good=got===s.en;const sl=$("#sl"),fb=$("#fb");
        if(good){sl.classList.add("ok");fb.className="fb ok";fb.textContent=t("correct");if(!tried)ok++;recordS(s,!tried);beep(true);say(s.en);later(()=>{i++;show()},1100)}
        else{tried=true;sl.classList.add("bad");fb.className="fb bad";fb.textContent=t("wrong")+" "+s.en;beep(false);later(()=>{i++;recordS(s,false);show()},2200)}}};
    draw()}
  show();
}

/* ---------- listen & type ---------- */
function gListen(ctx){
  const body=openStage(t("g_listen"),ctx.label);const ws=sample(ctx.pool,Math.min(8,ctx.pool.length));let i=0,ok=0;const tts=hasTTS();
  function show(){if(i>=ws.length)return finish({ok,total:ws.length,xp:ok*3,ctx,replay:()=>gListen(ctx)});
    const w=ws[i];score(`${i+1}/${ws.length}`);let done=false;
    body.innerHTML=`<div class="prog"><span style="width:${i/ws.length*100}%"></span></div>${tts?"":`<p class="fb bad">${t("no_tts")}</p>`}
     <button class="big-say" id="ls" aria-label="${t("listen")}">${I.sound}</button>
     <div class="qsub" style="text-align:center" id="lh">${tts?"":esc(tr(w))}</div>
     <form id="lf"><input class="inp" id="li" placeholder="${t("type_here")}" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="row"><button class="btn ghost" type="button" id="lhint">${t("hint")}</button><button class="btn" type="submit">${t("check")}</button></div></form><div class="fb" id="fb" style="text-align:center"></div>`;
    $("#ls").onclick=()=>say(w.en);if(tts)later(()=>say(w.en),300);
    $("#lhint").onclick=()=>{$("#lh").textContent=w.e+" "+tr(w)};
    $("#li").focus();
    $("#lf").onsubmit=e=>{e.preventDefault();if(done)return;done=true;const good=norm($("#li").value)===norm(w.en);const fb=$("#fb");fb.className="fb "+(good?"ok":"bad");fb.innerHTML=(good?t("correct"):t("wrong"))+` ${w.e} <b>${esc(w.en)}</b> — ${esc(tr(w))}`;record(w,good);if(good)ok++;beep(good);later(()=>{i++;show()},good?1100:2000)}}
  show();
}

/* ---------- true / false speed ---------- */
function gTF(ctx){
  const body=openStage(t("g_tf"),ctx.label);let ok=0,n=0,left=60,cur=null,truth=false;
  body.innerHTML=`<div class="timer"><span id="tbar"></span></div><div class="qcount" id="tc">60s</div><div class="qprompt" id="tq" style="text-align:center"></div>
   <div class="choices"><button class="choice" id="tyes" style="text-align:center">${t("yes")}</button><button class="choice" id="tno" style="text-align:center">${t("no")}</button></div><div class="fb" id="fb" style="text-align:center"></div>`;
  function next(){cur=pick(ctx.pool);truth=Math.random()<.5;let shown=cur;if(!truth){const o=ctx.pool.filter(x=>tr(x)!==tr(cur));shown=o.length?pick(o):cur;if(shown===cur)truth=true}
    $("#tq").innerHTML=`<span class="e">${cur.e}</span>${esc(cur.en)} = ${esc(tr(shown))}`;score(`${ok} ✓`)}
  function ans(v){if(left<=0)return;n++;const good=v===truth;if(good)ok++;record(cur,good);beep(good);const fb=$("#fb");fb.className="fb "+(good?"ok":"bad");fb.textContent=good?t("correct"):`${t("wrong")} ${cur.en} = ${tr(cur)}`;next()}
  $("#tyes").onclick=()=>ans(true);$("#tno").onclick=()=>ans(false);
  const iv=setInterval(()=>{left--;$("#tc").textContent=left+"s";$("#tbar").style.width=(left/60*100)+"%";if(left<=0){clearInterval(iv);finish({ok,total:n,xp:ok*2,ctx,extra:`<p class="muted">60s</p>`,replay:()=>gTF(ctx)})}},1000);
  cleanups.push(()=>clearInterval(iv));next();
}

/* ---------- dialogues ---------- */
function gDialog(d){
  const body=openStage(L(d.title),d.who);let step=0,ok=0,mist=0;const steps=d.steps;const total=steps.length-1;
  const trI=S.set.tr==="uz"?2:1;
  body.innerHTML=`<div class="chat" id="chat"></div><div class="opts" id="opts"></div>`;
  const chat=$("#chat"),opts=$("#opts");
  const npc=s=>{const el=document.createElement("div");el.className="bub npc";el.innerHTML=`<div class="who">${esc(d.who)}</div>${esc(s[0])}<div class="tr" hidden>${esc(s[trI])}</div><div class="tools"><button class="mini sy">${I.sound}</button><button class="mini tt">${t("tr")}</button></div>`;chat.appendChild(el);el.querySelector(".sy").onclick=()=>say(s[0]);el.querySelector(".tt").onclick=()=>{const x=el.querySelector(".tr");x.hidden=!x.hidden};say(s[0])};
  const add=(cls,html)=>{const el=document.createElement("div");el.className="bub "+cls;el.innerHTML=html;chat.appendChild(el);el.scrollIntoView({block:"nearest",behavior:"smooth"})};
  function show(){const s=steps[step];npc(s);score(`${Math.min(step,total)}/${total}`);
    if(!s[3]){S.dialogs[d.id]=true;save();checkBadges();opts.innerHTML="";later(()=>finish({ok,total,xp:20+ok*2,extra:mist?`<p class="muted">${t("nav_notes")}: +${mist}</p>`:"",replay:()=>gDialog(d)}),1300);return}
    let first=true;opts.innerHTML=shuffle(s[3].map((o,k)=>k)).map(k=>`<button class="choice" data-k="${k}">${esc(s[3][k][0])}</button>`).join("");
    $$("#opts .choice").forEach(b=>b.onclick=()=>{const o=s[3][+b.dataset.k];const sent={en:s[3].find(x=>x[1])[0],ru:s[1],uz:s[2]};
      if(o[1]){add("me",`<div class="who" style="color:inherit;opacity:.8">${t("you")}</div>${esc(o[0])}`);if(first)ok++;recordS(sent,first);beep(true);say(o[0]);opts.innerHTML="";step++;later(show,1200)}
      else{first=false;mist++;b.classList.add("bad");b.disabled=true;beep(false);add("hint",esc(o[S.set.tr==="uz"?3:2]||""))}})}
  show();
}

/* ============ BOOT ============ */
if(hasTTS()){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}}
render();
</script>
