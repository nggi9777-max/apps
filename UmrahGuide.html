<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d"><meta name="color-scheme" content="light dark">
<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Umrah Guide</title></head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-first app shell — sticky header with back button, animated content views, prominent emerald tab bar; Kaaba / mataf geometry as the visual motif */
:root{
  --bg:#f3f2ec; --surface:#ffffff; --surface-2:#e9ece4; --line:#d6d8cc;
  --fg:#15211b; --muted:#56655c; --emerald:#0c5a41; --emerald-2:#083d2c; --emerald-3:#0f6e50; --on-emerald:#f4f1e6;
  --gold:#b08a2e; --gold-2:#d9b45c; --gold-soft:#f1e6c8; --ok:#1d7a4c; --warn:#9a6a00; --bad:#b03a2e;
  --marble:#f7f6f1; --marble-2:#e6e4dc; --kiswa:#0b0d0c;
  --f-display:"Noto Serif",Georgia,"Times New Roman",serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ar:"Amiri","Scheherazade New","Traditional Arabic",serif;
  --ar-size:28px; --r:16px; --nav-h:72px;
  --shadow:0 1px 2px rgba(8,40,28,.06),0 6px 18px rgba(8,40,28,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1612; --surface:#15201b; --surface-2:#1b2a23; --line:#2a3a32;
  --fg:#e8ece4; --muted:#a2afa7; --emerald:#2f9a74; --emerald-2:#0a2a1f; --emerald-3:#1f7a5a; --on-emerald:#0b1410;
  --gold:#d9b45c; --gold-2:#e8c877; --gold-soft:#3a3121; --ok:#4cc38a; --warn:#e0b04a; --bad:#e2766a;
  --marble:#26332d; --marble-2:#1f2a25; --kiswa:#050606; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#15201b; --surface-2:#1b2a23; --line:#2a3a32;
  --fg:#e8ece4; --muted:#a2afa7; --emerald:#2f9a74; --emerald-2:#0a2a1f; --emerald-3:#1f7a5a; --on-emerald:#0b1410;
  --gold:#d9b45c; --gold-2:#e8c877; --gold-soft:#3a3121; --ok:#4cc38a; --warn:#e0b04a; --bad:#e2766a;
  --marble:#26332d; --marble-2:#1f2a25; --kiswa:#050606; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#083d2c}
button{font:inherit;color:inherit;cursor:pointer}
button[disabled]{cursor:default}
a{color:var(--emerald)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#083d2c;color:#f4f1e6;box-shadow:0 2px 10px rgba(0,0,0,.18)}
header.top .wrap{display:flex;align-items:center;gap:8px;padding-block:8px;min-height:58px}
.back{display:inline-flex;align-items:center;gap:4px;height:42px;padding:0 12px 0 8px;border-radius:12px;border:1px solid rgba(217,180,92,.55);background:rgba(217,180,92,.14);color:#f4f1e6;font-weight:600;font-size:14px;flex:0 0 auto}
.back svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:inherit}
.brand b{font:700 15px/1.1 var(--f-display);letter-spacing:.08em;display:block;white-space:nowrap}
.brand small{font-size:11px;opacity:.75;display:block}
.htitle{flex:1;min-width:0;font:600 16px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#f4f1e6;border-radius:12px;height:42px;min-width:42px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center}
select.hbtn{appearance:none;font-size:13px;font-weight:600}
select.hbtn option{color:#111}
main{padding-block:16px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom,0px))}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));pointer-events:none}
nav.tabs .tabbar{pointer-events:auto;max-width:640px;margin:0 auto;background:#083d2c;border:1px solid rgba(217,180,92,.45);border-radius:22px;box-shadow:0 10px 30px rgba(4,30,20,.35);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;gap:4px}
nav.tabs button{background:none;border:0;border-radius:16px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:#cfdcd4;transition:background .2s,color .2s}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{background:linear-gradient(180deg,#e2c06a,#c79d3f);color:#1b160a}
nav.tabs.hello .tabbar{animation:hello 1.6s ease 2}
@keyframes hello{0%,100%{transform:none}30%{transform:translateY(-6px)}55%{transform:none}}
/* type */
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:26px;line-height:1.2}
h2{font-size:20px;line-height:1.25}
h3{font-size:16px;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.flat{box-shadow:none}
/* entrance animation */
.view>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}.view>*:nth-child(5){animation-delay:.2s}.view>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;text-decoration:none;color:var(--fg);transition:transform .12s}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--emerald);border-color:var(--emerald);color:var(--on-emerald)}
.btn.gold{background:linear-gradient(180deg,#e2c06a,#c79d3f);border-color:#c79d3f;color:#1b160a}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:13px;border-radius:12px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--emerald);color:var(--on-emerald);border-color:var(--emerald)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips>*{flex:0 0 auto}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;letter-spacing:.03em;vertical-align:1px}
.tag.fard{background:var(--emerald);color:var(--on-emerald)}
.tag.wajib{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold)}
.tag.sunnah{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag.hadith{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.tag.verify{background:transparent;color:var(--warn);border:1px dashed var(--warn)}
ul.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
ul.pts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
ul.pts li::before{content:"";width:7px;height:7px;margin-top:8px;transform:rotate(45deg);background:var(--gold)}
.note{border-left:3px solid var(--gold);background:var(--surface-2);border-radius:0 12px 12px 0;padding:10px 12px;font-size:14px}
.note.warn{border-left-color:var(--bad)}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:540px){.split{grid-template-columns:1fr}}
.bar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--emerald),var(--gold-2));transition:width .5s}
details.acc{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.acc summary{padding:13px 14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";color:var(--gold);font-weight:700;font-size:18px;line-height:1}
details.acc[open] summary::after{content:"−"}
details.acc>div{padding:0 14px 14px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;background:radial-gradient(120% 90% at 85% 10%,#14704f 0%,#083d2c 55%,#05261b 100%);color:#f4f1e6;padding:18px;display:grid;grid-template-columns:1fr 132px;gap:10px;align-items:center;min-height:170px}
.hero h1{color:#f4f1e6;font-size:22px}
.hero p{opacity:.85;font-size:14px;margin-top:4px}
.hero .by{font-size:12px;opacity:.7;margin-top:10px;letter-spacing:.04em}
.hero .pattern{position:absolute;inset:0;opacity:.09;pointer-events:none}
.orbit{width:132px;height:132px;position:relative}
.orbit svg{width:100%;height:100%}
.spin-ccw{transform-box:fill-box;transform-origin:center;animation:ccw 14s linear infinite}
.spin-ccw.slow{animation-duration:26s}.spin-ccw.fast{animation-duration:9s}
@keyframes ccw{to{transform:rotate(-360deg)}}
.drift{animation:drift 40s linear infinite}
@keyframes drift{to{transform:translate(-60px,-60px)}}
/* home */
.continue{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.continue .num{width:46px;height:46px;border-radius:14px;background:var(--emerald);color:var(--on-emerald);display:grid;place-items:center;font:700 18px var(--f-display)}
.continue small{display:block;color:var(--muted);font-size:12px}
.continue b{display:block;font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:118px;box-shadow:var(--shadow);transition:transform .15s}
.tile:active{transform:scale(.98)}
.tile .ai{width:44px;height:44px}
.tile b{font-size:14px;line-height:1.25}
.tile small{color:var(--muted);font-size:12px;line-height:1.35}
.focus-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--gold);background:var(--gold-soft);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:38px}
/* counter */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:11px;min-height:42px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--emerald);color:var(--on-emerald);box-shadow:var(--shadow)}
.ctr-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;justify-items:center}
.ctr-svg{width:100%;max-width:300px}
.ctr-svg svg{width:100%;height:auto;display:block}
.arc{transition:stroke .35s,opacity .35s}
.arc.on{stroke:var(--emerald)}
.arc.cur{stroke:var(--gold-2);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
.plus{width:100%;max-width:360px;min-height:68px;border-radius:20px;font-size:21px;font-weight:800;position:relative;overflow:hidden}
.plus.cool::after{content:"";position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.7);animation:cool 1.2s linear forwards}
@keyframes cool{from{width:100%}to{width:0}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.duapanel{display:flex;flex-direction:column;gap:10px;width:100%}
.dstep{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px;border-radius:14px;background:var(--surface-2)}
.dstep .ix{width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.dstep .ix svg{width:20px;height:20px}
.dstep .ar{font-family:var(--f-ar);font-size:calc(var(--ar-size) - 4px);line-height:1.8;direction:rtl;text-align:right}
.dstep .tl{font-style:italic;color:var(--muted);font-size:13.5px}
.dstep b{font-size:14px}
.usertext{white-space:pre-wrap;font-size:14px;border:1px dashed var(--gold);border-radius:10px;padding:8px}
/* wizard */
.timeline{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.timeline button{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums}
.timeline button.done{background:var(--emerald);color:var(--on-emerald);border-color:var(--emerald)}
.timeline button.cur{outline:3px solid var(--gold-2);outline-offset:2px}
.stepnav{position:sticky;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:5;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;padding:8px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.stage svg{display:block;width:100%;height:auto}
.stage .ctl svg,.stage .btn svg{display:inline-block;width:18px;height:18px}
.stage .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface-2)}
.stage .cap{padding:10px 14px;font-size:14px;min-height:44px}
.hud{font-variant-numeric:tabular-nums}
/* dua cards */
.dua .ar{font-family:var(--f-ar);font-size:var(--ar-size);line-height:1.9;direction:rtl;text-align:right}
.dua .tl{font-style:italic;color:var(--muted);font-size:14px}
.src{font-size:12px;color:var(--muted)}
.dua-head{display:flex;justify-content:space-between;gap:8px;align-items:start}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;display:inline-grid;place-items:center;flex:0 0 auto}
.iconbtn svg{width:19px;height:19px}
.iconbtn[aria-pressed="true"] svg{fill:var(--gold);stroke:var(--gold)}
input[type=search],input[type=text],input[type=number],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:11px 12px;font:inherit;min-height:46px}
textarea{resize:vertical}
label.lbl{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
/* prohibitions */
.icards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:420px){.icards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.icard{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;line-height:1.3;position:relative}
.icard .ai{width:54px;height:54px}
.icard.no{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.icard.yes{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.icard .badge{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.icard.no .badge{background:var(--bad)}.icard.yes .badge{background:var(--ok)}
/* animated icon parts */
.ai{display:block;overflow:visible}
.a-bob{animation:bob 2.2s ease-in-out infinite;transform-box:fill-box}
@keyframes bob{50%{transform:translateY(-3px)}}
.a-spray circle{animation:spray 1.6s ease-out infinite;transform-box:fill-box}
.a-spray circle:nth-child(2){animation-delay:.25s}.a-spray circle:nth-child(3){animation-delay:.5s}
@keyframes spray{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-6px)}}
.a-snip{animation:snip 1s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 50%}
.a-snip2{animation:snip2 1s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 50%}
@keyframes snip{50%{transform:rotate(-14deg)}}@keyframes snip2{50%{transform:rotate(14deg)}}
.a-needle{animation:needle 1.4s ease-in-out infinite}
@keyframes needle{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,6px)}}
.a-fall{animation:fall 1.4s linear infinite}
.a-fall:nth-child(2){animation-delay:.45s}.a-fall:nth-child(3){animation-delay:.9s}
@keyframes fall{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.a-rise{animation:riseb 2s ease-in infinite;transform-box:fill-box}
.a-rise:nth-child(2){animation-delay:.6s}.a-rise:nth-child(3){animation-delay:1.2s}
@keyframes riseb{from{transform:translateY(6px);opacity:0}30%{opacity:1}to{transform:translateY(-14px);opacity:0}}
.a-tick{animation:tick 4s steps(8) infinite;transform-origin:32px 34px}
@keyframes tick{to{transform:rotate(360deg)}}
.a-beat{animation:beat 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes beat{30%{transform:scale(1.15)}}
.a-shake{animation:shake .9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes shake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.a-fly{animation:fly 1.8s ease-in infinite}
@keyframes fly{0%{transform:translateX(-6px);opacity:0}20%{opacity:1}100%{transform:translateX(18px);opacity:0}}
.a-draw{stroke-dasharray:40;stroke-dashoffset:40;animation:draw 2.4s ease-in-out infinite}
@keyframes draw{40%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-40}}
.a-ping{animation:ping 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
.a-glow{animation:glow 2s ease-in-out infinite}
.a-swing{animation:swing 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0%}
@keyframes swing{50%{transform:rotate(-8deg)}}
.cross{stroke:var(--bad);stroke-width:4;stroke-linecap:round}
/* list rows */
.lrow{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%;box-shadow:var(--shadow);color:var(--fg);text-decoration:none}
.lrow .ai{width:36px;height:36px;flex:0 0 auto}
.lrow div{flex:1;min-width:0}
.lrow small{color:var(--muted);display:block;font-size:12px}
.lrow .km{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap;color:var(--emerald)}
/* map */
.mapbox{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--marble)}
.mapbox svg{display:block;width:100%;height:min(58vh,460px);touch-action:none;cursor:grab;user-select:none}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;box-shadow:var(--shadow);display:grid;place-items:center}
.mapctl button svg{width:20px;height:20px}
.maphint{position:absolute;left:10px;right:62px;top:10px;background:var(--gold);color:#1b160a;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600}
.mk{cursor:pointer}
.mk .halo{animation:ping 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* checklist */
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

.chk input{width:24px;height:24px;accent-color:var(--emerald);flex:0 0 auto}
.chk span{flex:1;min-width:0}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;max-height:88%;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 10px}
.sheet .inner{max-width:680px;margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
/* focus mode */
.focus{position:fixed;inset:0;z-index:50;background:#05100b;color:#f4f1e6;display:flex;flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.focus .seg button[aria-pressed="true"]{background:#d9b45c;color:#1b160a}

.focus .lab{text-align:center;font-size:19px;color:#d9b45c;font-weight:700}
.focus .hint{text-align:center;color:#a8b5ad;font-size:15px}
.focus .ar{font-family:var(--f-ar);font-size:24px;text-align:center;direction:rtl;color:#f4f1e6}
.focus .go{width:100%;min-height:120px;border-radius:26px;border:0;background:#2f9a74;color:#05100b;font-size:32px;font-weight:800}
.focus .go[disabled]{opacity:.5}
.focus .sub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.focus .sub button{min-height:56px;border-radius:16px;border:1px solid #2b3a33;background:#12231b;color:#f4f1e6;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90%;text-align:center;animation:rise .25s}
.celebrate{text-align:center;padding:24px 16px;background:radial-gradient(100% 100% at 50% 0%,#14704f,#083d2c);color:#f4f1e6;border-radius:20px}
.celebrate h2{color:#f4f1e6;font-size:24px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
/* ---------- v3 ---------- */
.primary3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pbtn{position:relative;overflow:hidden;border:0;border-radius:20px;padding:12px 10px 12px;min-height:150px;color:#f4f1e6;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;box-shadow:0 8px 22px rgba(4,30,20,.25);background:#083d2c}

.pbtn .st{position:absolute;top:8px;right:8px;background:rgba(217,180,92,.95);color:#1b160a;font-weight:800;font-size:11px;border-radius:999px;padding:2px 8px}
.pbtn.t{background:radial-gradient(120% 90% at 50% 0%,#17765a,#083d2c 70%)}
.pbtn.s{background:radial-gradient(120% 90% at 50% 0%,#2b6c8f,#123247 70%)}
.pbtn.m{background:radial-gradient(120% 90% at 50% 0%,#a5493d,#4a1914 72%)}
.pbtn:active{transform:scale(.98)}
@media (max-width:380px){.pbtn{min-height:136px}.pbtn .art svg{width:70px;height:70px}.pbtn b{font-size:15px}}
/* scene */
.scene{position:relative;height:min(58vh,480px);min-height:300px;border-radius:22px;overflow:hidden;background:#0b1d33;box-shadow:0 10px 28px rgba(4,30,20,.3);isolation:isolate}
.scene .c3d{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:none;display:block;cursor:grab}
.scene.flat{height:auto;background:var(--surface);padding:10px}
.scene.flat .flatsvg{max-width:320px;margin:0 auto}
.lbls{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.l3{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;will-change:transform}
.l3 span{background:rgba(255,255,255,.94);color:#14201a;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25);border:1px solid rgba(0,0,0,.06)}

.l3.red span{background:#b03a2e;color:#fff}.l3.green span{background:#1d7a4c;color:#fff}.l3.gold span{background:#d9b45c;color:#1b160a}.l3.dark span{background:#0b0d0c;color:#d9b45c;border-color:#d9b45c}

.l3.big span{font-size:14px;padding:4px 12px}
.hud{position:absolute;z-index:3}

.hud.tr{right:10px;top:10px;display:flex;gap:6px}
.hbtn2{border:1px solid rgba(255,255,255,.35);background:rgba(5,20,14,.7);color:#fff;border-radius:10px;min-height:36px;padding:0 10px;font-size:12.5px;font-weight:700;backdrop-filter:blur(6px)}
.hud.bm{left:10px;right:10px;bottom:10px;background:rgba(5,20,14,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border-radius:14px;padding:9px 12px;font-size:13.5px;line-height:1.35;border-left:3px solid #d9b45c;min-height:42px}
.hint3d{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:3;background:rgba(0,0,0,.45);color:#fff;font-size:11.5px;border-radius:999px;padding:4px 10px;animation:fadeout 4s 3s forwards;pointer-events:none;white-space:nowrap}
@keyframes fadeout{to{opacity:0}}
.pills{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pill{height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);transition:all .3s}
.pill.on{background:var(--emerald);color:var(--on-emerald);border-color:var(--emerald)}
.pill.cur{background:var(--gold-soft);color:var(--gold);border:2px solid var(--gold-2);animation:glow 1.4s ease-in-out infinite}
.bigcount{display:flex;align-items:baseline;gap:6px}
.bigcount b{font:800 44px/1 var(--f-display);color:var(--emerald);font-variant-numeric:tabular-nums}
.bigcount span{color:var(--muted);font-weight:700}
/* leaflet minimal */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;background:#c9d6cf;outline:0;font:12px/1.4 var(--f-body)}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-tile,.leaflet-container .leaflet-marker-pane img{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}.leaflet-container.leaflet-touch-drag{touch-action:none}.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-marker-icon,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}.leaflet-right .leaflet-control{float:right}.leaflet-bottom .leaflet-control{margin-bottom:0}
.leaflet-control-attribution{background:rgba(255,255,255,.75);font-size:10px;padding:0 5px;color:#333}.leaflet-control-attribution a{color:#0c5a41}
.leaflet-tooltip{position:absolute;pointer-events:none;white-space:nowrap}
.leaflet-fade-anim .leaflet-popup{opacity:1}
/* map ui */
.lmapbox{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
#lmap,#mqmap{height:min(60vh,520px);min-height:320px;width:100%}
.lmapbox .mapctl{z-index:1000}
.lmapbox #mapSvg{display:block;width:100%;height:min(58vh,460px);touch-action:none;background:var(--marble)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.layersw{position:absolute;left:10px;bottom:22px;z-index:1000;display:flex;background:rgba(5,20,14,.8);border-radius:12px;padding:3px;gap:3px;backdrop-filter:blur(6px)}
.layersw button{border:0;background:transparent;color:#dfe8e3;border-radius:9px;min-height:34px;padding:0 10px;font-size:12.5px;font-weight:700}
.layersw button[aria-pressed="true"]{background:#d9b45c;color:#1b160a}
.maphint{position:absolute;left:10px;right:62px;top:10px;z-index:1000;background:rgba(176,58,46,.95);color:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:600}
.maphint.gold{background:#d9b45c;color:#1b160a}
.pin3{background:none;border:0}
.pinb{width:34px;height:42px;position:relative;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.pinb::before{content:"";position:absolute;left:3px;top:0;width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg) translate(-3px,3px);background:var(--c);border:2.5px solid #fff;transform-origin:center}
.pinb span{position:absolute;left:0;right:0;top:4px;text-align:center;color:#fff;font-weight:800;font-size:13px;z-index:1}
.pinb.apx::before{border-style:dashed}
.pinb.sel{transform:scale(1.25);transform-origin:50% 100%;z-index:5}
.pinb.sel::after{content:"";position:absolute;left:7px;bottom:-2px;width:20px;height:8px;border-radius:50%;background:var(--c);opacity:.5;animation:ping 1.6s ease-out infinite}
.kicon svg{width:40px;height:40px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.hicon{width:34px;height:34px;border-radius:10px;background:#2b6c8f;border:2px solid #fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.tlbl{background:none;border:0}
.tlbl span{display:inline-block;transform:translate(-50%,-50%);background:rgba(217,180,92,.95);color:#1b160a;font-weight:800;font-size:11px;border-radius:999px;padding:2px 7px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.ptip{background:rgba(255,255,255,.95);color:#14201a;font-weight:700;font-size:11.5px;border-radius:8px;padding:3px 7px;box-shadow:0 2px 6px rgba(0,0,0,.3);border:0}
.ptip.gold{background:#d9b45c;color:#1b160a}.ptip.blue{background:#2b6c8f;color:#fff}
#lmap.tips-off .ptip{display:none}
.dtip{background:#ffd36b;color:#1b160a;font-weight:800;font-size:12px;border-radius:999px;padding:3px 9px;box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid #fff}
.dtip.blue{background:#5aa9e6;color:#fff}.dtip.red{background:#ff6b5b;color:#fff}
.mqdot{width:22px;height:22px;border-radius:50%;background:#ff6b5b;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45)}

.dn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:0 0 auto}

.dbar{display:block;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:4px}.dbar i{display:block;height:100%;border-radius:6px}
.dk{text-align:right;display:flex;flex-direction:column}.dk b{font-variant-numeric:tabular-nums;color:var(--emerald)}.dk small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.photo{margin:0 -16px;position:relative}.photo img{width:100%;max-height:240px;object-fit:cover;display:block;border-radius:0}.photo figcaption{position:absolute;right:8px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;border-radius:6px;padding:1px 6px}
.launch{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:18px;border:0;color:#f4f1e6;text-align:left;width:100%;box-shadow:var(--shadow)}

/* ---------- v4: typography for duas ---------- */
:root{--tl-size:calc(var(--ar-size) + 3px)}
.dua .tl{font-style:normal;color:var(--fg);font-size:var(--tl-size);font-weight:600;line-height:1.45}
.dua .tl.sec{font-size:15px;font-weight:500;color:var(--muted)}
.dua .ar{font-size:var(--ar-size);line-height:1.8;color:var(--muted)}
.dstep .tl{font-style:normal;color:var(--fg);font-size:calc(var(--tl-size) - 2px);font-weight:600;line-height:1.45}
.dstep .ar{font-size:calc(var(--ar-size) - 2px);color:var(--muted)}
.dmini{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.dmt{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.tlx{font-size:var(--tl-size);font-weight:600;line-height:1.45;color:var(--fg)}
.arx{font-family:var(--f-ar);font-size:var(--ar-size);line-height:1.8;direction:rtl;text-align:right;color:var(--muted)}
.mnx{font-size:14px;color:var(--fg);opacity:.85}
.focus .tlx{color:#fff;text-align:center;font-size:22px}
.focus .ar{font-size:18px;color:#a8b5ad}
/* ---------- v4: journey ---------- */
.hero.compact{min-height:0;grid-template-columns:1fr 104px;padding:14px 16px}
.hero.compact .orbit{width:104px;height:104px}
.hero.compact h1{font-size:20px}
.jprog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.journey{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:10px}
.journey::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:3px;border-radius:3px;background:linear-gradient(var(--emerald) 0 var(--fill),var(--line) var(--fill) 100%)}
.jn{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;position:relative}
.jdot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;background:var(--surface);border:2px solid var(--line);color:var(--muted);position:relative;z-index:1;margin-top:6px;font-variant-numeric:tabular-nums}
.jn.done .jdot{background:var(--emerald);border-color:var(--emerald);color:var(--on-emerald)}
.jn.cur .jdot{border-color:var(--gold-2);color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 0 rgba(217,180,92,.6);animation:jpulse 1.8s ease-out infinite}
@keyframes jpulse{0%{box-shadow:0 0 0 0 rgba(217,180,92,.55)}100%{box-shadow:0 0 0 14px rgba(217,180,92,0)}}
.jcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.jn.cur .jcard{border-color:var(--gold-2)}
.jn.open .jcard{border:2px solid var(--emerald)}
.jhead{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 12px;text-align:left;color:var(--fg);min-height:60px}
.jt{flex:1;min-width:0;display:flex;flex-direction:column}
.jt b{font:600 16px/1.25 var(--f-display)}
.jt small{color:var(--muted);font-size:12px}
.jnow{color:var(--gold)!important;font-weight:700}
.jn.done .jt b{color:var(--emerald)}
.chev{font-size:24px;color:var(--gold);transition:transform .25s}
.jn.open .chev{transform:rotate(90deg)}
.jbody{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px;animation:rise .35s cubic-bezier(.2,.7,.2,1) both}
.jlead{font-size:14.5px}
.jfoot{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;padding-top:4px}
.mw{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.mctr{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;background:linear-gradient(180deg,var(--gold-soft),var(--surface));border:1px solid var(--gold-2)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.toolb{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow);color:var(--fg)}
.toolb .ai{width:38px;height:38px}


/* ---------- v5: path ---------- */
nav.tabs .tabbar{grid-template-columns:repeat(4,1fr)!important}
.pdots{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap;padding:2px 0}
.pd{width:14px;height:8px;border-radius:8px;border:0;background:var(--line);padding:0;transition:all .3s}
.pd.done{background:var(--emerald)}
.pd.cur{width:30px;background:var(--gold-2)}
.pstep{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font:600 14px var(--f-body);color:var(--muted)}
.pstep span{font:800 15px var(--f-display);color:var(--gold)}
.pstep small{margin-left:auto;font-size:11.5px;opacity:.8}
.slide{display:flex;flex-direction:column;gap:12px;touch-action:pan-y}
.slide.in-r{animation:slr .38s cubic-bezier(.2,.8,.2,1)}
.slide.in-l{animation:sll .38s cubic-bezier(.2,.8,.2,1)}

  --shadow:0 1px 2px rgba(16,24,40,.05); --r:16px;
}

var DUAS=[
{id:"talbiya",cat:"ihram",title:t3("Талбия","Тальбия","Talbiyah"),ar:"لَبَّيْكَ اللَّهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ الْحَمْدَ وَالنِّعْمَةَ لَكَ وَالْمُلْكَ، لَا شَرِيكَ لَكَ",la:"Labbayka Allohumma labbayk. Labbayka laa shariyka laka labbayk. Innal hamda van-ni'mata laka val mulk. Laa shariyka lak.",cy:"Лаббайка Аллоҳумма лаббайк. Лаббайка ла шарийка лака лаббайк. Иннал ҳамда ван-ниъмата лака вал мулк. Ла шарийка лак.",
mean:t3("Лаббай, Аллоҳим, лаббай! Лаббай, Сенинг шеригинг йўқ, лаббай! Албатта, ҳамд ҳам, неъмат ҳам, мулк ҳам Сеникидир. Сенинг шеригинг йўқ.","Вот я пред Тобой, о Аллах, вот я! Вот я, нет у Тебя сотоварища, вот я! Поистине, хвала, милость и власть принадлежат Тебе. Нет у Тебя сотоварища.","Here I am, O Allah, here I am! Here I am, You have no partner, here I am! Truly all praise, grace and dominion are Yours. You have no partner."),
when:t3("Ниятдан сўнг, тавоф бошлангунча кўп айтилади; ҳар сафар уч мартадан айтиш мустаҳаб. Эркаклар овоз чиқариб, аёллар паст овозда.","После намерения и до начала тавафа — как можно чаще, каждый раз по три раза (мустахаб). Мужчины вслух, женщины тихо.","After the intention and until tawaf — often, three times each time (recommended). Men aloud, women quietly."),src:[["bukhari","1549"],["muslim","1184"],["muslimuz"]]},
{id:"niyyah",cat:"ihram",title:t3("Умра нияти","Намерение Умры","Intention for Umrah"),ar:"اللَّهُمَّ إِنِّي أُرِيدُ الْعُمْرَةَ فَيَسِّرْهَا لِي وَتَقَبَّلْهَا مِنِّي",la:"Allohumma inniy uriydul 'umrata fa yassirhaa liy va taqobbalhaa minniy.",cy:"Аллоҳумма инний урийдул ъумрата фа яссирҳа лий ва тақоббалҳа минний.",
mean:t3("Аллоҳим, мен умра қилишни ният қилдим, уни менга осон қил ва мендан қабул эт.","О Аллах, я намереваюсь совершить Умру — облегчи её мне и прими её от меня.","O Allah, I intend to perform Umrah, so make it easy for me and accept it from me."),
when:t3("Миқотда, эҳром кийиб икки ракат намоздан сўнг. Ният қалбда, тил билан айтиш мустаҳаб. Кейин талбия.","На микате, после облачения в ихрам и двух ракаатов. Намерение — в сердце, произнести желательно. Затем — Тальбия.","At the miqat, after putting on ihram and two rak'ahs. Intention is in the heart; saying it is recommended. Then Talbiyah."),src:[["book"]],verify:true},
{id:"enter",cat:"mosque",title:t3("Масжидга кириш","Вход в мечеть","Entering the mosque"),ar:"بِسْمِ اللَّهِ وَالصَّلَاةُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ",la:"Bismillahi vas-solaatu 'alaa Rosulillah. Allohummaftah liy abvaaba rohmatik.",cy:"Бисмиллаҳи вас-солату ъала Росулиллаҳ. Аллоҳуммафтаҳ лий абваба роҳматик.",
mean:t3("Аллоҳнинг номи билан, Расулуллоҳга саловот бўлсин. Аллоҳим, менга раҳматинг эшикларини очгин.","С именем Аллаха, благословение Посланнику Аллаха. О Аллах, открой мне врата Твоей милости.","In the name of Allah, blessings upon the Messenger of Allah. O Allah, open for me the gates of Your mercy."),when:t3("Ўнг оёқ билан кираётганда.","Входя правой ногой.","Entering with the right foot."),src:[["muslim","713"],["muslimuz"]]},
{id:"exit",cat:"mosque",title:t3("Масжиддан чиқиш","Выход из мечети","Leaving the mosque"),ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ",la:"Allohumma inniy as'aluka min fazlik.",cy:"Аллоҳумма инний асъалука мин фазлик.",mean:t3("Аллоҳим, мен Сендан фазлингни сўрайман.","О Аллах, прошу у Тебя Твоей щедрости.","O Allah, I ask You of Your bounty."),when:t3("Чап оёқ билан чиқаётганда.","Выходя левой ногой.","Leaving with the left foot."),src:[["muslim","713"]]},
{id:"istilam",cat:"tawaf",title:t3("Ҳажарул асвад рўпарасида","Напротив Чёрного камня","Facing the Black Stone"),ar:"بِسْمِ اللَّهِ وَاللَّهُ أَكْبَرُ",la:"Bismillahi valloohu akbar.",cy:"Бисмиллаҳи валлоҳу акбар.",mean:t3("Аллоҳнинг номи билан, Аллоҳ буюкдир.","С именем Аллаха, Аллах велик.","In the name of Allah, Allah is the Greatest."),
when:t3("Ҳар шавт бошида. Имкони бўлса ўпилади; одамларга озор етиш хавфи бўлса, қўл билан ишора қилиб, қўл ўпилади.","В начале каждого круга. Если возможно — целуют; если есть риск навредить людям — указывают рукой и целуют руку.","At the start of each circuit. Kiss the Stone if possible; otherwise point with the hand and kiss the hand."),src:[["muslimuz"],["bukhari","1613"]]},
{id:"rabbana",cat:"tawaf",title:t3("Рукни Ямоний ва Ҳажарул асвад орасида","Между Йеменским углом и Чёрным камнем","Between the Yemeni Corner and the Black Stone"),ar:"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",la:"Robbanaa aatinaa fid-dunyaa hasanatan va fil aahiroti hasanatan va qinaa 'azaaban-naar.",cy:"Роббана атина фид-дунё ҳасанатан ва фил ахироти ҳасанатан ва қина ъазабан-нар.",
mean:t3("Роббимиз, бизга бу дунёда ҳам, охиратда ҳам яхшилик бергин ва бизни дўзах азобидан сақлагин.","Господь наш, даруй нам благо в этом мире и благо в Последней жизни и защити нас от мучений Огня.","Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire."),
when:t3("Ҳар шавтда Рукни Ямонийдан Ҳажарул асвадгача — ҳадисда собит.","В каждом круге — от Йеменского угла до Чёрного камня (из хадиса).","In every circuit, from the Yemeni Corner to the Black Stone (from hadith)."),src:[["quran","2:201"],["abudawud","1892"],["tawafduas"]]},
{id:"maqam",cat:"tawaf",title:t3("Мақоми Иброҳим","Макам Ибрахим","Maqam Ibrahim"),ar:"وَاتَّخِذُوا مِنْ مَقَامِ إِبْرَاهِيمَ مُصَلًّى",la:"Vattahizuu min maqoomi Ibroohiyma musollaa.",cy:"Ваттахизу мин мақоми Иброҳийма мусолла.",mean:t3("Иброҳимнинг мақомини намозгоҳ қилиб олинглар.","Сделайте место Ибрахима местом молитвы.","Take the station of Ibrahim as a place of prayer."),
when:t3("Тавофдан сўнг икки ракатга бораётганда. 1-ракатда «Кофирун», 2-ракатда «Ихлос».","Направляясь к двум ракаатам после тавафа. 1-й ракаат — «аль-Кафирун», 2-й — «аль-Ихлас».","Going to the two rak'ahs after tawaf. Rak'ah 1: al-Kafirun; rak'ah 2: al-Ikhlas."),src:[["quran","2:125"],["muslim","1218"],["tawafduas"]]},
{id:"zamzam",cat:"zamzam",title:t3("Замзам суви","Вода Замзам","Zamzam water"),ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا وَاسِعًا، وَشِفَاءً مِنْ كُلِّ دَاءٍ",la:"Allohumma inniy as'aluka 'ilman naafi'an, va rizqon vaasi'an, va shifaa'an min kulli daa'.",cy:"Аллоҳумма инний асъалука ъилман нафиъан, ва ризқон васиъан, ва шифаан мин кулли даъ.",
mean:t3("Аллоҳим, Сендан фойдали илм, кенг ризқ ва ҳар бир дарддан шифо сўрайман.","О Аллах, прошу у Тебя полезного знания, обильного удела и исцеления от всякой болезни.","O Allah, I ask You for beneficial knowledge, abundant provision and a cure for every illness."),
when:t3("Қиблага юзланиб, «Бисмиллаҳ» билан уч ҳўплаб ичилади. Ҳадис: «Замзам суви нима учун ичилса, ўшанга».","Лицом к Кибле, с «Бисмиллях», в три глотка. Хадис: «Вода Замзам — для того, ради чего её пьют».","Facing the Qiblah, with Bismillah, in three sips. Hadith: Zamzam is for whatever it is drunk for."),src:[["ibnmajah","3062"]],verify:true},
{id:"safa1",cat:"sai",title:t3("Сафога чиқаётганда","Поднимаясь на Сафа","Approaching Safa"),ar:"إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَائِرِ اللَّهِ، أَبْدَأُ بِمَا بَدَأَ اللَّهُ بِهِ",la:"Innas-sofaa val marvata min sha'aairillah. Abda'u bimaa bada'allohu bih.",cy:"Иннас-сафа вал марвата мин шаъаириллаҳ. Абдаъу бима бадааллоҳу биҳ.",
mean:t3("Албатта, Сафо ва Марва Аллоҳнинг белгиларидандир. Аллоҳ бошлаган нарсадан бошлайман.","Поистине, ас-Сафа и аль-Марва — из обрядовых знаков Аллаха. Начинаю с того, с чего начал Аллах.","Indeed Safa and Marwa are among the symbols of Allah. I begin with what Allah began with."),when:t3("Саъй бошида, Сафога яқинлашганда (бир марта).","В начале саъя, подходя к Сафа (один раз).","At the start of sa'i, approaching Safa (once)."),src:[["quran","2:158"],["muslim","1218"]]},
{id:"safa2",cat:"sai",title:t3("Сафо ва Марва устида","На Сафа и Марве","On Safa and Marwa"),ar:"اللَّهُ أَكْبَرُ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ وَهُوَ حَيٌّ لَا يَمُوتُ، بِيَدِهِ الْخَيْرُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لَا إِلَهَ إِلَّا اللَّهُ وَلَا نَعْبُدُ إِلَّا إِيَّاهُ",
la:"Allohu akbar. Laa ilaaha illallohu vahdahu laa shariyka lah, lahul mulku va lahul hamd, yuhyiy va yumiyt va huva hayyun laa yamuut, biyadihil xoyr, va huva 'alaa kulli shay'in qodiyr. Laa ilaaha illalloh, va laa na'budu illaa iyyaah.",cy:"Аллоҳу акбар. Ла илаҳа иллаллоҳу ваҳдаҳу ла шарийка лаҳ, лаҳул мулку ва лаҳул ҳамд, юҳйий ва юмийт ва ҳува ҳаййун ла ямут, бийадиҳил хойр, ва ҳува ъала кулли шайъин қодийр. Ла илаҳа иллаллоҳ, ва ла наъбуду илла иййаҳ.",
mean:t3("Аллоҳ буюкдир. Ёлғиз Аллоҳдан ўзга илоҳ йўқ, Унинг шериги йўқ. Мулк ва ҳамд Уникидир. У тирилтиради ва ўлдиради, Ўзи ўлмайдиган тирикдир. Яхшилик Унинг қўлида, У ҳар нарсага қодир. Аллоҳдан ўзга илоҳ йўқ, фақат Унга ибодат қиламиз.","Аллах велик. Нет божества, кроме Одного Аллаха, нет у Него сотоварища. Ему — власть и хвала. Он оживляет и умерщвляет, и Он Живой, не умирающий. В Его руке благо, и Он над всем властен. Нет божества, кроме Аллаха, и мы поклоняемся только Ему.","Allah is the Greatest. There is no god but Allah alone, without partner. His is the dominion and the praise. He gives life and death and is the Ever-Living who does not die. All good is in His hand and He has power over all things. There is no god but Allah, and we worship none but Him."),
when:t3("Сафо ва Марва тепасида Каъбага юзланиб (мустаҳаб).","Наверху Сафа и Марвы, лицом к Каабе (мустахаб).","On top of Safa and Marwa, facing the Kaaba (recommended)."),src:[["muslimuz"],["muslim","1218"]]},
{id:"saiwalk",cat:"sai",title:t3("Сафо ва Марва оралиғида","Между Сафа и Марвой","Between Safa and Marwa"),ar:"رَبِّ اغْفِرْ وَارْحَمْ وَتَجَاوَزْ عَمَّا تَعْلَمُ، إِنَّكَ أَنْتَ الْأَعَزُّ الْأَكْرَمُ",la:"Robbig'fir varham va tajaavaz 'ammaa ta'lam, innaka antal a'azzul akram.",cy:"Роббиғфир варҳам ва тажаваз ъамма таълам, иннака антал аъаззул акрам.",
mean:t3("Роббим, мағфират қил, раҳм қил, Ўзинг билган гуноҳларимни афв эт. Албатта, Сен энг азиз, энг карамли Зотсан.","Господи, прости, помилуй и оставь без взыскания то, о чём Ты знаешь. Поистине, Ты — Самый Могущественный, Самый Щедрый.","My Lord, forgive, have mercy and pardon what You know. Truly You are the Most Mighty, the Most Generous."),when:t3("Йўлда (мустаҳаб). Бошқа дуо ва зикрлар ҳам мумкин.","В пути между холмами (мустахаб). Можно и другие дуа и зикры.","While walking (recommended). Other du'a and dhikr are fine."),src:[["muslimuz"]],verify:true},
{id:"halq",cat:"halq",title:t3("Соч олдираётганда","При стрижке волос","When cutting the hair"),ar:"اللَّهُمَّ هَذِهِ نَاصِيَتِي بِيَدِكَ، فَاجْعَلْ لِي بِكُلِّ شَعْرَةٍ نُورًا يَوْمَ الْقِيَامَةِ، وَامْحُ عَنِّي بِهَا سَيِّئَةً، وَارْفَعْ لِي بِهَا دَرَجَةً، اللَّهُمَّ بَارِكْ فِي نَفْسِي وَتَقَبَّلْ مِنِّي، اللَّهُمَّ اغْفِرْ لِي وَلِلْمُحَلِّقِينَ وَالْمُقَصِّرِينَ يَا وَاسِعَ الْمَغْفِرَةِ",
la:"Allohumma haazihi naasiyatiy biyadik, faj'al liy bikulli sha'ratin nuuron yavmal qiyaamah, vamhu 'anniy bihaa sayyi'atan, varfa' liy bihaa darajah. Allohumma baarik fiy nafsiy va taqobbal minniy. Allohummag'fir liy va lil-muhalliqiyna val-muqossiriyn, yaa vaasi'al mag'firah.",cy:"Аллоҳумма ҳазиҳи носиятий бийадик, фажъал лий бикулли шаъротин нуран явмал қиямаҳ, вамҳу ъанний биҳа саййиатан, варфаъ лий биҳа дарожаҳ. Аллоҳумма барик фий нафсий ва тақоббал минний. Аллоҳуммағфир лий ва лил-муҳаллиқийна вал-муқоссирийн, я васиъал мағфироҳ.",
mean:t3("Аллоҳим, пешона сочим Сенинг қўлингдадир. Қиёматда ҳар бир толаси учун менга нур бер, ҳар бири билан бир гуноҳимни ўчир ва даражамни кўтар. Аллоҳим, мени баракали қил ва мендан қабул эт. Аллоҳим, мени ҳамда соч олдирган ва қисқартирганларни мағфират қил, эй мағфирати кенг Зот.","О Аллах, мой чуб — в Твоей руке. Даруй мне за каждый волос свет в Судный день, сотри им грех и возвысь степень. О Аллах, благослови меня и прими от меня. О Аллах, прости меня и обривших и укоротивших, о Обладающий обширным прощением.","O Allah, my forelock is in Your hand. Grant me light for every hair on the Day of Resurrection, erase a sin and raise a rank with each. O Allah, bless me and accept from me. O Allah, forgive me and those who shave and shorten, O You of vast forgiveness."),
when:t3("Соч олдириш ёки қисқартириш вақтида (мустаҳаб).","Во время бритья или укорачивания (мустахаб).","While shaving or shortening (recommended)."),src:[["muslimuz"]],verify:true},
{id:"travel",cat:"travel",title:t3("Сафар дуоси","Дуа в путешествии","Travel du'a"),ar:"سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُونَ",la:"Subhaanallaziy saxxoro lanaa haazaa va maa kunnaa lahu muqriniyn, va innaa ilaa robbinaa lamunqolibuun.",cy:"Субҳаналлазий саххоро лана ҳаза ва ма кунна лаҳу муқринийн, ва инна ила роббина ламунқолибун.",
mean:t3("Буни бизга бўйсундириб қўйган Зот покдир, биз унга қодир эмас эдик. Албатта, биз Роббимизга қайтгувчимиз.","Пречист Тот, Кто подчинил нам это, а сами мы не были на это способны. И, поистине, мы вернёмся к нашему Господу.","Glory be to the One who subjected this to us; we could not have done it ourselves. And to our Lord we shall return."),when:t3("Уловга ўтиргач.","Сев в транспорт.","After boarding a vehicle."),src:[["quran","43:13"],["muslim","1342"]]},
{id:"salam",cat:"madinah",title:t3("Пайғамбаримизга ﷺ салом","Салям Пророку ﷺ","Greeting the Prophet ﷺ"),ar:"السَّلَامُ عَلَيْكَ يَا رَسُولَ اللَّهِ، السَّلَامُ عَلَيْكَ يَا أَبَا بَكْرٍ، السَّلَامُ عَلَيْكَ يَا عُمَرُ",la:"Assalaamu 'alayka yaa Rosulalloh. Assalaamu 'alayka yaa Abaa Bakr. Assalaamu 'alayka yaa 'Umar.",cy:"Ассалому ъалайка я Росулаллоҳ. Ассалому ъалайка я Аба Бакр. Ассалому ъалайка я Ъумар.",
mean:t3("Сизга салом бўлсин, эй Аллоҳнинг Расули. Сизга салом бўлсин, эй Абу Бакр. Сизга салом бўлсин, эй Умар.","Мир тебе, о Посланник Аллаха. Мир тебе, о Абу Бакр. Мир тебе, о Умар.","Peace be upon you, O Messenger of Allah. Peace be upon you, O Abu Bakr. Peace be upon you, O Umar."),
when:t3("Равзаи муборак рўпарасида, паст овозда: аввал Пайғамбаримизга ﷺ, бир қадам ўнгга — Абу Бакрга, яна бир қадам — Умарга.","У благословенной могилы, тихо: сначала Пророку ﷺ, шаг вправо — Абу Бакру, ещё шаг — Умару.","At the blessed grave, quietly: first the Prophet ﷺ, a step right for Abu Bakr, another for Umar."),src:[["book"]],verify:true},
{id:"baqi",cat:"madinah",title:t3("Қабристонга кирганда","При посещении кладбища","Visiting the graves"),ar:"السَّلَامُ عَلَيْكُمْ أَهْلَ الدِّيَارِ مِنَ الْمُؤْمِنِينَ وَالْمُسْلِمِينَ، وَإِنَّا إِنْ شَاءَ اللَّهُ بِكُمْ لَلَاحِقُونَ، أَسْأَلُ اللَّهَ لَنَا وَلَكُمُ الْعَافِيَةَ",la:"Assalaamu 'alaykum ahlad-diyaari minal mu'miniyna val muslimiyn, va innaa in shaa'allohu bikum laalahiquun. As'alullooha lanaa va lakumul 'aafiyah.",cy:"Ассалому ъалайкум аҳлад-диёри минал муъминийна вал муслимийн, ва инна ин шаъаллоҳу бикум лалаҳиқун. Асъалуллоҳа лана ва лакумул ъафияҳ.",
mean:t3("Эй бу масканлар аҳли бўлган мўмин ва мусулмонлар, сизларга салом бўлсин. Иншааллоҳ, биз ҳам сизларга қўшиламиз. Аллоҳдан ўзимизга ва сизларга офият сўрайман.","Мир вам, обитатели этих жилищ из верующих и мусульман. Мы, если пожелает Аллах, присоединимся к вам. Прошу у Аллаха благополучия нам и вам.","Peace be upon you, O believing dwellers of these abodes. We shall, if Allah wills, join you. I ask Allah for wellbeing for us and for you."),when:t3("Ал-Бақиъ ва Уҳуд шаҳидлари зиёратида.","При посещении аль-Баки и шахидов Ухуда.","Visiting al-Baqi and the martyrs of Uhud."),src:[["muslim","975"]]}

t3("Аллоҳни поклаш ва улуғлаш, Пайғамбаримизга ﷺ салавот, афв, офият ва дўзахдан нажот сўраш.","Прославление Аллаха, благословение Пророку ﷺ, мольба о прощении, благополучии и спасении от Огня.","Glorifying Allah, blessings on the Prophet ﷺ, asking for pardon, wellbeing and salvation from the Fire."),
t3("Байтнинг Роббига мурожаат: иймонни севимли, гуноҳни ёқимсиз қилишини ва жаннатни ҳисобсиз сўраш.","Обращение к Господу Дома: сделать веру любимой, грех ненавистным, и просьба о Рае без отчёта.","Calling on the Lord of the House: make faith beloved and sin hateful, and grant Paradise without reckoning."),
t3("Шак, ширк, нифоқ, ёмон ахлоқ, оила ва молдаги ёмонлик, қабр фитнаси ва икки дунё хорлигидан паноҳ сўраш.","Защита от сомнения, многобожия, лицемерия, дурного нрава, бед в семье и имуществе, испытания могилы и унижения в обоих мирах.","Refuge from doubt, shirk, hypocrisy, bad character, harm to family and wealth, the trial of the grave and disgrace in both worlds."),
t3("Мақбул ибодат, мағфират, ҳалол ризқ, қаноат ва зарардан ҳимоя сўраш.","Просьба о принятом поклонении, прощении, дозволенном уделе, довольстве и защите от вреда.","Asking for accepted worship, forgiveness, lawful provision, contentment and protection from harm."),
t3("Қиёмат куни Аллоҳнинг соясида бўлиш, Пайғамбаримиз ﷺ ҳавзидан ичиш ва жаннат сўраш.","Просьба оказаться в тени Аллаха в Судный день, испить из Водоёма Пророка ﷺ и войти в Рай.","Asking for Allah's shade on the Day of Judgment, to drink from the Prophet's ﷺ Pool, and for Paradise."),
t3("Аллоҳнинг ва бандаларнинг ҳақлари учун мағфират, ҳалол билан кифояланишни сўраш.","Признание прав Аллаха и людей, мольба о прощении и о достатке через дозволенное.","Acknowledging the rights of Allah and of people; asking forgiveness and sufficiency through what is lawful."),
t3("Комил иймон, холис яқийн, ўлимдан олдин тавба, ўлимдан кейин мағфират, илм зиёдалиги ва солиҳлар ҳамроҳлигини сўраш.","Просьба о совершенной вере, искренней убеждённости, покаянии до смерти, прощении после неё, росте знания и обществе праведных.","Asking for perfect faith, sincere certainty, repentance before death, forgiveness after it, more knowledge and the company of the righteous.")];

extra:t3("Умра йилнинг исталган вақтида, энг афзали Рамазонда. Арафа куни ва Қурбон ҳайитининг тўрт кунида (жами беш кун) макруҳи таҳримий. Умрада Арафот, Муздалифа, тош отиш, қудум ва видо тавофлари йўқ.","Умру можно совершать в любое время, лучше всего — в Рамадан. В день Арафа и четыре дня Курбан-байрама (пять дней) — макрух тахрими. В Умре нет Арафата, Муздалифы, бросания камней, тавафа прибытия и прощального тавафа.","Umrah may be done any time, best in Ramadan. On the day of Arafah and the four days of Eid al-Adha (five days) it is makruh tahrimi. Umrah has no Arafat, Muzdalifah, stoning, arrival or farewell tawaf."),

lead:t3("Миқот — эҳромсиз ўтиб бўлмайдиган чегара. Харитадаги нуқтага босинг — масофа ва йўналиш чиқади.","Микат — граница, которую нельзя пересечь без ихрама. Нажмите на точку на карте — появится расстояние и направление.","The miqat is a boundary not to be crossed without ihram. Tap a point on the map to see distance and direction."),
stage:"miqat",
extra:t3("Ўзбекистонлик гуруҳлар кўпинча аввал Мадинага борадилар ва Маккага йўлга чиққанда Зулҳулайфада (Абёр Али) эҳромга кирадилар. Тўғридан-тўғри Жиддага учганлар самолёт миқот чизиғидан ўтишидан олдин эҳромга кирадилар: эҳромни олдиндан кийиб, экипаж эълонини кутинг. Миқотдан эҳромсиз ўтган киши қайтиши ёки жарима бериши лозим — гуруҳ раҳбаридан сўранг.","Узбекские группы обычно сначала едут в Медину и, выезжая в Мекку, входят в ихрам в Зуль-Хулайфе (Абьяр Али). Летящие прямо в Джидду входят в ихрам до того, как самолёт пересечёт линию миката: наденьте ихрам заранее и ждите объявления экипажа. Пересёкший микат без ихрама должен вернуться или дать искупление — уточните у руководителя группы.","Uzbek groups usually go to Madinah first and enter ihram at Dhul-Hulayfah (Abyar Ali) on the way to Makkah. Those flying directly to Jeddah enter ihram before the plane crosses the miqat line: wear it in advance and wait for the crew announcement. Whoever crosses without ihram must return or give an expiation — ask your group leader."),
mist:[t3("Жиддага етгач эҳромга кирамиз деб ўйлаш.","Думать, что можно войти в ихрам уже в Джидде.","Assuming ihram can wait until Jeddah.")],src:[["wiki"],["muslimuz"],["book"]]},

extra:t3("Жарима: масалан, бир кеча-кундуз тикилган кийим кийилса ёки бир қўл тирноқлари бир ўтиришда олинса — қўй; бир тирноқ ёки бир аъзонинг бир қисмига хушбўйлик — тахминан 2 кг буғдой ёки унинг қиймати.","Искупление: например, шитая одежда целые сутки или ногти всей руки за раз — овца; один ноготь или благовоние на часть органа — около 2 кг пшеницы или её стоимость.","Expiation: e.g. stitched clothing for a full day, or all nails of one hand at once — a sheep; one nail, or perfume on part of a limb — about 2 kg of wheat or its value."),src:[["muslimuz"],["book"]]},

{id:"tawaf",ic:"kaaba",title:t3("Тавоф","Таваф","Tawaf"),
lead:t3("Каъба чап томонда, Ҳажарул асвад рўпарасидан бошлаб 7 марта айланилади. Анимацияни ишга туширинг — ҳар шавт ва ҳар нуқта кўрсатилади.","7 кругов, Кааба слева, старт напротив Чёрного камня. Запустите анимацию — она показывает каждый круг и каждую точку.","Seven circuits, the Kaaba on your left, starting at the Black Stone. Play the animation to see every circuit and point."),
stage:"kaaba",
pts:[P("wajib",t3("Ҳажарул асваддан бошлаш.","Начинать от Чёрного камня.","Start at the Black Stone.")),P("wajib",t3("Каъбани чап томонда тутиш.","Кааба — слева.","Keep the Kaaba on your left.")),P("wajib",t3("Ҳатим (Ҳижри Исмоил) ортидан айланиш.","Обходить за Хатимом (Хиджр Исмаил).","Go around outside the Hatim (Hijr Ismail).")),P("wajib",t3("Таҳорат ва авратни ёпиш.","Омовение и закрытый аурат.","Wudu and covered awrah.")),P("wajib",t3("Қодир киши ўзи пиёда юриши.","Кто может — идёт сам.","Walk yourself if able.")),P("fard",t3("4 шавт — фарз, 7 тагача — вожиб.","4 круга — фарз, до 7 — ваджиб.","4 circuits fard, up to 7 wajib.")),P("sunnah",t3("Имкони бўлса Ҳажарул асвадни ўпиш; бўлмаса ишора қилиб, қўлни ўпиш.","Поцеловать Чёрный камень, если возможно; иначе указать рукой и поцеловать руку.","Kiss the Black Stone if possible; otherwise point and kiss your hand.")),P("sunnah",t3("Рукни Ямонийни фақат қўл билан ушлаш; имкон бўлмаса — ишора ҳам йўқ.","Йеменский угол — только коснуться; если нельзя — даже не указывать.","Yemeni Corner — only touch; if not possible, don't even point."))],
men:t3("Изтибоъ: ридо ўнг қўлтиқ остидан ўтиб, чап елкага ташланади — ўнг елка очиқ. Рамл: дастлабки 3 шавтда кичик қадам билан тез юриш. Иккаласи фақат саъйдан олдинги тавофда.","Идтиба: рида под правой подмышкой и на левом плече — правое плечо открыто. Рамаль: в первых 3 кругах быстрая ходьба мелким шагом. Оба — только в тавафе перед саъем.","Idtiba: rida under the right armpit over the left shoulder — right shoulder bare. Ramal: brisk short steps in the first 3 circuits. Both only in the tawaf before sa'i."),
women:t3("Изтибоъ ва рамл йўқ. Одатдаги юриш, тиқилинчдан четроқда.","Без идтибы и рамаля. Обычный шаг, подальше от толпы.","No idtiba or ramal. Normal pace, away from crowds."),
extra:CIRCUIT_NOTE,
mist:[t3("Ҳатим ичидан ўтиш — шавт ҳисобланмайди.","Проход внутри Хатима — круг не засчитывается.","Walking through the Hatim — the circuit does not count."),t3("Ҳажарул асвадга етиш учун итариш.","Толкаться ради Чёрного камня.","Pushing to reach the Black Stone."),t3("Рукни Ямонийни ўпиш ёки ишора қилиш.","Целовать Йеменский угол или указывать на него.","Kissing or pointing at the Yemeni Corner.")],

pts:[P("wajib",t3("Ҳар бир тавофдан кейин икки ракат.","Два ракаата после каждого тавафа.","Two rak'ahs after every tawaf.")),P("mustahab",t3("Мақоми Иброҳим ортида; имкон бўлмаса — масжиднинг исталган жойида.","За Макамом Ибрахима; если нельзя — в любом месте мечети.","Behind Maqam Ibrahim; if not possible, anywhere in the mosque.")),P("sunnah",t3("1-ракатда «Кофирун», 2-ракатда «Ихлос».","1-й ракаат — «аль-Кафирун», 2-й — «аль-Ихлас».","Rak'ah 1: al-Kafirun; rak'ah 2: al-Ikhlas.")),P("sunnah",t3("Имкони бўлса, саъйдан олдин Ҳажарул асвадни истилом қилиш.","Если возможно — истилям Чёрного камня перед саъем.","If possible, istilam of the Black Stone before sa'i."))],

{id:"zamzam",ic:"wash",title:t3("Замзам суви","Вода Замзам","Zamzam water"),

{id:"sai",ic:"pin",title:t3("Сафо ва Марва орасида саъй","Саъй между Сафа и Марвой","Sa'i between Safa and Marwa"),
lead:t3("Саъй Сафодан бошланади: Марвага бориш — 1, қайтиш — 2. Жами 7 марта, Марвада тугайди. Анимацияда ҳар бир марта кўрсатилади.","Саъй начинается с Сафа: до Марвы — 1, обратно — 2. Всего 7, завершение на Марве. Анимация показывает каждый отрезок.","Sa'i starts at Safa: to Marwa is 1, back is 2. Seven in all, ending at Marwa. The animation shows every lap."),
stage:"masa",

men:t3("Икки яшил чироқ орасида енгил югуриш (ҳарвала).","Между зелёными огнями — лёгкий бег (харвала).","Between the green lights, jog lightly (harwalah)."),women:t3("Яшил чироқлар орасида ҳам одатдаги қадам.","Между зелёными огнями — обычный шаг.","Normal pace even between the green lights."),
extra:t3("Юра олмайдиган, кекса ёки бемор киши аравачада саъй қилиши мумкин — Масъада махсус йўлак бор.","Кто не может идти — на коляске; в Масъа есть отдельная дорожка.","Those unable to walk may use a wheelchair; the Mas'a has a dedicated lane."),

{id:"halq",ic:"hair",title:t3("Соч олдириш ёки қисқартириш","Бритьё или укорачивание","Shaving or shortening"),
lead:t3("Вожиб. Шундан сўнг умра тугайди ва эҳром тақиқлари бекор бўлади.","Ваджиб. После этого Умра завершена и запреты ихрама сняты.","Wajib. After it, Umrah is complete and ihram restrictions are lifted."),
pts:[P("wajib",t3("Қисқартириш — бутун бошдаги сочни бармоқ учи миқдорида.","Укорачивание — все волосы на длину кончика пальца.","Shortening — all head hair by a fingertip's length.")),P("wajib",t3("Бошнинг тўртдан биридан кам бўлса — вожиб адо бўлмайди, қўй лозим.","Меньше четверти головы — ваджиб не выполнен, нужна овца.","Less than a quarter of the head — the wajib is not met; a sheep is due.")),P("sunnah",t3("Эркаклар учун тўлиқ олдириш афзал.","Мужчинам лучше обрить полностью.","For men, full shaving is better."))],
men:t3("Тўлиқ олдириш ёки бутун бошни бир хил қисқартириш. Фақат баъзи жойдан қирқиш макруҳ. Сочи йўқ киши устарани бошнинг тўртдан бирига юргизади.","Обрить или равномерно укоротить всю голову. Подрезать местами — макрух. Без волос — провести бритвой по четверти головы.","Shave or evenly shorten the whole head. Cutting in spots is disliked. Bald: pass a razor over a quarter of the head."),
women:t3("Сочнинг учидан бармоқ учи миқдорида. Аёлга сочни олдириш ҳаром. Сочни йиғиб, учларини ўзи ёки маҳрам ёпиқ жойда қирқади.","Концы волос на длину кончика пальца. Брить голову женщине харам. Соберите волосы и отрежьте концы сами или с махрамом, в уединении.","Ends cut by a fingertip's length. Shaving is forbidden for women. Gather the hair; cut the ends yourself or with a mahram, in private."),duas:["halq"],src:[["muslimuz"],["book"]]},
{id:"finish",ic:"star",title:t3("Умра якуни","Завершение Умры","Completing Umrah"),
lead:t3("Сочни олдиргач, умра ибодати ниҳоясига етди. Ҳожилар ва умра қилувчилар — Аллоҳнинг меҳмонлари.","После стрижки Умра завершена. Совершающие хадж и Умру — гости Аллаха.","After the haircut, Umrah is complete. Pilgrims are the guests of Allah."),

function hav(a,b,c,d){var R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(h));}
function fmtD(m){return m<1000?Math.round(m/10)*10+" "+tr("m"):(m<10000?(m/1000).toFixed(1):Math.round(m/1000))+" "+tr("km");}
function walkMin(m){return Math.max(1,Math.round(m*1.25/80));}

if(d.back!==undefined){stopAnims();nav(parentOf(route));return;}
if(d.theme!==undefined){var dark=S.theme?S.theme==="dark":(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);S.theme=dark?"light":"dark";save();applyTheme();if(route==="map")drawMap();return;}
if(d.close!==undefined){layer.innerHTML="";return;}
if(d.pi){pathGo(+d.pi,+d.pi>S.pi?1:-1);return;}

if(d.tap){if(bump(d.tap)){renderView(true);var tb=document.querySelector(".tapart");if(tb){tb.classList.add("pop");}}else if(S[d.tap]<7)toast(tr("wait"));return;}
if(d.jopen){var ji=+d.jopen;S.jOpen=S.jOpen===ji?-1:ji;save();renderView(true);if(S.jOpen===ji){var el0=document.getElementById("jn"+ji);if(el0)try{el0.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});}catch(e){}}return;}
if(d.jdone){var k2=+d.jdone,sid=STEPS[k2].id,ix2=S.done.indexOf(sid);if(ix2>=0)S.done.splice(ix2,1);else{S.done.push(sid);buzz(20);toast("✓ "+L(STEPS[k2].title));var nx=firstUndone();S.jOpen=nx;if(nx>=0)S.step=nx;}save();renderView(true);if(ix2<0&&S.jOpen>=0){setTimeout(function(){var el1=document.getElementById("jn"+S.jOpen);if(el1)try{el1.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});}catch(e){}},60);}return;}
if(d.jplus){if(bump(d.jplus))renderView(true);return;}
if(d.jundo){if(S[d.jundo]>0){S[d.jundo]--;save();}renderView(true);return;}
if(d.twmode){TW.demo=d.twmode==="demo";TW.laps=0;TW.ang=0;renderView(true);return;}

if(d.demorestart!==undefined){if(route==="tawaf"){TW.laps=0;TW.ang=0;if(TW.sync)TW.sync();}else{SA.laps=0;SA.x=0;if(SA.sync)SA.sync();}return;}
if(d.view){setView(d.view);return;}
if(d.tod!==undefined){S.tod=S.tod==="day"?"night":"day";save();renderView(true);return;}
if(d.layer){LM.base=d.layer;if(LM.map&&LM.layers.sat){LM.map.removeLayer(LM.layers.sat);LM.map.removeLayer(LM.layers.streets);LM.layers[LM.base].addTo(LM.map);}document.querySelectorAll("[data-layer]").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.layer===LM.base));});return;}

if(d.favp2){var a2=S.favP,j3=a2.indexOf(d.favp2);if(j3>=0)a2.splice(j3,1);else a2.push(d.favp2);save();placeSheet2(PLACES2.filter(function(x){return x.id===d.favp2;})[0]);return;}
if(d.vis2){var b3=S.visited,j4=b3.indexOf(d.vis2);if(j4>=0)b3.splice(j4,1);else b3.push(d.vis2);save();placeSheet2(PLACES2.filter(function(x){return x.id===d.vis2;})[0]);return;}
if(d.psheet){placeSheet2(PLACES2.filter(function(x){return x.id===d.psheet;})[0]);return;}
if(d.mq2){mqSel2=d.mq2;renderView(true);return;}
/* counters */
if(d.cmode){S.cmode=d.cmode;save();refreshCounter();return;}
if(d.men){S.men=d.men==="1";save();refreshCounter();return;}
if(d.plus){if(bump(d.plus)){try{var ob=d.plus==="tawaf"?TW:SA;if(ob.sync)ob.sync(true);}catch(e){}refreshCounter();var b=document.querySelector("[data-plus]");if(b&&S[d.plus]<7){b.classList.add("cool");b.disabled=true;setTimeout(function(){var b2=document.querySelector("[data-plus]");if(b2){b2.disabled=S[S.cmode]>=7;b2.classList.remove("cool");}},1200);}}return;}
if(d.undo){if(S[d.undo]>0){S[d.undo]--;save();}try{var ou=d.undo==="tawaf"?TW:SA;if(ou.sync)ou.sync(false);}catch(e){}refreshCounter();return;}

if(d.focus!==undefined){if(d.focus)S.cmode=d.focus;openFocus();return;}
if(d.fmode){S.cmode=d.fmode;save();layer.innerHTML=focusHtml();return;}
if(d.fgo!==undefined){if(bump(S.cmode)){layer.innerHTML=focusHtml();var g=layer.querySelector(".go");if(g&&S[S.cmode]<7){g.disabled=true;setTimeout(function(){var g2=layer.querySelector(".go");if(g2)g2.disabled=S[S.cmode]>=7;},1200);}}return;}
if(d.fundo!==undefined){if(S[S.cmode]>0){S[S.cmode]--;save();}layer.innerHTML=focusHtml();return;}
if(d.fexit!==undefined){closeFocus();return;}

if(d.ctsave!==undefined){layer.innerHTML="";toast(tr("saved"));refreshCounter();return;}

if(d.step){stopAnims();S.step=+d.step;save();if(route!=="umrah")nav("umrah");else{render();window.scrollTo(0,0);}return;}

 if(ix<0&&S.step<STEPS.length-1){S.step++;save();stopAnims();render();window.scrollTo(0,0);}else render(true);return;}

if(d.marestart!==undefined){MA.lap=0;MA.x=0;MA.last=0;maUpdate(false);if(!MA.on)maToggle();return;}

if(d.copy){var du=duaById(d.copy);copyText(L(du.title)+"\n\n"+du.ar+"\n\n"+du.la+"\n"+du.cy+"\n\n"+L(du.mean));return;}

if(d.favp){var a=S.favP,j=a.indexOf(d.favp);if(j>=0)a.splice(j,1);else a.push(d.favp);save();placeSheet(d.favp);return;}
if(d.vis){var b2=S.visited,j2=b2.indexOf(d.vis);if(j2>=0)b2.splice(j2,1);else b2.push(d.vis);save();placeSheet(d.vis);return;}

});
