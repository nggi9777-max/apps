<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="KaraKara — interactive multiplication table adventure game. by Anvar Muratov">
<meta name="author" content="Anvar Muratov">
<meta name="color-scheme" content="light dark">
<title>KaraKara — by Anvar Muratov</title>
<style>
/* =========================================================
   KaraKara — styles
   ========================================================= */
:root{
  --font:"Nunito","Varela Round","Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --r:22px;
}
:root,[data-theme="light"]{
  --bg:#dcf0ff; --bg2:#bfe1ff; --card:#ffffff; --card2:#f2f8ff; --text:#132d55; --muted:#4b6286;
  --line:#d2e3f6; --pri:#2a72ee; --pri2:#1a55c2; --on-pri:#ffffff; --acc:#ffc23a; --acc2:#ff8a1f; --on-acc:#3b2200;
  --ok:#137a43; --okbg:#dcf7e8; --bad:#b83434; --badbg:#ffe6e6; --vio:#7b5cff;
  --sh:0 10px 24px rgba(24,72,150,.14); --sh2:0 4px 0 rgba(20,60,130,.18); --glow:0 0 0 transparent;
  --field:#eaf5ff; --deco1:rgba(255,255,255,.7); --deco2:rgba(255,214,102,.18);
}
[data-theme="dark"]{
  --bg:#0c1530; --bg2:#1b1444; --card:#17244a; --card2:#1f2d59; --text:#eef3ff; --muted:#b0bde0;
  --line:#2e3e6c; --pri:#5aaeff; --pri2:#8b78ff; --on-pri:#07142e; --acc:#ffd45e; --acc2:#ff9d45; --on-acc:#2b1700;
  --ok:#52da92; --okbg:#143d31; --bad:#ff8c8c; --badbg:#47202a; --vio:#a993ff;
  --sh:0 10px 26px rgba(0,0,0,.45); --sh2:0 4px 0 rgba(0,0,0,.4); --glow:0 0 18px rgba(110,170,255,.45);
  --field:#121e3d; --deco1:rgba(255,255,255,.55); --deco2:rgba(164,140,255,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); color:var(--text); min-height:100vh; line-height:1.4;
  background:linear-gradient(165deg,var(--bg),var(--bg2)); background-attachment:fixed;
  transition:background-color .45s,color .45s; -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(circle at 8% 12%, var(--deco1) 0 2px, transparent 3px),
    radial-gradient(circle at 22% 78%, var(--deco1) 0 2px, transparent 3px),
    radial-gradient(circle at 78% 18%, var(--deco1) 0 3px, transparent 4px),
    radial-gradient(circle at 92% 64%, var(--deco1) 0 2px, transparent 3px),
    radial-gradient(circle at 55% 40%, var(--deco1) 0 1.5px, transparent 2.5px),
    radial-gradient(ellipse at 85% 95%, var(--deco2) 0 120px, transparent 121px),
    radial-gradient(ellipse at 5% 100%, var(--deco2) 0 90px, transparent 91px);
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc2);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{min-height:100vh}
.screen{animation:screenIn .35s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 40px}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.15}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
p{margin:.3em 0 .6em}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.row.c{justify-content:center}
.grow{flex:1}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
@supports not (background:color-mix(in srgb,red 50%,blue)){.topbar{background:var(--card)}}
.topbar h1{font-size:1.15rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:var(--card2);color:var(--text);width:44px;height:44px;border-radius:14px;font-size:1.25rem;
  cursor:pointer;box-shadow:var(--sh2);display:inline-flex;align-items:center;justify-content:center;flex:none;transition:transform .12s}
.iconbtn:active{transform:translateY(2px)}
.pills{display:flex;gap:6px;flex:none}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:.85rem;white-space:nowrap}
.pill b{font-weight:900}

/* ---------- buttons & cards ---------- */
.btn{border:0;border-radius:16px;padding:12px 20px;min-height:48px;background:var(--pri);color:var(--on-pri);font-weight:800;
  font-size:1rem;cursor:pointer;box-shadow:var(--sh2);transition:transform .12s,filter .2s,box-shadow .2s;display:inline-flex;
  align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.acc{background:linear-gradient(180deg,var(--acc),var(--acc2));color:var(--on-acc)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
[data-theme="dark"] .btn.ok{color:#06251a}
.btn.danger{background:var(--bad);color:#fff}
[data-theme="dark"] .btn.danger{color:#2a0a0a}
.btn.big{font-size:1.15rem;padding:14px 26px;min-height:56px}
.btn.sm{padding:6px 12px;min-height:38px;font-size:.9rem;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:grayscale(.4)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;border:1px solid var(--line);
  transition:background-color .45s,border-color .45s}
.card+.card{margin-top:14px}
.help{border:0;width:26px;height:26px;border-radius:50%;background:var(--pri);color:var(--on-pri);font-weight:900;cursor:pointer;
  font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:6px;flex:none}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:11px;font-weight:800;cursor:pointer;min-height:40px;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--on-pri);box-shadow:var(--glow)}
.bar{height:12px;background:var(--card2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--vio));border-radius:999px;transition:width .4s}
.bar.gold>i{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar.green>i{background:linear-gradient(90deg,#46c47f,#1f9d55)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);border-radius:999px;
  padding:5px 11px;font-size:.9rem;white-space:nowrap}
.tag{display:inline-block;background:var(--acc);color:var(--on-acc);font-weight:800;font-size:.8rem;border-radius:999px;padding:3px 10px}
.tag.v{background:var(--vio);color:#fff}
.stars{display:inline-flex;gap:2px;letter-spacing:0}
.stars .s{filter:grayscale(1);opacity:.35}
.stars .s.on{filter:none;opacity:1}

/* ---------- logo & characters ---------- */
.logo{display:block;width:min(420px,88vw);height:auto;margin:0 auto}
.logo.sm{width:min(260px,60vw)}
.logo .lg-glow{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{opacity:.55}}
.char{display:inline-block}
.floaty{animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px)}}
.cheer{animation:cheer .6s ease}
@keyframes cheer{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.sad{animation:sad .6s ease}
@keyframes sad{40%{transform:translateX(-4px) rotate(-3deg)}70%{transform:translateX(3px)}}

/* ---------- splash ---------- */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
.splash .slogan{font-size:1.25rem;font-weight:800;color:var(--pri2)}
[data-theme="dark"] .splash .slogan{color:var(--acc)}
.splash .chars{display:flex;align-items:flex-end;gap:10px}
.loader{width:min(260px,70vw)}

/* ---------- main ---------- */
.mainhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px}
.scene{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--pri) 14%,var(--card)),var(--card));overflow:hidden;position:relative}
.bubble{background:var(--card2);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:700;position:relative;align-self:center}
.bubble::after{content:"";position:absolute;bottom:-10px;right:26px;border:10px solid transparent;border-top-color:var(--line);border-bottom:0}
.playercard .lv{font-size:1.6rem;font-weight:900}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.menu-btn{border:0;cursor:pointer;border-radius:20px;padding:16px 10px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;text-align:center;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);color:var(--text);transition:transform .15s,box-shadow .2s}
.menu-btn:hover{transform:translateY(-3px);box-shadow:var(--sh),var(--glow)}
.menu-btn:active{transform:translateY(1px)}
.menu-btn .ic{font-size:2.1rem;line-height:1}
.menu-btn .nm{font-weight:900;font-size:1.02rem}
.menu-btn .ds{font-size:.78rem;color:var(--muted)}
.menu-btn.hero{background:linear-gradient(160deg,var(--acc),var(--acc2));color:var(--on-acc);grid-column:span 3;min-height:96px;flex-direction:row;gap:14px}
.menu-btn.hero .ds{color:var(--on-acc);opacity:.85}
.menu-btn.hero .ic{font-size:2.6rem}
@media (max-width:560px){.menu-grid{grid-template-columns:repeat(2,1fr)}.menu-btn.hero{grid-column:span 2}.scene{grid-template-columns:auto 1fr}.scene .dr{display:none}}
.daily li{list-style:none;display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.daily li:last-child{border-bottom:0}
.daily ul{margin:0;padding:0}
.credit{text-align:center;margin:26px auto 10px;color:var(--muted);font-size:.85rem;line-height:1.45}
.credit .cn{font-weight:900;font-size:1rem;color:var(--text)}

/* ---------- map ---------- */
.regions{display:grid;gap:14px}
.region-card{border:0;cursor:pointer;text-align:left;border-radius:24px;padding:16px;display:flex;gap:14px;align-items:center;color:#fff;
  box-shadow:var(--sh);position:relative;overflow:hidden;min-height:110px;transition:transform .15s}
.region-card:hover{transform:translateY(-2px)}
.region-card .ric{font-size:3rem;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.region-card h3{margin:0;font-size:1.2rem;text-shadow:0 2px 3px rgba(0,0,0,.25)}
.region-card p{margin:2px 0;font-size:.9rem;opacity:.95}
.region-card.locked{filter:grayscale(.85) brightness(.85);cursor:pointer}
.region-card .lockbadge{position:absolute;top:10px;right:12px;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px;font-size:.8rem}
.region-card .bar{background:rgba(255,255,255,.3);border-color:transparent}
.region-card .bar>i{background:#fff}
.route{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:800;font-size:.9rem}
.route .ln{flex:1;border-top:3px dashed var(--line)}
.path{display:flex;flex-direction:column;gap:18px;padding:10px 0;position:relative}
.node{display:flex;align-items:center;gap:12px;width:min(340px,92%);border:0;cursor:pointer;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:12px 14px;box-shadow:var(--sh);text-align:left;color:var(--text);position:relative;transition:transform .15s}
.node:hover{transform:scale(1.02)}
.node:nth-child(odd){align-self:flex-start}
.node:nth-child(even){align-self:flex-end}
.node .nb{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900;
  background:linear-gradient(180deg,var(--pri),var(--pri2));color:#fff;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.node.boss .nb{background:linear-gradient(180deg,#ff7a59,#d6336c)}
.node.secret .nb{background:linear-gradient(180deg,var(--acc),var(--acc2))}
.node.locked{opacity:.55}
.node.locked .nb{background:#8a96b3}
.node.done .nb{box-shadow:0 0 0 4px var(--acc),inset 0 -4px 0 rgba(0,0,0,.2)}

/* ---------- table grid ---------- */
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:520px){.tgrid{grid-template-columns:repeat(3,1fr)}}
.tbtn{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:10px 6px;cursor:pointer;color:var(--text);display:flex;flex-direction:column;
  align-items:center;gap:4px;box-shadow:var(--sh2);transition:transform .12s}
.tbtn b{font-size:1.6rem}
.tbtn small{font-size:.72rem;color:var(--muted)}
.tbtn[aria-pressed="true"]{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 35%,transparent),var(--glow)}
.tbtn .bar{width:80%;height:7px}

/* ---------- quiz ---------- */
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.hud .prog,.hud .timer{flex:1 1 200px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem}
.hud .prog .bar,.hud .timer .bar{flex:1}
.timer .bar>i{background:linear-gradient(90deg,#46c47f,var(--acc),var(--acc2));transition:width .12s linear}
.qwrap{display:grid;grid-template-columns:1fr 170px;gap:14px;align-items:start}
@media (max-width:720px){.qwrap{grid-template-columns:1fr}.buddy{position:static;flex-direction:row;justify-content:center}.buddy svg{width:76px;height:auto}.buddy .bubble::after{display:none}}
.qcard{background:var(--card);border-radius:28px;box-shadow:var(--sh);border:1px solid var(--line);padding:18px;text-align:center;position:relative}
.expr{font-size:clamp(46px,12vw,80px);font-weight:900;letter-spacing:.02em;display:flex;justify-content:center;align-items:center;gap:.22em;margin:6px 0 10px;line-height:1.1}
.expr .op{color:var(--acc2)}
.expr .slot{min-width:1.4em;padding:0 .15em;border-radius:18px;background:var(--card2);border:3px dashed var(--line);color:var(--pri)}
.expr .slot.ok{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ok);animation:pop .4s}
.expr .slot.no{border-style:solid;border-color:var(--bad);background:var(--badbg);color:var(--bad)}
@keyframes pop{40%{transform:scale(1.18)}}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
.choice{position:relative;border:3px solid var(--line);background:var(--card2);color:var(--text);border-radius:20px;min-height:76px;font-size:clamp(28px,7vw,40px);
  font-weight:900;cursor:pointer;box-shadow:var(--sh2);transition:transform .1s,background .2s,border-color .2s}
.choice:hover:not([disabled]){border-color:var(--pri);transform:translateY(-2px)}
.choice:active:not([disabled]){transform:translateY(2px)}
.choice .k{position:absolute;top:6px;left:10px;font-size:.8rem;color:var(--muted);font-weight:700}
.choice .mk{position:absolute;top:4px;right:10px;font-size:1.3rem}
.choice.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);animation:pop .4s}
.choice.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad);animation:softshake .45s}
.choice.gone{visibility:hidden}
.choice[disabled]{cursor:default}
@keyframes softshake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.typebox{font-size:2.4rem;font-weight:900;min-height:64px;border:3px solid var(--line);border-radius:18px;background:var(--card2);display:flex;align-items:center;justify-content:center;margin:8px auto;max-width:220px;color:var(--pri)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:8px auto 0}
.keypad button{min-height:56px;border-radius:16px;border:2px solid var(--line);background:var(--card2);font-size:1.5rem;font-weight:900;cursor:pointer;box-shadow:var(--sh2);color:var(--text)}
.keypad button.kok{background:var(--ok);color:#fff;border-color:transparent}
[data-theme="dark"] .keypad button.kok{color:#06251a}
.keypad button:active{transform:translateY(2px)}
.feedback{min-height:28px;margin-top:12px;font-weight:800;font-size:1.05rem}
.feedback.ok{color:var(--ok)}
.feedback.no{color:var(--bad)}
.explain{background:var(--card2);border-radius:16px;padding:10px 12px;margin-top:10px;border:1px solid var(--line);font-weight:700}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.buddy{display:flex;flex-direction:column;align-items:center;gap:8px;position:sticky;top:80px}
.buddy .bubble{font-size:.92rem;text-align:center}
.buddy .bubble::after{left:50%;right:auto;transform:translateX(-50%)}
.viz{margin:8px auto 4px;max-width:640px}
.grps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.grp{display:inline-flex;flex-wrap:wrap;max-width:118px;gap:2px;padding:6px 8px;border-radius:14px;background:color-mix(in srgb,var(--acc) 22%,var(--card));border:2px dashed var(--acc2);justify-content:center;animation:pop .35s both}
.dot{font-size:18px;line-height:1}
.vizcap{font-size:.9rem;color:var(--muted);margin-top:6px;font-weight:700}
.bossbar{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#3a1d5c,#7a2450);color:#fff;border-radius:20px;padding:10px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.bossbar .bic{font-size:2.6rem;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.bossbar .bar{background:rgba(255,255,255,.2);border-color:transparent}
.bossbar .bar>i{background:linear-gradient(90deg,#ff7a59,#ffd166)}
.bossbar.hit .bic{animation:softshake .4s}

/* ---------- results ---------- */
.res-stars{font-size:3.4rem;display:flex;justify-content:center;gap:10px;margin:6px 0}
.res-stars span{display:inline-block;filter:grayscale(1);opacity:.3}
.res-stars span.on{filter:none;opacity:1;animation:starIn .6s both}
.res-stars span.on:nth-child(2){animation-delay:.2s}
.res-stars span.on:nth-child(3){animation-delay:.4s}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.25) rotate(10deg)}100%{transform:none}}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--card2);border-radius:16px;padding:10px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:1.5rem}
.stat small{color:var(--muted);font-weight:700}

/* ---------- mini-games ---------- */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.gcard{border:0;cursor:pointer;text-align:left;border-radius:24px;padding:16px;color:#fff;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;min-height:120px;transition:transform .15s}
.gcard:hover{transform:translateY(-3px)}
.gcard .gic{font-size:3rem}
.gcard h3{margin:0;text-shadow:0 2px 3px rgba(0,0,0,.25)}
.gcard p{margin:3px 0;font-size:.88rem;opacity:.95}
.gcard small{display:inline-block;background:rgba(0,0,0,.25);border-radius:999px;padding:2px 9px;margin-top:4px}
.tmap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;border-radius:26px;
  background:radial-gradient(circle at 30% 30%,#f9e3a3,#e8c06d 60%,#c99a45);box-shadow:inset 0 0 0 6px rgba(120,70,20,.25),var(--sh)}
[data-theme="dark"] .tmap{background:radial-gradient(circle at 30% 30%,#5c4a2a,#3e3020 60%,#2a2016)}
.chest{border:0;background:rgba(255,255,255,.35);border-radius:18px;min-height:96px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;color:#3b2200;transition:transform .15s}
[data-theme="dark"] .chest{background:rgba(255,255,255,.08);color:#ffe3a6}
.chest:hover:not([disabled]){transform:scale(1.05)}
.chest.active{box-shadow:0 0 0 4px var(--pri),0 0 20px rgba(90,170,255,.6)}
.chest svg{width:64px;height:56px}
.chest.opened{animation:pop .5s}
.overlayq{margin-top:14px}
.field{position:relative;height:230px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#9fd8ff 0,#c9ecff 55%,#7ccf7a 55%,#5cb85c 100%);box-shadow:var(--sh)}
[data-theme="dark"] .field{background:linear-gradient(180deg,#1b2a5a 0,#2c3d7a 55%,#2f6a3c 55%,#24532f 100%)}
.field .castle{position:absolute;left:0;bottom:12px;width:92px}
.field .road{position:absolute;left:0;right:0;bottom:38px;height:26px;background:rgba(150,110,60,.45)}
.enemy{position:absolute;bottom:46px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;transition:opacity .3s}
.enemy .eic{font-size:2.3rem;line-height:1;animation:walk .6s ease-in-out infinite alternate}
.enemy.boss .eic{font-size:3.6rem}
.enemy .ehp{width:44px;height:6px;border-radius:4px;background:rgba(0,0,0,.25);overflow:hidden;margin-top:2px}
.enemy .ehp i{display:block;height:100%;background:#ff5d5d}
.enemy.dead{opacity:0}
@keyframes walk{to{transform:translateY(-4px)}}
.shot{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff6b0,#ffb020);box-shadow:0 0 10px #ffc23a;left:84px;bottom:150px;transition:left .25s linear,bottom .25s linear;pointer-events:none}
.space{position:relative;height:330px;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#3b2a8a,#120a35 60%,#05040f);box-shadow:var(--sh)}
.space::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 10% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 30% 70%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 30%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 85% 80%,#fff 0 1px,transparent 2px),radial-gradient(circle at 50% 50%,#fff 0 1px,transparent 2px),radial-gradient(circle at 60% 10%,#fff 0 1px,transparent 2px)}
.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}
.lane{border-right:2px dashed rgba(255,255,255,.12);position:relative}
.lane:last-child{border-right:0}
.gate{position:absolute;left:8%;right:8%;top:0;border:0;cursor:pointer;height:64px;border-radius:18px;background:linear-gradient(180deg,rgba(130,200,255,.35),rgba(150,110,255,.35));
  border:3px solid rgba(180,220,255,.8);color:#fff;font-size:1.9rem;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.6);box-shadow:0 0 16px rgba(120,180,255,.5)}
.gate.ok{border-color:#52da92;background:rgba(82,218,146,.35)}
.gate.no{border-color:#ff8c8c;background:rgba(255,120,120,.3)}
.ship{position:absolute;bottom:14px;width:33.33%;display:flex;justify-content:center;transition:left .18s ease}
.ship svg{width:54px;height:80px;filter:drop-shadow(0 0 10px rgba(255,180,80,.6))}
.ship.bump svg{animation:softshake .4s}
.spaceq{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(10,8,40,.7);color:#fff;border-radius:16px;padding:6px 16px;font-size:1.8rem;font-weight:900;z-index:3;white-space:nowrap;border:2px solid rgba(255,255,255,.25)}
.planetmsg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(255,255,255,.92);color:#2a1a6e;padding:10px 16px;border-radius:16px;font-weight:900;z-index:4;text-align:center;animation:pop .5s}
.track{display:flex;flex-direction:column;gap:6px;background:#5b6377;border-radius:22px;padding:10px;box-shadow:var(--sh);position:relative}
[data-theme="dark"] .track{background:#2b3145}
.tlane{position:relative;height:52px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 30px,transparent 30px 60px);border-radius:12px;border-bottom:2px dashed rgba(255,255,255,.35)}
.tlane:last-child{border-bottom:0}
.tlane .finish{position:absolute;right:8px;top:0;bottom:0;width:14px;background:repeating-conic-gradient(#fff 0 25%,#222 0 50%) 0 0/14px 14px;border-radius:3px}
.car{position:absolute;top:4px;left:0;display:flex;align-items:center;gap:4px;transition:none}
.car svg{width:66px;height:36px}
.car .cn{font-size:.72rem;font-weight:900;color:#fff;background:rgba(0,0,0,.4);padding:1px 6px;border-radius:8px}
.car.wobble svg{animation:softshake .4s}
.car.boost svg{filter:drop-shadow(-8px 0 6px rgba(255,190,60,.9))}
.pairs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:480px){.pairs{grid-template-columns:repeat(3,1fr)}}
.pcard{perspective:600px;border:0;background:transparent;padding:0;min-height:84px;cursor:pointer}
.pcard .in{position:relative;width:100%;height:84px;transition:transform .4s;transform-style:preserve-3d}
.pcard.up .in,.pcard.got .in{transform:rotateY(180deg)}
.pcard .fa,.pcard .ba{position:absolute;inset:0;border-radius:18px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-weight:900;box-shadow:var(--sh2)}
.pcard .ba{background:linear-gradient(160deg,var(--pri),var(--vio));color:#fff;font-size:2rem}
.pcard .fa{background:var(--card);border:3px solid var(--line);transform:rotateY(180deg);font-size:1.5rem;color:var(--text)}
.pcard.got .fa{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.noanim .pcard .fa{transform:none}
.noanim .pcard .ba{display:flex}
.noanim .pcard.up .ba,.noanim .pcard.got .ba{display:none}
.noanim .pcard .in{transform:none!important}

/* ---------- inventory / achievements ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:14px;font-weight:800;cursor:pointer;color:var(--text);min-height:44px}
.tabs button[aria-selected="true"]{background:var(--pri);color:var(--on-pri);border-color:transparent}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.item .iic{font-size:2.2rem;line-height:1.1}
.item.lock{opacity:.55}
.item.on{border-color:var(--ok)}
.item svg{width:70px;height:70px}
.ach{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px}
.ach .aic{font-size:2.2rem;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--acc),var(--acc2));flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 35%,transparent)}
.ach.lock .aic{background:var(--card2);filter:grayscale(1);box-shadow:none;opacity:.6}
.ach.lock{border-style:dashed}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.tbl-row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.tbl-row b{font-size:1.1rem}
.factchips{display:flex;flex-wrap:wrap;gap:6px}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.hist{margin:0;padding:0;list-style:none}

/* ---------- learn ---------- */
.steps{display:flex;gap:5px;justify-content:center;margin:6px 0 12px;flex-wrap:wrap}
.steps i{width:22px;height:8px;border-radius:6px;background:var(--line)}
.steps i.on{background:var(--pri)}
.steps i.cur{background:var(--acc2)}
.tip{background:color-mix(in srgb,var(--acc) 20%,var(--card));border-left:6px solid var(--acc2);border-radius:14px;padding:10px 14px;font-weight:700}

/* ---------- tour ---------- */
.tour{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.tour .card{max-width:560px;width:100%;text-align:center}
.demo-stars{font-size:3rem;display:flex;justify-content:center;gap:10px}
.demo-stars span{animation:starIn .6s both}
.demo-stars span:nth-child(2){animation-delay:.3s}
.demo-stars span:nth-child(3){animation-delay:.6s}

/* ---------- modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(5,12,30,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);color:var(--text);border-radius:24px;max-width:460px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);border:1px solid var(--line);animation:screenIn .25s;max-height:90vh;overflow:auto}
.modal h2{margin-top:0}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(420px,92vw)}
.toast{background:var(--card);border:2px solid var(--acc);color:var(--text);padding:10px 16px;border-radius:16px;box-shadow:var(--sh),var(--glow);font-weight:800;animation:toastIn .35s both;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.cf{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- reduced motion ---------- */
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
@media print{.topbar{position:static}}

}

function isObj(x){ return x && typeof x === 'object' && !Array.isArray(x); }
function sanitize(def, obj) {
  if (!isObj(obj)) return def;
  const out = {};
  for (const k of Object.keys(def)) {
    const dv = def[k], ov = obj[k];
    if (ov === undefined || ov === null) { out[k] = dv; continue; }
    if (Array.isArray(dv)) out[k] = Array.isArray(ov) ? ov : dv;
    else if (isObj(dv)) out[k] = isObj(ov) ? (Object.keys(dv).length ? sanitize(dv, ov) : ov) : dv;
    else if (typeof dv === 'number') out[k] = (typeof ov === 'number' && isFinite(ov) && ov >= 0) ? ov : dv;
    else if (typeof dv === typeof ov) out[k] = ov;
    else out[k] = dv;
  }
  return out;
}
function migrate(obj) {
  // Future versions: transform obj step by step, e.g. if (obj.v === 1) {...; obj.v = 2;}
  if (typeof obj.v !== 'number') obj.v = 1;
  if (obj.v > SAVE_VERSION) obj.v = SAVE_VERSION;
  return obj;
}
let LOAD_PROBLEM = false;
function loadState() {
  const def = defaultState();
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return def; }
  if (!raw) return def;
  try {
    const obj = migrate(JSON.parse(raw));
    const st = sanitize(def, obj);

const AudioSys = {
  ctx: null, musicTimer: null, step: 0,
  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{}); return this.ctx; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    try { this.ctx = new AC(); } catch (e) { this.ctx = null; }
    return this.ctx;
  },
  tone(freq, dur, type, vol, delay) {
    const c = this.ctx; if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  startMusic() {
    if (this.musicTimer || !S.music) return; if (!this.ensure()) return;
    const mel = [523,659,784,659,587,698,880,698,523,659,784,1047,880,784,659,587];
    const bass = [131,175,196,165];
    this.musicTimer = setInterval(() => {
      if (!S.music || document.hidden) return;
      const i = this.step++ % mel.length;
      this.tone(mel[i], 0.32, 'triangle', 0.035);
      if (i % 4 === 0) this.tone(bass[(i / 4) % 4], 0.8, 'sine', 0.045);
    }, 400);
  },
  stopMusic() { if (this.musicTimer) clearInterval(this.musicTimer); this.musicTimer = null; }
};
function sfx(name) {
  if (!S.sound) return; const c = AudioSys.ensure(); if (!c) return;
  try {
    if (name === 'correct') { AudioSys.tone(660, .15, 'triangle', .16); AudioSys.tone(880, .18, 'triangle', .16, .09); AudioSys.tone(1175, .22, 'triangle', .14, .18); }
    else if (name === 'wrong') { AudioSys.tone(330, .22, 'sine', .1); AudioSys.tone(262, .3, 'sine', .09, .12); }
    else if (name === 'reward') { [784, 988, 1175, 1568].forEach((f, i) => AudioSys.tone(f, .25, 'triangle', .13, i * .09)); }
    else if (name === 'click') { AudioSys.tone(520, .06, 'sine', .06); }
    else if (name === 'hit') { AudioSys.tone(220, .12, 'square', .06); AudioSys.tone(440, .1, 'triangle', .08, .05); }
    else if (name === 'coin') { AudioSys.tone(988, .08, 'square', .06); AudioSys.tone(1319, .14, 'square', .06, .07); }
  } catch (e) { /* audio is optional */ }
}

    [t('rec_timed', { d: t('easy') }), R.timed_easy], [t('rec_timed', { d: t('medium') }), R.timed_medium], [t('rec_timed', { d: t('hard') }), R.timed_hard],
    [t('rec_mixed'), R.mixedAcc ? R.mixedAcc + '%' : 0], [t('rec_treasure'), R.treasureCoins], [t('rec_castle'), R.castleWave],
    [t('rec_pilot'), R.pilotBest], [t('rec_race'), R.raceBest ? t('ra_place', { n: R.raceBest }) : 0], [t('rec_pairs'), R.pairsMoves]
  ];
  const kindName = k => ({ level:'k_level', boss:'k_boss', secret:'k_secret', island:'k_island', practice:'k_practice', review:'k_review', timed:'k_timed', mixed:'k_mixed', learn:'k_learn', treasure:'g_treasure', castle:'g_castle', pilot:'g_pilot', race:'g_race', pairs:'g_pairs' })[k] || 'k_level';
  return topbar(t('stats')) + '<main class="wrap"><p class="center"><b>🌱 ' + t('st_self') + '</b></p><div class="statgrid">' +
    '<div class="stat"><b>' + li.lvl + '</b><small>' + t('st_level') + '</small></div><div class="stat"><b>' + c.tasks + '</b><small>' + t('st_tasks') + '</small></div><div class="stat"><b>' + c.correct + '</b><small>' + t('st_correct') + '</small></div><div class="stat"><b>' + acc + '%</b><small>' + t('st_acc') + '</small></div><div class="stat"><b>' + mastered + '/100</b><small>' + t('st_mastered') + '</small></div><div class="stat"><b>' + unlockedRegionCount() + '/5</b><small>' + t('st_regions') + '</small></div><div class="stat"><b>⭐ ' + totalStars() + '</b><small>' + t('stars') + '</small></div><div class="stat"><b>🔥 ' + c.bestStreak + '</b><small>' + t('streak') + '</small></div></div>' +
    '<section class="card"><h2>📈 ' + t('st_tables') + ' ' + helpBtn('help_mastery') + '</h2>' + RANGE10.map(n => { const st = tableStats(n); return '<div class="tbl-row"><b>×' + n + '</b><div><div class="bar green"><i style="width:' + st.mastered * 10 + '%"></i></div><small class="muted">' + (st.acc === null ? t('st_notPlayed') : t('st_tableAcc', { m: st.mastered, a: st.acc })) + (S.tablePassed[n] ? ' · 🎓' : '') + '</small></div><button class="btn sm ghost" data-act="prQuick" data-arg="' + n + '">' + t('practice') + '</button></div>'; }).join('') + '</section>' +
    '<section class="card"><h2>🔁 ' + t('st_review') + '</h2>' + (rv.length ? '<div class="factchips">' + rv.slice(0, 16).map(x => '<span class="chip">' + x.t + ' × ' + x.b + '</span>').join('') + '</div><div style="margin-top:10px"><button class="btn sm acc" data-act="prReview">🔁 ' + t('practiceThese') + '</button></div>' : '<p class="muted">' + t('st_noReview') + '</p>') + '</section>' +
    '<section class="card"><h2>🏅 ' + t('st_records') + '</h2><ul class="hist">' + recs.map(r => '<li><span>' + r[0] + '</span><b>' + (r[1] ? r[1] : '—') + '</b></li>').join('') + '</ul></section>' +
    '<section class="card"><h2>🕑 ' + t('st_history') + '</h2>' + (S.sessions.length ? '<ul class="hist">' + S.sessions.map(s => '<li><span>' + fmtDate(s.t) + ' · ' + t(kindName(s.k)) + '</span><span>✓ ' + s.c + ' · ✗ ' + s.w + ' · 🏅 ' + s.p + '</span></li>').join('') + '</ul>' : '<p class="muted">' + t('st_noHistory') + '</p>') + '</section></main>';
};

/* ---------- Settings ---------- */
SCREENS.settings = () => {
  const tog = (act, val, label, help) => '<div class="row sb" style="padding:8px 0;border-bottom:1px dashed var(--line)"><span><b>' + label + '</b>' + (help ? helpBtn(help) : '') + '</span><div class="seg"><button data-act="' + act + '" data-arg="1" aria-pressed="' + val + '">' + t('on') + '</button><button data-act="' + act + '" data-arg="0" aria-pressed="' + !val + '">' + t('off') + '</button></div></div>';
  return topbar(t('settings')) + '<main class="wrap"><section class="card"><h2>🌐 ' + t('langLbl') + '</h2><div class="row">' + LANGS.map(l => '<button class="btn ' + (S.lang === l ? '' : 'ghost') + '" data-act="lang" data-arg="' + l + '" aria-pressed="' + (S.lang === l) + '">' + LANG_LABEL[l] + '</button>').join('') + '</div></section>' +
    '<section class="card"><h2>🎨 ' + t('themeLbl') + '</h2><div class="seg"><button data-act="theme" data-arg="light" aria-pressed="' + (S.theme === 'light') + '">☀️ ' + t('light') + '</button><button data-act="theme" data-arg="dark" aria-pressed="' + (S.theme === 'dark') + '">🌙 ' + t('dark') + '</button></div></section>' +
    '<section class="card">' + tog('setSound', S.sound, '🔊 ' + t('set_sound')) + tog('setMusic', S.music, '🎵 ' + t('set_music'), 'help_music') + tog('setAnim', S.anim, '✨ ' + t('set_anim'), 'help_anim') +
    '<div class="row sb" style="padding:8px 0"><span><b>⌨️ ' + t('set_mode') + '</b>' + helpBtn('help_mode') + '</span><div class="seg"><button data-act="setMode" data-arg="choice" aria-pressed="' + (S.mode === 'choice') + '">' + t('modeChoice') + '</button><button data-act="setMode" data-arg="type" aria-pressed="' + (S.mode === 'type') + '">' + t('modeType') + '</button></div></div></section>' +
    '<section class="card"><h2>💾 ' + t('set_data') + '</h2><p class="muted">' + t('set_storage') + '</p><div class="row"><button class="btn ghost" data-act="showTour">👋 ' + t('set_tour') + '</button><button class="btn danger" data-act="resetAsk">🗑️ ' + t('set_reset') + '</button>' + helpBtn('help_reset') + '</div></section></main>';
};

/* ---------- About ---------- */
SCREENS.about = () => topbar(t('about')) + '<main class="wrap"><section class="card center">' + logoSVG() + '<p style="font-weight:800">' + t('slogan') + '</p><p>' + t('ab_text') + '</p></section>' +
  '<section class="card"><h2>' + t('ab_chars') + '</h2><div class="achs"><div class="ach" style="border-style:solid">' + heroSVG(70, S.inv.hat) + '<div><b>' + t('heroName') + '</b><div class="muted">' + t('ab_hero') + '</div></div></div><div class="ach">' + dragonSVG(80, S.inv.color) + '<div><b>' + t('dragonName') + '</b><div class="muted">' + t('ab_dragon') + '</div></div></div></div></section>' +
  '<section class="card"><p>🔒 ' + t('ab_privacy') + '</p><p class="muted">' + t('set_storage') + '</p><p class="muted">' + t('ab_version') + ': ' + APP_VERSION + '</p></section>' + credit() + '</main>';

/* ---------- Modal ---------- */
let modalOpen = false, modalReturn = null;
function openModal(html) {
  modalReturn = document.activeElement;
  const root = document.getElementById('modal-root');
  root.innerHTML = '<div class="modal-bg" data-act="modalBg"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
  modalOpen = true;
  const b = root.querySelector('.modal button'); if (b) b.focus();
}
function closeModal() {
  document.getElementById('modal-root').innerHTML = ''; modalOpen = false;
  if (modalReturn && document.body.contains(modalReturn)) modalReturn.focus({ preventScroll: true });
}
function confirmModal(text, yesLabel, yesAct, danger) {
  openModal('<h2>❓</h2><p>' + text + '</p><div class="row c"><button class="btn ghost" data-act="closeModal">' + t('cancel') + '</button><button class="btn ' + (danger ? 'danger' : 'acc') + '" data-act="' + yesAct + '">' + yesLabel + '</button></div>');
}

/* =========================================================
   10. EVENT HANDLERS
   ========================================================= */
const ACTIONS = {
  back() { if (isActivePlay()) { openModal('<h2>🚪</h2><p>' + t('leaveQ') + '</p><div class="row c"><button class="btn" data-act="closeModal">' + t('stay') + '</button><button class="btn danger" data-act="leaveNow">' + t('leave') + '</button></div>'); return; } back(); },
  leaveNow() { closeModal(); if (RT.sess) RT.sess.done = true; if (RT.game) RT.game.done = true; stopRuntime(); back(); },
  home() { go('main', {}, { reset: true }); },
  splashGo() { AudioSys.ensure(); leaveSplash(); },
  nav(a) {
    if (a === 'play') go('map'); else if (a === 'learn') go('learnSelect'); else if (a === 'practice') go('practiceMenu');
    else if (a === 'minigames') go('minigames'); else if (a === 'achievements') go('achievements'); else if (a === 'stats') go('stats');
    else if (a === 'settings') go('settings'); else if (a === 'inventory') { RT.invTab = 'shop'; go('inventory'); } else if (a === 'about') go('about');
  },
  lang(l) { if (!LANGS.includes(l)) return; S.lang = l; applyPrefs(); save(); render(); },
  toggleTheme() { S.theme = S.theme === 'dark' ? 'light' : 'dark'; applyPrefs(); save(); render(); },
  theme(v) { S.theme = v === 'dark' ? 'dark' : 'light'; applyPrefs(); save(); render(); },
  toggleSound() { S.sound = !S.sound; save(); render(); if (S.sound) sfx('click'); },
  setSound(v) { S.sound = v === '1'; save(); render(); if (S.sound) sfx('click'); },
  setMusic(v) { S.music = v === '1'; save(); if (S.music) AudioSys.startMusic(); else AudioSys.stopMusic(); render(); },
  setAnim(v) { S.anim = v === '1'; applyPrefs(); save(); render(); },
  setMode(v) { S.mode = v === 'type' ? 'type' : 'choice'; save(); render(); },
  help(k) { openModal('<h2>❔ ' + t('helpTitle') + '</h2><p>' + t(k) + '</p><div class="row c"><button class="btn" data-act="closeModal">' + t('ok') + '</button></div>'); },
  closeModal() { closeModal(); },
  modalBg(_, el, e) { if (e.target === el) closeModal(); },
  claimDaily(id) {
    ensureDaily(); const m = S.daily.list.find(x => x.id === id);
    if (!m || m.claimed || m.p < DAILY_POOL[m.id]) return;
    m.claimed = true; S.coins += 20; S.counters.dailyClaimed++; addXP(30); sfx('reward'); confetti(50); checkAch(); save(); render();
  },
  tourStep(d) { const st = RT.tour; st.step = Math.max(0, Math.min(4, st.step + Number(d))); render(true); },
  tourAns(v) { const st = RT.tour; if (st.demoOk) return; st.demoPick = Number(v); if (Number(v) === 6) { st.demoOk = true; sfx('correct'); confetti(40); } else sfx('wrong'); render(); },
  tourFinish(a) { S.tourDone = true; save(); RT.tour = null; go('main', {}, { reset: true }); if (a === 'play') { NAV.push({ screen: 'map', params: {} }); CUR = { screen: 'region', params: { id: 'forest' } }; startLevel('forest-1'); } },
  showTour() { RT.tour = { step: 0, demoOk: false }; go('tour', {}, { reset: true }); },
  region(id) { const r = REG[id]; if (!r) return; if (!regionUnlocked(r)) { openModal('<h2>🔒 ' + t('r_' + id) + '</h2><p>' + t(NEED_KEY[id]) + '</p><div class="row c"><button class="btn" data-act="closeModal">' + t('ok') + '</button></div>'); return; } go('region', { id }); },
  island() { if (!islandUnlocked()) { openModal('<h2>🔒 ' + t('island') + '</h2><p>' + t('islandNeed') + '</p><div class="row c"><button class="btn" data-act="closeModal">' + t('ok') + '</button></div>'); return; } openModal('<h2>🏝️ ' + t('island') + '</h2><p>' + t('islandD') + '</p><p>' + t('tablesList', { list: '1–10' }) + ' · ' + t('questions', { n: 12 }) + '</p><div class="row c"><button class="btn ghost" data-act="closeModal">' + t('cancel') + '</button><button class="btn acc" data-act="startLevel" data-arg="island">▶ ' + t('start') + '</button></div>'); },
  level(id) { levelModal(id); },
  startLevel(id) { startLevel(id); },
  ans(v) { submitAnswer(v); },
  key(k) {
    const s = RT.sess; if (!s || s.answered || s.done) return;
    if (k === 'del') s.input = s.input.slice(0, -1);
    else if (k === 'ok') { if (s.input) submitAnswer(s.input); return; }
    else if (s.input.length < 3) s.input += k;
    renderQuizParts();
  },
  nextQ() { nextQ(); },
  hint() { useHint(); },
  fifty() { useFifty(); },
  timeBonus() { useTime(); },
  retry() { const r = RT.res; if (r && r.retry) r.retry(); },
  resCont() { const r = RT.res; const b = (r && r.backTo) || { screen: 'main' }; NAV.length = 0; if (b.screen !== 'main') { NAV.push({ screen: 'main', params: {} }); (b.via || []).forEach(v => NAV.push(v)); } stopRuntime(b.screen); CUR = { screen: b.screen, params: b.params || {} }; render(true); },
  reviewFacts() { const r = RT.res; if (!r || !r.rec || !r.rec.facts) return; startQuiz({ kind: 'review', pool: r.rec.facts, tables: [...new Set(r.rec.facts.map(f => f[0]))], total: Math.max(6, Math.min(10, r.rec.facts.length * 2)), backTo: { screen: 'practiceMenu', via: [] } }); },
  learnTable(n) { RT.learn = { t: Number(n), i: 1, answered: false, revealed: false, q: null }; go('learn'); },
  learnNav(d) { const L = RT.learn; if (!L) return; L.i = Math.max(1, Math.min(10, L.i + Number(d))); L.answered = false; L.revealed = false; L.q = null; L.chosen = null; render(); },
  learnRepeat() { const L = RT.learn; if (!L) return; L.answered = false; L.revealed = false; L.q = null; L.chosen = null; render(); },
  learnReveal() { const L = RT.learn; if (!L) return; L.revealed = true; render(); },
  learnAns(v) { const L = RT.learn; if (!L || L.answered || L.revealed) return; L.answered = true; L.chosen = Number(v); L.ok = Number(v) === L.t * L.i; recordAnswer(L.t, L.i, L.ok, 0, L.i <= 6); if (L.ok) sfx('correct'); else sfx('wrong'); checkAch(); render(); buddyMood(L.ok ? 'cheer' : 'sad'); },
  learnQuiz() { const L = RT.learn; if (!L) return; startQuiz({ kind: 'learn', tables: [L.t], total: 5, mode: 'choice', backTo: { screen: 'learnSelect', via: [] } }); },
  prTableScreen() { RT.pr = RT.pr || { table: 1, mode: S.mode }; go('practiceSetup'); },
  prPick(n) { RT.pr.table = Number(n); render(); },
  prMode(m) { RT.pr.mode = m; render(); },
  prStart() { const p = RT.pr; startQuiz({ kind: 'practice', tables: [p.table], total: 10, mode: p.mode, backTo: { screen: 'practiceSetup', via: [{ screen: 'practiceMenu', params: {} }] } }); },
  prQuick(n) { RT.pr = { table: Number(n), mode: S.mode }; startQuiz({ kind: 'practice', tables: [Number(n)], total: 10, backTo: { screen: 'stats', via: [] } }); },
  prTimedScreen() { RT.td = RT.td || { diff: 'easy', mode: S.mode }; go('timedSetup'); },
  tdDiff(d) { RT.td.diff = d; render(); },
  tdMode(m) { RT.td.mode = m; render(); },
  tdStart() { const d = RT.td.diff, c = TIMED[d]; startQuiz({ kind: 'timed', diff: d, tables: c.tables, time: c.time, total: 999, mode: RT.td.mode, backTo: { screen: 'timedSetup', via: [{ screen: 'practiceMenu', params: {} }] } }); },
  prMixed() { startQuiz({ kind: 'mixed', tables: RANGE10, total: 15, backTo: { screen: 'practiceMenu', via: [] } }); },
  prReview() { const rv = reviewList().slice(0, 12); if (!rv.length) return; const pool = rv.map(x => [x.t, x.b]); startQuiz({ kind: 'review', pool, tables: [...new Set(pool.map(p => p[0]))], total: Math.max(6, Math.min(12, pool.length * 2)), backTo: { screen: 'practiceMenu', via: [] } }); },
  game(type) { startGame(type); },
  chest(i) { openChest(Number(i)); },
  chestClose() { const g = RT.game; if (!g || g.answered && g.lastOk) return; g.active = -1; g.q = null; g.msg = ''; g.answered = false; render(); },
  trAns(v) { treasureAnswer(v); },
  towerUp() { const cost = 40 * S.tower; if (S.tower >= 5) return; if (S.coins < cost) { toast(t('notEnough')); return; } S.coins -= cost; S.tower++; save(); sfx('reward'); toast('⬆️ ' + t('upgraded')); render(); },
  castleGo() { castleStart(); },
  caAns(v) { castleAnswer(v); },
  gate(i) { const g = RT.game; if (g && g.type === 'pilot' && g.phase === 'fly') pilotResolve(g, Number(i)); },
  lane(d) { const g = RT.game; if (!g || g.type !== 'pilot' || g.phase !== 'fly') return; g.lane = Math.max(0, Math.min(2, g.lane + Number(d))); pilotDraw(g); },
  flyNow() { const g = RT.game; if (g && g.type === 'pilot' && g.phase === 'fly') pilotResolve(g, g.lane); },
  raDiff(d) { const g = RT.game; if (g) { g.diff = d; render(); } },
  raceGo() { raceStart(); },
  raAns(v) { raceAnswer(v); },
  flip(i) { flipCard(Number(i)); },
  invTab(tb) { RT.invTab = tb; render(); },
  buy(arg) {
    const [kind, id] = arg.split(':'); const list = kind === 'hat' ? HATS : DCOLORS; const it = list.find(x => x.id === id);
    if (!it || S.inv.owned.includes(id)) return;
    if (S.coins < it.price) { toast(t('notEnough')); return; }
    S.coins -= it.price; S.inv.owned.push(id); if (kind === 'hat') S.inv.hat = id; else S.inv.color = id;
    save(); sfx('reward'); toast('🛍️ ' + t('bought')); render();
  },
  equip(arg) { const [kind, id] = arg.split(':'); if (!S.inv.owned.includes(id)) return; if (kind === 'hat') S.inv.hat = id; else S.inv.color = id; save(); sfx('click'); render(); },
  resetAsk() { confirmModal(t('resetQ'), t('resetYes'), 'resetDo', true); },
  resetDo() {
    closeModal();
    const keep = { lang: S.lang, theme: S.theme, sound: S.sound, music: S.music, anim: S.anim, mode: S.mode };
    S = Object.assign(defaultState(), keep, { tourDone: true });
    RT = {}; save(); toast('🗑️ ' + t('resetDone')); go('main', {}, { reset: true });
  }
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.dataset.act !== 'modalBg') e.preventDefault();
  try { fn(el.dataset.arg, el, e); } catch (err) { console.error(err); }
});
document.addEventListener('pointerdown', () => { if (S.sound || S.music) AudioSys.ensure(); if (S.music) AudioSys.startMusic(); }, { once: false, passive: true });
document.addEventListener('keydown', (e) => {
  if (modalOpen) { if (e.key === 'Escape') closeModal(); return; }
  const sc = CUR.screen, ae = document.activeElement, onBtn = ae && ae.tagName === 'BUTTON';
  if (e.key === 'Escape') { ACTIONS.back(); return; }
  if (sc === 'splash' && (e.key === 'Enter' || e.key === ' ')) { if (!onBtn) { e.preventDefault(); leaveSplash(); } return; }
  if (sc === 'quiz' && RT.sess) {
    const s = RT.sess;
    if (s.answered) { if ((e.key === 'Enter' || e.key === ' ') && !onBtn) { e.preventDefault(); nextQ(); } return; }
    if (s.mode === 'type') {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); ACTIONS.key(e.key); }
      else if (e.key === 'Backspace') { e.preventDefault(); ACTIONS.key('del'); }
      else if (e.key === 'Enter' && !onBtn) { e.preventDefault(); ACTIONS.key('ok'); }
      return;
    }
  }
  if (sc === 'pilot') {
    if (e.key === 'ArrowLeft') { e.preventDefault(); ACTIONS.lane(-1); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); ACTIONS.lane(1); return; }
    if ((e.key === 'ArrowUp' || ((e.key === 'Enter' || e.key === ' ') && !onBtn))) { e.preventDefault(); ACTIONS.flyNow(); return; }
    if (/^[1-3]$/.test(e.key)) { e.preventDefault(); ACTIONS.gate(Number(e.key) - 1); return; }
  }
  if (/^[1-4]$/.test(e.key) && ['quiz','treasure','castle','race','learn','tour'].includes(sc)) {
    const b = document.querySelector('.choice[data-key="' + e.key + '"]:not([disabled])');
    if (b) { e.preventDefault(); b.click(); }
  }
});
document.addEventListener('visibilitychange', () => { const g = RT.game; if (g) g.lastTs = 0; });
window.addEventListener('storage', (e) => { if (e.key === SAVE_KEY && e.newValue) { /* another tab saved: keep this tab's state authoritative */ } });

/* =========================================================
   12. INITIALIZATION
   ========================================================= */
function init() {
  applyPrefs();
  ensureDaily();
  CUR = { screen: 'splash', params: {} };
  render(true);
  if (LOAD_PROBLEM) setTimeout(() => toast(t('loadErr')), 400);
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    if (mq.addEventListener) mq.addEventListener('change', ev => { if (ev.matches) { S.anim = false; applyPrefs(); save(); } });
  }
}
window.addEventListener('error', (e) => { try { console.error('KaraKara error:', e.message); } catch (x) { /* ignore */ } });
init();
})();
</script>
