<script>window.TGA_CFG = {
  id: 'pe', keys: ['petroenglish.v1'],
  seed: function (lang, scheme, LS, set) { if (!LS.getItem('petroenglish.v1')) set('petroenglish.v1', JSON.stringify({ lang: lang, theme: scheme })); },
  back: function () {
    var b = [].slice.call(document.querySelectorAll('.back')).filter(function (x) { return x.offsetParent !== null; })[0];
    return b ? function () { b.click(); } : null;
  }
};
/* Telegram Mini App adapter — early part (runs before the app's own scripts).
   Seeds language/theme from Telegram on first launch and mirrors saved progress to Telegram CloudStorage. */
(function () {
  var CFG = window.TGA_CFG || {};
  var W = window.Telegram && window.Telegram.WebApp;
  var on = !!(W && W.initData);
  var TGA = window.TGA = { W: W, on: on, cfg: CFG };
  if (!on) return;
  document.documentElement.classList.add('tg-app');
  var u = (W.initDataUnsafe && W.initDataUnsafe.user) || {};
  var lc = String(u.language_code || '').toLowerCase();
  TGA.lang = lc.indexOf('uz') === 0 ? 'uz' : lc.indexOf('en') === 0 ? 'en' : 'ru';
  TGA.scheme = W.colorScheme === 'dark' ? 'dark' : 'light';
  try { if (/[?&]from=hub\b/.test(location.search)) sessionStorage.setItem('tga_hub', '1'); } catch (e) {}
  TGA.fromHub = (function () { try { return sessionStorage.getItem('tga_hub') === '1'; } catch (e) { return false; } })();

  var LS = window.localStorage, origSet = Storage.prototype.setItem;
  TGA.rawSet = function (k, v) { try { origSet.call(LS, k, v); } catch (e) {} };

  // First launch on this device: start in the user's Telegram language and theme.
  try { if (CFG.seed) CFG.seed(TGA.lang, TGA.scheme, LS, TGA.rawSet); } catch (e) {}

  // Every save of a synced key is queued for upload to CloudStorage.
  var keys = CFG.keys || [], pending = {}, timer = null;
  TGA.pending = pending;
  Storage.prototype.setItem = function (k, v) {
    origSet.apply(this, arguments);
    if (this === LS && keys.indexOf(k) >= 0) {
      origSet.call(LS, 'tga_ts_' + k, String(Date.now()));
      pending[k] = 1;
      clearTimeout(timer);
      timer = setTimeout(function () { TGA.flush && TGA.flush(); }, 1500);
    }
  };
})();
</script>

<title>PetroEnglish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: dashboard — left progress column (day goal, rank, streak, continue) + right 3×3 section grid; inner screens full width. */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --surface-2:#F5F8F9; --ink:#13232B; --muted:#5A6B74; --line:#DCE4E7;
  --accent:#0A6F80; --accent-ink:#FFFFFF; --accent-soft:#DDEFF2;
  --oil:#C2780F; --oil-soft:#FBEBD3;
  --good:#2B8A3E; --good-soft:#DDF2E1; --bad:#C92A5A; --bad-soft:#FBE1EA;
  --layer1:#E9D8A6; --layer2:#C9B79C; --layer3:#B7C4C9; --layer4:#9FB0A0; --layer5:#D9C08C; --pay:#3C2A12;
  --shadow:0 1px 2px rgba(16,40,50,.06),0 8px 24px rgba(16,40,50,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1418; --surface:#142026; --surface-2:#1A2A31; --ink:#E4EDF0; --muted:#8FA3AC; --line:#25373F;
  --accent:#3CC3D6; --accent-ink:#06262C; --accent-soft:#163A42;
  --oil:#F0A43A; --oil-soft:#3A2A12;
  --good:#5BD07A; --good-soft:#163A22; --bad:#FF7AA2; --bad-soft:#3E1726;
  --layer1:#5E5236; --layer2:#4D4436; --layer3:#3B4A50; --layer4:#3C4C3E; --layer5:#6A5732; --pay:#F0A43A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1418; --surface:#142026; --surface-2:#1A2A31; --ink:#E4EDF0; --muted:#8FA3AC; --line:#25373F;
  --accent:#3CC3D6; --accent-ink:#06262C; --accent-soft:#163A42;
  --oil:#F0A43A; --oil-soft:#3A2A12;
  --good:#5BD07A; --good-soft:#163A22; --bad:#FF7AA2; --bad-soft:#3E1726;
  --layer1:#5E5236; --layer2:#4D4436; --layer3:#3B4A50; --layer4:#3C4C3E; --layer5:#6A5732; --pay:#F0A43A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(22px,3vw,30px)} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand svg{width:40px;height:40px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1}
.brand-name b{color:var(--oil);font-weight:700}
.brand-by{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.top-sp{flex:1}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);min-width:40px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}

/* page */
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:24px 32px}
.dash{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:980px){.dash{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:84px}
@media (max-width:980px){.side{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.side .wide{grid-column:1/-1}}
@media (max-width:560px){.side{grid-template-columns:minmax(0,1fr)}}
.only-narrow{display:none}
@media (max-width:980px){.dash>section{order:1}.dash>.side{order:2}.only-narrow{display:inline-flex}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel.flat{box-shadow:none}

/* sidebar parts */
.greet h2{font-size:19px}
.ring-row{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none}
.ring .bgc{stroke:var(--line)} .ring .fgc{stroke:var(--oil);transition:stroke-dashoffset .8s ease}
.ring text{fill:var(--ink);font-family:var(--f-mono);font-weight:600}
.bar{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}
.rank{display:flex;align-items:center;gap:12px}
.rank-badge{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700}
.week{display:flex;gap:6px;margin-top:10px}
.week span{flex:1;height:28px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:600}
.week span.on{background:var(--oil-soft);border-color:var(--oil);color:var(--oil)}
.cont{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--ink)));color:var(--accent-ink);border:0}
.cont .lbl{color:inherit;opacity:.8}
.cont h3{margin:6px 0 2px;font-size:17px}
.res-bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);margin:10px 0 8px}
.res-bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* tiles */
.main-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles .tile.feat{grid-column:1/-1}}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:170px;box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease;overflow:hidden;min-width:0}
.tile:hover{transform:translateY(-3px);border-color:var(--accent)}
.tile .ic{width:46px;height:46px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile .ic svg{width:24px;height:24px}
.tile h3{font-size:16px}
.tile p{font-size:14px;color:var(--muted)}
.tile .stat{margin-top:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.tile.feat{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile.feat p,.tile.feat .stat{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.tile.feat .ic{background:var(--oil);color:#fff}
.tile.feat .deco{position:absolute;right:-10px;top:10px;width:120px;height:150px;opacity:.35;pointer-events:none}
.tile.oil .ic{background:var(--oil-soft);color:var(--oil)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:13px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;transition:transform .12s ease,filter .12s}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.oil{background:var(--oil);color:#fff}
.btn.light{background:rgba(255,255,255,.18);color:inherit;border-color:rgba(255,255,255,.35)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.say{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:inline-grid;place-items:center;cursor:pointer;color:var(--accent);flex:none}
.say svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

/* inner screens */
.crumb{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:20px;height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.item{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;width:100%;min-width:0;transition:border-color .15s}
.item:hover{border-color:var(--accent)}
.item .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.item .ic svg{width:22px;height:22px}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-weight:600}
.item .tx small{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;font-family:var(--f-mono)}
.tag.p1{background:var(--good-soft);color:var(--good)} .tag.p2{background:var(--accent-soft);color:var(--accent)} .tag.p3{background:var(--oil-soft);color:var(--oil)} .tag.p0{background:var(--surface-2);color:var(--muted)}

/* learning path */
.mod{margin-bottom:22px}
.mod-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;position:relative}
@media (max-width:760px){.path{grid-template-columns:minmax(0,1fr)}}
.les{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;min-height:118px;display:flex;flex-direction:column;gap:6px;min-width:0}
.les .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.les b{font-size:14px;line-height:1.3}
.les .st{margin-top:auto;display:flex;gap:2px;color:var(--oil)}
.les .st svg{width:16px;height:16px}
.les.done{border-color:var(--good)}
.les.next{border:2px solid var(--accent);background:var(--accent-soft)}
.les.lock{opacity:.5;cursor:not-allowed}
.les .ck{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center}
.les .ck svg{width:14px;height:14px}

/* lesson */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.steps span{flex:1;min-width:88px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);text-align:center;white-space:nowrap}
.steps span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps span.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.word{display:flex;flex-direction:column;gap:6px}
.word .t{display:flex;align-items:center;gap:10px;justify-content:space-between}
.word .t b{font-size:18px;font-family:var(--f-display);font-weight:500}
.word .ipa{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.word .tr{font-weight:600}
.word .ex{font-size:14px;color:var(--muted);border-left:3px solid var(--oil);padding-left:10px;font-style:italic}
.reading{font-size:18px;line-height:1.8;max-width:68ch}
.hw{background:var(--oil-soft);color:var(--ink);border-radius:5px;padding:0 3px;cursor:pointer;border-bottom:2px solid var(--oil)}
.pop{position:fixed;z-index:50;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;max-width:280px;box-shadow:var(--shadow)}
.diagram{width:100%;overflow-x:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px}
.diagram svg{display:block;width:100%;min-width:520px;height:auto}
.diagram text{font-family:var(--f-body);font-size:13px;fill:var(--ink)}
.rule{border-left:4px solid var(--accent);padding:4px 0 4px 14px}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex-list div{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:10px;padding:10px 12px}

/* quiz */
.q-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.q-top .bar{flex:1}
.q-prompt{font-size:20px;font-weight:600;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{min-height:58px;text-align:left;padding:12px 16px;border-radius:13px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:500}
.fb.good{background:var(--good-soft);color:var(--good)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.anim{animation:pop .3s ease both}
.big-num{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1}
.stars{display:flex;gap:6px;color:var(--oil)} .stars svg{width:36px;height:36px}
.stars .off{color:var(--line)}

input[type=text],input[type=search],textarea{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px}
textarea{min-height:140px;resize:vertical;line-height:1.5}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}

/* flashcard */
.flash{perspective:1200px;max-width:560px;margin:0 auto;width:100%}
.flash-in{position:relative;min-height:300px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg)}
.face .term{font-family:var(--f-display);font-size:30px;font-weight:700}

/* games */
.well-wrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.well-wrap{grid-template-columns:minmax(0,1fr)}}
.well svg{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line)}
.well .bitg{transition:transform .6s cubic-bezier(.5,1.6,.5,1)}
.kick{animation:shake .4s 2}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mcell{min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;padding:8px 12px;font-weight:500;text-align:left}
.mcell.sel{border-color:var(--accent);background:var(--accent-soft)}
.mcell.gone{visibility:hidden}
.mcell.err{border-color:var(--bad);animation:shake .3s}
.cores{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:12px;border-radius:14px;border:2px dashed var(--line);background:var(--surface-2)}

.bub small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

.stat-c{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat-c .v{font-family:var(--f-display);font-size:26px;font-weight:700}

.bdg svg{width:34px;height:34px;color:var(--oil);margin:0 auto 6px;display:block}

.diff .ok{background:var(--good-soft);color:var(--good)} .diff .no{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}

.ai-out{white-space:pre-wrap}
.err-row{border-left:3px solid var(--bad);padding:6px 0 6px 12px;margin:8px 0}

comm:`Good morning, everyone.|||Всем доброе утро.|Hammaga xayrli tong.|I open the presentation with a short greeting.

Let's move on to the results.|||Перейдём к результатам.|Natijalarga o‘tamiz.|Let's move on to the results of history matching.
To sum up…|||Подводя итог…|Xulosa qilib aytganda…|To sum up, infill drilling is the best option.

const SAYS=[];
function sayBtn(text,label){SAYS.push(text);return `<button class="say" onclick="App.say(${SAYS.length-1})" aria-label="${esc(label||"Listen")}" title="Listen">${IC.speaker}</button>`;}

try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}
function speak(text,rate,onend){
 try{if(!("speechSynthesis" in window)){toast(t("speechNA"));return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/…/g,"..."));u.lang="en-US";if(voice)u.voice=voice;u.rate=rate||0.92;if(onend)u.onend=onend;speechSynthesis.speak(u);}catch(e){toast(t("speechNA"));}
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function recognize(cb){
 if(!SR){cb(null,"na");return;}
 try{const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=1;let got=false;
  r.onresult=e=>{got=true;cb(e.results[0][0].transcript);};
  r.onerror=e=>{got=true;cb(null,e.error||"err");};
  r.onend=()=>{if(!got)cb(null,"nomatch");};
  r.start();}catch(e){cb(null,"na");}
}

/* ---------- text compare ---------- */
const norm=s=>String(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9а-яёʻ‘'\s%.-]/gi," ").replace(/\.(?!\d)/g," ").split(/\s+/).filter(Boolean);
function lcs(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
 for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);return d;}
function similarity(x,y){const a=norm(x),b=norm(y);if(!a.length||!b.length)return 0;const d=lcs(a,b);return Math.round(200*d[0][0]/(a.length+b.length));}
function diffHtml(user,target){
 const a=norm(user),b=norm(target),d=lcs(a,b);let i=0,j=0,out=[];
 while(i<a.length&&j<b.length){if(a[i]===b[j]){out.push(`<span class="ok">${esc(b[j])}</span>`);i++;j++;}else if(d[i+1][j]>=d[i][j+1]){out.push(`<span class="no">${esc(a[i])}</span>`);i++;}else{out.push(`<span class="miss">${esc(b[j])}</span>`);j++;}}
 while(i<a.length)out.push(`<span class="no">${esc(a[i++])}</span>`);while(j<b.length)out.push(`<span class="miss">${esc(b[j++])}</span>`);
 return `<div class="diff">${out.join(" ")}</div>`;
}

/* ---------- XP, streak, words ---------- */
function touchStreak(){const td=today();if(S.last===td)return;const y=dkey(Date.now()-DAY);S.streak=S.last===y?S.streak+1:1;S.last=td;}
function addXP(n){if(!n)return;S.xp+=n;const d=today();S.days[d]=(S.days[d]||0)+n;touchStreak();save();}
function curStreak(){return (S.last===today()||S.last===dkey(Date.now()-DAY))?S.streak:0;}
function rankOf(xp){let i=0;RANKS.forEach((r,k)=>{if(xp>=r[0])i=k;});return i;}
const ws=k=>S.w[k]||{l:0,d:0,e:0};
function seen(k){const s=ws(k);if(s.l<1){s.l=1;s.d=Date.now();S.w[k]=s;}}
function grade(k,ok){const s=ws(k);if(ok){s.l=Math.min(3,Math.max(1,s.l)+1);s.d=Date.now()+[0,.5,2,7][s.l]*DAY;}else{s.l=Math.max(1,s.l-1);s.e=(s.e||0)+1;s.d=Date.now();}S.w[k]=s;}
function dueList(){const now=Date.now();return Object.keys(S.w).filter(k=>WORD[k]&&S.w[k].l>0&&S.w[k].d<=now).sort((a,b)=>(S.w[b].e||0)-(S.w[a].e||0));}
function reservesCount(){const c={p3:0,p2:0,p1:0};for(const k in S.w){if(!WORD[k])continue;const l=S.w[k].l;if(l===1)c.p3++;else if(l===2)c.p2++;else if(l===3)c.p1++;}return c;}
function addMistake(it){const p=it.p;S.mist=S.mist.filter(m=>m.p!==p);S.mist.unshift({p,o:it.o,a:it.o[it.a],k:it.k||null,ex:it.ex||""});S.mist=S.mist.slice(0,80);}
function totalWords(){let n=0;for(const k in VOCAB)n+=VOCAB[k].length;return n;}

/* ---------- question generators ---------- */
function distract(w,field,n){const pool=shuffle(VOCAB[w.topic].filter(x=>x.k!==w.k&&field(x)!==field(w)));const out=[];for(const x of pool){if(!out.includes(field(x)))out.push(field(x));if(out.length>=n)break;}return out;}
function qTerm(w){const o=shuffle([trw(w)].concat(distract(w,trw,3)));return {p:`What does “${w.en}” mean?`,o,a:o.indexOf(trw(w)),k:w.k,say:w.en};}
function qRev(w){const o=shuffle([w.en].concat(distract(w,x=>x.en,3)));return {p:`${t("tr")}: «${trw(w)}» → English?`,o,a:o.indexOf(w.en),k:w.k};}
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function qGap(w){if(!w.ex||w.topic==="comm")return qTerm(w);const re=new RegExp("\\b"+escRe(w.en)+"(?![a-z])","i");if(!re.test(w.ex))return qTerm(w);
 const o=shuffle([w.en].concat(distract(w,x=>x.en,3)));return {p:w.ex.replace(re,"_____"),o,a:o.indexOf(w.en),k:w.k};}
function qMix(w){const r=Math.random();return r<.4?qTerm(w):r<.7?qRev(w):qGap(w);}
function qGram(id,i){const g=GRAMMAR[id],e=g.ex[i];return {p:e[0],o:e[1],a:e[2],ex:L3(g.rule).split(".")[0]+"."};}
function prep(it){const idx=it.o.map((_,i)=>i);const sh=shuffle(idx);return Object.assign({},it,{o:sh.map(i=>it.o[i]),a:sh.indexOf(it.a)});}

/* ---------- quiz engine ---------- */
function quiz(el,items,opt){
 opt=opt||{};let i=0,sc=0;const wrong=[];
 function draw(){const it=items[i];
  el.innerHTML=`<div class="q-top"><span class="mono muted">${i+1} / ${items.length}</span><div class="bar"><i style="width:${i/items.length*100}%"></i></div></div>
  <div class="q-prompt anim"><span style="flex:1">${esc(it.p)}</span>${it.say?sayBtn(it.say):""}</div>
  <div class="opts">${it.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div><div class="fbx"></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.j));}
 function pick(j){const it=items[i];const bs=el.querySelectorAll(".opt");bs.forEach(b=>b.disabled=true);
  const ok=j===it.a;bs[it.a].classList.add("right");if(!ok)bs[j].classList.add("wrong");
  if(it.k)grade(it.k,ok);
  if(ok){sc++;if(opt.xp!==false)addXP(2);if(opt.onRight)opt.onRight(it);}else{wrong.push(it);if(opt.mist!==false)addMistake(it);}
  save();
  const fb=el.querySelector(".fbx");
  fb.innerHTML=`<div class="fb ${ok?"good":"bad"}">${ok?t("correct"):t("wrong")+" "+t("answerIs")+" <b>"+esc(it.o[it.a])+"</b>"}${it.ex?`<div style="margin-top:6px;font-weight:400">${esc(it.ex)}</div>`:""}</div>
  <div class="row" style="margin-top:12px"><button class="btn nxt">${i+1<items.length?t("next"):t("finish")}</button></div>`;
  fb.querySelector(".nxt").onclick=()=>{i++;if(i<items.length)draw();else{if(opt.done)opt.done(sc,items.length,wrong);else el.innerHTML=resultHtml(sc,items.length,wrong);}};
  fb.querySelector(".nxt").focus();
 }
 if(!items.length){el.innerHTML=`<p class="muted">—</p>`;return;}
 draw();
}
function resultHtml(sc,n,wrong){
 return `<div class="stack anim"><div class="row"><span class="big-num">${sc}/${n}</span><span class="muted">${t("score")}</span></div>
 ${wrong.length?`<div><div class="lbl" style="margin-bottom:6px">${t("review")}</div>${wrong.map(w=>`<div class="err-row"><div>${esc(w.p)}</div><div class="muted">→ <b style="color:var(--good)">${esc(w.o[w.a])}</b></div></div>`).join("")}</div>`:""}</div>`;
}

let CW={topic:"geo"};
function buildCross(words){
 const grid={},placed=[];const key=(x,y)=>x+","+y;const get=(x,y)=>grid[key(x,y)];
 function can(w,x,y,d){const dx=d==="a"?1:0,dy=d==="a"?0:1;if(get(x-dx,y-dy)||get(x+dx*w.length,y+dy*w.length))return false;let cross=0;
  for(let k=0;k<w.length;k++){const cx=x+dx*k,cy=y+dy*k,c=get(cx,cy);if(c){if(c!==w[k])return false;cross++;}else{if(get(cx+dy,cy+dx)||get(cx-dy,cy-dx))return false;}}return placed.length===0||cross>0;}
 function put(o,x,y,d){const dx=d==="a"?1:0,dy=d==="a"?0:1;for(let k=0;k<o.w.length;k++)grid[key(x+dx*k,y+dy*k)]=o.w[k];placed.push(Object.assign({},o,{x,y,d}));}
 for(const o of words){if(placed.length>=8)break;
  if(!placed.length){put(o,0,0,"a");continue;}let done=false;
  for(const p of shuffle(placed)){for(let i=0;i<o.w.length&&!done;i++)for(let j=0;j<p.w.length&&!done;j++){if(o.w[i]!==p.w[j])continue;const d=p.d==="a"?"d":"a";const x=d==="d"?p.x+j:p.x-i,y=d==="d"?p.y-i:p.y+j;if(can(o.w,x,y,d)){put(o,x,y,d);done=true;}}if(done)break;}}
 let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;Object.keys(grid).forEach(k=>{const[x,y]=k.split(",").map(Number);minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
 const starts={};let n=0;placed.slice().sort((a,b)=>a.y-b.y||a.x-b.x).forEach(p=>{const k=key(p.x,p.y);if(!starts[k])starts[k]=++n;p.n=starts[k];});
 return {grid,placed,minX,minY,maxX,maxY,starts};
}
V.g_cross=function(){

 const C=buildCross(cand);CW.C=C;
 let rows="";for(let y=C.minY;y<=C.maxY;y++){rows+="<tr>";for(let x=C.minX;x<=C.maxX;x++){const c=C.grid[x+","+y];const n=C.starts[x+","+y];rows+=c?`<td class="c" data-x="${x}" data-y="${y}">${n?`<sup>${n}</sup>`:""}<input maxlength="1" aria-label="cell" data-x="${x}" data-y="${y}" autocomplete="off" autocapitalize="characters"></td>`:"<td></td>";}rows+="</tr>";}
 const clue=d=>C.placed.filter(p=>p.d===d).sort((a,b)=>a.n-b.n).map(p=>`<div><b class="mono">${p.n}.</b> ${esc(trw(p.src))} <span class="muted mono">(${p.w.length})</span></div>`).join("");
 app.innerHTML=crumb(t("cross"),"games",t("clue"))+`<div class="stack"><div class="chips">${TOPICS.map(k=>`<button class="chip ${CW.topic===k?"on":""}" onclick="App.cwTopic('${k}')">${TNAME[k]}</button>`).join("")}</div>
 <div class="grid2" style="align-items:start"><div class="card cw"><table>${rows}</table></div><div class="card stack"><div><div class="lbl" style="margin-bottom:6px">${t("across")}</div>${clue("a")}</div><div><div class="lbl" style="margin-bottom:6px">${t("down")}</div>${clue("d")}</div>
 <div class="row"><button class="btn" id="cwck">${t("check")}</button><button class="btn ghost" onclick="App.go('g_cross')">${t("newGame")}</button></div><div id="cwout"></div></div></div></div>`;
 const inputs=[...document.querySelectorAll(".cw input")];
 inputs.forEach((inp,k)=>{inp.oninput=()=>{inp.value=inp.value.slice(-1).toUpperCase();if(inp.value){const nx=document.querySelector(`.cw input[data-x="${+inp.dataset.x+1}"][data-y="${inp.dataset.y}"]`)||document.querySelector(`.cw input[data-x="${inp.dataset.x}"][data-y="${+inp.dataset.y+1}"]`);if(nx)nx.focus();}};});
 $("#cwck").onclick=()=>{let all=true;inputs.forEach(inp=>{const c=C.grid[inp.dataset.x+","+inp.dataset.y];const ok=inp.value.toUpperCase()===c;inp.parentElement.classList.toggle("ok",ok);inp.parentElement.classList.toggle("no",!ok&&!!inp.value);if(!ok)all=false;});
  if(all){addXP(30);C.placed.forEach(p=>grade(p.src.k,true));save();$("#cwout").innerHTML=`<div class="fb good">${t("cwDone")} +30 XP</div>`;}};
};

 vGrade(ok){const list=wordsForVocab();const w=list[VS.ci];if(w){grade(w.k,!!ok);if(ok)addXP(1);save();}VS.ci++;VS.flip=false;drawVocab();},
 vRestart(){VS.ci=0;if(VS.review)VS.queue=dueList();drawVocab();},
 scPick(j){const a=CUR.a,sc=SCENARIOS[a.i],st=sc.steps[a.step];const ok=j===st.b;if(ok){a.score++;addXP(5);}a.log.push({p:st.p,me:st.o[j],ok,best:st.o[st.b],f:L3(st.f)});a.picked=true;V.scen(a);},
 scNext(){const a=CUR.a;a.step++;a.picked=false;if(a.step>=SCENARIOS[a.i].steps.length)addXP(5);V.scen(a);}
};
document.addEventListener("keydown",e=>{if(e.key==="Escape")hidePop();});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(!S.theme)applyTheme();});}catch(e){}
getSample();
render();
})();

<script>
/* Telegram Mini App adapter — late part: Telegram buttons, colors, haptics, cloud sync, downloads. */
(function () {
  var TGA = window.TGA;
  if (!TGA || !TGA.on) return;
  var W = TGA.W, CFG = TGA.cfg, LS = window.localStorage;
  var atLeast = function (v) { try { return W.isVersionAtLeast(v); } catch (e) { return false; } };
  var L = function () { var l = (document.documentElement.lang || TGA.lang || 'ru').slice(0, 2); return l === 'uz' || l === 'en' ? l : 'ru'; };
  var TX = {
    ru: { copy: 'Скопировать', copied: 'Скопировано', close: 'Закрыть', open: 'Открыть в браузере',
      fileTitle: 'Файл', fileText: 'Скачивание файлов внутри Telegram ограничено. Скопируйте содержимое или откройте приложение в браузере.',
      imgText: 'Нажмите и удерживайте изображение, чтобы сохранить его.',
      printTitle: 'Печать', printText: 'Печать и сохранение в PDF внутри Telegram недоступны. Откройте приложение в браузере (лучше на компьютере), чтобы распечатать.' },
    uz: { copy: 'Nusxa olish', copied: 'Nusxa olindi', close: 'Yopish', open: 'Brauzerda ochish',
      fileTitle: 'Fayl', fileText: 'Telegram ichida fayllarni yuklab olish cheklangan. Mazmunini nusxalang yoki ilovani brauzerda oching.',
      imgText: 'Rasmni saqlash uchun uni bosib turing.',
      printTitle: 'Chop etish', printText: 'Telegram ichida chop etish va PDF saqlash mavjud emas. Chop etish uchun ilovani brauzerda (yaxshisi kompyuterda) oching.' },
    en: { copy: 'Copy', copied: 'Copied', close: 'Close', open: 'Open in browser',
      fileTitle: 'File', fileText: 'Downloading files inside Telegram is limited. Copy the content or open the app in a browser.',
      imgText: 'Press and hold the image to save it.',
      printTitle: 'Print', printText: 'Printing and saving to PDF are not available inside Telegram. Open the app in a browser (preferably on a computer) to print.' }
  };
  var tx = function (k) { return (TX[L()] || TX.ru)[k]; };

  try { W.ready(); W.expand(); } catch (e) {}
  if (atLeast('7.7')) try { W.disableVerticalSwipes(); } catch (e) {}

  /* ---------- header / background colors follow the app's own theme ---------- */
  function hex(c) {
    var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c || '');
    if (!m) return null;
    return '#' + [m[1], m[2], m[3]].map(function (n) { return ('0' + (+n).toString(16)).slice(-2); }).join('');
  }
  function paint() {
    var c = hex(getComputedStyle(document.body).backgroundColor) || hex(getComputedStyle(document.documentElement).backgroundColor);
    if (!c || !atLeast('6.1')) return;
    try { W.setHeaderColor(c); W.setBackgroundColor(c); if (atLeast('7.10')) W.setBottomBarColor(c); } catch (e) {}
  }
  new MutationObserver(function () { setTimeout(paint, 30); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { setTimeout(paint, 30); }); } catch (e) {}
  paint(); setTimeout(paint, 400);

  /* ---------- Back button ---------- */
  var backFn = null;
  function updateBack() {
    var fn = null;
    try { fn = CFG.back ? CFG.back() : null; } catch (e) {}
    if (!fn && TGA.fromHub) fn = function () { location.href = 'index.html'; };
    backFn = fn;
    try { fn ? W.BackButton.show() : W.BackButton.hide(); } catch (e) {}
  }
  try { W.BackButton.onClick(function () { haptic('impact'); if (backFn) backFn(); setTimeout(updateBack, 60); }); } catch (e) {}
  var ut = null;
  var schedule = function () { clearTimeout(ut); ut = setTimeout(updateBack, 80); };
  window.addEventListener('hashchange', schedule);
  document.addEventListener('click', schedule, true);
  new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
  updateBack();

  /* ---------- Haptic feedback ---------- */
  function haptic(kind) {
    try {
      var H = W.HapticFeedback; if (!H || !atLeast('6.1')) return;
      if (kind === 'ok') H.notificationOccurred('success');
      else if (kind === 'bad') H.notificationOccurred('error');
      else if (kind === 'impact') H.impactOccurred('light');
      else H.selectionChanged();
    } catch (e) {}
  }
  TGA.haptic = haptic;
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('button,[role=button],[role=tab],a,.opt,.tile,.item')) haptic('tap');
  }, true);
  var OK = CFG.okSel || '.opt.right,.opt.ok,.fb.good,.feedback.good,.expl.ok',
      BAD = CFG.badSel || '.opt.wrong,.opt.no,.fb.bad,.feedback.bad,.expl.no,button.wrong';
  var hk = null, hTimer = null;
  function mark(k) { if (hk !== 'bad') hk = k; clearTimeout(hTimer); hTimer = setTimeout(function () { haptic(hk); hk = null; }, 60); }
  function test(el) {
    if (!el || el.nodeType !== 1) return;
    if (el.matches(BAD) || el.querySelector(BAD)) mark('bad');
    else if (el.matches(OK) || el.querySelector(OK)) mark('ok');
  }
  new MutationObserver(function (ms) {
    ms.forEach(function (m) {
      if (m.type === 'attributes') { if (m.target.matches && (m.target.matches(BAD) || m.target.matches(OK)) && m.oldValue !== m.target.className) test(m.target); }
      else for (var i = 0; i < m.addedNodes.length; i++) test(m.addedNodes[i]);
    });
  }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'], attributeOldValue: true });

  /* ---------- External links open outside the Mini App ---------- */
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || a.hasAttribute('download')) return;
    var href = a.getAttribute('href') || '';
    if (/^https?:/i.test(href) && a.host !== location.host) { e.preventDefault(); try { W.openLink(a.href); } catch (er) { location.href = a.href; } }
  }, true);

  /* ---------- Small modal used for downloads and printing ---------- */
  var css = document.createElement('style');
  css.textContent =
    '.tga-ov{position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}' +
    '.tga-box{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);border-radius:18px;padding:18px;font:15px/1.5 system-ui,-apple-system,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.3)}' +
    '.tga-box h3{margin:0 0 8px;font-size:18px}.tga-box p{margin:0 0 12px;color:var(--tg-theme-hint-color,#666)}' +
    '.tga-box img{display:block;width:100%;height:auto;border-radius:10px;margin:0 0 12px}' +
    '.tga-box textarea{width:100%;height:160px;font:12px ui-monospace,monospace;border-radius:10px;border:1px solid var(--tg-theme-hint-color,#ccc);background:var(--tg-theme-secondary-bg-color,#f4f4f4);color:inherit;padding:8px;margin:0 0 12px}' +
    '.tga-row{display:flex;gap:8px;flex-wrap:wrap}.tga-row button{flex:1;min-height:44px;border:0;border-radius:12px;font:600 15px system-ui,sans-serif;cursor:pointer;background:var(--tg-theme-secondary-bg-color,#eee);color:var(--tg-theme-text-color,#111)}' +
    '.tga-row button.p{background:var(--tg-theme-button-color,#2a8bf2);color:var(--tg-theme-button-text-color,#fff)}';
  document.head.appendChild(css);
  function modal(title, text, extra, buttons) {
    var ov = document.createElement('div'); ov.className = 'tga-ov';
    var box = document.createElement('div'); box.className = 'tga-box'; ov.appendChild(box);
    var h = document.createElement('h3'); h.textContent = title; box.appendChild(h);
    var p = document.createElement('p'); p.textContent = text; box.appendChild(p);
    if (extra) box.appendChild(extra);
    var row = document.createElement('div'); row.className = 'tga-row'; box.appendChild(row);
    var close = function () { ov.remove(); };
    (buttons || []).concat([{ t: tx('close'), f: close }]).forEach(function (b) {
      var x = document.createElement('button'); x.textContent = b.t; if (b.p) x.className = 'p';
      x.onclick = function () { b.f(x, close); }; row.appendChild(x);
    });
    ov.addEventListener('click', function (e) { if (e.target === ov) close(); });
    document.body.appendChild(ov);
  }
  TGA.modal = modal;
  var openOutside = { t: tx('open'), f: function () { try { W.openLink(location.href.split('?')[0]); } catch (e) {} } };
  TGA.showImage = function (src, title) {
    var img = document.createElement('img'); img.src = src; img.alt = title || '';
    modal(title || tx('fileTitle'), tx('imgText'), img, []);
  };

  window.print = function () { modal(tx('printTitle'), tx('printText'), null, [openOutside]); };

  var origClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    var href = this.href || '';
    if (!this.hasAttribute('download') || !/^(blob|data):/.test(href)) return origClick.apply(this, arguments);
    var name = this.getAttribute('download') || 'file';
    fetch(href).then(function (r) { return r.blob(); }).then(function (b) {
      var type = b.type || '';
      if (/^image\//.test(type)) {
        var fr = new FileReader(); fr.onload = function () { TGA.showImage(fr.result, name); }; fr.readAsDataURL(b);
      } else if (/^text\/|json|csv|xml|las/i.test(type) || /\.(txt|csv|las|json|xml)$/i.test(name)) {
        b.text().then(function (t) {
          var ta = document.createElement('textarea'); ta.readOnly = true; ta.value = t;
          modal(name, tx('fileText'), ta, [{ t: tx('copy'), p: 1, f: function (btn) {
            var done = function () { btn.textContent = tx('copied'); haptic('ok'); };
            if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function () { ta.select(); document.execCommand('copy'); done(); });
            else { ta.select(); document.execCommand('copy'); done(); }
          } }, openOutside]);
        });
      } else modal(name, tx('fileText'), null, [openOutside]);
    }).catch(function () { modal(name, tx('fileText'), null, [openOutside]); });
  };

  /* ---------- Progress sync through Telegram CloudStorage ---------- */
  var CS = W.CloudStorage, keys = CFG.keys || [], app = CFG.id || 'app';
  if (!CS || !atLeast('6.9') || !keys.length) return;
  var CHUNK = 4000;
  var base = function (k) { return (app + '_' + k).replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 100); };
  var cget = function (ks) { return new Promise(function (res) { try { CS.getItems(ks, function (err, v) { res(err ? null : (v || {})); }); } catch (e) { res(null); } }); };
  var cset = function (k, v) { return new Promise(function (res) { try { CS.setItem(k, v, function (err) { res(!err); }); } catch (e) { res(false); } }); };

  TGA.flush = function () {
    var ks = Object.keys(TGA.pending); ks.forEach(function (k) { delete TGA.pending[k]; });
    return Promise.all(ks.map(function (k) {
      var v = LS.getItem(k); if (v == null) return null;
      var b = base(k), parts = [];
      for (var i = 0; i < v.length; i += CHUNK) parts.push(v.slice(i, i + CHUNK));
      return Promise.all(parts.map(function (p, i) { return cset(b + '_' + i, p); }))
        .then(function () { return cset(b + '_n', String(parts.length)); })
        .then(function () { return cset(b + '_ts', LS.getItem('tga_ts_' + k) || String(Date.now())); });
    }));
  };
  document.addEventListener('visibilitychange', function () { if (document.hidden && Object.keys(TGA.pending).length) TGA.flush(); });
  try { W.onEvent('viewportChanged', function () { if (Object.keys(TGA.pending).length) TGA.flush(); }); } catch (e) {}

  // On start: take the newer copy — from this device or from the cloud.
  var meta = []; keys.forEach(function (k) { meta.push(base(k) + '_n', base(k) + '_ts'); });
  cget(meta).then(function (m) {
    if (!m) return;
    var pulls = [];
    keys.forEach(function (k) {
      var b = base(k), cts = +(m[b + '_ts'] || 0), n = +(m[b + '_n'] || 0), lts = +(LS.getItem('tga_ts_' + k) || 0);
      if (n > 0 && cts > lts) {
        var ck = []; for (var i = 0; i < n; i++) ck.push(b + '_' + i);
        pulls.push(cget(ck).then(function (v) {
          if (!v) return false;
          var s = ck.map(function (x) { return v[x] || ''; }).join('');
          try { JSON.parse(s); } catch (e) { if (/^[{\[]/.test(s)) return false; }
          if (s === LS.getItem(k)) { TGA.rawSet('tga_ts_' + k, String(cts)); return false; }
          TGA.rawSet(k, s); TGA.rawSet('tga_ts_' + k, String(cts)); return true;
        }));
      } else if (lts > cts && LS.getItem(k) != null) { TGA.pending[k] = 1; }
    });
    Promise.all(pulls).then(function (r) {
      if (r.some(Boolean)) {
        var once = false; try { once = sessionStorage.getItem('tga_reloaded') === '1'; sessionStorage.setItem('tga_reloaded', '1'); } catch (e) {}
        if (!once) location.reload();
      } else if (Object.keys(TGA.pending).length) TGA.flush();
    });
  });
})();
