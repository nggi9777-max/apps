<script>window.TGA_CFG = {
  id: 'sba', keys: ['sba.state.v1'],
  seed: function (lang, scheme, LS, set) { if (!LS.getItem('sba.state.v1')) set('sba.state.v1', JSON.stringify({ lang: lang, theme: scheme })); },
  back: function () {
    var p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (!p.length) return null;
    return function () {
      if (p[1]) location.hash = '#/' + p[0];
      else if (['quick', 'perfect', 'daily', 'write'].indexOf(p[0]) >= 0) location.hash = '#/practice';
      else location.hash = '#/';
    };
  }
};
/* Telegram Mini App adapter — early part (runs before the app's own scripts).
   Seeds language/theme from Telegram on first launch and mirrors saved progress to Telegram CloudStorage. */
(function () {
  var CFG = window.TGA_CFG || {};
  var W = window.Telegram && window.Telegram.WebApp;
  var on = !!(W && W.initData);
  var TGA = window.TGA = { W: W, on: on, cfg: CFG };
  if (!on) return;
  document.documentElement.classList.add('tg-app');
  var u = (W.initDataUnsafe && W.initDataUnsafe.user) || {};
  var lc = String(u.language_code || '').toLowerCase();
  TGA.lang = lc.indexOf('uz') === 0 ? 'uz' : lc.indexOf('en') === 0 ? 'en' : 'ru';
  TGA.scheme = W.colorScheme === 'dark' ? 'dark' : 'light';
  try { if (/[?&]from=hub\b/.test(location.search)) sessionStorage.setItem('tga_hub', '1'); } catch (e) {}
  TGA.fromHub = (function () { try { return sessionStorage.getItem('tga_hub') === '1'; } catch (e) { return false; } })();

  var LS = window.localStorage, origSet = Storage.prototype.setItem;
  TGA.rawSet = function (k, v) { try { origSet.call(LS, k, v); } catch (e) {} };

  // First launch on this device: start in the user's Telegram language and theme.
  try { if (CFG.seed) CFG.seed(TGA.lang, TGA.scheme, LS, TGA.rawSet); } catch (e) {}

  // Every save of a synced key is queued for upload to CloudStorage.
  var keys = CFG.keys || [], pending = {}, timer = null;
  TGA.pending = pending;
  Storage.prototype.setItem = function (k, v) {
    origSet.apply(this, arguments);
    if (this === LS && keys.indexOf(k) >= 0) {
      origSet.call(LS, 'tga_ts_' + k, String(Date.now()));
      pending[k] = 1;
      clearTimeout(timer);
      timer = setTimeout(function () { TGA.flush && TGA.flush(); }, 1500);
    }
  };
})();
</script>

/* ---------------------------------------------------------------- tokens */
:root {
  --fs: 1;
  --brand-1: #4f46e5;           /* logo indigo */
  --brand-2: #0d9488;           /* logo teal */
  --brand-grad: linear-gradient(135deg, var(--brand-1), var(--brand-2));
  --chrome: #111735;            /* header */
  --chrome-2: #1a2147;
  --chrome-text: #e8eaf6;
  --chrome-muted: #a3a9c9;

  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #f0f2f7;
  --text: #101828;
  --muted: #5a6478;
  --border: #e2e6ee;
  --border-strong: #cfd5e2;
  --primary: #4338ca;
  --primary-hover: #3730a3;
  --primary-ink: #ffffff;
  --primary-soft: #eef0fd;
  --accent: #0f766e;
  --accent-soft: #e6f4f2;
  --ok: #157347;
  --ok-soft: #e7f4ec;
  --bad: #b42318;
  --bad-soft: #fdecea;
  --warn: #8a5a00;
  --warn-soft: #fdf4e3;
  --gold: #a16207;
  --dot-on: #312e81;
  --dot-off: #b9c0d3;
  --focus: #f59e0b;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 14px rgba(16, 24, 40, .06);
  --radius: 14px;
  --radius-sm: 10px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --brand-1: #2563eb;           /* light-blue accents instead of violet in the dark theme */
  --chrome: #0a0f1e;
  --chrome-2: #141b33;
  --bg: #0d1324;
  --surface: #131b30;
  --surface-2: #1a2440;
  --text: #e7eaf2;
  --muted: #98a2b8;
  --border: #243150;
  --border-strong: #31406a;
  --primary: #60a5fa;
  --primary-hover: #93c5fd;
  --primary-ink: #0d1324;
  --primary-soft: #14294a;
  --accent: #2dd4bf;
  --accent-soft: #0e2f2d;
  --ok: #4ade80;
  --ok-soft: #10301d;
  --bad: #f97066;
  --bad-soft: #3a1618;
  --warn: #fbbf24;
  --warn-soft: #33270c;
  --gold: #e0b45a;
  --dot-on: #bfdbfe;
  --dot-off: #46557c;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

/* ---------------------------------------------------------------- base */
* { box-sizing: border-box; }
html { font-size: calc(100% * var(--fs)); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--bg); color: var(--text);
  font: 400 1rem/1.55 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 .6em; letter-spacing: -.01em; }
h1 { font-size: clamp(1.5rem, 3.4vw, 1.9rem); font-weight: 700; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1.02rem; font-weight: 700; }
p { margin: 0 0 .8em; }
a { color: var(--primary); }
img { max-width: 100%; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--primary); color: var(--primary-ink); padding: 10px 16px; border-radius: 10px; }
.skip-link:focus { top: 12px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.center { text-align: center; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.center { justify-content: center; margin-top: 12px; }
.row.space { justify-content: space-between; }
.ico { flex: none; display: block; }
.ic { display: inline-flex; align-items: center; gap: 8px; }

main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 22px 20px 56px; }
main > * + * { margin-top: 18px; }

/* ---------------------------------------------------------------- header */
#app-header { position: sticky; top: 0; z-index: 20; background: var(--chrome); color: var(--chrome-text); box-shadow: 0 1px 0 rgba(255, 255, 255, .06), 0 4px 18px rgba(8, 12, 30, .25); }
#app-header::after { content: ""; display: block; height: 3px; background: var(--brand-grad); }
.bar { max-width: 1180px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
.brand { text-decoration: none; color: inherit; margin-right: auto; border-radius: 10px; }
.bar .logo-words { color: #fff; }
.bar .logo-by { color: var(--chrome-muted); }
.bar-tools { display: flex; align-items: center; gap: 8px; }
.icon-btn { min-width: 42px; min-height: 42px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; text-decoration: none; color: var(--text); }
.icon-btn:hover { border-color: var(--primary); color: var(--primary); }
#app-header .icon-btn { background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .14); color: var(--chrome-text); }
#app-header .icon-btn:hover { background: rgba(255, 255, 255, .12); color: #fff; }

/* segmented controls (language, theme) */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .14); }
.seg-btn { min-width: 40px; min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--chrome-muted); font-weight: 700; font-size: .82rem; letter-spacing: .06em; cursor: pointer; display: inline-grid; place-items: center; transition: background .15s, color .15s; }
.seg-btn:hover { color: #fff; background: rgba(255, 255, 255, .08); }
.seg-btn.active { background: #fff; color: var(--chrome); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.seg.theme .seg-btn { min-width: 38px; padding: 0 9px; }

/* breadcrumbs */
#app-subheader { background: var(--surface); border-bottom: 1px solid var(--border); }
#app-subheader[hidden] { display: none; }
.crumbs { max-width: 1180px; margin: 0 auto; padding: 8px 20px; font-size: .88rem; }
.crumbs ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.crumbs li { display: inline-flex; align-items: center; gap: 4px; }
.crumbs .sep { color: var(--border-strong); display: inline-flex; }
.crumbs a { color: var(--muted); text-decoration: none; padding: 4px 6px; border-radius: 6px; font-weight: 500; }
.crumbs a:hover { color: var(--primary); background: var(--primary-soft); }
.crumbs [aria-current] { font-weight: 600; color: var(--text); padding: 4px 6px; }
.crumb-home { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); padding: 4px 10px !important; color: var(--text) !important; font-weight: 600 !important; }
.crumb-home:hover { border-color: var(--primary); }

/* ---------------------------------------------------------------- logo */
.logo { display: inline-flex; align-items: center; gap: 12px; }
.logo-mark-wrap { display: inline-flex; }
.logo-text { display: flex; flex-direction: column; }
.logo-words { font-weight: 800; letter-spacing: .08em; line-height: 1.05; font-size: .82rem; color: var(--text); }
.logo-by { font-size: .74rem; color: var(--muted); font-weight: 500; letter-spacing: .02em; margin-top: 3px; }
.logo.inline .logo-words { font-size: .86rem; }
.logo.inline .logo-by { font-size: .72rem; margin-top: 1px; }

/* ---------------------------------------------------------------- splash */
#splash { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: var(--chrome); color: #fff; transition: opacity .35s; }
#splash.hide { opacity: 0; pointer-events: none; }
#splash .splash-dots { display: grid; grid-template-columns: repeat(2, 14px); gap: 9px; margin: 0 auto 16px; width: max-content; }
#splash .splash-dots span { width: 14px; height: 14px; border-radius: 50%; background: #fff; animation: pulse 1s infinite alternate; }
#splash .splash-dots span:nth-child(2n) { animation-delay: .2s; }
#splash .splash-dots span:nth-child(3n) { animation-delay: .4s; }
#splash p { text-align: center; font-weight: 800; letter-spacing: .1em; margin: 0; }
#splash small { display: block; text-align: center; color: var(--chrome-muted); margin-top: 6px; }
@keyframes pulse { from { opacity: .35; } to { opacity: 1; } }

/* ---------------------------------------------------------------- cards & layout */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); }
.card.accent { border-left: 4px solid var(--primary); }
.card > :last-child { margin-bottom: 0; }
.two-col { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.section-title { display: flex; align-items: center; gap: 8px; font-size: 1.3rem; margin: 0 0 14px; }
.page-head h1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.page-head h1:focus { outline: none; }
.lead { font-size: 1.04rem; color: var(--muted); }
.big-num { font-size: 1.4rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; justify-content: center; }
.note-card, .note { border-left: 4px solid var(--gold); }
.note { padding-left: 12px; }

/* home */
.home-head { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
.home-head .logo-words { font-size: 1.05rem; }
.home-head .logo-by { font-size: .82rem; }
.home-tagline { margin: 0; color: var(--muted); font-size: 1rem; padding-left: 20px; border-left: 1px solid var(--border); }
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.home-main .section-title { margin-top: 2px; }
.home-tiles { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.home-side { display: grid; gap: 12px; position: sticky; top: 92px; }
.side-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: .9rem; }
.side-card > :last-child { margin-bottom: 0; }
.side-title { display: flex; align-items: center; gap: 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 10px; }
.side-title .ico { color: var(--primary); }
.side-title .help-btn { margin-left: auto; width: 26px; height: 26px; }
.side-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.side-progress .progress { flex: 1; }
.side-pct { font-size: 1.35rem; font-weight: 800; color: var(--text); min-width: 3.2ch; }
.kv { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--border); }
.kv-icon { color: var(--muted); display: inline-flex; }
.kv-label { color: var(--muted); flex: 1; }
.kv-value { font-weight: 700; }
.kv .help-btn { width: 24px; height: 24px; }
.side-note { font-size: .8rem; color: var(--muted); margin: 6px 0 0; }
.side-text { color: var(--muted); margin: 0 0 10px; font-size: .88rem; }
.side-row { margin-top: 10px; }
.side-row .side-text { margin: 0; }
.review-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.review-chip { min-width: 30px; height: 30px; padding: 0 8px; display: inline-grid; place-items: center; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-weight: 700; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent; font-weight: 600; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s, color .15s; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: .88rem; }
.btn.primary { background: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.ghost { background: var(--surface); border-color: var(--border-strong); color: var(--text); }
.btn.ghost:hover { border-color: var(--primary); color: var(--primary); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.big { min-height: 52px; font-size: 1.05rem; padding: 0 24px; }
.btn:disabled { opacity: .5; cursor: default; }
.help-btn { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 50%; width: 30px; height: 30px; padding: 0; cursor: pointer; display: inline-grid; place-items: center; vertical-align: middle; flex: none; }
.help-btn:hover { color: var(--primary); border-color: var(--primary); }

/* chips & badges */
.chip, .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 7px; font-size: .82rem; background: var(--surface-2); border: 1px solid var(--border); font-weight: 600; }
.chip.ok, .badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.streak { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.review { background: var(--warn-soft); color: var(--warn); border-color: transparent; margin-bottom: 8px; }
.badge[class*="set-"] { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
.badge.set-en, .badge.set-uz { background: var(--accent-soft); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip-btn { min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip-btn:hover { border-color: var(--primary); }
.chip-btn.active { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 700; box-shadow: inset 0 0 0 1px var(--primary); }

/* tiles */
.tiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.tiles.three { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.tile { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 18px; min-height: 132px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); color: var(--text); text-decoration: none; transition: border-color .15s, box-shadow .15s, transform .15s var(--ease); }
.tile:hover { border-color: var(--primary); box-shadow: var(--shadow); transform: translateY(-2px); }
.tile-icon { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); margin-bottom: 8px; }
.tile:hover .tile-icon { background: var(--primary); color: var(--primary-ink); }
.primary-tile .tile-icon, .primary-tile:hover .tile-icon { background: var(--brand-grad); color: #fff; }
.primary-tile { border-top: 3px solid var(--brand-1); }
.tile-title { font-weight: 700; font-size: 1.02rem; }
.tile-desc { color: var(--muted); font-size: .88rem; }
.tile-meta { margin-top: auto; padding-top: 6px; font-weight: 600; color: var(--primary); font-size: .86rem; }

/* stats */
.stat-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 14px; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: var(--radius-sm); background: var(--surface-2); position: relative; text-align: left; }
.stat-icon { color: var(--primary); margin-bottom: 4px; }
.stat-value { font-size: 1.3rem; font-weight: 800; word-break: break-word; }
.stat-label { color: var(--muted); font-size: .85rem; }

/* progress */
.progress { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress-fill { height: 100%; background: var(--brand-grad); border-radius: 999px; transition: width .5s var(--ease); }

/* ---------------------------------------------------------------- Braille cells */
.braille { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: calc(var(--d) * 1.25); --d: 14px; }
.braille.sm { --d: 9px; }
.braille.md { --d: 14px; }
.braille.lg { --d: 24px; }
.braille.xl { --d: 34px; }
.cell { display: grid; grid-template-columns: repeat(2, var(--d)); grid-template-rows: repeat(3, var(--d)); grid-auto-flow: column; gap: calc(var(--d) * .55); }
.braille .dot { width: var(--d); height: var(--d); border-radius: 50%; border: max(1.5px, calc(var(--d) * .1)) solid var(--dot-off); background: transparent; display: grid; place-items: center; }
.braille .dot.on { background: var(--dot-on); border-color: var(--dot-on); }
.braille .dot i { font-style: normal; font-size: calc(var(--d) * .48); color: var(--muted); font-weight: 700; }
.braille .dot.on i { color: var(--surface); }
.braille.sm .dot i { display: none; }

/* editor (interactive cell) */
.editor-wrap { display: flex; justify-content: center; padding: 10px 0; }
.editor { display: grid; grid-template-columns: repeat(2, var(--ed)); grid-template-rows: repeat(3, var(--ed)); grid-auto-flow: column; gap: calc(var(--ed) * .32); padding: calc(var(--ed) * .35); border-radius: 20px; background: var(--surface-2); border: 1px solid var(--border); --ed: 72px; }
.editor .dot { width: var(--ed); height: var(--ed); border-radius: 50%; border: 3px solid var(--dot-off); background: var(--surface); cursor: pointer; display: grid; place-items: center; font-size: 1.25rem; font-weight: 700; color: var(--muted); transition: transform .18s var(--ease), background .18s, box-shadow .18s; touch-action: manipulation; }
.editor .dot:hover { border-color: var(--primary); }
.editor .dot i { font-style: normal; }
.editor .dot.on { background: var(--dot-on); border-color: var(--dot-on); color: var(--surface); transform: translateY(-3px); box-shadow: 0 6px 0 rgba(0, 0, 0, .18); }
.editor.good { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok); }
.editor.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad); animation: shake .35s; }
.editor.reveal { border-color: var(--warn); box-shadow: 0 0 0 2px var(--warn); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.explorer { display: grid; gap: 18px; grid-template-columns: auto 1fr; align-items: center; }
.combo b { font-size: 1.15rem; }
.created { font-weight: 700; margin-bottom: 4px; }
.match-list { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
.match-list li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); }
.match-ch { font-size: 1.5rem; font-weight: 800; min-width: 2ch; }
.match-list .icon-btn { margin-left: auto; min-width: 38px; min-height: 38px; }
.cell-map { display: inline-grid; font: 700 1.3rem/1.4 ui-monospace, monospace; background: var(--surface-2); padding: 8px 18px; border-radius: 10px; white-space: pre; }
.demo-row { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: center; padding: 8px 0; }
.demo-item { display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 700; }
.arrow { font-size: 1.5rem; color: var(--muted); }
.facts li { margin-bottom: 6px; }

/* symbol grid */
.sym-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
.sym-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; transition: border-color .15s, box-shadow .15s; min-height: 128px; }
.sym-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.sym-card.special { border-color: var(--gold); box-shadow: inset 0 3px 0 var(--gold); }
.sym-ch { font-size: 1.5rem; font-weight: 800; }
.sym-dots { font-size: .8rem; color: var(--muted); font-weight: 600; }
.sym-latin { font-size: .76rem; color: var(--muted); text-align: center; }
.star { position: absolute; top: 4px; right: 8px; color: var(--gold); }
.detail { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center; }
.detail-list { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
.detail-list dt { color: var(--muted); }
.detail-list dd { margin: 0; font-weight: 700; }
.uni { font-size: 1.5rem; }

/* lessons */
.lesson-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.lesson-card { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); text-decoration: none; color: var(--text); transition: border-color .15s; }
.lesson-card:hover { border-color: var(--primary); }
.lesson-num { flex: none; width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 800; }
.lesson-card.done .lesson-num { background: var(--ok-soft); color: var(--ok); }
.lesson-text { flex: 1; display: flex; flex-direction: column; }
.lesson-title { font-weight: 700; }
.lesson-desc { color: var(--muted); font-size: .9rem; }
.stepper { display: flex; gap: 6px; flex-wrap: wrap; }
.step { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; text-decoration: none; font-weight: 700; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); }
.step.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.step.current { border-color: var(--primary); background: var(--primary); color: var(--primary-ink); }
.lesson-nav { margin-top: 24px; }

/* ---------------------------------------------------------------- quiz */
.quiz { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow-sm); }
.quiz-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.quiz-title h2 { margin: 0; }
.quiz-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.quiz-body { text-align: center; }
.prompt { font-size: 1.1rem; font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.target { display: flex; justify-content: center; align-items: center; gap: 16px; min-height: 120px; padding: 12px; border-radius: 14px; background: var(--surface-2); margin: 10px 0 16px; flex-wrap: wrap; }
.big-letter { font-size: clamp(2.6rem, 9vw, 4rem); font-weight: 800; line-height: 1; }
.target .eq { font-size: 2rem; color: var(--muted); }
.options { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); max-width: 560px; margin: 0 auto; }
.opt { min-height: 60px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 1.3rem; font-weight: 700; cursor: pointer; padding: 6px 10px; transition: border-color .12s, background .12s; }
.opt:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-soft); }
.opt.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }
.feedback { min-height: 1.6em; margin-top: 14px; font-weight: 600; }
.feedback.good { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.qtimer { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-bottom: 12px; }
.qtimer > div { height: 100%; background: var(--warn); transition: width 1s linear; }
.results { text-align: center; }
.results h2:focus, .congrats h2:focus { outline: none; }
.success-msg { color: var(--ok); font-weight: 600; background: var(--ok-soft); padding: 10px 14px; border-radius: 10px; }
.warn-msg { color: var(--warn); font-weight: 600; background: var(--warn-soft); padding: 10px 14px; border-radius: 10px; }
.error { color: var(--bad); font-weight: 600; min-height: 1.2em; }
.review-box h3 { margin-top: 16px; display: flex; justify-content: center; }
.mini-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 12px; }
.mini { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-weight: 700; }

/* memory */
.memory-grid { display: grid; gap: 10px; grid-template-columns: repeat(4, 1fr); max-width: 560px; margin: 0 auto; }
.mem-card { aspect-ratio: 1 / 1; border-radius: 12px; border: 1px solid var(--border); background: var(--chrome); color: #fff; cursor: pointer; display: grid; place-items: center; position: relative; font-size: 1.6rem; }
.mem-card.shown { background: var(--surface); color: var(--text); border-color: var(--primary); }
.mem-card.matched { background: var(--ok-soft); border-color: var(--ok); }
.mem-letter { font-weight: 800; font-size: 1.7rem; }
.mem-back { opacity: .55; }
.mem-ok { position: absolute; top: 4px; right: 8px; font-size: .95rem; color: var(--ok); }

/* exam */
.label { font-weight: 700; display: block; margin-bottom: 6px; }
.input { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 1rem; }
.input:focus { border-color: var(--primary); outline: 3px solid var(--primary-soft); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.rules { list-style: none; padding: 0; display: grid; gap: 8px; }
.rules li { display: flex; align-items: center; gap: 10px; }
.rules .ico { color: var(--primary); }
.result-table { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; max-width: 460px; margin: 14px auto; text-align: left; }
.result-table dt { color: var(--muted); }
.result-table dd { margin: 0; font-weight: 700; }
.result-table .pass { color: var(--ok); }
.result-table .fail { color: var(--bad); }
.congrats { text-align: center; border-top: 4px solid var(--brand-1); }
.congrats-icon { display: inline-grid; place-items: center; width: 84px; height: 84px; border-radius: 22px; background: var(--brand-grad); color: #fff; margin-bottom: 12px; }
.score-big { font-size: 2.4rem; font-weight: 800; color: var(--primary); margin: 0; }
.topics a { font-weight: 600; text-decoration: none; }
.table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table th, .table td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
.cert-preview { width: 100%; border-radius: 8px; border: 1px solid var(--border); }

/* stats & achievements */
.donut { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }

.legend.ok { color: var(--ok); font-weight: 700; } .legend.bad { color: var(--bad); font-weight: 700; }
.bars { display: grid; gap: 12px; }

.tips li { margin-bottom: 6px; }

.setting { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 0; border-bottom: 1px solid var(--border); }
.setting:last-child { border-bottom: 0; }
.setting .chips { margin: 0; }
.setting-label { font-weight: 700; }
.switch { position: relative; width: 78px; height: 40px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface-2); cursor: pointer; display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; font-weight: 800; font-size: .76rem; color: var(--muted); }

  <script>
/* js/braille-data.js */
/*!
 * STUDY BRAILLE ALPHABET by Madina Saidmalikova
 * © 2026 Madina Saidmalikova. All rights reserved.
 *
 * braille-data.js — verified Braille tables.
 *
 * Standards used (see README.md, section "Стандарты"):
 *  - Russian: Russian Braille (ГОСТ Р 58511-2019 «Символы Брайля…», traditional
 *    Russian relief-dot script). Punctuation: Russian Braille.
 *  - English: Unified English Braille (UEB), Grade 1 (uncontracted).
 *  - Uzbek (Latin script): every letter uses the cell of its Cyrillic counterpart in
 *    Uzbek Braille, as in the liblouis table uz-g1.utb; the cells for Ў/Oʻ Қ/Q Ғ/Gʻ Ҳ/H
 *    also match UNESCO "World Braille Usage" (3rd ed., 2013). Punctuation follows Russian.
 *  - Digits: number sign ⠼ (dots 3-4-5-6) + letters a–j (identical in all three).
 *
 * A cell is an array of dot numbers (1..6). A symbol may have several cells.
 */
'use strict';

const Braille = (() => {
  /** "12-345" → [[1,2],[3,4,5]] */
  const parse = (s) => s.split('-').map((c) => c.split('').map(Number).sort((a, b) => a - b));

  // ---------- Russian (33 letters) ----------
  const RU = [
    ['А', '1', 'a'], ['Б', '12', 'b'], ['В', '2456', 'v'], ['Г', '1245', 'g'], ['Д', '145', 'd'],
    ['Е', '15', 'e / ye'], ['Ё', '16', 'yo'], ['Ж', '245', 'zh'], ['З', '1356', 'z'], ['И', '24', 'i'],
    ['Й', '12346', 'y'], ['К', '13', 'k'], ['Л', '123', 'l'], ['М', '134', 'm'], ['Н', '1345', 'n'],
    ['О', '135', 'o'], ['П', '1234', 'p'], ['Р', '1235', 'r'], ['С', '234', 's'], ['Т', '2345', 't'],
    ['У', '136', 'u'], ['Ф', '124', 'f'], ['Х', '125', 'kh'], ['Ц', '14', 'ts'], ['Ч', '12345', 'ch'],
    ['Ш', '156', 'sh'], ['Щ', '1346', 'shch'], ['Ъ', '12356', '"'], ['Ы', '2346', 'y'], ['Ь', '23456', "'"],
    ['Э', '246', 'e'], ['Ю', '1256', 'yu'], ['Я', '1246', 'ya'],
  ];

  // ---------- English, UEB grade 1 (26 letters) ----------
  const EN = [
    ['A', '1'], ['B', '12'], ['C', '14'], ['D', '145'], ['E', '15'], ['F', '124'], ['G', '1245'],
    ['H', '125'], ['I', '24'], ['J', '245'], ['K', '13'], ['L', '123'], ['M', '134'], ['N', '1345'],
    ['O', '135'], ['P', '1234'], ['Q', '12345'], ['R', '1235'], ['S', '234'], ['T', '2345'],
    ['U', '136'], ['V', '1236'], ['W', '2456'], ['X', '1346'], ['Y', '13456'], ['Z', '1356'],
  ];

  // ---------- Uzbek, Latin script (official alphabet) ----------
  // Same cells as the Cyrillic-based Uzbek Braille: each Latin letter uses the cell of its
  // Cyrillic counterpart (Oʻ = Ў, Gʻ = Ғ, Q = Қ, H = Ҳ, Sh = Ш, Ch = Ч, X = Х, Y = Й, J = Ж, V = В).
  // Verified against the liblouis table uz-g1.utb (BAUM Engineering, 2020–2021).
  // Third column: the Cyrillic equivalent. Ng is written as two cells: n + g.
  const UZ = [
    ['A', '1', 'А'], ['B', '12', 'Б'], ['D', '145', 'Д'], ['E', '15', 'Е / Э'], ['F', '124', 'Ф'],
    ['G', '1245', 'Г'], ['H', '1456', 'Ҳ'], ['I', '24', 'И'], ['J', '245', 'Ж'], ['K', '13', 'К'],
    ['L', '123', 'Л'], ['M', '134', 'М'], ['N', '1345', 'Н'], ['O', '135', 'О'], ['P', '1234', 'П'],
    ['Q', '13456', 'Қ'], ['R', '1235', 'Р'], ['S', '234', 'С'], ['T', '2345', 'Т'], ['U', '136', 'У'],
    ['V', '2456', 'В'], ['X', '125', 'Х'], ['Y', '12346', 'Й'], ['Z', '1356', 'З'],
    ['Oʻ', '1236', 'Ў'], ['Gʻ', '12456', 'Ғ'], ['Sh', '156', 'Ш'], ['Ch', '12345', 'Ч'], ['Ng', '1345-1245', 'НГ'],
  ];
  /** Uzbek-specific letters (highlighted in lessons). */
  const UZ_SPECIAL = ['Oʻ', 'Gʻ', 'Q', 'H', 'Sh', 'Ch', 'Ng'];

  // ---------- Digits: ⠼ + a..j ----------
  const NUM = [['1', '1'], ['2', '12'], ['3', '14'], ['4', '145'], ['5', '15'], ['6', '124'],
    ['7', '1245'], ['8', '125'], ['9', '24'], ['0', '245']];

  // ---------- Punctuation: Russian / Uzbek standard (used in quizzes) ----------
  const PUNCT = [
    [',', '2', 'comma'], ['.', '256', 'period'], ['?', '26', 'question'], ['!', '235', 'exclam'],
    [':', '25', 'colon'], [';', '23', 'semicolon'], ['-', '36', 'dash'],
    ['«', '236', 'quoteOpen'], ['»', '356', 'quoteClose'], ['(', '126', 'parenOpen'], [')', '345', 'parenClose'],
  ];

  // ---------- Punctuation: UEB (reference only; "?" and "“" share ⠦) ----------
  const PUNCT_EN = [
    [',', '2', 'comma'], ['.', '256', 'period'], ['?', '236', 'question'], ['!', '235', 'exclam'],
    [':', '25', 'colon'], [';', '23', 'semicolon'], ['-', '36', 'hyphen'], ['—', '6-36', 'dash'],
    ["'", '3', 'apostrophe'], ['“', '236', 'quoteOpen'], ['”', '356', 'quoteClose'],
    ['(', '5-126', 'parenOpen'], [')', '5-345', 'parenClose'],
  ];

  // ---------- Special indicators ----------
  const SPECIAL = [
    ['#', '3456', 'numSign'], ['RU ⇧', '46', 'capRu'], ['EN ⇧', '6', 'capEn'], ['UZ ⇧', '6', 'capUz'],
  ];

  /** Symbol factory. id = "<set>:<char>" is used as a stable storage key. */
  const make = (set, rows, opts = {}) => rows.map(([ch, dots, extra]) => ({
    id: `${set}:${ch}`,
    set,
    ch,
    cells: opts.prefix ? [opts.prefix, ...parse(dots)] : parse(dots),
    latin: set === 'ru' ? extra : undefined,
    cyr: set === 'uz' ? extra : undefined,
    name: set.startsWith('punct') || set === 'special' ? extra : undefined,
    special: set === 'uz' && UZ_SPECIAL.includes(ch),
  }));

  const sets = {
    ru: make('ru', RU),
    en: make('en', EN),
    uz: make('uz', UZ),
    num: make('num', NUM, { prefix: [3, 4, 5, 6] }),
    punct: make('punct', PUNCT),
    punctEn: make('punctEn', PUNCT_EN),
    special: make('special', SPECIAL),
  };

  /** Language code for speech synthesis per set. */
  const speechLang = { ru: 'ru-RU', en: 'en-US', uz: 'uz-UZ', num: null, punct: null };

  /** Simple words per alphabet for reading practice. */
  const WORDS = {
    ru: ['МАМА', 'ДОМ', 'МИР', 'МОЛОКО', 'КОТ', 'СОН', 'ЛЕС', 'РЫБА', 'КНИГА', 'ШКОЛА', 'ЖУК', 'ЧАЙ', 'ЮЛА', 'ЁЖ', 'ЯБЛОКО', 'ДРУГ', 'ЦВЕТ', 'ЩИ', 'ЭХО', 'ФЛАГ'],
    en: ['CAT', 'DOG', 'SUN', 'BOOK', 'MOM', 'HOME', 'TREE', 'FISH', 'STAR', 'MILK', 'HAND', 'BLUE', 'JAZZ', 'QUIZ', 'WAVE', 'BOX'],
    uz: ['ONA', 'OTA', 'KITOB', 'QIZ', 'OʻQISH', 'GʻOZ', 'HAVO', 'DOʻST', 'UY', 'NON', 'SUV', 'OY', 'BOLA', 'QOʻL', 'TOGʻ', 'HAYOT', 'SHAHAR', 'CHOY', 'TONG', 'MAKTAB'],
  };

  const all = () => [...sets.ru, ...sets.en, ...sets.uz, ...sets.num, ...sets.punct];
  const byId = new Map();
  Object.values(sets).forEach((list) => list.forEach((s) => byId.set(s.id, s)));

  /** Dots → Unicode braille character (U+2800 block). */
  const toUnicode = (cell) => String.fromCharCode(0x2800 + cell.reduce((m, d) => m | (1 << (d - 1)), 0));
  const cellsToUnicode = (cells) => cells.map(toUnicode).join('');
  const key = (cell) => [...cell].sort((a, b) => a - b).join('');
  const sameCell = (a, b) => key(a) === key(b);

  /** All single-cell symbols (letters / punctuation) matching the given dots. */
  const findByCell = (dots) => {
    const k = key(dots);
    if (!k) return [];
    return [...sets.ru, ...sets.en, ...sets.uz, ...sets.punct, ...sets.special]
      .filter((s) => s.cells.length === 1 && key(s.cells[0]) === k);
  };

  /** Split a word into letters; Uzbek Latin digraphs Oʻ Gʻ Sh Ch count as one letter. */
  const letters = (word, set) => (set === 'uz' ? word.toUpperCase().match(/Oʻ|Gʻ|SH|CH|[\s\S]/gu) : [...word]);
  const uzByUpper = new Map(sets.uz.map((s) => [s.ch.toUpperCase(), s]));

  /** Letters of a word → cells (within one alphabet). */
  const wordCells = (word, set) => letters(word, set).flatMap((ch) => {
    const s = set === 'uz' ? uzByUpper.get(ch) : byId.get(`${set}:${ch}`);
    if (!s) throw new Error(`No braille for ${ch} in ${set}`);
    return s.cells;
  });
  /** Symbol ids of the letters of a word (for progress tracking). */
  const wordIds = (word, set) => letters(word, set).map((ch) => (set === 'uz' ? uzByUpper.get(ch) : byId.get(`${set}:${ch}`))).filter(Boolean).map((s) => s.id);

  /** Quiz pools by name. "all" mixes letters, digits and punctuation. */
  const pool = (name) => {
    if (name === 'all') return all();
    if (name === 'letters') return [...sets.ru, ...sets.en, ...sets.uz];
    return sets[name] || sets.ru;
  };

  /** Patterns that are NOT valid in a set (used to build plausible wrong answers). */
  const allPatterns = () => {
    const out = [];
    for (let m = 1; m < 64; m++) out.push([1, 2, 3, 4, 5, 6].filter((d) => m & (1 << (d - 1))));
    return out;
  };

  return { sets, WORDS, UZ_SPECIAL, speechLang, byId, toUnicode, cellsToUnicode, key, sameCell, findByCell, wordCells, wordIds, pool, allPatterns };
})();

const I18n = (() => {

  const get = (obj, path) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);

  /** t('home.dailyDone', {n: 3}) → string with placeholders filled. Falls back to Russian, then the key. */
  const t = (key, vars) => {
    let v = get(I18N_DATA[lang], key);
    if (v === undefined) v = get(I18N_DATA.ru, key);
    if (v === undefined) { console.warn('[i18n] missing', key); return key; }
    if (typeof v === 'string' && vars) v = v.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
    return v;
  };

  /** Plural helper for "dot/dots" words (Russian rules; others use one/many). */
  const plural = (n, forms) => {
    if (lang !== 'ru') return n === 1 ? forms[0] : forms[1];
    const m10 = n % 10; const m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return forms[0];
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return forms[1];
    return forms[2];
  };

  return {
    t, plural,
    get lang() { return lang; },
    set(l) { if (I18N_DATA[l]) { lang = l; document.documentElement.lang = l; } },
    langs: [['ru', '🇷🇺', 'Русский'], ['uz', '🇺🇿', 'Oʻzbekcha'], ['en', '🇬🇧', 'English']],

  <script>
/* js/store.js */
/*!
 * STUDY BRAILLE ALPHABET by Madina Saidmalikova
 * © 2026 Madina Saidmalikova. All rights reserved.
 *
 * store.js — persistent state (localStorage), XP/levels, achievements, adaptive review.
 * All data stays on the device. Loaded data is validated and merged with defaults,
 * so a corrupted or tampered value can never break the app.
 */
'use strict';

const Store = (() => {
  const KEY = 'sba.state.v1';

  const defaults = () => ({
    v: 1,
    lang: 'ru',
    theme: (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light',
    sound: true,
    reduceMotion: !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches),
    fontScale: 0, // index: 0 normal, 1 large, 2 extra large
    hints: true,
    difficulty: 'normal',
    practiceSet: 'ru',
    onboarded: false,
    userName: '',
    xp: 0,
    correct: 0,
    wrong: 0,
    streak: 0,
    bestStreak: 0,
    bestSpeed: 0,
    learned: {},     // symbolId → number of correct answers
    errors: {},      // symbolId → current error weight (decays on correct answers)
    lessonsDone: [], // lesson numbers
    gamesPlayed: {}, // gameId → times completed
    gameBest: {},    // gameId → best score
    written: {},     // symbolId → true (built in "Try writing")
    exams: [],       // { date, name, score, correct, total, cert? }
    achievements: {},// achId → ISO date
    daily: { date: '', done: 0, streak: 0, last: '' },
    timeSpent: 0,    // seconds
    lastResult: null,// { label, correct, total, date }
  });

  // ----- validation helpers -----
  const isObj = (o) => o && typeof o === 'object' && !Array.isArray(o);
  const numMap = (o) => {
    const out = {};
    if (isObj(o)) Object.keys(o).forEach((k) => { const n = Number(o[k]); if (Number.isFinite(n) && n >= 0 && k.length < 40) out[k] = n; });
    return out;
  };

  /** Merge loaded JSON onto defaults, keeping only fields of the expected type. */
  function sanitize(raw) {
    const d = defaults();
    if (!isObj(raw)) return d;
    Object.keys(d).forEach((k) => {
      const dv = d[k]; const rv = raw[k];
      if (rv === undefined) return;
      if (typeof dv === 'number') { if (Number.isFinite(rv) && rv >= 0) d[k] = rv; }
      else if (typeof dv === 'boolean') { if (typeof rv === 'boolean') d[k] = rv; }
      else if (typeof dv === 'string') { if (typeof rv === 'string') d[k] = rv.slice(0, 80); }
      else if (Array.isArray(dv)) { if (Array.isArray(rv)) d[k] = rv.slice(0, 200); }
      else if (isObj(dv) && isObj(rv)) d[k] = rv;
      else if (dv === null && isObj(rv)) d[k] = rv;
    });
    ['learned', 'errors', 'gamesPlayed', 'gameBest'].forEach((k) => { d[k] = numMap(d[k]); });
    if (!['ru', 'uz', 'en'].includes(d.lang)) d.lang = 'ru';
    if (!['light', 'dark'].includes(d.theme)) d.theme = 'light';
    if (!['easy', 'normal', 'hard', 'expert'].includes(d.difficulty)) d.difficulty = 'normal';
    if (!['ru', 'en', 'uz', 'num', 'punct', 'letters'].includes(d.practiceSet)) d.practiceSet = 'ru';
    d.written = isObj(d.written) ? d.written : {};
    d.fontScale = Math.min(2, Math.floor(d.fontScale));
    d.lessonsDone = d.lessonsDone.filter((n) => Number.isInteger(n) && n >= 1 && n <= 7);
    d.exams = d.exams.filter((e) => isObj(e) && Number.isFinite(e.score)).map((e) => ({
      date: String(e.date || ''), name: String(e.name || '').slice(0, 60), score: e.score,
      correct: Number(e.correct) || 0, total: Number(e.total) || 20, cert: typeof e.cert === 'string' ? e.cert.slice(0, 20) : undefined,
    }));
    if (!isObj(d.daily)) d.daily = defaults().daily;
    return d;
  }

  let s = defaults();
  function load() {
    try { s = sanitize(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { s = defaults(); }
    return s;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* storage full or blocked: keep working in memory */ }
  }
  /** Reset learning progress but keep interface preferences. */
  function reset() {
    const keep = { lang: s.lang, theme: s.theme, sound: s.sound, reduceMotion: s.reduceMotion, fontScale: s.fontScale, hints: s.hints, onboarded: true };
    s = Object.assign(defaults(), keep);
    save();
  }

  // ---------------- Levels & XP ----------------
  const LEVELS = [0, 150, 400, 900, 1800];
  const levelIndex = (xp = s.xp) => LEVELS.reduce((idx, min, i) => (xp >= min ? i : idx), 0);
  const levelInfo = () => {
    const i = levelIndex();
    const next = LEVELS[i + 1];
    return { index: i, name: t('levels')[i], next, nextName: next ? t('levels')[i + 1] : null,
      pct: next ? Math.round(((s.xp - LEVELS[i]) / (next - LEVELS[i])) * 100) : 100, toNext: next ? next - s.xp : 0 };
  };

  /** Listeners for UI (toasts). Set by app.js. */
  const events = { onAchievement: () => {}, onLevelUp: () => {} };

  function addXP(n) {
    const before = levelIndex();
    s.xp += n;
    const after = levelIndex();
    if (after > before) events.onLevelUp(t('levels')[after]);
  }

  // ---------------- Answers & adaptive review ----------------
  /** Record one answer for a symbol. Returns XP gained. */
  function recordAnswer(symId, ok) {
    let gained = 0;
    if (ok) {
      s.correct++; s.streak++;
      s.bestStreak = Math.max(s.bestStreak, s.streak);
      if (symId) {
        s.learned[symId] = (s.learned[symId] || 0) + 1;
        if (s.errors[symId]) { s.errors[symId] = Math.max(0, s.errors[symId] - 1); if (!s.errors[symId]) delete s.errors[symId]; }
      }
      gained = 5 + (s.streak >= 5 ? 2 : 0) + (s.streak > 0 && s.streak % 10 === 0 ? 10 : 0);
      addXP(gained);
    } else {
      s.wrong++; s.streak = 0;
      if (symId) s.errors[symId] = Math.min(6, (s.errors[symId] || 0) + 2);
    }

  const reviewList = (limit = 8) => Object.entries(s.errors)
    .filter(([id, w]) => w > 0 && Braille.byId.has(id))
    .sort((a, b) => b[1] - a[1]).slice(0, limit).map(([id]) => Braille.byId.get(id));

  function completeLesson(n) {
    if (s.lessonsDone.includes(n)) return 0;
    s.lessonsDone.push(n);

  }

  const dailyStreak = () => ([today(), yesterday()].includes(s.daily.last) ? s.daily.streak : 0);

    const td = today();
    const already = s.daily.date === td && s.daily.done >= 10;
    s.daily.done = Math.max(s.daily.date === td ? s.daily.done : 0, done);
    s.daily.date = td;

  function recordExam(r) {
    s.exams.unshift(r);
    s.exams = s.exams.slice(0, 30);
    if (r.name) s.userName = r.name;
    if (r.score === 100) { addXP(100); unlock('exam'); }
    checkAchievements(); save();
  }
  const passedExam = () => s.exams.find((e) => e.score === 100 && e.cert);

  // ---------------- Achievements ----------------
  const ACH = [
    ['first10', 'star'], ['correct25', 'check'], ['correct100', 'target'], ['noErrors', 'sparkle'], ['streak10', 'flame'],
    ['digits', 'hash'], ['punct', 'quote'], ['ru', 'txt:RU'], ['en', 'txt:EN'], ['uz', 'txt:UZ'], ['lessons', 'book'],
    ['firstGame', 'gamepad'], ['allGames', 'layers'], ['perfect', 'trophy'], ['daily3', 'calendar'], ['daily7', 'calendar'],
    ['daily30', 'calendar'], ['writer', 'pen'], ['exam', 'cap'],
  ];
  function unlock(id) {
    if (s.achievements[id]) return;
    s.achievements[id] = new Date().toISOString();
    events.onAchievement(t(`ach.list.${id}`)[0]);
  }
  function checkAchievements() {
    const all = (set) => Braille.sets[set].every((x) => s.learned[x.id]);
    if (learnedCount() >= 10) unlock('first10');
    if (s.correct >= 25) unlock('correct25');
    if (s.correct >= 100) unlock('correct100');
    if (s.bestStreak >= 10) unlock('streak10');
    ['ru', 'en', 'uz'].forEach((k) => { if (all(k)) unlock(k); });
    if (all('num')) unlock('digits');
    if (all('punct')) unlock('punct');
    if (s.lessonsDone.length >= 7) unlock('lessons');
    const games = Object.keys(s.gamesPlayed);
    if (games.length >= 1) unlock('firstGame');
    if (['guess', 'build', 'memory', 'fast', 'error', 'challenge'].every((g) => s.gamesPlayed[g])) unlock('allGames');
    const ds = dailyStreak();
    if (ds >= 3) unlock('daily3');
    if (ds >= 7) unlock('daily7');
    if (ds >= 30) unlock('daily30');

  function overallProgress() {

    const p = (s.lessonsDone.length / 7) * 40 + (Math.min(learnedCount(), total) / total) * 40 + (passedExam() ? 20 : 0);
    return Math.round(p);

    get s() { return s; }, load, save, reset, events, LEVELS, levelInfo, addXP, recordAnswer, reviewList, weightOf,
    learnedCount, setLearned, completeLesson, completeGame, endSession, today, dailyDoneToday, dailyStreak, recordDaily,

  };
})();

  function helpBtn(key) {
    if (!Store.s.hints) return null;
    const data = t(`help.${key}`);
    return h('button', {
      type: 'button', class: 'help-btn', title: data.t, 'aria-label': `${t('c.help')}: ${data.t}`,
      onclick: (e) => { e.stopPropagation(); modal({ title: data.t, body: h('p', null, data.b), actions: [{ label: t('c.close'), primary: true }] }); },
    }, Icon('help', { size: 18 }));
  }

  // ---------------- Speech (browser speech synthesis, offline when the OS has voices) ----------------
  const canSpeak = () => 'speechSynthesis' in window;
  function speak(text, lang) {
    if (!Store.s.sound || !canSpeak() || !text) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const want = lang || { ru: 'ru-RU', uz: 'uz-UZ', en: 'en-US' }[I18n.lang];
      const voices = speechSynthesis.getVoices();
      const v = voices.find((x) => x.lang && x.lang.toLowerCase().startsWith(want.slice(0, 2).toLowerCase()))
        || (want.startsWith('uz') && voices.find((x) => x.lang && x.lang.startsWith('ru')));
      u.lang = v ? v.lang : want;
      if (v) u.voice = v;
      u.rate = 0.9;
      speechSynthesis.speak(u);
    } catch (e) { /* speech is optional */ }
  }
  /** Speak a Braille symbol in the language of its alphabet. */
  function speakSymbol(sym) {
    const lang = sym.set === 'en' ? 'en-US' : sym.set === 'uz' ? 'uz-UZ' : sym.set === 'ru' ? 'ru-RU' : null;
    const text = sym.name ? t(`punctNames.${sym.name}`) : sym.ch.toLowerCase();
    speak(text, lang || undefined);
  }
  const speakBtn = (getText, lang, labelKey = 'c.listen') => (canSpeak() ? h('button', {
    type: 'button', class: 'icon-btn', title: t(labelKey), 'aria-label': t(labelKey),
    onclick: () => { const v = getText(); typeof v === 'string' ? speak(v, lang) : speakSymbol(v); },
  }, Icon('volume')) : null);

  // ---------------- Sound cues (WebAudio, generated locally) ----------------
  let ctx = null;
  function sfx(type) {
    if (!Store.s.sound) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); const g = ctx.createGain();
      const now = ctx.currentTime;
      const conf = { ok: [660, 880, 0.18], bad: [220, 160, 0.22], tick: [520, 520, 0.04], win: [523, 1046, 0.4] }[type] || [440, 440, 0.1];
      o.frequency.setValueAtTime(conf[0], now);
      o.frequency.linearRampToValueAtTime(conf[1], now + conf[2]);
      g.gain.setValueAtTime(type === 'tick' ? 0.04 : 0.09, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + conf[2] + 0.05);
      o.connect(g).connect(ctx.destination); o.start(now); o.stop(now + conf[2] + 0.06);
    } catch (e) { /* audio is optional */ }
  }

  // ---------------- Random helpers ----------------
  const rnd = (n) => {
    if (window.crypto && crypto.getRandomValues) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
    return Math.floor(Math.random() * n);
  };
  const shuffle = (arr) => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = (arr) => arr[rnd(arr.length)];
  /** Weighted pick using Store.weightOf (adaptive repetition). */
  function weightedPick(arr, exclude) {
    const pool = arr.filter((x) => !exclude || !exclude.has(x.id));
    const list = pool.length ? pool : arr;
    const ws = list.map((x) => Store.weightOf(x.id));
    let r = Math.random() * ws.reduce((a, b) => a + b, 0);
    for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) return list[i]; }
    return list[list.length - 1];
  }
  const fmtTime = (sec) => `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
  const praise = () => pick(t('praise'));
  /** Icon + text, for buttons and headings. */
  const ic = (name, text, size = 18) => h('span', { class: 'ic' }, Icon(name, { size }), text !== undefined ? h('span', null, text) : null);

  /** Progress bar with text value (not color-only). */
  const progress = (pct, labelText) => h('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': pct, 'aria-label': labelText || `${pct}%` },
    h('div', { class: 'progress-fill', style: { width: `${Math.max(0, Math.min(100, pct))}%` } }));

  /** Section header with optional ❓. */
  const pageHead = (title, sub, helpKey) => h('header', { class: 'page-head' },
    h('h1', { tabindex: '-1', id: 'page-title' }, title, helpKey ? helpBtn(helpKey) : null),
    sub ? h('p', { class: 'lead' }, sub) : null);

  return { ic, h, cells, editor, dotsText, dotsSpeech, label, shortLabel, toast, modal, confirmDialog, helpBtn, speak, speakSymbol, speakBtn, canSpeak, sfx, rnd, shuffle, pick, weightedPick, fmtTime, praise, progress, pageHead };
})();
const h = UI.h;
