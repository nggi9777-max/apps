  <script>
/* js/practice.js */
/*!
 * STUDY BRAILLE ALPHABET by Madina Saidmalikova
 * © 2026 Madina Saidmalikova. All rights reserved.
 *
 * practice.js — the shared Quiz engine (used by practice, lessons, games, daily task,
 * Quick Learn, Perfect Streak and the exam) plus the Practice and "Try writing" screens.
 *
 * Question types:
 *   build      letter → raise dots in the editor
 *   recognize  Braille → choose the symbol (4 options)
 *   word       Braille word → choose the word (4 options)
 *   number     Braille number (⠼ + digits) → choose the number
 *   tf         letter + combination → "correct" or "mistake"
 */
'use strict';

const Quiz = (() => {
  const { cells, shuffle, pick, weightedPick, rnd } = UI;

  // ------------------------------------------------------------------ generators
  const singleCell = (pool) => pool.filter((s) => s.cells.length === 1);

  /** 3 distractors from the same set with different patterns and labels. */
  function distractors(sym, n = 3) {
    const same = Braille.sets[sym.set].filter((x) => x.id !== sym.id && Braille.cellsToUnicode(x.cells) !== Braille.cellsToUnicode(sym.cells) && x.ch !== sym.ch);
    // prefer visually similar symbols (share dots) to make the task meaningful
    const scored = shuffle(same).sort((a, b) => overlap(b, sym) - overlap(a, sym));
    return shuffle([...scored.slice(0, 5)]).slice(0, n);
  }
  const overlap = (a, b) => a.cells[a.cells.length - 1].filter((d) => b.cells[b.cells.length - 1].includes(d)).length;

  function genNumber() {
    const len = 1 + rnd(3);
    let n = String(1 + rnd(9)); while (n.length < len) n += String(rnd(10));
    const opts = new Set([n]);
    while (opts.size < 4) {
      const arr = n.split(''); const i = rnd(arr.length); arr[i] = String((Number(arr[i]) + 1 + rnd(8)) % 10);
      if (arr[0] !== '0') opts.add(arr.join(''));
    }
    const cellsList = [[3, 4, 5, 6], ...n.split('').map((d) => Braille.byId.get(`num:${d}`).cells[1])];
    return { type: 'number', answer: n, cells: cellsList, options: shuffle([...opts]), topic: 'num', id: null };
  }

  function genWord(set) {
    const s = set || pick(['ru', 'en', 'uz']);
    const list = Braille.WORDS[s];
    const w = pick(list);
    const others = shuffle(list.filter((x) => x !== w)).sort((a, b) => Math.abs(a.length - w.length) - Math.abs(b.length - w.length)).slice(0, 3);
    return { type: 'word', set: s, answer: w, cells: Braille.wordCells(w, s), options: shuffle([w, ...others]), topic: 'words', id: null };
  }

  /** Build one question of the given type from the pool (adaptive weighting). */
  function make(type, cfg, recent) {
    const ex = new Set(recent);
    if (type === 'number') return genNumber();
    if (type === 'word') return genWord(cfg.wordsSet);
    if (type === 'build' || type === 'tf') {
      const sym = weightedPick(singleCell(cfg.pool).filter((x) => x.set !== 'special'), ex);
      if (type === 'build') return { type, sym, id: sym.id, topic: sym.set };
      const right = Math.random() < 0.5;
      let shown = sym.cells[0];
      if (!right) {
        const alt = pick(distractors(sym, 3).filter((x) => x.cells.length === 1));
        shown = alt ? alt.cells[0] : flipDot(sym.cells[0]);
      }
      return { type, sym, id: sym.id, shown, right, topic: sym.set };
    }
    // recognize
    const sym = weightedPick(cfg.pool.filter((x) => x.set !== 'special'), ex);
    return { type: 'recognize', sym, id: sym.id, options: shuffle([sym, ...distractors(sym)]), topic: sym.set };
  }
  const flipDot = (c) => { const d = 1 + rnd(6); const s = new Set(c); s.has(d) && s.size > 1 ? s.delete(d) : s.add(d); return [...s].sort(); };

  // ------------------------------------------------------------------ engine
  /**
   * Run a quiz inside `root`.
   * cfg: { title, label, pool, types[], wordsSet, total, timeLimit, perQuestion, retry, numbers,
   *        streakTarget, exam, questions[], onFinish(res), backHref }
   */
  function run(root, cfg) {
    const st = {
      i: 0, correct: 0, wrong: 0, xp: 0, inARow: 0, start: Date.now(), q: null, done: false,
      timeLeft: cfg.timeLimit || null, qLeft: null, missed: new Map(), log: [],
    };
    const recent = [];
    let timer = null; let nextTimer = null; let ed = null; let hintEl = null;

    App.onLeave(stop);

    function stop() { clearInterval(timer); clearTimeout(nextTimer); ed && ed.destroy(); App.relang = null; }

    function nextQuestion() {
      clearTimeout(nextTimer);
      if (cfg.total && st.i >= cfg.total) return finish();
      st.q = cfg.questions ? cfg.questions[st.i] : make(pick(cfg.types), cfg, recent);
      st.q.attempts = 0; st.q.failed = false; st.q.answered = false;
      if (st.q.id) { recent.push(st.q.id); if (recent.length > 4) recent.shift(); }
      st.qLeft = cfg.perQuestion || null;
      draw(true);
    }

    // timers: global countdown + per-question countdown
    if (cfg.timeLimit || cfg.perQuestion || cfg.exam) {
      timer = setInterval(() => {
        if (st.done) return;
        if (st.timeLeft !== null) {
          st.timeLeft--;
          const el = root.querySelector('[data-timer]'); if (el) el.textContent = UI.fmtTime(Math.max(0, st.timeLeft));
          if (st.timeLeft <= 0) { UI.toast(cfg.exam ? t('exam.timeout') : t('practice.timeUp'), 'warn'); return finish(); }
        }
        if (st.qLeft !== null && st.q && !st.q.answered) {
          st.qLeft--;
          const qt = root.querySelector('[data-qtimer]');
          if (qt) { qt.style.width = `${(st.qLeft / cfg.perQuestion) * 100}%`; qt.parentElement.setAttribute('aria-valuenow', st.qLeft); }
          if (st.qLeft <= 0) resolve(false, true);
        }
      }, 1000);
    }

    // ---------------- rendering ----------------
    function header() {
      const total = cfg.total;
      const bits = [];
      if (cfg.streakTarget) bits.push(h('span', { class: 'chip' }, t('practice.inARow', { n: st.inARow, total: cfg.streakTarget })));
      else if (total) bits.push(h('span', { class: 'chip' }, `${t('c.question')} ${Math.min(st.i + 1, total)} ${t('c.of')} ${total}`));
      if (st.timeLeft !== null) bits.push(h('span', { class: 'chip timer', 'aria-label': t('exam.timeLeft') }, Icon('clock', { size: 15 }), h('span', { 'data-timer': '' }, UI.fmtTime(st.timeLeft))));
      if (!cfg.exam) {
        bits.push(h('span', { class: 'chip ok' }, Icon('check', { size: 15 }), st.correct));
        bits.push(h('span', { class: 'chip bad' }, Icon('x', { size: 15 }), st.wrong));
        if (Store.s.streak >= 3) bits.push(h('span', { class: 'chip streak' }, Icon('flame', { size: 15 }), Store.s.streak));
      }
      return h('div', { class: 'quiz-head' },
        h('div', { class: 'quiz-title' }, h('h2', null, typeof cfg.title === 'function' ? cfg.title() : cfg.title)),
        h('div', { class: 'quiz-chips' }, bits),
        total ? UI.progress(Math.round((st.i / total) * 100), `${st.i}/${total}`) : null);
    }

    function setBadge(set) {
      return set ? h('span', { class: `badge set-${set}` }, t(`sets.${set}`)) : null;
    }

    function draw(fresh) {
      if (st.done) return;
      App.relang = () => draw(false);
      const keep = ed ? ed.value : [];
      ed && ed.destroy(); ed = null;
      const q = st.q;
      const body = h('div', { class: 'quiz-body' });
      hintEl = h('div', { class: 'feedback', role: 'status', 'aria-live': 'polite' });

      if (q.type === 'build') {
        body.append(
          h('p', { class: 'prompt' }, t('practice.promptBuild'), ' ', setBadge(q.sym.set)),
          h('div', { class: 'target' }, h('span', { class: 'big-letter', lang: q.sym.set === 'en' ? 'en' : null }, UI.shortLabel(q.sym)), UI.speakBtn(() => q.sym)),
        );
        ed = UI.editor({ onSubmit: (v) => submitBuild(v) });
        if (!fresh) ed.set(keep);
        body.append(h('div', { class: 'editor-wrap' }, ed.el),
          h('p', { class: 'muted small' }, t('c.keyboardHint')),
          h('div', { class: 'row center' },
            h('button', { type: 'button', class: 'btn ghost', onclick: () => ed.clear() }, t('c.clear')),
            cfg.numbers ? h('button', { type: 'button', class: 'btn ghost', onclick: () => showHint(1) }, UI.ic('bulb', t('c.hint'))) : null,
            h('button', { type: 'button', class: 'btn primary', 'data-check': '', onclick: () => submitBuild(ed.value) }, t('c.check'))));
      } else if (q.type === 'tf') {
        body.append(
          h('p', { class: 'prompt' }, t('practice.promptTF'), ' ', setBadge(q.sym.set)),
          h('div', { class: 'target tf' }, h('span', { class: 'big-letter' }, UI.shortLabel(q.sym)), h('span', { class: 'eq' }, '='), cells([q.shown], { size: 'lg', numbers: cfg.numbers })),
          h('div', { class: 'options two' },
            optBtn(`✓ ${t('practice.isCorrect')}`, () => answerTF(true), 'tf-yes'),
            optBtn(`✗ ${t('practice.isWrong')}`, () => answerTF(false), 'tf-no')));
      } else {
        const isRec = q.type === 'recognize';
        const prompt = isRec ? t('practice.promptRecognize') : q.type === 'word' ? t('practice.promptWord') : t('exam.qNum');
        const shown = isRec ? q.sym.cells : q.cells;
        body.append(
          h('p', { class: 'prompt' }, prompt, ' ', setBadge(isRec ? q.sym.set : q.set)),
          h('div', { class: 'target' }, cells(shown, { size: shown.length > 3 ? 'md' : 'lg', numbers: cfg.numbers })),
          h('div', { class: `options${q.type === 'word' ? ' words' : ''}` }, q.options.map((o, idx) => {
            const text = isRec ? UI.shortLabel(o) : o;
            return optBtn(text, (btn) => answerChoice(isRec ? o.id === q.sym.id : o === q.answer, btn), `opt${idx}`, isRec ? o.id : o);
          })));
      }
      if (cfg.perQuestion && !q.answered) {
        body.prepend(h('div', { class: 'qtimer', role: 'progressbar', 'aria-label': t('c.time'), 'aria-valuemin': 0, 'aria-valuemax': cfg.perQuestion, 'aria-valuenow': st.qLeft },
          h('div', { 'data-qtimer': '', style: { width: `${(st.qLeft / cfg.perQuestion) * 100}%` } })));
      }
      if (st.q.id && Store.s.errors[st.q.id] && !cfg.exam) body.prepend(h('span', { class: 'badge review' }, Icon('repeat', { size: 14 }), t('practice.reviewBadge')));
      body.append(hintEl);
      root.replaceChildren(header(), body);
      if (fresh) {
        const focusEl = root.querySelector('.editor .dot') || root.querySelector('.options button');
        focusEl && focusEl.focus({ preventScroll: true });
      }
    }

    function optBtn(text, fn, key, val) {
      const b = h('button', { type: 'button', class: 'opt', 'data-key': key, 'data-val': val, onclick: () => fn(b) }, text);
      return b;
    }

    // ---------------- answering ----------------
    function showHint(level) {
      const target = st.q.sym.cells[0];
      const words = t('hints.dotWords');
      if (level === 1) hintEl.textContent = t('hints.count', { n: target.length, word: I18n.plural(target.length, words) });
      else {
        const v = ed ? ed.value : [];
        const missing = target.filter((d) => !v.includes(d));
        const extra = v.filter((d) => !target.includes(d));
        const parts = [];
        if (extra.length) parts.push(t('hints.extra', { d: extra[0] }));
        if (missing.length) parts.push(t('hints.dotIs', { d: missing[0] }));
        hintEl.textContent = parts.join(' ');
      }
    }

    function submitBuild(v) {
      const q = st.q; if (q.answered) return;
      if (!v.length) { hintEl.textContent = t('write.empty'); return; }
      const ok = Braille.sameCell(v, q.sym.cells[0]);
      if (ok || !cfg.retry) { if (!cfg.exam) ed.flash(ok ? 'good' : 'bad'); return resolve(ok); }
      // wrong with retries: progressive hints, never reveal the answer right away
      q.attempts++; markFailed(); ed.flash('bad'); UI.sfx('bad');
      if (q.attempts >= 3) return resolve(false);
      hintEl.className = 'feedback bad';
      showHint(q.attempts === 1 ? 1 : 2);
      hintEl.textContent = `✗ ${t('c.tryAgain')}. ${hintEl.textContent}`;
    }

    function answerChoice(ok, btn) {
      const q = st.q; if (q.answered) return;
      if (ok || !cfg.retry) return resolve(ok, false, btn);
      q.attempts++; markFailed(); UI.sfx('bad');
      btn.disabled = true; btn.classList.add('wrong'); btn.prepend('✗ ');
      if (q.attempts >= 2) return resolve(false, false, btn);
      hintEl.className = 'feedback bad';
      hintEl.textContent = `✗ ${t('c.tryAgain')}`;
    }

    function answerTF(saidCorrect) { resolve(saidCorrect === st.q.right); }

    /** First mistake on a question is recorded immediately (counts once). */
    function markFailed() {
      const q = st.q; if (q.failed) return;
      q.failed = true; st.wrong++;
      Store.recordAnswer(q.id, false);
      if (q.id) st.missed.set(q.id, q.sym);
      if (cfg.streakTarget) { st.inARow = 0; }
    }

    function resolve(ok, timedOut = false, btn = null) {
      const q = st.q; if (q.answered) return;
      q.answered = true;
      const counted = ok && !q.failed;
      if (!ok) markFailed();
      else if (!q.failed) { st.correct++; st.xp += Store.recordAnswer(q.id, true); if (cfg.streakTarget) st.inARow++; }
      // numbers and words: credit the individual digits / letters as practiced
      if (counted && (q.type === 'number' || q.type === 'word')) {
        const ids = q.type === 'number' ? [...q.answer].map((d) => `num:${d}`) : Braille.wordIds(q.answer, q.set);
        ids.forEach((id) => { if (Braille.byId.has(id)) Store.s.learned[id] = (Store.s.learned[id] || 0) + 1; });
        Store.checkAchievements(); Store.save();
      }
      st.log.push({ q, ok: counted });
      st.i++;

      if (cfg.exam) { nextTimer = setTimeout(nextQuestion, 120); return; }

      UI.sfx(counted ? 'ok' : 'bad');
      // visual feedback with text + icon (never color only)
      root.querySelectorAll('.options button').forEach((b) => {
        b.disabled = true;
        const isRight = q.type === 'recognize' ? b.dataset.val === q.sym.id : q.type === 'tf' ? (b.dataset.key === 'tf-yes') === q.right : b.dataset.val === q.answer;
        if (isRight) { b.classList.add('right'); if (!b.textContent.startsWith('✓')) b.prepend('✓ '); }
      });
      if (btn && !counted && !btn.classList.contains('wrong')) { btn.classList.add('wrong'); btn.prepend('✗ '); }
      root.querySelectorAll('[data-check]').forEach((b) => { b.disabled = true; });
      if (q.type === 'build' && !counted && ed) { ed.set(q.sym.cells[0]); ed.flash('reveal'); }

      hintEl.className = `feedback ${counted ? 'good' : 'bad'}`;
      hintEl.replaceChildren();
      if (counted) {
        const streakMsg = Store.s.streak > 0 && Store.s.streak % 5 === 0 ? ` ${pick(t('streakPraise'))}` : '';
        hintEl.append(`✓ ${t('c.correct')} ${UI.praise()}${streakMsg}`);
      } else {
        hintEl.append(`✗ ${timedOut ? t('practice.timeUp') : t('c.wrong')}. `);
        hintEl.append(h('span', null, `${t('c.correctAnswer')}: `, h('b', null, answerText(q))));
        if (cfg.streakTarget) UI.toast(t('practice.perfectReset'), 'warn');
      }
      if (cfg.streakTarget && st.inARow >= cfg.streakTarget) { nextTimer = setTimeout(finish, 800); return; }
      if (st.timeLeft !== null && !cfg.retry) { nextTimer = setTimeout(nextQuestion, counted ? 450 : 1300); return; }
      if (counted) { nextTimer = setTimeout(nextQuestion, Store.s.reduceMotion ? 700 : 900); return; }
      const nb = h('button', { type: 'button', class: 'btn primary', onclick: nextQuestion }, t('c.next'));
      hintEl.append(h('div', { class: 'row center' }, nb));
      nb.focus();
    }

    function answerText(q) {
      if (q.type === 'build') return `${UI.dotsText(q.sym.cells)} ${Braille.cellsToUnicode(q.sym.cells)}`;
      if (q.type === 'tf') return q.right ? t('practice.tfRight') : t('practice.tfWrongWas', { ch: q.sym.ch, dots: `${UI.dotsText(q.sym.cells)} ${Braille.cellsToUnicode(q.sym.cells)}` });
      if (q.type === 'recognize') return UI.shortLabel(q.sym);
      return q.answer;
    }

    function finish() {
      if (st.done) return;
      st.done = true; stop();
      const res = {
        correct: st.correct, wrong: st.wrong, answered: st.log.length, total: cfg.total || st.log.length,
        timeSec: Math.round((Date.now() - st.start) / 1000), xp: st.xp, missed: [...st.missed.values()].filter(Boolean),
        log: st.log, perfectWin: !!(cfg.streakTarget && st.inARow >= cfg.streakTarget),
      };
      if (!cfg.exam) Store.endSession({ label: cfg.label || (typeof cfg.title === 'function' ? cfg.title() : cfg.title), correct: res.correct, total: res.answered, speedScore: cfg.timeLimit ? res.correct : 0 });
      (cfg.onFinish || ((r) => results(root, r, cfg)))(res);
    }

    nextQuestion();
    return { stop };
  }

  /** Default results screen. */
  function results(root, r, cfg, extra) {
    App.relang = () => results(root, r, cfg, extra);
    const acc = r.answered ? Math.round((r.correct / r.answered) * 100) : 0;
    root.replaceChildren(h('section', { class: 'card results', 'aria-labelledby': 'res-h' },
      h('h2', { id: 'res-h', tabindex: '-1' }, r.perfectWin ? t('practice.perfectWin') : t('practice.sessionDone')),
      r.answered >= 5 && r.correct === r.answered ? h('p', { class: 'success-msg' }, t('results.perfect')) : null,
      extra || null,
      h('div', { class: 'stat-grid' },
        stat(t('results.correct'), r.correct, 'check'), stat(t('results.wrong'), r.wrong, 'x'),
        stat(t('results.accuracy'), `${acc}%`, 'percent'), stat(t('results.time'), UI.fmtTime(r.timeSec), 'clock'),
        stat(t('results.xpGained'), `+${r.xp}`, 'star')),
      r.missed.length ? h('div', { class: 'review-box' }, h('h3', null, UI.ic('repeat', t('results.review'))),
        h('div', { class: 'mini-list' }, r.missed.map((s) => miniSymbol(s)))) : null,
      h('div', { class: 'row center' },
        h('button', { type: 'button', class: 'btn primary', onclick: () => run(root, cfg) }, UI.ic('refresh', t('results.again'))),
        h('a', { class: 'btn ghost', href: cfg.backHref || '#/practice' }, t('c.toMenu')))));
    root.querySelector('h2').focus();
  }
  const stat = (label, value, icon) => h('div', { class: 'stat' }, h('span', { class: 'stat-icon' }, Icon(icon, { size: 18 })), h('span', { class: 'stat-value' }, value), h('span', { class: 'stat-label' }, label));
  const miniSymbol = (s) => h('div', { class: 'mini' }, UI.cells(s.cells, { size: 'sm' }), h('span', null, UI.shortLabel(s)));

  return { run, results, make, stat, miniSymbol, genWord, genNumber };
})();

/* ====================================================================== Practice screens */
const Practice = (() => {
  const SETS = ['ru', 'en', 'uz', 'num', 'punct', 'letters'];
  const LEVELS = ['easy', 'normal', 'hard', 'expert'];
  const MODES = ['build', 'recognize', 'mixed', 'words', 'speed'];

  /** Choose a pool for a set/level. Easy = mostly familiar symbols. */
  function poolFor(set, lvl) {
    let pool = Braille.pool(lvl === 'expert' ? 'all' : set);
    if (lvl === 'easy') {
      const learned = pool.filter((s) => Store.s.learned[s.id]);
      pool = learned.length >= 6 ? [...learned, ...pool.filter((s) => !Store.s.learned[s.id]).slice(0, 3)] : pool.slice(0, 10);
    }
    return pool;
  }

  function config(mode, set, lvl) {
    const pool = poolFor(set, lvl);
    const canBuild = pool.some((s) => s.cells.length === 1);
    const wordsSet = ['ru', 'en', 'uz'].includes(set) ? set : null;
    let types = {
      build: canBuild ? ['build'] : ['recognize', 'number'],
      recognize: set === 'num' ? ['recognize', 'number'] : ['recognize'],
      mixed: canBuild ? ['build', 'recognize'] : ['recognize', 'number'],
      words: ['word'],
      speed: ['recognize'],
    }[mode];
    if (lvl === 'expert' && mode !== 'words' && mode !== 'speed') types = ['build', 'recognize', 'word', 'number'];
    return {
      title: () => `${t(`practice.modes.${mode}`)[0]} · ${t(`practice.levels.${lvl}`)[0]}`,
      label: t(`practice.modes.${mode}`)[0],
      pool, types, wordsSet,
      total: mode === 'speed' ? null : 10,
      timeLimit: mode === 'speed' ? 60 : null,
      perQuestion: mode === 'speed' ? null : lvl === 'hard' ? 10 : lvl === 'expert' ? 12 : null,
      retry: (lvl === 'easy' || lvl === 'normal') && mode !== 'speed',
      numbers: lvl === 'easy',
      backHref: '#/practice',
    };
  }

  function chips(name, values, current, labelFn, onPick) {
    return h('div', { class: 'chips', role: 'radiogroup', 'aria-label': name },
      values.map((v) => h('button', {
        type: 'button', role: 'radio', 'aria-checked': String(v === current), class: `chip-btn${v === current ? ' active' : ''}`,
        onclick: () => onPick(v),
      }, v === current ? Icon('check', { size: 16 }) : null, labelFn(v))));
  }

  /** #/practice and #/practice/<mode> */
  function view(main, mode) {
    if (mode && MODES.includes(mode)) {
      const box = h('div', { class: 'quiz' });
      main.append(box);
      Quiz.run(box, config(mode, Store.s.practiceSet, Store.s.difficulty));
      return;
    }
    const s = Store.s;
    const rerender = () => App.render();
    main.append(
      UI.pageHead(t('practice.title'), null, 'practice'),
      h('section', { class: 'card' },
        h('h2', null, t('practice.chooseSet')),
        chips(t('practice.chooseSet'), SETS, s.practiceSet, (v) => t(`sets.${v}`), (v) => { s.practiceSet = v; Store.save(); rerender(); }),
        h('h2', null, t('practice.chooseLevel'), UI.helpBtn('difficulty')),
        chips(t('practice.chooseLevel'), LEVELS, s.difficulty, (v) => `${t(`practice.levels.${v}`)[0]} — ${t(`practice.levels.${v}`)[1]}`, (v) => { s.difficulty = v; Store.save(); rerender(); })),
      h('h2', { class: 'section-title' }, t('practice.chooseMode')),
      h('div', { class: 'tiles' }, MODES.map((m, i) => tile(`#/practice/${m}`, ['pen', 'eye', 'shuffle', 'text', 'clock'][i], t(`practice.modes.${m}`)[0], t(`practice.modes.${m}`)[1]))),
      h('div', { class: 'tiles' },
        tile('#/quick', 'zap', t('nav.quick'), t('navDesc.quick')),
        tile('#/perfect', 'trophy', t('nav.perfect'), t('navDesc.perfect')),
        tile('#/daily', 'calendar', t('nav.daily'), t('home.dailyDesc')),
        tile('#/write', 'braille', t('nav.write'), t('navDesc.write'))),
    );
  }
  const tile = (href, icon, title, desc) => h('a', { class: 'tile', href }, h('span', { class: 'tile-icon' }, Icon(icon, { size: 22 })), h('span', { class: 'tile-title' }, title), h('span', { class: 'tile-desc' }, desc));

  /** #/quick — Quick Learn */
  function quick(main, minutes) {
    const n = Number(minutes);
    if ([5, 10, 15].includes(n)) {
      const box = h('div', { class: 'quiz' }); main.append(box);
      Quiz.run(box, {
        title: () => `${t('practice.quickTitle')} · ${t('practice.minutes', { n })}`, label: 'Quick Learn',
        pool: Braille.pool('all'), types: ['recognize', 'build', 'recognize', 'word'], total: null, timeLimit: n * 60,
        retry: true, numbers: Store.s.difficulty === 'easy', backHref: '#/quick',
      });
      return;
    }
    main.append(UI.pageHead(t('practice.quickTitle'), t('practice.quickIntro')),
      h('div', { class: 'tiles three' }, [5, 10, 15].map((m) => tile(`#/quick/${m}`, 'zap', t('practice.minutes', { n: m }), t('navDesc.quick')))));
  }

  /** #/perfect — 20 in a row */
  function perfect(main, go) {
    if (go === 'go') {
      const box = h('div', { class: 'quiz' }); main.append(box);
      const cfg = {
        title: () => t('practice.perfectTitle'), label: 'Perfect Streak',
        pool: Braille.pool(Store.s.practiceSet), types: ['recognize'], total: null, streakTarget: 20, retry: false, backHref: '#/perfect',
      };
      cfg.onFinish = (r) => { if (r.perfectWin) { Store.unlock('perfect'); Store.addXP(50); Store.save(); UI.sfx('win'); } Quiz.results(box, r, cfg); };
      Quiz.run(box, cfg);
      return;
    }
    main.append(UI.pageHead(t('practice.perfectTitle'), t('practice.perfectIntro')),
      h('section', { class: 'card' }, h('p', null, `${t('c.set')}: `, h('b', null, t(`sets.${Store.s.practiceSet}`))),
        h('a', { class: 'btn primary', href: '#/perfect/go' }, t('c.start'))));
  }

  /** #/daily — daily task: 10 symbols in 3 minutes */
  function daily(main, go) {
    const done = Store.dailyDoneToday();
    if (go === 'go') {
      const box = h('div', { class: 'quiz' }); main.append(box);
      const cfg = {
        title: () => t('home.dailyTitle'), label: t('home.dailyTitle'),
        pool: Braille.pool('all'), types: ['recognize', 'build'], total: 10, timeLimit: 180, retry: false, backHref: '#/',
      };
      cfg.onFinish = (r) => {
        const xp = Store.recordDaily(r.answered);
        Quiz.results(box, { ...r, xp: r.xp + xp }, cfg, h('p', { class: 'success-msg' }, t('home.dailyDone', { n: Store.dailyDoneToday() }), ' · ', t('home.dailyStreak', { n: Store.dailyStreak() })));
      };
      Quiz.run(box, cfg);
      return;
    }
    main.append(UI.pageHead(t('home.dailyTitle'), t('practice.dailyIntro'), 'daily'),
      h('section', { class: 'card' },
        done >= 10 ? h('p', { class: 'success-msg' }, t('practice.dailyAlready', { n: done })) : null,
        h('p', { class: 'big-num' }, t('home.dailyStreak', { n: Store.dailyStreak() })),
        h('a', { class: 'btn primary', href: '#/daily/go' }, t('home.dailyStart'))));
  }

  /**
   * Interactive cell explorer: toggle dots, see combination and matching symbols.
   * Used in Lesson 2 and on the "Try writing yourself" page.
   */
  function explorer({ track = false } = {}) {
    const out = h('div', { class: 'explorer-out', 'aria-live': 'polite' });
    const ed = UI.editor({ onChange: update });
    function update(v) {
      out.replaceChildren();
      const combo = h('p', { class: 'combo' }, `${t('learn.combination')}: `, h('b', null, v.length ? `${v.join('-')}  ${Braille.toUnicode(v)}` : t('c.noDots')));
      out.append(combo);
      if (!v.length) { out.append(h('p', { class: 'muted' }, t('write.empty'))); return; }
      const found = Braille.findByCell(v);
      if (!found.length) { out.append(h('p', { class: 'muted' }, t('write.nothing'))); return; }
      out.append(h('p', { class: 'created' }, t('write.created')));
      const list = h('ul', { class: 'match-list' });
      found.forEach((s) => {
        if (track && s.set !== 'special') Store.s.written[s.id] = true;
        list.append(h('li', null, h('span', { class: 'match-ch' }, UI.shortLabel(s)), h('span', { class: `badge set-${s.set}` }, t(`sets.${s.set}`)),
          s.set !== 'special' ? UI.speakBtn(() => s, null, 'write.speakIt') : null));
      });
      out.append(list);
      if (track) { Store.checkAchievements(); Store.save(); }
    }
    update([]);
    const el = h('div', { class: 'explorer' }, h('div', { class: 'editor-wrap' }, ed.el),
      h('div', null, out, h('button', { type: 'button', class: 'btn ghost', onclick: () => ed.clear() }, t('c.clear'))));
    return { el, ed, update };
  }

  /** #/write */
  function write(main) {
    main.append(UI.pageHead(t('write.title'), t('write.intro'), 'write'),
      h('section', { class: 'card' }, explorer({ track: true }).el, h('p', { class: 'muted small' }, t('c.keyboardHint'))));
  }

  return { view, quick, perfect, daily, write, explorer, tile, config };
})();

  <script>
/* js/lessons.js */
/*!
 * STUDY BRAILLE ALPHABET by Madina Saidmalikova
 * © 2026 Madina Saidmalikova. All rights reserved.
 *
 * lessons.js — the step-by-step course (7 lessons):
 *   explanation → demonstration → self-check (quiz) → completion.
 */
'use strict';

const Lessons = (() => {
  const COUNT = 7;
  const title = (n) => t('learn.titles')[n - 1];
  const done = (n) => Store.s.lessonsDone.includes(n);
  /** First lesson not yet completed (or null). */
  const nextUndone = () => { for (let n = 1; n <= COUNT; n++) if (!done(n)) return n; return null; };

  /** #/learn */
  function list(main) {
    main.append(UI.pageHead(t('learn.title'), t('learn.intro')),
      UI.progress(Math.round((Store.s.lessonsDone.length / COUNT) * 100), `${Store.s.lessonsDone.length}/${COUNT}`),
      h('p', { class: 'muted small center' }, `${Store.s.lessonsDone.length} / ${COUNT} · ${t('c.done')}`),
      h('ol', { class: 'lesson-list' }, Array.from({ length: COUNT }, (_, i) => {
        const n = i + 1;
        return h('li', null, h('a', { class: `lesson-card${done(n) ? ' done' : ''}`, href: `#/learn/${n}` },
          h('span', { class: 'lesson-num', 'aria-hidden': 'true' }, done(n) ? '✓' : n),
          h('span', { class: 'lesson-text' }, h('span', { class: 'lesson-title' }, `${t('learn.lesson', { n })}. ${title(n)}`),
            h('span', { class: 'lesson-desc' }, t('learn.descs')[i])),
          h('span', { class: `badge ${done(n) ? 'ok' : ''}` }, done(n) ? `✓ ${t('c.done')}` : t('c.notDone'))));
      })));
  }

  /** Lesson stepper: shows where the user is in the course. */
  const stepper = (cur) => h('nav', { class: 'stepper', 'aria-label': t('learn.title') },
    Array.from({ length: COUNT }, (_, i) => h('a', {
      href: `#/learn/${i + 1}`, class: `step${i + 1 === cur ? ' current' : ''}${done(i + 1) ? ' done' : ''}`,
      'aria-current': i + 1 === cur ? 'step' : null, 'aria-label': `${t('learn.lesson', { n: i + 1 })}: ${title(i + 1)}${done(i + 1) ? ` (${t('c.done')})` : ''}`,
    }, done(i + 1) ? '✓' : i + 1)));

  /** Symbol card for alphabet tables; opens a detail dialog. */
  function symbolCard(s) {
    return h('button', {
      type: 'button', class: `sym-card${s.special ? ' special' : ''}`,
      'aria-label': `${UI.label(s)}. ${UI.dotsSpeech(s.cells)}`,
      onclick: () => detail(s),
    },
    h('span', { class: 'sym-ch' }, s.name ? s.ch : s.ch),
    UI.cells(s.cells, { size: 'sm' }),
    h('span', { class: 'sym-dots' }, UI.dotsText(s.cells)),
    s.latin || s.cyr ? h('span', { class: 'sym-latin' }, s.latin || s.cyr) : null,
    s.name ? h('span', { class: 'sym-latin' }, t(`punctNames.${s.name}`)) : null,
    s.special ? h('span', { class: 'star', 'aria-hidden': 'true' }, '★') : null);
  }

  function detail(s) {
    UI.speakSymbol(s);
    UI.modal({
      title: `${UI.shortLabel(s)} · ${t(`sets.${s.set}`)}`,
      body: h('div', { class: 'detail' },
        UI.cells(s.cells, { size: 'xl', numbers: true }),
        h('dl', { class: 'detail-list' },
          h('dt', null, t('c.print')), h('dd', null, UI.shortLabel(s)),
          h('dt', null, t('c.dots')), h('dd', null, UI.dotsText(s.cells)),
          h('dt', null, t('c.unicode')), h('dd', { class: 'uni' }, Braille.cellsToUnicode(s.cells)),
          s.latin ? [h('dt', null, t('c.latin')), h('dd', null, s.latin)] : null,
          s.cyr ? [h('dt', null, t('c.cyrillic')), h('dd', null, s.cyr)] : null)),
      actions: [UI.canSpeak() ? { label: UI.ic('volume', t('c.listen')), keepOpen: true, onClick: () => UI.speakSymbol(s) } : null, { label: t('c.close'), primary: true }].filter(Boolean),
    });
  }

  const table = (list) => h('div', { class: 'sym-grid' }, list.map(symbolCard));
  const section = (heading, ...content) => h('section', { class: 'card' }, heading ? h('h2', null, heading) : null, ...content);

  /** Self-check quiz that completes the lesson (≥4 of 5). */
  function selfCheck(n, pool, types) {
    const box = h('div', { class: 'quiz' });
    const start = h('button', { type: 'button', class: 'btn primary', onclick: () => {
      start.remove();
      const cfg = {
        title: () => `${t('learn.lesson', { n })} · ${t('learn.checkSelf')}`, label: title(n),
        pool, types, total: 5, retry: false, backHref: `#/learn/${n}`,
      };
      cfg.onFinish = (r) => {
        let msg;
        if (r.correct >= 4) {
          const xp = Store.completeLesson(n);
          msg = h('p', { class: 'success-msg' }, t('learn.doneMsg', { xp }));
          r.xp += xp;
        } else msg = h('p', { class: 'warn-msg' }, t('learn.checkFail'));
        Quiz.results(box, r, cfg, msg);
        if (r.correct >= 4 && n < COUNT) box.querySelector('.row').append(h('a', { class: 'btn primary', href: `#/learn/${n + 1}` }, t('learn.nextLesson')));
      };
      Quiz.run(box, cfg);
    } }, UI.ic('check', t('learn.checkSelf')));
    return section(t('learn.checkSelf'), h('p', { class: 'muted' }, t('learn.checkIntro')), start, box);
  }

  /** "Complete lesson" button for theory lessons (1, 2). */
  function completeBtn(n) {
    const wrap = h('div', { class: 'row center' });
    const draw = () => {
      wrap.replaceChildren(done(n)
        ? h('p', { class: 'success-msg' }, `✓ ${t('c.done')}`)
        : h('button', { type: 'button', class: 'btn primary', onclick: () => { const xp = Store.completeLesson(n); UI.toast(t('learn.doneMsg', { xp }), 'ok'); UI.sfx('win'); draw(); } }, `✓ ${t('learn.markDone')}`),
      n < COUNT ? h('a', { class: 'btn ghost', href: `#/learn/${n + 1}` }, t('learn.nextLesson')) : null);
    };
    draw();
    return wrap;
  }

  // ---------------------------------------------------------------- lesson bodies
  const bodies = {
    1: () => [
      ...t('learn.l1').map(([hd, txt]) => section(hd, h('p', { html: txt }))),
      section(null, h('div', { class: 'demo-row' }, ['l', 'o', 'u', 'i', 's'].map((ch) => {
        const s = Braille.byId.get(`en:${ch.toUpperCase()}`);
        return h('div', { class: 'demo-item' }, UI.cells(s.cells, { size: 'md' }), h('span', null, ch));
      })), h('p', { class: 'muted small center' }, 'L · O · U · I · S')),
      completeBtn(1),
    ],
    2: () => {
      const ex = Practice.explorer();
      const demo = h('div', { class: 'demo-row' }, ['A', 'K', 'U'].map((ch, i) => [
        i ? h('span', { class: 'arrow', 'aria-hidden': 'true' }, '→') : null,
        h('div', { class: 'demo-item' }, UI.cells(Braille.byId.get(`en:${ch}`).cells, { size: 'md', numbers: true }), h('span', null, ch.toLowerCase())),
      ]));
      return [
        section(null, h('p', { html: t('learn.l2intro') }),
          h('div', { class: 'cell-map', 'aria-hidden': 'true' }, h('span', null, '1  4'), h('span', null, '2  5'), h('span', null, '3  6'))),
        section(h('span', null, t('c.symbolWord'), UI.helpBtn('cell')), ex.el, h('p', { class: 'muted small' }, t('c.keyboardHint'))),
        section(t('learn.l2demo'), demo, h('ul', { class: 'facts' }, t('learn.l2facts').map((f) => h('li', null, f)))),
        completeBtn(2),
      ];
    },
    3: () => [
      section(null, h('p', null, t('learn.ruNote')), h('p', { class: 'muted small' }, t('learn.tapLetter'))),
      section(t('sets.ru'), table(Braille.sets.ru)),
      selfCheck(3, Braille.sets.ru, ['recognize', 'build']),
    ],
    4: () => [
      section(null, h('p', null, t('learn.enNote')), h('p', { class: 'muted small' }, t('learn.tapLetter'))),
      section('a–j', table(Braille.sets.en.slice(0, 10))),
      section('k–t (+3)', table(Braille.sets.en.slice(10, 20))),
      section('u–z (+3, +6)', table(Braille.sets.en.slice(20))),
      selfCheck(4, Braille.sets.en, ['recognize', 'build']),
    ],
    5: () => [
      section(null, h('p', { class: 'note', html: t('learn.uzNote') }), h('p', { class: 'muted small' }, t('learn.tapLetter'))),
      section('★ Oʻ Gʻ Q H Sh Ch Ng', table(Braille.sets.uz.filter((s) => s.special))),
      section(t('sets.uz'), table(Braille.sets.uz)),
      selfCheck(5, Braille.sets.uz, ['recognize', 'build']),
    ],
    6: () => {
      const sign = Braille.sets.special[0];
      const yearCells = [[3, 4, 5, 6], ...'2026'.split('').map((d) => Braille.byId.get(`num:${d}`).cells[1])];
      return [
        section(h('span', null, t('punctNames.numSign'), UI.helpBtn('numSign')),
          h('div', { class: 'demo-row' }, h('div', { class: 'demo-item' }, UI.cells(sign.cells, { size: 'lg', numbers: true }), h('span', null, '3-4-5-6'))),
          ...t('learn.l6').map((p) => h('p', { html: p }))),
        section(t('sets.num'), table(Braille.sets.num)),
        section(t('learn.l6example'), h('div', { class: 'demo-row' }, UI.cells(yearCells, { size: 'md' })),
          h('p', { class: 'center' }, '⠼ + 2 0 2 6 = ', h('b', null, Braille.cellsToUnicode(yearCells)))),
        selfCheck(6, Braille.sets.num, ['recognize', 'number']),
      ];
    },
    7: () => [
      section(null, h('p', { html: t('learn.l7intro') }), h('p', { class: 'muted small' }, t('learn.tapLetter'))),
      section(t('sets.punct'), table(Braille.sets.punct)),
      section(t('learn.l7en'), h('p', { class: 'muted' }, t('learn.l7enNote')), table(Braille.sets.punctEn)),
      selfCheck(7, Braille.sets.punct, ['recognize', 'build']),
    ],
  };

  /** #/learn/<n> */
  function lesson(main, nStr) {
    const n = Number(nStr);
    if (!bodies[n]) return list(main);
    main.append(stepper(n),
      UI.pageHead(`${t('learn.lesson', { n })}. ${title(n)}`, t('learn.descs')[n - 1]),
      ...bodies[n](),
      h('nav', { class: 'row space lesson-nav', 'aria-label': t('learn.title') },
        n > 1 ? h('a', { class: 'btn ghost', href: `#/learn/${n - 1}` }, `← ${t('learn.lesson', { n: n - 1 })}`) : h('span'),
        n < COUNT ? h('a', { class: 'btn ghost', href: `#/learn/${n + 1}` }, `${t('learn.lesson', { n: n + 1 })} →`) : h('a', { class: 'btn ghost', href: '#/exam' }, `${t('nav.exam')} →`)));
  }

  return { list, lesson, nextUndone, title, COUNT, symbolCard, detail };
})();

'use strict';

const Games = (() => {
  const IDS = ['guess', 'build', 'memory', 'fast', 'error', 'challenge'];

  /** #/games */
  function list(main) {

    main.append(UI.pageHead(t('games.title')),

        return h('a', { class: 'tile game', href: `#/games/${id}` },

      } else if (lts > cts && LS.getItem(k) != null) { TGA.pending[k] = 1; }

  });
