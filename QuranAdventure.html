["фа-ирғоб","фа-ирғоб","fa-irgʻob"]]]},"95":{"n":95,"ar":"سُورَةُ التِّينِ","en":"At-Tin","enT":"The Fig","c":8,"a":[["وَٱلتِّينِ وَٱلزَّيْتُونِ","Wat teeni waz zaitoon","By the fig and the olive","Клянусь смоковницей и оливой!","Анжир билан қасам ва зайтун билан қасам."],["وَطُورِ سِينِينَ","Wa toori sineen","And [by] Mount Sinai","Клянусь горой Синин (Синай)!","Ва Тури Сийно билан қасам."],["وَهَٰذَا ٱلْبَلَدِ ٱلْأَمِينِ","Wa haazal balad-il ameen","And [by] this secure city [Makkah],","Клянусь этим безопасным городом (Меккой)!","Ва мана бу, эминлик юрти (Макка) билан қасам."],["لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِىٓ أَحْسَنِ تَقْوِيمٍۢ","Laqad khalaqnal insaana fee ahsani taqweem","We have certainly created man in the best of stature;","Мы сотворили человека в прекраснейшем облике.","Батаҳқиқ, Биз инсонни энг яхши суратда яратдик."],["ثُمَّ رَدَدْنَٰهُ أَسْفَلَ سَٰفِلِينَ","Thumma ra dad naahu asfala saafileen","Then We return him to the lowest of the low,","Потом Мы вернем его в нижайшее из низких (продлим ему жизнь настолько, что он превратится в дряхлого старика, или бросим его на самое дно Геенны),","Сўнгра уни асфала сафилинга қайтардик."],["إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۢ","Ill-lal lazeena aamanoo wa 'amilus saalihaati; falahum ajrun ghairu mamnoon","Except for those who believe and do righteous deeds, for they will have a reward uninterrupted.","за исключением тех, которые уверовали и совершали праведные деяния. Им уготована награда неиссякаемая.","Магар иймон келтирганлар ва яхши амаллар қилганларга миннатсиз ва узлуксиз ажрлар бордир."],["فَمَا يُكَذِّبُكَ بَعْدُ بِٱلدِّينِ","Fama yu kaz zibuka b'adu bid deen","So what yet causes you to deny the Recompense?","Что же после этого заставляет тебя считать ложью воздаяние?","Бас, сени нима охиратни ёлғонга чиқаришга олиб келади (эй кофир)?"],["أَلَيْسَ ٱللَّهُ بِأَحْكَمِ ٱلْحَٰكِمِينَ","Alai sal laahu bi-ahkamil haakimeen","Is not Allah the most just of judges?","Разве Аллах не является Наимудрейшим Судьей?","Аллоҳ ҳукм қилгувчиларнинг энг ҳикматлиси эмасми?!"]],"b":1,"type":"Meccan","w":[[["wal-tīni","By the fig"],["wal-zaytūni","and the olive"]],[["waṭūri","And (the) Mount"],["sīnīna","Sinai"]],[["wahādhā","And this"],["l-baladi","[the] city"],["l-amīni","[the] secure"]],[["laqad","Indeed"],["khalaqnā","We created"],["l-insāna","man"],["fī","in"],["aḥsani","(the) best"],["taqwīmin","mould"]],[["thumma","Then"],["radadnāhu","We returned him"],["asfala","(to the) lowest"],["sāfilīna","(of the) low"]],[["illā","Except"],["alladhīna","those who"],["āmanū","believe"],["waʿamilū","and do"],["l-ṣāliḥāti","righteous deeds"],["falahum","then for them"],["ajrun","(is a) reward"],["ghayru","never"],["mamnūnin","ending"]],[["famā","Then what"],["yukadhibuka","causes you to deny"],["baʿdu","after (this)"],["bil-dīni","the judgment"]],[["alaysa","Is not"],["l-lahu","Allah"],["bi-aḥkami","(the) Most Just"],["l-ḥākimīna","(of) the Judges"]]],"uzl":["Anjir bilan qasam va zaytun bilan qasam.","Va Turi Siyno bilan qasam.","Va mana bu eminlik yurti (Makka) bilan qasam.","Batahqiq, Biz insonni eng yaxshi suvratda yaratdik.","Soʻngra uni asfala saafiliynga qaytardik.","Illo, iymon keltirganlar va yaxshi amallar qilganlarga minnatsiz va uzluksiz ajrlar bordir.","Bas, seni oxiratni yolgʻonga chiqarishga nima olib kelur?!","Alloh hukm qilguvchilarning eng hikmatlisi emasmi?!"],"t":[["Ват-тийни ваз-зайтун","Ват-тийни ваз-зайтун","Vat-tiyni vaz-zaytun"],["Ватури сийнийн","Ватури сийнийн","Vaturi siyniyn"],["Ваҳазал-баладил-амийн","Ваҳазал-баладил-амийн","Vahazal-baladil-amiyn"],["Лақод холақнал-инсана фий аҳсани тақвийм","Лақод холақнал-инсана фий аҳсани тақвийм","Laqod xolaqnal-insana fiy ahsani taqviym"],["Сумма родаднаҳу асфала сафилийн","Сумма родаднаҳу асфала сафилийн","Summa rodadnahu asfala safiliyn"],["Иллал-лазийна аману ваъамилус-солиҳати фалаҳум ажрун ғойру мамнун","Иллал-лазийна аману ваъамилус-солиҳати фалаҳум ажрун ғойру мамнун","Illal-laziyna amanu vaʼamilus-solihati falahum ajrun gʻoyru mamnun"],["Фама юказибука баъду бид-дийн","Фама юказибука баъду бид-дийн","Fama yukazibuka baʼdu bid-diyn"],["Алайсаллоҳу би-аҳкамил-ҳакимийн","Алайсаллоҳу би-аҳкамил-ҳакимийн","Alaysallohu bi-ahkamil-hakimiyn"]],"wt":[[["ват-тийни","ват-тийни","vat-tiyni"],["ваз-зайтуни","ваз-зайтуни","vaz-zaytuni"]],[["ватури","ватури","vaturi"],["сийнийна","сийнийна","siyniyna"]],[["ваҳаза","ваҳаза","vahaza"],["ал-балади","ал-балади","al-baladi"],["ал-амийни","ал-амийни","al-amiyni"]],[["лақод","лақод","laqod"],["холақна","холақна","xolaqna"],["ал-инсана","ал-инсана","al-insana"],["фий","фий","fiy"],["аҳсани","аҳсани","ahsani"],["тақвиймин","тақвиймин","taqviymin"]],[["сумма","сумма","summa"],["родаднаҳу","родаднаҳу","rodadnahu"],["асфала","асфала","asfala"],["сафилийна","сафилийна","safiliyna"]],[["илла","илла","illa"],["аллазийна","аллазийна","allaziyna"],["аману","аману","amanu"],["ваъамилу","ваъамилу","vaʼamilu"],["ас-солиҳати","ас-солиҳати","as-solihati"],["фалаҳум","фалаҳум","falahum"],["ажрун","ажрун","ajrun"],["ғойру","ғойру","gʻoyru"],["мамнунин","мамнунин","mamnunin"]],[["фама","фама","fama"],["юказибука","юказибука","yukazibuka"],["баъду","баъду","baʼdu"],["бид-дийни","бид-дийни","bid-diyni"]],[["алайса","алайса","alaysa"],["Аллоҳу","Аллоҳу","Allohu"],["би-аҳками","би-аҳками","bi-ahkami"],["ал-ҳакимийна","ал-ҳакимийна","al-hakimiyna"]]]},"96":{"n":96,"ar":"سُورَةُ العَلَقِ","en":"Al-Alaq","enT":"The Clot","c":19,"a":[["ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ","Iqra bismi rab bikal lazee khalaq","Recite in the name of your Lord who created -","Читай во имя твоего Господа, Который сотворил все сущее,","Яратган Роббинг номи билан ўқи."],["خَلَقَ ٱلْإِنسَٰنَ مِنْ عَلَقٍ","Khalaqal insaana min 'alaq","Created man from a clinging substance.","сотворил человека из сгустка крови.","У инсонни алақдан яратди."],["ٱقْرَأْ وَرَبُّكَ ٱلْأَكْرَمُ","Iqra wa rab bukal akram","Recite, and your Lord is the most Generous -","Читай, ведь твой Господь - Самый великодушный.","Ўқи! Ва Роббинг энг карамлидир!"],["ٱلَّذِى عَلَّمَ بِٱلْقَلَمِ","Al lazee 'allama bil qalam","Who taught by the pen -","Он научил посредством письменной трости -","У қалам билан илм ўргатгандир."],["عَلَّمَ ٱلْإِنسَٰنَ مَا لَمْ يَعْلَمْ","'Al lamal insaana ma lam y'alam","Taught man that which he knew not.","научил человека тому, чего тот не знал.","У инсонга у билмаган нарсани ўргатди."],["كَلَّآ إِنَّ ٱلْإِنسَٰنَ لَيَطْغَىٰٓ","Kallaa innal insaana layatghaa","No! [But] indeed, man transgresses","Но нет! Человек преступает границы дозволенного,","Йўқ! Албатта инсон туғёнга кетадир."],["أَن رَّءَاهُ ٱسْتَغْنَىٰٓ","Ar-ra aahus taghnaa","Because he sees himself self-sufficient.","когда ему кажется, что он ни в чем не нуждается.","Ўзини бой кўргани учун."],["إِنَّ إِلَىٰ رَبِّكَ ٱلرُّجْعَىٰٓ","Innna ilaa rabbikar ruj'aa","Indeed, to your Lord is the return.","Но к твоему Господу предстоит возвращение.","Албатта, қайтиб бориш Роббингадир."],["أَرَءَيْتَ ٱلَّذِى يَنْهَىٰ","Ara-aital lazee yanhaa","Have you seen the one who forbids","Что ты думаешь о том, кто мешает","Қайтарганни кўрдингми?!"],["عَبْدًا إِذَا صَلَّىٰٓ","'Abdan iza sallaa","A servant when he prays?","рабу, когда тот молится?","Бандани намоз ўқиётганида?!"],["أَرَءَيْتَ إِن كَانَ عَلَى ٱلْهُدَىٰٓ","Ara-aita in kana 'alal hudaa","Have you seen if he is upon guidance","Что ты думаешь, а если он был на правом пути","Айт-чи, агар ўша ҳидоятда бўлса."],["أَوْ أَمَرَ بِٱلتَّقْوَىٰٓ","Au amara bit taqwaa","Or enjoins righteousness?","или призывал к богобоязненности?","Ёки тақвога амр қилса."],["أَرَءَيْتَ إِن كَذَّبَ وَتَوَلَّىٰٓ","Ara-aita in kaz zaba wa ta walla","Have you seen if he denies and turns away -","Что ты думаешь, а если он счел ложью истину и отвернулся?","Айт-чи, ўша ёлғонга чиқарса ва юз ўгирса."],["أَلَمْ يَعْلَم بِأَنَّ ٱللَّهَ يَرَىٰ","Alam y'alam bi-an nal lahaa yaraa","Does he not know that Allah sees?","Неужели он не знал, что Аллах видит его?","Албатта Аллоҳ уни кўришини билмасми?!"],["كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًۢا بِٱلنَّاصِيَةِ","Kalla la illam yantahi la nasfa'am bin nasiyah","No! If he does not desist, We will surely drag him by the forelock -","Но нет, если он не перестанет, то Мы схватим его за хохол -","Йўқ! Агар қайтмаса, пешонасидан шиддатла тутамиз."],["نَاصِيَةٍۢ كَٰذِبَةٍ خَاطِئَةٍۢ","Nasiyatin kazi batin khaatiyah","A lying, sinning forelock.","хохол лживый, грешный.","Ёлғончи, хатокор пешонасидан."],["فَلْيَدْعُ نَادِيَهُۥ","Fal yad'u naadiyah","Then let him call his associates;","Пусть он зовет свое сборище.","Бас, ўз тўпини чақирсин."],["سَنَدْعُ ٱلزَّبَانِيَةَ","Sanad 'uz zabaaniyah","We will call the angels of Hell.","Мы же позовем адских стражей!","Биз ҳам забонияларни чақирамиз. (Яъни, дўзахийларни азобловчи фаришталарни.)"],["كَلَّا لَا تُطِعْهُ وَٱسْجُدْ وَٱقْتَرِب ۩","Kalla; la tuti'hu wasjud waqtarib","No! Do not obey him. But prostrate and draw near [to Allah].","Так нет! Не повинуйся ему, а пади ниц и приближайся к Аллаху.","Йўқ! Сен унга итоат қилма! Сажда қил ва қурбат ҳосил қил."]],"b":1,"type":"Meccan","w":[[["iq'ra","Read"],["bi-is'mi","in (the) name"],["rabbika","(of) your Lord"],["alladhī","the One Who"],["khalaqa","created "]],[["khalaqa","He created"],["l-insāna","man"],["min","from"],["ʿalaqin","a clinging substance"]],[["iq'ra","Read"],["warabbuka","and your Lord"],["l-akramu","(is) the Most Generous"]],[["alladhī","The One Who"],["ʿallama","taught"],["bil-qalami","by the pen"]],[["ʿallama","Taught"],["l-insāna","man"],["mā","what"],["lam","not"],["yaʿlam","he knew"]],[["kallā","Nay"],["inna","Indeed"],["l-insāna","man"],["layaṭghā","surely transgresses"]],[["an","That"],["raāhu","he sees himself"],["is'taghnā","self-sufficient"]],[["inna","Indeed"],["ilā","to"],["rabbika","your Lord"],["l-ruj'ʿā","(is) the return"]],[["ara-ayta","Have you seen"],["alladhī","the one who"],["yanhā","forbids"]],[["ʿabdan","A slave"],["idhā","when"],["ṣallā","he prays"]],[["ara-a аҳу","roʼahu"],["истағна","истағна","istagʻna"]],[["инна","инна","inna"],["ила","ила","ila"],["роббика","роббика","robbika"],["ар-ружъа","ар-ружъа","ar-rujʼa"]],[["ароъайта","ароъайта","aroʼayta"],["аллазий","аллазий","allaziy"],["янҳа","янҳа","yanha"]],[["ъабдан","ъабдан","ʼabdan"],["иза","иза","iza"],["солла","солла","solla"]],[["ароъайта","ароъайта","aroʼayta"],["ин","ин","in"],["кана","кана","kana"],["ъала","ъала","ʼala"],["ал-ҳуда","ал-ҳуда","al-huda"]],[["ав","ав","av"],["амаро","амаро","amaro"],["бит-тақва","бит-тақва","bit-taqva"]],[["ароъайта","ароъайта","aroʼayta"],["ин","ин","in"],["казаба","казаба","kazaba"],["ватавалла","ватавалла","vatavalla"]],[["алам","алам","alam"],["яълам","яълам","yaʼlam"],["би-анна","би-анна","bi-anna"],["Аллоҳа","Аллоҳа","Alloha"],["яро","яро","yaro"]],[["калла","калла","kalla"],["ла-ин","ла-ин","la-in"],["лам","лам","lam"],["янтаҳи","янтаҳи","yantahi"],["ланасфаъан","ланасфаъан","lanasfaʼan"],["бин-насияти","бин-насияти","bin-nasiyati"]],[["насиятин","насиятин","nasiyatin"],["казибатин","казибатин","kazibatin"],["хотиъатин","хотиъатин","xotiʼatin"]],[["фалядъу","фалядъу","falyadʼu"],["надияҳу","надияҳу","nadiyahu"]],[["санадъу","санадъу","sanadʼu"],["аз-забанията","аз-забанията","az-zabaniyata"]],[["калла","калла","kalla"],["ла","ла","la"],["тутиъҳу","тутиъҳу","tutiʼhu"],["ва-усжуд","ва-усжуд","va-usjud"],["ва-иқтариб","ва-иқтариб","va-iqtarib"]]]},"97":{"n":97,"ar":"سُورَةُ القَدْرِ","en":"Al-Qadr","enT":"The Power, Fate","c":5,"a":[["إِنَّآ أَنزَلْنَٰهُ فِى لَيْلَةِ ٱلْقَدْرِ","Innaa anzalnaahu fee lailatil qadr","Indeed, We sent the Qur'an down during the Night of Decree.","Воистину, Мы ниспослали его (Коран) в ночь предопределения (или величия).","Албатта, Биз у(Қуръон)ни Лайлатул Қадр да туширдик."],["وَمَآ أَدْرَىٰكَ مَا لَيْلَةُ ٱلْقَدْرِ","Wa maa adraaka ma lailatul qadr","And what can make you know what is the Night of Decree?","Откуда ты мог знать, что такое ночь предопределения (или величия)?","Лайлатул Қадр қандоқ нарса эканини сенга нима билдирди?"],["لَيْلَةُ ٱلْقَدْرِ خَيْرٌۭ مِّنْ أَلْفِ شَهْرٍۢ","Lailatul qadri khairum min alfee shahr","The Night of Decree is better than a thousand months.","Ночь предопределения (или величия) лучше тысячи месяцев.","Лайлатул Қадр минг ойдин яхшироқдир."],["تَنَزَّلُ ٱلْمَلَٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍۢ","Tanaz zalul malaa-ikatu war roohu feeha bi izni-rab bihim min kulli amr","The angels and the Spirit descend therein by permission of their Lord for every matter.","В эту ночь ангелы и Дух (Джибрил) нисходят с дозволения их Господа по всем Его повелениям.","Унда фаришталар ва Руҳ Роббилари изни билан барча ишлар учун тушадир."],["سَلَٰمٌ هِىَ حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ","Salaamun hiya hattaa mat la'il fajr","Peace it is until the emergence of dawn.","Она благополучна вплоть до наступления зари.","У то тонг отгунча салом бўлиб турадир."]],"b":1,"type":"Meccan","w":[[["innā","Indeed, We"],["anzalnāhu","revealed it"],["fī","in"],["laylati","(the) Night"],["l-qadri","(of) Power"]],[["wamā","And what"],["adrāka","can make you know"],["mā","what"],["laylatu","(the) Night"],["l-qadri","(of) Power (is)"]],[["laylatu","(The) Night"],["l-qadri","(of) Power"],["khayrun","(is) better"],["min","than"],["alfi","a thousand"],["shahrin","month(s)"]],[["tanazzalu","Descend"],["l-malāikatu","the Angels"],["wal-rūḥu","and the Spirit"],["fīhā","therein"],["bi-idh'ni","by (the) permission"],["rabbihim","(of) their Lord"],["min","for"],["kulli","every"],["amrin","affair"]],[["salāmun","Peace"],["hiya","it (is)"],["ḥattā","until"],["maṭlaʿi","(the) emergence"],["l-fajri","(of) the dawn"]]],"uzl":["Albatta, Biz U(Qur'on)ni Qadr kechasida tushirdik.","Laylatul Qadr qandoq narsa ekanini senga nima bildirdi?","Laylatul Qadr ming oydin yaxshiroqdir.","Unda farishtalar va Ruh Robbilari izni bilan barcha ishlar uchun tushadir.","U to tong otguncha salom boʻlib turadir."],"t":[["Инна анзалнаҳу фий лайлатил-қодр","Инна анзалнаҳу фий лайлатил-қодр","Inna anzalnahu fiy laylatil-qodr"],["Вама адрока ма лайлатул-қодр","Вама адрока ма лайлатул-қодр","Vama adroka ma laylatul-qodr"],["Лайлатул-қодри хойрун мин алфи шаҳр","Лайлатул-қодри хойрун мин алфи шаҳр","Laylatul-qodri xoyrun min alfi shahr"],["Таназзалул-малаъикату вар-руҳу фийҳа би-изни роббиҳим мин кулли амр","Таназзалул-малаъикату вар-руҳу фийҳа би-изни роббиҳим мин кулли амр","Tanazzalul-malaʼikatu var-ruhu fiyha bi-izni robbihim min kulli amr"],["Саламун ҳия ҳатта матлаъил-фажр","Саламун ҳия ҳатта матлаъил-фажр","Salamun hiya hatta matlaʼil-fajr"]],"wt":[[["инна","инна","inna"],["анзалнаҳу","анзалнаҳу","anzalnahu"],["фий","фий","fiy"],["лайлати","лайлати","laylati"],["ал-қодри","ал-қодри","al-qodri"]],[["вама","вама","vama"],["адрока","адрока","adroka"],["ма","ма","ma"],["лайлату","лайлату","laylatu"],["ал-қодри","ал-қодри","al-qodri"]],[["лайлату","лайлату","laylatu"],["ал-қодри","ал-қодри","al-qodri"],["хойрун","хойрун","xoyrun"],["мин","мин","min"],["алфи","алфи","alfi"],["шаҳрин","шаҳрин","shahrin"]],[["таназзалу","таназзалу","tanazzalu"],["ал-малаъикату","ал-малаъикату","al-malaʼikatu"],["вар-руҳу","вар-руҳу","var-ruhu"],["фийҳа","фийҳа","fiyha"],["би-изни","би-изни","bi-izni"],["роббиҳим","роббиҳим","robbihim"],["мин","мин","min"],["кулли","кулли","kulli"],["амрин","амрин","amrin"]],[["саламун","саламун","salamun"],["ҳия","ҳия","hiya"],["ҳатта","ҳатта","hatta"],["матлаъи","матлаъи","matlaʼi"],["ал-фажри","ал-фажри","al-fajri"]]]},"98":{"n":98,"ar":"سُورَةُ البَيِّنَةِ","en":"Al-Bayyina","enT":"The Evidence","c":8,"a":[["لَمْ يَكُنِ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ ٱلْبَيِّنَةُ","Lam ya kunil lazeena kafaru min ahlil kitaabi wal mushri keena mun fak keena hattaa ta-tiya humul bayyinah","Those who disbelieved among the People of the Scripture and the polytheists were not to be parted [from misbelief] until there came to them clear evidence -","Неверующие из людей Писания и многобожников не расстались с неверием, пока к ним не явилось ясное знамение -","Аҳли китоб ва мушриклардан бўлган куфр келтирганларга «баййина» келмагунча ажралмасдилар."],["رَسُولٌۭ مِّنَ ٱللَّهِ يَتْلُوا۟ صُحُفًۭا مُّطَهَّرَةًۭ","Rasoolum minal laahi yatlu suhufam mutahharah","A Messenger from Allah, reciting purified scriptures","Посланник от Аллаха, который читает очищенные свитки.","У (баййина) Аллоҳ тарафидан юборилган Расул бўлиб, покланган саҳифаларни тиловат қиладир."],["فِيهَا كُتُبٌۭ قَيِّمَةٌۭ","Feeha kutubun qaiyimah","Within which are correct writings.","В них содержатся правдивые Писания.","Уларда ажойиб битиклар бордир."],["وَمَا تَفَرَّقَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَةُ","Wa maa tafarraqal lazeena ootul kitaaba il-la mim b'adi ma jaa-at humul baiyyinah","Nor did those who were given the Scripture become divided until after there had come to them clear evidence.","Те, кому было даровано Писание, распались только после того, как к ним явилось ясное знамение.","Китоб берилганлар уларга «баййина» келганидан сўнггина бўлиниб кетишди."],["وَمَآ أُمِرُوٓا۟ إِلَّا لِيَعْبُدُوا۟ ٱللَّهَ مُخْلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُوا۟ ٱلصَّلَوٰةَ وَيُؤْتُوا۟ ٱلزَّكَوٰةَ ۚ وَذَٰلِكَ دِينُ ٱلْقَيِّمَةِ","Wa maa umiroo il-la liy'abu dul laaha mukhliseena lahud-deena huna faa-a wa yuqeemus salaahta wa yu-tuz zakaata; wa zaalika deenul qaiyimah","And they were not commanded except to worship Allah, [being] sincere to Him in religion, inclining to truth, and to establish prayer and to give zakah. And that is the correct religion.","А ведь им было велено лишь поклоняться Аллаху, служа ему искренне, как ханифы, совершать намаз и выплачивать закят. Это - правая вера.","Ҳолбуки, улар фақат Аллоҳгагина ибодат қилишга, Унинг динигагина ихлос қилишга, бошқа динларга мойил бўлмасликка, намозни тўлиқ ўқишга, закот беришга буюрилган эдилар. Ана шу тўғри миллатнинг динидир."],["إِنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ فِى نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآ ۚ أُو۟لَٰٓئِكَ هُمْ شَرُّ ٱلْبَرِيَّةِ","Innal lazeena kafaru min ahlil kitaabi wal mushri keena fee nari jahan nama khaali deena feeha; ulaa-ika hum shar rul ba reeyah","Indeed, they who disbelieved among the People of the Scripture and the polytheists will be in the fire of Hell, abiding eternally therein. Those are the worst of creatures.","Воистину, неверующие из людей Писания и многобожников окажутся в огне Геенны и пребудут там вечно. Они являются наихудшими из тварей.","Албатта, аҳли китоб ва мушриклардан бўлган куфр келтирганлар жаҳаннам ўтидадурлар, у ерда абадий қолурлар. Ана ўшалар халойиқнинг энг ёмонларидир."],["إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ أُو۟لَٰٓئِكَ هُمْ خَيْرُ ٱلْبَرِيَّةِ","Innal lazeena aamanu wa 'amilus saalihaati ula-ika hum khairul bareey yah","Indeed, they who have believed and done righteous deeds - those are the best of creatures.","Воистину, те, которые уверовали и совершали праведные деяния, являются наилучшими из тварей.","Албатта, иймон келтирганлар ва солиҳ амалларни қилганлар, ана ўшалар, халойиқнинг энг яхшиларидир."],["جَزَآؤُهُمْ عِندَ رَبِّهِمْ جَنَّٰتُ عَدْنٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدًۭا ۖ رَّضِىَ ٱللَّهُ عَنْهُمْ وَرَضُوا۟ عَنْهُ ۚ ذَٰلِكَ لِمَنْ خَشِىَ رَبَّهُۥ","Jazaa-uhum inda rabbihim jan naatu 'adnin tajree min tahtihal an haaru khalideena feeha abada; radiy-yallaahu 'anhum wa ra du 'an zaalika liman khashiya rabbah.","Their reward with Allah will be gardens of perpetual residence beneath which rivers flow, wherein they will abide forever, Allah being pleased with them and they with Him. That is for whoever has feared his Lord.","Их воздаянием у их Господа будут сады Эдема, в которых текут реки. Они пребудут в них вечно. Аллах доволен ими, и они довольны Им. Это уготовано для тех, кто боится своего Господа.","Уларнинг мукофотлари Роббилари ҳузуридаги остидан анҳорлар оқиб турган жаннат «адн»дир. У ерда абадул абад қолажаклар. Аллоҳ улардан рози бўлди, улар ҳам У зотдан рози бўлдилар. Бу Роббисидан қўрққанлар учундир."]],"b":1,"type":"Medinan","w":[[["lam","Not"],["yakuni","were"],["alladhīna","those who"],["kafarū","disbelieved"],["min","from"],["ahli","(the) People"],["l-kitābi","of the Book"],["wal-mush'rikīna","and the polytheists"],["munfakkīna","to be abandoned"],["ḥattā","until"],["tatiyahumu","(there) comes to them"],["l-bayinatu","the clear evidence"]],[["rasūlun","A Messenger"],["mina","from"],["l-lahi","Allah"],["yatlū","reciting"],["ṣuḥufan","pages"],["muṭahharatan","purified"]],[["fīhā","Wherein"],["kutubun","(are) writings"],["qayyimatun","correct"]],[["wamā","And not"],["tafarraqa","became divided"],["alladhīna","those who"],["ūtū","were given"],["l-kitāba","the Book"],["illā","until"],["min","from"],["baʿdi","after"],["mā","what"],["jāathumu","came (to) them"],["l-bayinatu","(of) the clear evidence"]],[["wamā","And not"],["umirū","they were commanded"],["illā","except"],["liyaʿbudū","to worship"],["l-laha","Allah"],["mukh'liṣīna","(being) sincere"],["lahu","to Him"],["l-dīna","(in) the religion"],["ḥunafāa","upright"],["wayuqīmū","and to establish"],["l-ṣalata","the prayer"],["wayu'tū","and to give"],["l-zakata","the zakah"],["wadhālika","And that"],["dīnu","(is the) religion"],["l-qayimati","the correct"]],[["inna","Indeed"],["alladhīna","those who"],["kafarū","disbelieve"],["min","from"],["ahli","(the) People"],["l-kitābi","(of) the Book"],["wal-mush'rikīna","and the polytheists"],["fī","(will be) in"],["nāri","(the) Fire"],["jahannama","(of) Hell"],["khālidīna","abiding eternally"],["fīhā","therein"],["ulāika","Those "],["hum","they"],["sharru","(are the) worst"],["l-bariyati","(of) the creatures"]],[["inna","Indeed"],["alladhīna","those who"],["āmanū","believe"],["waʿamilū","and do"],["l-ṣāliḥāti","righteous deeds"],["ulāika","those "],["hum","they"],["khayru","(are the) best"],["l-bariyati","(of) the creatures"]],[["jazāuhum","Their reward"],["ʿinda","(is) with"],["rabbihim","their Lord "],["jannātu","Gardens"],["ʿadnin","(of) Eternity"],["tajrī","flow"],["min","from"],["taḥtihā","underneath them"],["l-anhāru","the rivers"],["khālidīna","will abide"],["fīhā","therein"],["abadan","forever"],["raḍiya","(will be) pleased"],["l-lahu","Allah"],["ʿanhum","with them"],["waraḍū","and they (will be) pleased"],["ʿanhu","with Him"],["dhālika","That"],["liman","(is) for whoever"],["khashiya","feared"],["rabbahu","his Lord"]]],"uzl":["Ahli kitob va mushriklardan boʻlgan kufr keltirganlar «bayyina» kelmaguncha ajralmasdilar.","U (bayyina), Alloh tarafidan yuborilgan Rasul boʻlib, poklangan sahifalarni tilovat qiladur.","Ularda ajoyib bitiklar bor.","Kitob berilganlar ularga «bayyina» kelganidan soʻnggina boʻlinib ketishdi.","Holbuki, ular faqat Allohgagina ibodat qilishga, Uning dinigagina ixlos qilishga, boshqa dinlarga moyil boʻlmaslikka, namozni toʻliq oʻqishga, zakot berishga buyurilgan edilar. Ana shu, toʻgʻri(millat)ning dinidir.","Albatta, ahli kitob va mushriklardan boʻlgan kufr keltirganlar jahannam oʻtidadurlar, u yerda abadiy qolurlar. Undaylar xaloyiqning eng yomonidirlar.","Albatta, iymon keltirganlar va solih amallarni qilganlar, ana oʻshalar, xaloyiqning eng yaxshisidir.","Ularning mukofotlari Robbilari huzuridagi (daraxtlari) ostidan anhorlar oqib turgan «adn» jannatlaridir. U yerda abadul-abad qolurlar. Alloh ulardan rozi boʻldi, ular ham Undan rozi boʻldilar. Bu, Robbidan qoʻrqqanlar uchundir."],"t":[["Лам якунил-лазийна кафару мин аҳлил-китаби вал-мушрикийна мунфаккийна ҳатта татияҳумул-байина","Лам якунил-лазийна кафару мин аҳлил-китаби вал-мушрикийна мунфаккийна ҳатта татияҳумул-байина","Lam yakunil-laziyna kafaru min ahlil-kitabi val-mushrikiyna munfakkiyna hatta tatiyahumul-bayina"],["Росулун миналлоҳи ятлу суҳуфан мутоҳҳаро","Росулун миналлоҳи ятлу суҳуфан мутоҳҳаро","Rosulun minallohi yatlu suhufan mutohharo"],["Фийҳа кутубун қоййима","Фийҳа кутубун қоййима","Fiyha kutubun qoyyima"],["Вама тафарроқол-лазийна утул-китаба илла мин баъди ма жаъасумул-байина","Вама тафарроқол-лазийна утул-китаба илла мин баъди ма жаъасумул-байина","Vama tafarroqol-laziyna utul-kitaba illa min baʼdi ma jaʼasumul-bayina"],["Вама умиру илла лияъбудуллоҳа мухлисийна лаҳуд-дийна ҳунафаъа ваюқиймус-солата ваютуз-заката вазалика дийнул-қойима","Вама умиру илла лияъбудуллоҳа мухлисийна лаҳуд-дийна ҳунафаъа ваюқиймус-солата ваютуз-заката вазалика дийнул-қойима","Vama umiru illa liyaʼbudulloha muxlisiyna lahud-diyna hunafaʼa vayuqiymus-solata vayutuz-zakata vazalika diynul-qoyima"],["Иннал-лазийна кафару мин аҳлил-китаби вал-мушрикийна фий нари жаҳаннама холидийна фийҳа улаъика ҳум шаррул-бария","Иннал-лазийна кафару мин аҳлил-китаби вал-мушрикийна фий нари жаҳаннама холидийна фийҳа улаъика ҳум шаррул-бария","Innal-laziyna kafaru min ahlil-kitabi val-mushrikiyna fiy nari jahannama xolidiyna fiyha ulaʼika hum sharrul-bariya"],["Иннал-лазийна аману ваъамилус-солиҳати улаъика ҳум хойрул-бария","Иннал-лазийна аману ваъамилус-солиҳати улаъика ҳум хойрул-бария","Innal-laziyna amanu vaʼamilus-solihati ulaʼika hum xoyrul-bariya"],["Жазаъуҳум ъинда роббиҳим жаннату ъаднин тажрий мин таҳтиҳал-анҳару холидийна фийҳа абадан розияллоҳу ъанҳум варозу ъанҳу залика лиман хошия роббаҳ","Жазаъуҳум ъинда роббиҳим жаннату ъаднин тажрий мин таҳтиҳал-анҳару холидийна фийҳа абадан розияллоҳу ъанҳум варозу ъанҳу залика лиман хошия роббаҳ","Jazaʼuhum ʼinda robbihim jannatu ʼadnin tajriy min tahtihal-anharu xolidiyna fiyha abadan roziyallohu ʼanhum varozu ʼanhu zalika liman xoshiya robbah"]],"wt":[[["лам","лам","lam"],["якуни","якуни","yakuni"],["аллазийна","аллазийна","allaziyna"],["кафару","кафару","kafaru"],["мин","мин","min"],["аҳли","аҳли","ahli"],["ал-китаби","ал-китаби","al-kitabi"],["вал-мушрикийна","вал-мушрикийна","val-mushrikiyna"],["мунфаккийна","мунфаккийна","munfakkiyna"],["ҳатта","ҳатта","hatta"],["татияҳуму","татияҳуму","tatiyahumu"],["ал-байинату","ал-байинату","al-bayinatu"]],[["росулун","росулун","rosulu maiy ya'mal mithqala zarratin khai raiy-yarah","So whoever does an atom's weight of good will see it,","Тот, кто сделал добро весом в мельчайшую частицу, увидит его.","Бас, ким зарра оғирлигида яхшилик қилса ҳам кўрадир."],["وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍۢ شَرًّۭا يَرَهُۥ","Wa maiy-y'amal mithqala zarratin sharraiy-yarah","And whoever does an atom's weight of evil will see it.","И тот, кто сделал зло весом в мельчайшую частицу, увидит его.","Ва ким зарра оғирлигида ёмонлик қилса ҳам кўрадир."]],"b":1,"type":"Medinan","w":[[["idhā","When"],["zul'zilati","is shaken"],["l-arḍu","the earth"],["zil'zālahā","(with) its earthquake"]],[["wa-akhrajati","And brings forth"],["l-arḍu","the earth"],["athqālahā","its burdens"]],[["waqāla","And says"],["l-insānu","man"],["mā","What"],["lahā","(is) with it"]],[["yawma-idhin","That Day"],["tuḥaddithu","it will report"],["akhbārahā","its news"]],[["bi-anna","Because"],["rabbaka","your Lord"],["awḥā","inspired"],["lahā","[to] it"]],[["yawma-idhin","That Day"],["yaṣduru","will proceed"],["l-nāsu","the mankind"],["ashtātan","(in) scattered groups"],["liyuraw","to be shown"],["aʿmālahum","their deeds"]],[["faman","So whoever"],["yaʿmal","does"],["mith'qāla","(equal to the) weight"],["dharratin","(of) an atom"],["khayran","good"],["yarahu","will see it"]],[["waman","And whoever"],["yaʿmal","does"],["mith'qāla","(equal to the) weight"],["dharratin","(of) an atom"],["sharran","evil"],["yarahu","will see it"]]],"uzl":["Vaqtiki, yer oʻziga xos zilzilaga tushsa...","Va yer oʻz yuklarini otib chiqarsa...","Va inson: «Unga nima boʻldi?!» – desa...","Oʻsha kunda u (er) oʻz xabarini aytadir.","Sening Robbing unga vahiy yuborgani uchundir.","Oʻsha kunda odamlar amallarini koʻrish uchun joylaridan guruh-guruh boʻlib qoʻzgʻalurlar.","Bas, kim zarra ogʻirligida yaxshilik qilsa ham koʻradir.","Va kim zarra ogʻirligida yomonlik qilsa ham koʻradir."],"t":[["Иза зулзилатил-арзу зилзалаҳа","Иза зулзилатил-арзу зилзалаҳа","Iza zulzilatil-arzu zilzalaha"], rse","c":7,"a":[["ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ","Allahu laaa ilaaha illaa Huwal Haiyul Qaiyoom","Allah - there is no deity except Him, the Ever-Living, the Sustainer of [all] existence.","Аллах - нет божества, кроме Него, Живого, Вседержителя.","Аллоҳ Ундан ўзга илоҳ йўқ зотдир. У тирик ва қаййумдир."],["لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭ ۚ","laa taakhuzuhoo sinatunw wa laa nawm","Neither drowsiness overtakes Him nor sleep.","Им не овладевают ни дремота, ни сон.","Уни мудроқ ҳам, уйқу ҳам олмас."],["لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ","lahoo maa fissamaawaati wa maa fil ard","To Him belongs whatever is in the heavens and whatever is on the earth.","Ему принадлежит то, что на небесах, и то, что на земле.","Осмонлару ердаги нарсалар Уникидир."],["مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ","man zal lazee yashfa'u indahooo illaa bi-iznih","Who is it that can intercede with Him except by His permission?","Кто станет заступаться перед Ним без Его дозволения?","Унинг ҳузурида Ўзининг изнисиз ҳеч ким шафоат қила олмас."],["يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ","ya'lamu maa baina aydeehim wa mww khalfahum wa laa yuheetoona bishai'im min 'ilmihee illaa bimaa shaaa'","He knows what is [presently] before them and what will be after them, and they encompass not a thing of His knowledge except for what He wills.","Он знает их будущее и прошлое. Они постигают из Его знания только то, что Он пожелает.","У уларнинг олдиларидаги нарсани ҳам, ортларидаги нарсани ҳам билур. Унинг илмидан ҳеч нарсани иҳота қила олмаслар, магар Ўзи хоҳлаганини, халос."],["وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ","wasi'a Kursiyyuhus samaawaati wal arda wa laa ya'ooduho hifzuhumaa","His Kursi extends over the heavens and the earth, and their preservation tires Him not.","Его Престол (Подножие Трона) объемлет небеса и землю, и не т /* ---------- Uzbek Cyrillic → Latin ---------- */
const CYR2LAT = {'а':'a','б':'b','в':'v','г':'g','д':'d','ж':'j','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'x','ч':'ch','ш':'sh','щ':'sh','ъ':'ʼ','ы':'i','ь':'','э':'e','ю':'yu','я':'ya','ё':'yo','ў':'oʻ','қ':'q','ғ':'gʻ','ҳ':'h','ц':'ts'};
function cyr2lat(s){
  if(!s) return s;
  let out=''; const chars=[...s];
  for(let i=0;i<chars.length;i++){
    const ch=chars[i], lo=ch.toLowerCase(), isUp = ch!==lo; let r;
    if(lo==='е'){ const prev=(chars[i-1]||' ').toLowerCase(); r = (/[\s«"(\-–—.,!?:;'ʼ]/.test(prev) || i===0 || 'аеёиоуўэюяъь'.includes(prev)) ? 'ye' : 'e'; }
    else if(lo in CYR2LAT){ r=CYR2LAT[lo]; } else { out+=ch; continue; }
    if(isUp && r){ const next=chars[i+1]; const nextUp = next && next!==next.toLowerCase(); r = nextUp ? r.toUpperCase() : r.charAt(0).toUpperCase()+r.slice(1); }
    out+=r;
  }
  return out;
}

/* ---------- Latin transliteration → Cyrillic (для RU и ЎЗ интерфейса) ---------- */
function lat2cyr(src, mode){ // mode: 'tz' (Tanzil: ' = айн/хамза) | 'qc' (quran.com: ' = разделитель слогов)
  if(!src) return src;
  const uz = S.lang==='uzc';
  let s = String(src).normalize('NFC');
  if(mode==='qc') s=s.replace(/'/g,'');
  const multi = [['sh','ш'],['kh','х'],['th','с'],['dh','з'],['gh',uz?'ғ':'г'],['ch','ч'],['aa','а'],['ee','и'],['oo','у'],['ya','я'],['yu','ю']];
  const single = {a:'а',b:'б',c:'к',d:'д',e:'е',f:'ф',g:'г',h:uz?'ҳ':'х',i:'и',j:uz?'ж':'дж',k:'к',l:'л',m:'м',n:'н',o:'о',p:'п',q:uz?'қ':'к',r:'р',s:'с',t:'т',u:'у',v:'в',w:'в',x:'х',y:'й',z:'з',
    'ā':'а','ī':'и','ū':'у','ḥ':uz?'ҳ':'х','ṣ':'с','ḍ':'д','ṭ':'т','ẓ':'з','ʿ':'ъ',"'":'ъ','ʾ':'ъ'};
  let out=''; let i=0;
  while(i<s.length){
    const ch=s[i], lo=ch.toLowerCase(), up=ch!==lo; let done=false;
    for(const [k,v] of multi){ if(s.substr(i,k.length).toLowerCase()===k){ out+= up? v.charAt(0).toUpperCase()+v.slice(1) : v; i+=k.length; done=true; break; } }
    if(done) continue;
    if(lo in single){ const v=single[lo]; out+= up? v.toUpperCase() : v; } else out+=ch;
    i++;
  }
  return out;
}

function mergeDefaults(s){

    const learned = Object.values(s.surahs||{}).filter(x=>x&&x.status==='learned').length;
    s.points = learned*PTS.surah + (s.stars||0)*10;
    s.ptsLog = [{t:Date.now(), k:s.points, r:'migrate'}];
    s.confirm = {require: !!(s.rewards&&s.rewards.requireConfirm), pending:(s.rewards&&s.rewards.pending)||[], given:[]};
    if(s.audio) s.audio.online = true;
    delete s.rewards; delete s.stars; s.v=2;
  }
  for(const k in d){ if(!(k in s)) s[k]=d[k]; else if(d[k] && typeof d[k]==='object' && !Array.isArray(d[k])){ for(const kk in d[k]) if(!(kk in s[k])) s[k][kk]=d[k][kk]; } }

  DEFAULT_ROUTE.forEach((n,k)=>{ if(!seen.has(n)){ const prev=DEFAULT_ROUTE[k-1]; const at=prev==null?0:s.route.indexOf(prev)+1; s.route.splice(at>0?at:s.route.length,0,n); seen.add(n); } });
  s.confirm.pending = [...new Set((s.confirm.pending||[]).map(Number))].filter(n=>known.has(n));
  s.points = Math.max(0, Math.round(+s.points||0));
  for(const k in s.surahs){ const p=s.surahs[k]; if(!p||typeof p!=='object'){ delete s.surahs[k]; continue; } if(!Array.isArray(p.tests)) p.tests=[]; if(!p.weak||typeof p.weak!=='object') p.weak={}; if(!p.got||typeof p.got!=='object') p.got={}; if(p.status==='learned' && s.ptsLog && s.ptsLog.length && s.ptsLog[s.ptsLog.length-1].r==='migrate') p.got.surah=1; }

  let h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]; const w=new Uint32Array(64);
  const r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<withPad;o+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){ const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3), s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0; }

    h=[(h[0]+a)>>>0,(h[1]+b)>>>0,(h[2]+c)>>>0,(h[3]+d)>>>0,(h[4]+e)>>>0,(h[5]+f)>>>0,(h[6]+g)>>>0,(h[7]+hh)>>>0];

async function idbClear(){ const db=await idbOpen(); if(!db) return; return new Promise(res=>{ try{ const tx=db.transaction('audio','readwrite'); tx.objectStore('audio').clear(); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }catch(e){res();} }); }

let CACHED = new Set();

function audioReset(){ Object.values(AUD.urls).forEach(u=>{ if(String(u).startsWith('blob:')) URL.revokeObjectURL(u); }); AUD.urls={}; }
function stopAudio(){ if(AUD.tick){ clearInterval(AUD.tick); AUD.tick=null; } AUD.token++; AUD.playing=false; if(AUD.el){ try{AUD.el.pause();}catch(e){} } if(AUD.onstate) AUD.onstate(null); }

    a.onended=()=>fin(true); a.onerror=()=>fin(false);
    const go=()=>{ if(range){ try{ a.currentTime=range[0]; }catch(e){} AUD.tick=setInterval(()=>{ if(token!==undefined && token!==AUD.token){ fin(false); return; } if(a.currentTime>=range[1]){ a.pause(); fin(true); } },40); }

async function playSequence(n, indices, onEach, withBism){

  for(const i of indices){ if(tok!==AUD.token) return; if(onEach) onEach(i); const ok=await playAyah(n,i,tok); if(!ok || tok!==AUD.token) break; await new Promise(r=>setTimeout(r,300)); }

async function playWord(n,i,k){
  if(!S.audio.wordAudio) return;
  const key='wbw/'+n+'_'+i+'_'+k; let src=null;
  if(AUD.urls[key]) src=AUD.urls[key];
  else { const blob=await idbGet(key); if(blob){ src=AUD.urls[key]=URL.createObjectURL(blob); } }
  if(!src){ if(!online()) return; const sg=isSeg(n), sn=sg?QURAN[n].src[0]:n, sa=sg?QURAN[n].src[1]:i+1, sw=(sg?QURAN[n].wo[i]:0)+k+1;

    if(S.audio.autoCache){ fetch(src).then(r=>r.ok?r.blob():null).then(b=>{ if(b&&b.size>300) idbPut(key,b); }).catch(()=>{}); } }

}
async function downloadAll(onProgress){
  if(AUD.dl) return; AUD.dl={done:0,total:0,fail:0};
  await refreshCached(); const todo=allAudioKeys().filter(([n,i])=>!hasCached(n,i)); AUD.dl.total=todo.length;
  let idx=0; const worker=async()=>{ while(idx<todo.length && AUD.dl){ const [n,i]=todo[idx++]; const ok=await fetchToCache(n,i); if(!AUD.dl) return; if(ok) AUD.dl.done++; else AUD.dl.fail++; if(onProgress) onProgress(AUD.dl); } };
  await Promise.all([worker(),worker(),worker(),worker()]);
  const res=AUD.dl; AUD.dl=null; return res;
}

/* =========================================================
   Quiz engine — задания строятся ТОЛЬКО из проверенного текста.
   Везде, где есть арабский, показываем транслитерацию (кириллица/латиница)
   и/или перевод смысла — чтобы задания были понятны ребёнку,
   который ещё не читает по-арабски.
   ========================================================= */
function otherAyahs(n, excludeSkels, count){
  const ex=new Set(excludeSkels); const res=[];
  shuffle(QURAN[n].a.map((a,j)=>j)).forEach(j=>{ const k=skel(ar(n,j)); if(res.length<count && !ex.has(k)){ res.push({n,i:j}); ex.add(k);} });
  if(res.length<count){ for(const m of shuffle(S.route.filter(m=>m!==n))){ if(res.length>=count) break; const j=Math.floor(Math.random()*ayahCount(m)); const k=skel(ar(m,j)); if(!ex.has(k)){ res.push({n:m,i:j}); ex.add(k);} } }
  return res;
}
function canNext(n,i){
  const c=ayahCount(n); if(i>=c-1) return false;
  const k=skel(ar(n,i)), nk=skel(ar(n,i+1));
  for(let j=0;j<c;j++){ if(j!==i && skel(ar(n,j))===k){ const nn = j<c-1 ? skel(ar(n,j+1)) : null; if(nn!==nk) return false; } }
  return true;
}
function wordItems(n,i){ return wordsOf(n,i).map((w,k)=>({w,k,key:skel(w)})); }
const GEN = {
  next(n,i){ if(!canNext(n,i)){ const c=[...Array(ayahCount(n)).keys()].filter(j=>canNext(n,j)); if(!c.length) return null; i=pick(c); }
    return {type:'next',n,i,ayah:i+1,opts:shuffle([{n,i:i+1,ok:true}].concat(otherAyahs(n,[skel(ar(n,i)),skel(ar(n,i+1))],2)))}; },
  missing(n,i){ const ws=wordItems(n,i); const cand=ws.filter(x=>x.key.replace(/\s/g,'').length>=2); if(ws.length<2||!cand.length) return null;
    const right=pick(cand); const ex=new Set([right.key]); const pool=[];
    const allW=shuffle(QURAN[n].a.flatMap((a,ii)=>wordItems(n,ii).map(x=>({n,i:ii,k:x.k,w:x.w,key:x.key}))));
    allW.forEach(x=>{ if(pool.length<2 && !ex.has(x.key) && x.key.replace(/\s/g,'').length>=2){ pool.push(x); ex.add(x.key);} });
    if(pool.length<2){ for(const m of shuffle(S.route)){ if(pool.length>=2) break; const xs=shuffle(wordItems(m,0)); for(const x of xs){ if(!ex.has(x.key)&&x.key.length>=2){ pool.push({n:m,i:0,k:x.k,w:x.w,key:x.key}); ex.add(x.key); break; } } } }
    return {type:'missing',n,i,ayah:i,k:right.k,opts:shuffle([{n,i,k:right.k,w:right.w,ok:true}].concat(pool))}; },
  meaning(n,i){ return {type:'meaning',n,i,ayah:i,opts:shuffle([{n,i,ok:true}].concat(otherAyahs(n,[skel(ar(n,i))],2)))}; },
  audio(n,i){ if(!canPlay(n)) return null; return {type:'audio',n,i,ayah:i,opts:shuffle([{n,i,ok:true}].concat(otherAyahs(n,[skel(ar(n,i))],2)))}; },
  order(n,i,exact){ const c=ayahCount(n); if(c<2) return null; const k=Math.min(4,c); let s=exact? Math.max(0,Math.min(i,c-k)) : Math.max(0,Math.min(i-1,c-k)); if(isNaN(s)) s=0;
    const items=[]; for(let j=s;j<s+k;j++) items.push({n,i:j,key:skel(ar(n,j))});
    return {type:'order',n,i:s,ayah:s,items:shuffledDifferent(items,x=>x.key),correct:items.map(x=>x.key),picked:[]}; },
  words(n,i,part){ const all=wordItems(n,i); if(all.length<3) return null; const ch=wordChunks(all.length); const pi = part==null ? Math.floor(Math.random()*ch.length) : Math.min(part,ch.length-1); const [a,b]=ch[pi]; const ws=all.slice(a,b);
    return {type:'words',n,i,ayah:i,partial:ch.length>1,pre:all.slice(0,a),more:b<all.length,items:shuffledDifferent(ws,x=>x.key),correct:ws.map(x=>x.key),picked:[]}; },
  which(n,i,pool){ const others=shuffle(pool.filter(m=>m!==n)).slice(0,2); if(others.length<1) return null; return {type:'which',n,i,ayah:i,opts:shuffle([{s:n,ok:true}].concat(others.map(s=>({s}))))}; }
};
/* Длинный аят делим на подряд идущие куски по 4–6 слов — всегда от начала аята */
function wordChunks(len){ if(len<=7) return [[0,len]]; const k=Math.ceil(len/6), sz=Math.ceil(len/k); const out=[]; for(let a=0;a<len;a+=sz) out.push([a,Math.min(len,a+sz)]); return out; }
function buildQuestions(n, count, types, focus){
  const c=ayahCount(n); const qs=[]; let order=shuffle([...Array(c).keys()]);
  if(focus && focus.length) order = focus.concat(order.filter(x=>!focus.includes(x)));
  let ti=0, ai=0, guard=0;
  while(qs.length<count && guard<count*12){ guard++; const type=types[ti%types.length]; ti++; const i=order[ai%order.length]; const q=GEN[type](n,i); if(q){ qs.push(q); ai++; } }
  return qs;
}
function lessonTypes(n){ const base=['next','missing','order','meaning','words']; if(canPlay(n)) base.splice(2,0,'audio'); return base; }

    }
  }

function sparkle(el){

function route(){
  const h=decodeURIComponent(location.hash.replace(/^#/,'')); const [name,arg]=h.split('/');
  stopAudio(); QZ=null;
  const ok=['home','map','lesson','games','game','review','progress','rewards','achievements','parent','about'];

/* ---------- Lesson ---------- */
function startLesson(n){
  const p=sp(n); if(p.status==='new'){ p.status='progress'; p.stage=0; logEvent('start',{n}); save(); }
  const stage = p.status==='learned' ? 0 : Math.min(p.stage,5);
  if(!L || L.n!==n) L={n, stage, cur:0, reads:{}, readNeed:3, memIdx:p.memIdx||0, memHidden:false, result:null, wordMode:false};
}
function award(n, key, pts, x, y){ const p=sp(n); if(p.got[key]) return; p.got[key]=1; addPoints(pts, key, x, y); }
function setStage(k){
  const p=sp(L.n);
  if(k===2) award(L.n,'listen',PTS.listen);
  L.stage=k; L.ig=null; if(p.status!=='learned' && k>p.stage){ p.stage=k; } save(); stopAudio(); QZ=null; render(); window.scrollTo({top:0,behavior:'smooth'});
}
function stepper(){ const p=sp(L.n); const reached = p.status==='learned'?6:p.stage;
  return '<div class="stepper" role="list"><div class="steptrack"><i style="width:'+Math.round(L.stage/6*100)+'%"></i></div>'+STAGES.map((s,k)=>'<button class="st '+(k<L.stage||(p.status==='learned'&&k!==L.stage)?'done':'')+(k===L.stage?' cur':'')+'" '+(k<=reached&&k<6?'data-a="stage" data-k="'+k+'"':'disabled')+' role="listitem" aria-label="'+esc(t('stage_'+s))+'"><i>'+ic(STAGE_IC[k])+'</i><span>'+esc(t('stage_'+s))+'</span></button>').join('')+'</div>'; }
function vLesson(){
  if(!L) return '';

function memSteps(n){
  const c=ayahCount(n); const block = c<=4?c: c<=8?4:3; const steps=[];
  for(let s=0;s<c;s+=block){ const e=Math.min(c,s+block); for(let i=s;i<e;i++){ steps.push([i,i]); if(i>s) steps.push([s,i]); } }
  if(c>block && c<=12) steps.push([0,c-1]);
  return steps;
}

function onTestDone(n,res){
  const p=sp(n); const prevBest=p.best||0; p.tests.push({d:Date.now(),s:res.score}); if(p.tests.length>30) p.tests.shift();
  res.wrongAyahs.forEach(i=>{ p.weak[i]=(p.weak[i]||0)+1; }); res.results.filter(r=>r.ok).forEach(r=>{ if(p.weak[r.ayah]) p.weak[r.ayah]=Math.max(0,p.weak[r.ayah]-1); });
  if(p.tests.length>1 && res.score>prevBest && prevBest>0) S.improved=true;
  p.best=Math.max(prevBest,res.score); if(res.score>S.records.bestScore) S.records.bestScore=res.score;
  markActivity(); logEvent('test',{n,score:res.score});
  L.result=res; L.gotNow=0;
  if(res.score>=PASS){
    S.checks++; if(res.score===100) S.records.perfectTests++;
    let g=0;
    if(!p.got.test){ p.got.test=1; g+=PTS.test; if(res.score===100) g+=PTS.perfect; } else g+=5;
    if(p.status!=='learned'){ p.status='learned'; p.stage=6; p.learnedAt=Date.now(); p.memIdx=0; logEvent('learned',{n});
      if(!p.got.surah){ if(S.confirm.require){ if(!S.confirm.pending.includes(n)) S.confirm.pending.push(n); } else { p.got.surah=1; g+=PTS.surah; } } }
    L.gotNow=g; L.celebrate=true; save();
    setTimeout(()=>addPoints(g,'lesson'), 400);
  }
  save(); checkAch(); render();
}

      res.results.forEach(r=>{ if(r.ok && p.weak[r.ayah]) p.weak[r.ayah]=Math.max(0,p.weak[r.ayah]-1); });
      res.wrongAyahs.forEach(i=>{ p.weak[i]=(p.weak[i]||0)+1; });

/* «Собери суру»: идём по суре с самого начала — аяты 1–4, затем 5–8 … (для коротких сур — вся сура, 2 раза) */
function buildWindows(n){ const c=ayahCount(n), k=Math.min(4,c), qs=[]; for(let s=0; s<c; s+=k){ const q=GEN.order(n, Math.min(s,c-k), true); if(q) qs.push(q); if(s+k>=c) break; }
  if(qs.length===1){ const q=GEN.order(n,0,true); if(q) qs.push(q); } return qs; }
function gameDone(score){
  G.done=true; G.final=score; markActivity(); bump('game'); logEvent('game',{g:G.kind,score}); save(); checkAch(); SFX.win(); confetti();
  const pts = score==null||score>=60 ? PTS.game + ((score===100||score==null)?PTS.gamePerfect:0) : 5;
  G.pts=pts; if(G.kind==='bubbles'){ const nx=G.start+G.rounds.length; S.bubPos[G.n]= nx>=G.all.length?0:nx; save(); } render(); setTimeout(()=>addPoints(pts,'game'),400);
}

}

  G.items=idx; G.left=shuffle(idx); G.right=shuffle(idx); G.sel=null; G.matched=[]; }

function setupMemory(){ const pool=S.route.filter(isUnlocked); const ns=(pool.length>=6?shuffle(pool).slice(0,6):S.route.slice(0,6)); G.cards=shuffle(ns.flatMap(n=>[{n,side:'name'},{n,side:'mean'}])); G.open=[]; G.doneN=[]; G.moves=0; G.lock=false; }

/* «Пузыри»: всегда по порядку — с 1-го аята и 1-го слова. Длинный аят идёт кусками подряд (слова 1–6, 7–12 …).
   За одну игру — до 5 раундов; следующая игра продолжает с того места, где остановились (или начните сначала). */
function bubbleRounds(n){ const out=[]; for(let i=0;i<ayahCount(n);i++){ wordChunks(wordsOf(n,i).length).forEach(([a,b],ci,arr)=>out.push({i,a,b,part:ci,parts:arr.length})); } return out; }
function setupBubbles(fromStart){
  const all=bubbleRounds(G.n); let st = fromStart ? 0 : (S.bubPos[G.n]||0); if(st>=all.length) st=0;
  G.all=all; G.start=st; G.rounds=all.slice(st, st+5); G.round=0; G.mistakes=0; nextBubbleRound();
}
function nextBubbleRound(){
  const r=G.rounds[G.round], i=r.i; const ws=wordsOf(G.n,i).map((w,k)=>({w,k,key:skel(w)})).slice(r.a,r.b);
  G.bi=i; G.br=r; G.target=ws; G.got=0;
  G.bubbles=shuffle(ws.map((x,idx)=>Object.assign({idx},x))).map((b,j,arr)=>Object.assign(b,{left:4+Math.round(j*(78/Math.max(1,arr.length-1))), dur:6+Math.random()*4, delay:-Math.random()*5}));
}
function bubblesHtml(){
  const i=G.bi, r=G.br, all=wordsOf(G.n,i);
  const need=G.target[G.got];
  // подсказка: всё чтение аята буквами, уже найденные слова — зелёные, следующее — подсвечено
  const guide=all.map((w,k)=>{ const cls = k<r.a+G.got ? 'done' : (need&&k===need.k) ? 'next' : (k<r.b?'todo':'later'); return '<span class="gw '+cls+'">'+esc(wTr(G.n,i,k))+'</span>'; }).join(' ');
  const prev = i>0 && r.a===0 ? '<div class="bprev"><small class="sub">'+esc(t('before_this'))+'</small><div class="ar xs">'+esc(ar(G.n,i-1))+'</div></div>' : '';

    trLine(G.n,i)+'<div class="bguide" dir="ltr">'+guide+'</div>'+(need?'<div class="sub">'+esc(t('bub_find'))+' <b class="gw next">'+esc(wTr(G.n,i,need.k))+'</b></div>':'')+
    '<div class="bslots">'+(r.a>0?'<span class="bslot on fixed">…</span>':'')+G.target.map((x,k)=>'<span class="bslot'+(k<G.got?' on':'')+(k===G.got?' nextslot':'')+'">'+(k<G.got?'<span class="ar">'+esc(x.w)+'</span><small class="wtl" dir="ltr">'+esc(wTr(G.n,i,x.k))+'</small>':(k+1+r.a))+'</span>').join('')+'</div></div>'+
    '<div class="arena" id="arena">'+G.bubbles.map(b=>'<button class="bub'+(b.idx<G.got?' gone':'')+'" data-a="bubTap" data-x="'+b.idx+'" style="left:'+b.left+'%;animation-duration:'+b.dur.toFixed(1)+'s;animation-delay:'+b.delay.toFixed(1)+'s"><span class="ar">'+esc(b.w)+'</span><small class="wtl" dir="ltr">'+esc(wTr(G.n,i,b.k))+'</small></button>').join('')+'</div><div class="feedback" id="fb" aria-live="polite"></div>';
}

    downloadAll(p=>updateDlUi(p)).then(res=>{ if(!res) return; refreshCached().then(()=>{ toast(ic('check')+esc(res.fail? t('dl_partial',{x:res.done,f:res.fail}) : t('dl_done'))); if(V.name==='home'||V.name==='parent') render(); }); }); },
  dlHide(){ S.audioBannerHidden=true; save(); render(); },
  openSurah(d){ SFX.tap(); surahCard(+d.n); },
  showText(d){ const el=$('#fullText'); if(el) el.innerHTML = el.innerHTML ? '' : fullTextHtml(+d.n); },
  startLesson(d){ closeModal(true); L=null; const n=+d.n; if(!isUnlocked(n)) return; const p=sp(n); if(p.status==='learned'){ L={n,stage:0,cur:0,reads:{},readNeed:3,memIdx:0,memHidden:false,result:null,wordMode:false}; } go('lesson',n); },
  reviewSurah(d){ closeModal(true); startReview(+d.n); if(V.name==='review') render(); else { location.hash='#review'; } },
  weakPractice(d){ const n=+d.n; const w=Object.entries((S.surahs[n]||{}).weak||{}).filter(([k,v])=>v>0).map(([k])=>+k); startReview(n,w); render(); },
  endGame(){ G=null; QZ=null; render(); },
  stage(d){ setStage(+d.k); },

  setCur(d){ L.cur=+d.i; $$('.ayah.cur').forEach(e=>e.classList.remove('cur')); const el=$('#ay'+L.cur); if(el) el.classList.add('cur'); const pl=$('#curPill'); if(pl) pl.textContent=t(unitKey(L.n,'ayah_x_of_y'),{x:L.cur+1,y:ayahCount(L.n)}); if(canPlay(L.n)) playSequence(L.n,[L.cur]); },
  curPrev(){ if(L.cur>0){ L.cur--; stopAudio(); render(); } },
  curNext(){ if(L.cur<ayahCount(L.n)-1){ L.cur++; stopAudio(); render(); } },
  playAll(){ markActivity(); save(); playSequence(L.n,[...Array(ayahCount(L.n)).keys()], i=>{ L.cur=i; }, true); },
  playCur(){ playSequence(L.n,[L.cur]); },

function backupJson(){ return JSON.stringify({app:'QuranAdventure',format:2,version:APP_VERSION,exportedAt:new Date().toISOString(),state:S},null,1); }
function importBackup(text){
  let obj; try{ obj=JSON.parse(text); }catch(e){ toast(esc(t('import_bad'))); return; }
  const s = obj && obj.app==='QuranAdventure' ? obj.state : null;
  if(!s || !(s.v===1||s.v===2) || typeof s.surahs!=='object' || !Array.isArray(s.route)){ toast(esc(t('import_bad'))); return; }
  window.__pendingImport=s;
  const learned=Object.values(s.surahs).filter(x=>x&&x.status==='learned').length;
  openModal('<h2>'+esc(t('import_btn'))+'</h2><p>'+esc(t('import_q',{n:learned,d:obj.exportedAt?fmtDate(Date.parse(obj.exportedAt)):'?'}))+'</p><div class="toolbar"><button class="btn gold" data-a="importYes">'+esc(t('yes'))+'</button><button class="btn ghost" data-a="closeModal">'+esc(t('cancel'))+'</button></div>');

/* ---------- Init ---------- */
function init(){
  if(!S.lang){ const nl=(navigator.language||'ru').toLowerCase(); S.lang = nl.startsWith('uz') ? (nl.includes('cyrl')?'uzc':'uzl') : nl.startsWith('en') ? 'en' : 'ru'; }
  applyTheme();
  document.addEventListener('click', e=>{ const el=e.target.closest('[data-a]'); if(!el || el.disabled) return; const fn=A[el.dataset.a]; if(fn){ e.preventDefault(); try{ fn(el.dataset, el, e); }catch(err){ console.error('action '+el.dataset.a, err); try{ render(); }catch(e2){} } } });
  document.addEventListener('change', e=>{ const el=e.target.closest('[data-c]'); if(!el) return; const fn=C[el.dataset.c]; if(fn){ try{ fn(el); }catch(err){ console.error('change '+el.dataset.c, err); } } });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && $('#overlay')){ closeModal(); return; }
    const el=e.target; if((e.key==='Enter'||e.key===' ') && el && el.matches && el.matches('[data-a][tabindex],[role="button"][data-a]') && el.tagName!=='BUTTON'){ e.preventDefault(); el.click(); return; }
    if(e.key==='Enter' && el && el.id==='pin'){ A.pinCheck(); return; }
    if(V.name==='lesson' && L && (L.stage===1||L.stage===2) && !$('#overlay') && !(el && /INPUT|SELECT|TEXTAREA/.test(el.tagName))){ if(e.key==='ArrowLeft') A.curNext(); if(e.key==='ArrowRight') A.curPrev(); }
  });
  window.addEventListener('hashchange', route);
  let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{ const c=innerWidth<640; if(c!==compactMap){ compactMap=c; if(V.name==='map') render(); } },200); });
  window.addEventListener('online', ()=>{ if(V.name==='lesson') render(); });
  window.addEventListener('offline', ()=>{ if(V.name==='lesson') render(); });
  setInterval(()=>{ const r=S.reminders; if(r.enabled && reminderDue() && r.lastNotified!==todayKey() && 'Notification' in window && Notification.permission==='granted'){ try{ new Notification('Quran Adventure', {body:t('reminder_now')}); r.lastNotified=todayKey(); save(); }catch(e){} } }, 60000);
  daily(); save();
  refreshCached().then(()=>{ route(); if(!S.onboarded) onboarding(0); checkAch(); });
}
document.addEventListener('DOMContentLoaded', init);

  if(w.id==='oasis') art='<circle cx="300" cy="26" r="16" fill="#FFF3B0"/><path d="M0 78q90-26 180-6t180-8v26H0z" fill="#F2CF86"/>'+palm(70,72)+palm(250,70)+'<ellipse cx="160" cy="80" rx="40" ry="6" fill="#6FC6E8"/>';
  if(w.id==='sea') art='<path d="M0 52q30-8 60 0t60 0 60 0 60 0 60 0 60 0V90H0z" fill="#2F8FC0"/><path d="M0 64q30-8 60 0t60 0 60 0 60 0 60 0 60 0" stroke="#fff" stroke-opacity=".6" stroke-width="2.5" fill="none"/><path d="M40 84q10-12 20 0z M290 86q12-14 24 0z" fill="#FFB6A3"/><g transform="translate(200 74)"><path d="M0 0q9-6 18 0q-9 6-18 0zM18 0l6-5v10z" fill="#FFD84D"/></g>';
  if(w.id==='night') art='<path d="M300 14a14 14 0 1 0 10 24 16 16 0 1 1-10-24z" fill="#FFE9A8"/>'+[[40,20],[90,40],[140,16],[190,34],[230,12],[260,46],[110,64],[30,58]].map(([x,y])=>'<circle cx="'+x+'" cy="'+y+'" r="1.8" fill="#fff"/>').join('')+'<path d="M0 82q90-14 180-4t180-4v16H0z" fill="#26346F"/>';
  if(w.id==='garden') art='<path d="M0 74q90-12 180 0t180 0v16H0z" fill="#7CCB6B"/>'+[30,80,130,180,230,280,330].map((x,k)=>'<g transform="translate('+x+' '+(70-(k%2)*6)+')"><path d="M0 0v14" stroke="#3E8E4A" stroke-width="2"/><circle r="6" fill="'+['#FF7FB0','#FFD84D','#B98CFF','#FF9F6B'][k%4]+'"/><circle r="2.4" fill="#fff"/></g>').join('');
  if(w.id==='mount') art='<path d="M0 90L70 30l40 34 50-50 60 52 40-28 100 52z" fill="#6E86C9"/><path d="M160 14l-14 14h28zM70 30l-10 9h20z" fill="#fff"/><path d="M110 80l6-12 6 12zM240 84l5-10 5 10z" fill="#7FE3F5"/>';
  if(w.id==='city') art='<circle cx="60" cy="22" r="10" fill="#FFF0C2" opacity=".9"/><path d="M0 90V66h40V52a20 20 0 0 1 40 0v14h30V40l6-10 6 10v26h40V58a26 26 0 0 1 52 0v8h36V50l6-10 6 10v16h28V60a18 18 0 0 1 36 0v30z" fill="#3B2A6B"/>'+[70,150,250,320].map(x=>'<g transform="translate('+x+' 30)"><path d="M0 -10v6" stroke="#FFE7A0" stroke-width="1.5"/><rect x="-4" y="-4" width="8" height="11" rx="2" fill="#FFC531"/></g>').join('');
  if(w.id==='desert') art='<circle cx="290" cy="28" r="14" fill="#FFF3B0"/><path d="M0 70q60-24 140-6t220-10v36H0z" fill="#E8B062"/><path d="M0 82q90-12 200-2t160-4v14H0z" fill="#D69A4C"/><g transform="translate(110 56) scale(.9)" fill="#7A4A1E"><path d="M0 10q4-14 14-8q6-10 14 0q4-2 6 2l6-10q4 0 4 4l-4 4v10H0z"/><path d="M4 16v10M12 16v10M26 16v10M32 16v10" stroke="#7A4A1E" stroke-width="2.5"/></g>';
  if(w.id==='sky') art=[[60,30,1],[200,22,1.3],[300,50,.9],[120,62,.8]].map(([x,y,s])=>'<g transform="translate('+x+' '+y+') scale('+s+')" fill="#fff"><circle r="12"/><circle cx="14" cy="4" r="10"/><circle cx="-14" cy="4" r="9"/><rect x="-22" y="4" width="46" height="9" rx="4"/></g>').join('')+'<path d="M250 70q5-5 10 0q5-5 10 0M160 40q4-4 8 0q4-4 8 0" stroke="#3B6FA0" stroke-width="2" fill="none"/>';
  return '<svg class="scene '+(cls||'')+'" viewBox="0 0 360 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="sg'+w.id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+a+'"/><stop offset="1" stop-color="'+b+'"/></linearGradient></defs><rect width="360" height="90" fill="url(#sg'+w.id+')"/>'+art+'</svg>';
}
function palm(x,y){ return '<g transform="translate('+x+' '+y+')"><path d="M0 0q3-22 0-40" stroke="#8B5A2B" stroke-width="4" fill="none"/><path d="M0 -40q-16-6-24 6M0 -40q16-6 24 6M0 -40q-6-16-20-16M0 -40q6-16 20-16" stroke="#3E9B6A" stroke-width="6" fill="none" stroke-linecap="round"/></g>'; }

/* ---------- Полоска прогресса в стиле игры ---------- */
const METER_IC = {
  caravan:on=>'<svg viewBox="0 0 40 32" class="mtr-ic'+(on?'':' off')+'"><path d="M2 20q3-12 11-6q5-9 11 0q3-2 5 2l5-8q3 0 3 3l-3 4v9H2z" fill="'+(on?'#C9965A':'#D8D2C4')+'"/><path d="M5 25v6M11 25v6M22 25v6M27 25v6" stroke="'+(on?'#8B5A2B':'#C7C0B0')+'" stroke-width="2.4" stroke-linecap="round"/>'+(on?'<rect x="10" y="10" width="10" height="5" rx="2" fill="#E0565B"/>':'')+'</svg>',
  bloom:on=>on?'<svg viewBox="0 0 32 32" class="mtr-ic"><path d="M16 30V16" stroke="#3E8E4A" stroke-width="2.5"/><g transform="translate(4 2) scale(1)">'+ITEM_SVG.flower+'</g></svg>':'<svg viewBox="0 0 32 32" class="mtr-ic off"><path d="M16 30V18" stroke="#9CC79F" stroke-width="2.5"/><path d="M16 22q-6-2-7-7 6 0 7 7zM16 20q5-2 6-6-5 0-6 6z" fill="#9CC79F"/></svg>',
  climb:on=>'<svg viewBox="0 0 32 32" class="mtr-ic'+(on?'':' off')+'"><path d="M2 30h28v-6H2z" fill="'+(on?'#8FA6E8':'#D8D2C4')+'"/>'+(on?'<g transform="translate(9 6) scale(.6)">'+ITEM_SVG.crystal+'</g>':'')+'</svg>',
  lanterns:on=>'<svg viewBox="0 0 24 30" class="mtr-ic'+(on?' glow':' off')+'"><g transform="translate(0 3)">'+ITEM_SVG.lantern.replace('#FFC531',on?'#FFC531':'#D8D2C4').replace('#FFF6C9',on?'#FFF6C9':'#E9E4D8')+'</g></svg>',
  pearls:on=>'<svg viewBox="0 0 32 28" class="mtr-ic'+(on?'':' off')+'">'+(on?'<path d="M3 22a13 9 0 0 1 26 0z" fill="#FFB6A3"/><circle cx="16" cy="15" r="5" fill="#F4F1FF" stroke="#C8C0E8"/><path d="M3 22a13 13 0 0 1 26 0" stroke="#E58A73" stroke-width="1.5" fill="none" transform="rotate(-160 16 22)"/>':'<path d="M3 22a13 13 0 0 1 26 0z" fill="#E6DED3"/><path d="M8 22l3-9M16 22V10M24 22l-3-9" stroke="#CFC5B6" stroke-width="1.5"/>')+'</svg>',
  bridge:on=>'<svg viewBox="0 0 30 26" class="mtr-ic'+(on?'':' off')+'"><rect x="2" y="9" width="26" height="8" rx="2" fill="'+(on?'#B5652E':'#E2D8C8')+'" stroke="'+(on?'#7A3F17':'#CFC5B6')+'" stroke-width="1.5"/><path d="M0 22q7-4 15 0t15 0" stroke="#6FC6E8" stroke-width="2" fill="none"/></svg>'
};
function meterHtml(kind, total, done, res){
  const ig=kind;
  let slots='';
  for(let k=0;k<total;k++){
    const on = res ? !!(res[k]&&res[k].ok) : k<done;
    const miss = res && res[k] && !res[k].ok;
    const style = ig==='climb' ? ' style="transform:translateY('+(-(k*5))+'px)"' : '';
    slots += '<span class="mslot'+(on?' on':'')+(miss?' miss':'')+(k===done&&!res?' nexts':'')+'"'+style+'>'+(METER_IC[ig]?METER_IC[ig](on):itemSvg(ig,'',!on))+'</span>';
  }
  if(ig==='climb') slots+='<span class="mslot flag"'+' style="transform:translateY('+(-(total*5))+'px)"><svg viewBox="0 0 24 24" class="mtr-ic"><path d="M6 22V3" stroke="#7A4A1E" stroke-width="2"/><path d="M6 3h12l-3 4 3 4H6z" fill="#E0565B"/></svg></span>';
  return '<div class="meter m-'+ig+'">'+slots+'</div>';
}

/* ---------- Тексты ---------- */
function wName(w){ return t('w_'+w.id); }
function gName(g){ return t('ig_'+g); }

/* Вступление острова: мир + история + какая игра ждёт */
function islandIntro(n){
  const I=island(n);
  return '<div class="isl-intro">'+sceneSvg(I.w,'big')+'<div class="isl-cap" style="color:'+I.w.ink+'"><small>'+esc(t('isl_n',{n:S.route.indexOf(n)+1}))+'</small><b>'+esc(wName(I.w))+'</b></div></div>'+
    helper(esc(t('ws_'+I.w.id,{s:sName(n)})),'wow')+
    '<div class="isl-game"><div class="isl-gicon">'+itemSvg(I.w.item,'big')+'</div><div class="grow"><small class="sub">'+esc(t('isl_game_wait'))+'</small><b>'+esc(gName(I.g))+'</b><div class="sub">'+esc(t('ig_'+I.g+'_d'))+'</div></div></div>';
}
function islandStrip(n){ const I=island(n); return '<div class="isl-strip">'+sceneSvg(I.w)+'<span class="isl-tag" style="color:'+I.w.ink+'">'+itemSvg(I.w.item)+esc(wName(I.w))+'</span></div>'; }

/* ---------- Игра острова на этапе «Практика» ---------- */
function spread(arr, k){ if(arr.length<=k) return arr.slice(); const out=[]; for(let j=0;j<k;j++){ const x=arr[Math.round(j*(arr.length-1)/(k-1))]; if(!out.includes(x)) out.push(x); } return out; }
function igQuestions(n, g){
  const c=ayahCount(n), order=[...Array(c).keys()]; let qs=[];
  const pick=(type, cnt, part)=>{ spread(order, cnt).forEach(i=>{ const q=type==='words'?GEN.words(n,i,part):GEN[type](n,i); if(q) qs.push(q); }); };
  if(g==='caravan') qs=buildWindows(n);
  if(g==='bloom') pick('meaning', Math.min(5,Math.max(3,c)));
  if(g==='climb'){ spread(order.filter(i=>i<c-1), 5).forEach(i=>{ const q=GEN.next(n,i); if(q) qs.push(q); }); }
  if(g==='pearls') pick('missing', 5);
  if(g==='bridge') pick('words', 4);
  if(g==='lanterns'){ if(canPlay(n)) pick('audio', 5); else pick('missing', 5); }
  if(!qs.length) pick('meaning', 4);
  return qs.slice(0,6);
}
function islandInit(n){
  const I=island(n); L.ig={g:I.g, w:I.w, done:false, got:0, quiz:!(I.g==='catch'||I.g==='stars')};
  if(!L.ig.quiz){ const all=bubbleRounds(n); L.ig.rounds=spread(all, I.g==='stars'?3:4); L.ig.round=0; L.ig.mistakes=0; igRound(); }
}
function islandQuiz(n){
  const I=island(n); const qs=igQuestions(n, I.g);
  startQuiz(qs,'practice',()=>islandDone(n, qs.length));
  QZ.top = z => '<div class="igtop">'+meterHtml(I.g, z.qs.length, z.i)+'</div>';
  renderQuiz();
}
function igRound(){
  const ig=L.ig, r=ig.rounds[ig.round], n=L.n; const ws=wordsOf(n,r.i).map((w,k)=>({w,k,key:skel(w)})).slice(r.a,r.b);
  ig.r=r; ig.target=ws; ig.gotW=0; ig.lines=[];
  const ix=shuffle(ws.map((x,j)=>j));
  if(ig.g==='catch') ig.items=ix.map((j,p)=>({j, left:6+Math.round(p*(80/Math.max(1,ix.length-1))), dur:5.5+Math.random()*3, delay:-Math.random()*6}));
  else { const cells=shuffle([...Array(12).keys()]).slice(0,ws.length); ig.items=ix.map((j,p)=>{ const c=cells[p]; return {j, x:12+(c%4)*25+(Math.random()*8-4), y:16+Math.floor(c/4)*30+(Math.random()*8-4)}; }); }
}
function islandPracticeHtml(){
  const ig=L.ig, n=L.n;
  if(!ig){ islandInit(n); return islandPracticeHtml(); }
  if(ig.g!=='catch' && ig.g!=='stars') return helper(esc(t('ig_'+ig.g+'_help')))+'<div id="quiz"></div>';
  const r=ig.r, i=r.i, all=wordsOf(n,i), need=ig.target[ig.gotW];
  const guide=all.map((w,k)=>{ const cls = k<r.a+ig.gotW ? 'done' : (need&&k===need.k) ? 'next' : (k<r.b?'todo':'later'); return '<span class="gw '+cls+'">'+esc(wTr(n,i,k))+'</span>'; }).join(' ');
  const head=helper(esc(t('ig_'+ig.g+'_help')))+
    '<div class="card bubble-top"><div class="row"><span class="pill">'+esc(t('round_x_of_y',{x:ig.round+1,y:ig.rounds.length}))+'</span><span class="pill gold">'+esc(t(unitKey(n,'ayah_x_of_y'),{x:i+1,y:ayahCount(n)}))+'</span><span class="grow"></span>'+(canPlay(n)?'<button class="btn sm ghost" data-a="igPlay">'+ic('ear')+esc(t('listen'))+'</button>':'')+'</div>'+
    trLine(n,i)+'<div class="bguide" dir="ltr">'+guide+'</div>'+(need?'<div class="sub">'+esc(t('bub_find'))+' <b class="gw next">'+esc(wTr(n,i,need.k))+'</b></div>':'')+
    '<div class="basket">'+(r.a>0?'<span class="bslot on fixed">…</span>':'')+ig.target.map((x,k)=>'<span class="bslot'+(k<ig.gotW?' on':'')+(k===ig.gotW?' nextslot':'')+'">'+(k<ig.gotW?itemSvg(ig.w.item)+'<span class="ar">'+esc(x.w)+'</span>':(k+1+r.a))+'</span>').join('')+'</div></div>';
  if(ig.g==='catch'){
    return head+'<div class="arena fall w-'+ig.w.id+'" style="--sky1:'+ig.w.sky[0]+';--sky2:'+ig.w.sky[1]+'">'+ig.items.map(it=>{ const x=ig.target[it.j]; const got=it.j<ig.gotW;
      return '<button class="fitem'+(got?' gone':'')+'" data-a="igTap" data-j="'+it.j+'" style="left:'+it.left+'%;animation-duration:'+it.dur.toFixed(1)+'s;animation-delay:'+it.delay.toFixed(1)+'s">'+itemSvg(ig.w.item,'fbig')+'<span class="ar">'+esc(x.w)+'</span><small class="wtl" dir="ltr">'+esc(wTr(n,i,x.k))+'</small></button>'; }).join('')+'</div><div class="feedback" id="fb" aria-live="polite"></div>';
  }
  // stars: созвездие
  const pos=j=>ig.items.find(it=>it.j===j);
  let lines=''; for(let k=1;k<ig.gotW;k++){ const a=pos(k-1), b=pos(k); lines+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'"/>'; }
  return head+'<div class="arena starsky"><svg class="clines" viewBox="0 0 100 100" preserveAspectRatio="none">'+lines+'</svg>'+ig.items.map(it=>{ const x=ig.target[it.j]; const lit=it.j<ig.gotW;
    return '<button class="sitem'+(lit?' lit':'')+'" data-a="igTap" data-j="'+it.j+'" style="left:'+it.x+'%;top:'+it.y+'%">'+itemSvg('star','sbig')+'<span class="ar">'+esc(x.w)+'</span><small class="wtl" dir="ltr">'+esc(wTr(n,i,x.k))+'</small></button>'; }).join('')+'</div><div class="feedback" id="fb" aria-live="polite"></div>';
}
function islandDone(n, count){
  const I=island(n); const k=Math.max(1,count||1);
  S.treasure[I.w.id]=(S.treasure[I.w.id]||0)+k; save();
  award(n,'practice',PTS.practice); markActivity(); save();
  L.ig=null; SFX.win(); confetti();
  toast(itemSvg(I.w.item,'tbig')+'<div><div class="sub">'+esc(gName(I.g))+'</div>'+esc(t('ig_got',{x:k,item:t('it_'+I.w.item)}))+'</div>',3000);
  const l=L; setTimeout(()=>{ if(L===l && L.n===n && L.stage===4 && V.name==='lesson') setStage(5); }, 900);
}
function treasureHtml(){
  return '<h2>'+itemSvg('pearl','h2i')+' '+esc(t('treasury'))+'</h2><p class="sub">'+esc(t('treasury_help'))+'</p><div class="treasury">'+WORLDS.map(w=>{ const c=S.treasure[w.id]||0;
    return '<div class="tre'+(c?'':' none')+'">'+itemSvg(w.item,'tre-i',!c)+'<b>'+c+'</b><small>'+esc(t('it_'+w.item))+'</small></div>'; }).join('')+'</div>';
}
function nextTeaser(n){
  const nx=S.route[S.route.indexOf(n)+1]; if(!nx) return '';
  const I=island(nx);
  return '<div class="teaser">'+sceneSvg(I.w)+'<div class="teaser-in"><small>'+esc(t('next_island'))+'</small><b>'+esc(wName(I.w))+'</b><span>'+esc(t('teaser_game',{g:gName(I.g)}))+'</span></div></div>';
}

Object.assign(A, {
  igPlay(){ if(L&&L.ig&&L.ig.r) playSequence(L.n,[L.ig.r.i]); },
  igTap(d, el){
    const ig=L&&L.ig; if(!ig||!ig.target) return; const j=+d.j; if(j<ig.gotW) return;
    const need=ig.target[ig.gotW], tapped=ig.target[j];
    if(j===ig.gotW || (tapped && need && tapped.key===need.key)){
      if(j!==ig.gotW){ const a=ig.items.find(x=>x.j===j), b=ig.items.find(x=>x.j===ig.gotW); a.j=ig.gotW; b.j=j; }
      SFX.pop(); playWord(L.n, ig.r.i, need.k); sparkle(el); el.classList.add('popped'); ig.gotW++; ig.got++; bump('correct');
      setTimeout(()=>{ if(!L || L.ig!==ig) return; if(ig.gotW>=ig.target.length){ SFX.good(); ig.round++; if(ig.round>=ig.rounds.length){ render(); const l=L; return setTimeout(()=>{ if(L===l && L.ig===ig) islandDone(L.n, ig.got); },500); } const fb=$('#fb'); if(fb){ fb.className='feedback good'; fb.textContent=t('fb_good3'); } setTimeout(()=>{ if(L && L.ig===ig){ igRound(); render(); } },650); } else render(); },260);
    } else { ig.mistakes++; SFX.soft(); el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),450); const fb=$('#fb'); if(fb){ fb.className='feedback bad'; fb.textContent=t('fb_bubble'); } }
  }
});

</script>
