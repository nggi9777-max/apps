<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#138A8A">
<meta name="author" content="Anvar Muratov, Muhammad Ayub Fozilov">
<meta name="description" content="Quran Adventure — интерактивная игра для детей: изучение и запоминание сур Священного Корана. Работает офлайн.">
<title>Quran Adventure</title>
<meta name="version" content="2.2.1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%23138A8A'/%3E%3Cpath d='M24 8l4 10 10 4-10 4-4 10-4-10-10-4 10-4z' fill='%23D4A437'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFF7E6; --bg2:#F5EAD0; --card:#FFFFFF; --card2:#FFFBF2;
  --ink:#2B2A28; --ink2:#5E5A50; --muted:#8C8574;
  --teal:#11998E; --teal2:#0B7A71; --green:#2EB872; --gold:#FFB703; --gold2:#E09A00;
  --rose:#FF6B8B; --sky:#4CC9F0; --violet:#8B5CF6; --orange:#FF8C42;
  --line:rgba(60,50,20,.12); --shadow:0 6px 0 rgba(80,60,10,.08), 0 10px 24px rgba(80,60,10,.10); --shadow2:0 14px 34px rgba(80,60,10,.18);
  --ok:#2EB872; --okbg:#E1F7EA; --warn:#E09A00; --warnbg:#FFF2D2; --err:#E5484D; --errbg:#FDE6E6;
  --pattern:rgba(17,153,142,.06); --ar-size:34px; --radius:22px; color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#0E1630; --bg2:#18224A; --card:#1A2550; --card2:#202D60;
  --ink:#F2ECDD; --ink2:#CFC6B2; --muted:#9C95B8;
  --teal:#2DD4BF; --teal2:#14B8A6; --green:#4ADE80; --gold:#FFC93C; --gold2:#E9AE14;
  --rose:#FF8FAB; --sky:#67D8F5; --violet:#A78BFA; --orange:#FFA36C;
  --line:rgba(230,220,255,.13); --shadow:0 6px 0 rgba(0,0,0,.25), 0 10px 24px rgba(0,0,0,.35); --shadow2:0 14px 34px rgba(0,0,0,.5);
  --ok:#4ADE80; --okbg:rgba(74,222,128,.15); --warn:#FFC93C; --warnbg:rgba(255,201,60,.14); --err:#FF8A8A; --errbg:rgba(255,138,138,.15);
  --pattern:rgba(255,201,60,.05); color-scheme: dark;
}
*{box-sizing:border-box}
svg.i{width:1.25em;height:1.25em;vertical-align:-.25em;flex:none}
svg.i.big{width:44px;height:44px}
svg.i.gold{color:var(--gold)}
html,body{margin:0;padding:0}
body{font-family:"Nunito","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:17px;line-height:1.45;transition:background-color .5s,color .5s;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:var(--pat);background-size:84px 84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:12px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mt{margin-top:14px}
.center{justify-content:center} .center-txt{text-align:center} .center-col{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}

/* Arabic & readable lines */
.ar{font-family:"KFGQPC Uthmanic Script HAFS","Amiri Quran","Scheherazade New","Noto Naskh Arabic","Traditional Arabic","Arabic Typesetting","Geeza Pro","Times New Roman",serif;direction:rtl;unicode-bidi:isolate;font-size:var(--ar-size);line-height:2;word-spacing:.06em}
.ar.sm{font-size:calc(var(--ar-size)*.75)} .ar.xs{font-size:calc(var(--ar-size)*.6);line-height:1.8} .ar.lg{font-size:calc(var(--ar-size)*1.15)}
.anum{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;height:1.6em;margin:0 .25em;border-radius:50%;border:2px solid var(--gold);color:var(--gold2);font-size:.48em;line-height:1;vertical-align:middle;background:var(--card2)}
.bism{text-align:center;color:var(--teal);margin:6px 0;border-radius:14px;transition:background .3s}
.bism.cur{background:color-mix(in srgb,var(--gold) 18%,transparent)}
.tl{font-weight:800;color:var(--teal);font-size:1.02rem;letter-spacing:.2px}
.transl{color:var(--ink2);font-size:.98rem} .transl.big{font-size:1.12rem;font-weight:700;color:var(--ink)} .transl.sm{font-size:.86rem}
.srcnote{font-size:.78rem;color:var(--muted)}
.sub{color:var(--muted);font-size:.92rem}

/* Layout */
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;padding:8px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:6px;font-weight:900;font-size:.82rem;line-height:1.05;background:none;border:0;padding:2px}
.brand .logo{width:36px;height:36px}
.hud{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 10px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:900;font-size:.95rem;box-shadow:0 3px 0 var(--line)}
.hud.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25)}60%{transform:scale(.95)}}
.hud.ring{width:38px;padding:0;justify-content:center;border:0;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--bg2) 0);position:relative}
.hud.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--card)}
.hud.ring b{position:relative;font-size:.9rem}
.hud.flame{color:var(--orange)} .hud.flame.off{color:var(--muted);opacity:.6}
.hud.flame b{color:var(--ink)}
.tb-btn{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 8px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800}
.tb-btn svg{width:20px;height:20px}
select.tb-btn{appearance:none;-webkit-appearance:none;text-align:center}
.grow{flex:1;min-width:0}
main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:16px 14px 110px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 95%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bottomnav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;border-radius:16px;font-size:.7rem;font-weight:800;color:var(--muted);transition:transform .15s}
.bottomnav button svg{width:26px;height:26px}
.bottomnav button.on{color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,transparent)}
.bottomnav button.on svg{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-5px)}}
@media(min-width:900px){ .bottomnav{top:62px;bottom:auto;left:auto;right:auto;position:sticky;max-width:1080px;margin:0 auto;border:1px solid var(--line);border-radius:20px;width:calc(100% - 28px)} main{padding-bottom:40px} .brand{font-size:.95rem} }
.view{animation:viewIn .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.2} h1{font-size:1.7rem;font-weight:900} h2{font-size:1.3rem;font-weight:900} h3{font-size:1.08rem;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.inner{box-shadow:none;background:var(--card2);margin:10px 0}
.card.tap{cursor:pointer;transition:transform .18s, box-shadow .18s}
.card.tap:hover{transform:translateY(-3px) rotate(-.4deg)}
.card.tap:active{transform:scale(.97)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 20px;border-radius:18px;border:0;font-weight:900;font-size:1.02rem;background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--teal2);transition:transform .1s, filter .2s}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--teal2)}
.btn svg{width:22px;height:22px}
.btn.gold{background:linear-gradient(180deg,#FFD04D,var(--gold));color:#3a2a00;box-shadow:0 5px 0 var(--gold2)}
.btn.green{background:var(--green);box-shadow:0 5px 0 color-mix(in srgb,var(--green) 65%,#000)}
.btn.rose{background:var(--rose);box-shadow:0 5px 0 color-mix(in srgb,var(--rose) 65%,#000)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{min-height:42px;padding:6px 14px;font-size:.92rem;border-radius:14px}
.btn.xl{min-height:62px;padding:12px 28px;font-size:1.25rem;border-radius:22px}
.btn.big{font-size:1.15rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4)}
.btn.block{width:100%}
.pulse{animation:pulseBtn 1.8s ease-in-out infinite}
@keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:800;background:var(--bg2);color:var(--ink2);border:0}
button.pill{cursor:pointer}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.lock{background:var(--bg2);color:var(--muted)} .pill.gold{background:color-mix(in srgb,var(--gold) 25%,var(--card));color:var(--ink)}
.pill svg{width:14px;height:14px}
.x{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);font-size:1.3rem;font-weight:900}
.x.small{width:34px;height:34px;font-size:1.1rem;border-radius:10px}

.bar{height:14px;border-radius:999px;background:var(--bg2);overflow:hidden;border:1px solid var(--line);margin:6px 0}
.bar>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--green));transition:width 1s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.bar>i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.4s infinite;transform:translateX(-100%)}
@keyframes shine{to{transform:translateX(100%)}}
.bar.gold>i{background:linear-gradient(90deg,var(--orange),var(--gold))}

/* Companions */
.mascot{width:96px;height:106px;flex:none} .mascot.big{width:130px;height:143px} .mascot-s{width:64px;height:70px;flex:none}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.blink{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.jump{animation:jump .7s cubic-bezier(.3,1.6,.4,1)!important}
@keyframes jump{0%{transform:translateY(0) rotate(0)}30%{transform:translateY(-28px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}100%{transform:none}}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 14px;box-shadow:var(--shadow);font-weight:800}
.bubble.say::before{content:"";position:absolute;left:-10px;top:18px;border:10px solid transparent;border-right-color:var(--line);border-left:0}
.helper{display:flex;gap:10px;align-items:flex-end;margin:6px 0 14px}
.helper .bubble{flex:1;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}

/* Home */
.hero{display:flex;gap:16px;align-items:center;overflow:hidden;background:linear-gradient(135deg,#BDF0E8 0%,#FFE8B0 60%,#FFD1DC 100%);border:0}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#123B4A 0%,#3A2F5E 60%,#4A2240 100%)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.25)}
.hero h1{margin:0}
.hero-comp{cursor:pointer;flex:none}
.lvlline{display:flex;flex-direction:column;gap:2px;margin:10px 0}
.hero .btn.xl{margin-top:4px}
.dlcard{margin-top:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--sky) 20%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--sky) 50%,transparent)}
.dlcard .i.big{color:var(--sky)}
.dlcard .row>.grow{min-width:200px}
@media(max-width:560px){.dlcard .i.big{width:32px;height:32px}}
.chestcard{display:flex;align-items:center;gap:12px}
.chest{width:110px;height:92px;flex:none}
.chest:not(.open) .lid{animation:wiggle 2.5s ease-in-out infinite;transform-origin:60px 48px}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}
.chest.open .glow{animation:glow 1.5s ease-in-out infinite}
@keyframes glow{50%{opacity:.6}}
.questcard h3{margin-top:0}
.quest{display:flex;align-items:center;gap:8px;margin:6px 0}
.quest .qi{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--gold) 22%,var(--card));color:var(--gold2);flex:none}
.quest.done .qi{background:var(--okbg);color:var(--ok)}
.quest .qt{font-weight:800;font-size:.9rem}
.quest.done .qt{text-decoration:line-through;color:var(--muted)}
.quest .bar{height:9px;margin:3px 0}
.big-num{font-size:2.6rem;font-weight:900;line-height:1} .big-num small{font-size:1.1rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:132px;padding:14px;border-radius:22px;border:0;color:#fff;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.15);overflow:hidden;transition:transform .15s}
.tile:hover{transform:translateY(-3px) rotate(-1deg)} .tile:active{transform:scale(.96)}
.tile b{font-size:1.08rem;font-weight:900} .tile small{opacity:.92;font-weight:700}
.tile::after{content:"";position:absolute;right:-28px;bottom:-28px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.18)}
.tico{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.25);color:#fff;flex:none}
.tico svg{width:30px;height:30px}
.t-sea{background:linear-gradient(135deg,#29B6F6,#0277BD)} .t-rose{background:linear-gradient(135deg,#FF7A9A,#E0446C)} .t-green{background:linear-gradient(135deg,#43D18A,#1E9E62)}
.t-gold{background:linear-gradient(135deg,#FFC94D,#F08C00);color:#3a2a00} .t-gold .tico{color:#3a2a00} .t-violet{background:linear-gradient(135deg,#A78BFA,#6D3FD8)} .t-sky{background:linear-gradient(135deg,#5EE0E0,#1595B0)}
.li .tico{width:40px;height:40px}
.games .tile{min-height:150px}
.statstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:1.35rem} .stat.gold b{color:var(--gold2)}
.stat span{font-size:.78rem;color:var(--muted);font-weight:800}

/* Map */
.mapwrap{position:relative;border-radius:26px;overflow:hidden;border:3px solid #fff;box-shadow:var(--shadow2)}
.mapsvg{display:block;width:100%;height:auto}
.wv{animation:wave 4s ease-in-out infinite}
@keyframes wave{50%{transform:translateX(10px)}}
.fish{animation:fish 14s linear infinite}
@keyframes fish{0%{transform:translateX(-80px)}100%{transform:translateX(1100px)}}
.node{cursor:pointer}
.node:focus{outline:none}
.node .isl{transition:transform .25s}
.node:hover .isl,.node:focus-visible .isl{transform:scale(1.07)}
.node .isl.cur{animation:islPulse 2s ease-in-out infinite}
@keyframes islPulse{50%{transform:scale(1.08)}}
.node.popin .isl{animation:islPop 1.2s cubic-bezier(.2,1.6,.4,1) both}
@keyframes islPop{0%{transform:scale(0) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
.node.locked .fog{animation:fogDrift 6s ease-in-out infinite}
@keyframes fogDrift{50%{transform:translateX(6px)}}
.boat .rock{animation:rock 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes rock{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-4px)}}
.cloud{position:absolute;z-index:2;pointer-events:none;width:120px;height:40px;border-radius:40px;background:rgba(255,255,255,.85);filter:blur(1px)}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:56px;height:56px;left:16px;top:-26px} .cloud::after{width:44px;height:44px;left:58px;top:-18px}
.c1{top:6%;animation:cloud 38s linear infinite} .c2{top:42%;animation:cloud 52s linear infinite -20s;transform:scale(.7)} .c3{top:74%;animation:cloud 46s linear infinite -32s;opacity:.7}
@keyframes cloud{0%{left:-150px}100%{left:110%}}

/* Stickers */
.stk-xs{width:28px;height:28px} .stk-s{width:40px;height:40px;flex:none} .stk-m{width:56px;height:56px} .stk-l{width:84px;height:84px} .stk-xl{width:140px;height:140px}
.stkrow{display:flex;flex-wrap:wrap;gap:4px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.aslot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:20px;background:var(--card);border:2px dashed var(--line);text-align:center}
.aslot.got{border-style:solid;border-color:color-mix(in srgb,var(--gold) 50%,transparent);background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--gold) 10%,var(--card)))}
.aslot.got svg{filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.aslot small{color:var(--muted);font-size:.75rem}
.aslot.fresh svg{animation:stkFlip 1.2s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stkFlip{0%{transform:rotateY(180deg) scale(.4)}100%{transform:none}}
.stk-reveal svg{animation:stkReveal 1.4s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 8px 0 rgba(0,0,0,.15))}
@keyframes stkReveal{0%{transform:scale(0) rotate(-200deg)}100%{transform:none}}

/* Modal */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,15,30,.55);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@media(min-width:700px){.overlay{align-items:center;padding:20px}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px 18px 24px;box-shadow:var(--shadow2);animation:sheetIn .35s cubic-bezier(.2,1.2,.3,1)}
@media(min-width:700px){.modal{border-radius:28px}}
@keyframes sheetIn{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.modal .x{float:right}
.lvlbadge{display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--gold),var(--orange),var(--rose),var(--violet),var(--teal),var(--gold));color:#fff;font-size:2.4rem;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.25);animation:pop .7s cubic-bezier(.2,1.6,.4,1) both, spin 6s linear infinite .7s}
@keyframes spin{to{filter:hue-rotate(360deg)}}

/* Lesson */
.lesson-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px}
.stepper{position:relative;display:flex;gap:4px;align-items:flex-start;margin:6px 0 16px;padding-top:4px}
.steptrack{position:absolute;left:18px;right:18px;top:22px;height:6px;border-radius:6px;background:var(--bg2)}
.steptrack i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .8s}
.stepper .st{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.62rem;font-weight:800;color:var(--muted);text-align:center;border:0;background:none;padding:0}
.stepper .st i{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:3px solid var(--line);font-style:normal;transition:transform .3s}
.stepper .st i svg{width:20px;height:20px}
.stepper .st.done i{background:var(--green);color:#fff;border-color:var(--green)}
.stepper .st.cur i{background:var(--gold);color:#3a2a00;border-color:var(--gold2);transform:scale(1.18);box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 25%,transparent)}
.stepper .st.cur{color:var(--ink)}
@media(max-width:520px){ .stepper .st span{display:none} .stepper .st.cur span{display:block;position:absolute;top:44px;white-space:nowrap} .stepper{margin-bottom:28px} }
.intro .steps-prev{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0;width:100%}
.sp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:18px;background:var(--card2);border:2px solid var(--line)}
.sp i{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--teal) 15%,var(--card));color:var(--teal)}
.sp small{color:var(--muted);font-size:.78rem}
.ayahs{display:flex;flex-direction:column;gap:10px}
.ayah{border:2px solid var(--line);border-radius:20px;padding:10px 14px;background:var(--card);cursor:pointer;transition:background .25s,border-color .25s,box-shadow .25s,transform .25s}
.ayah:hover{border-color:color-mix(in srgb,var(--teal) 50%,transparent)}
.ayah.cur{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 13%,var(--card));box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 20%,transparent);transform:scale(1.01)}
.ayah .ar{text-align:right}
.sticky-tools{position:sticky;top:60px;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding:8px;border-radius:18px}
.readbox{text-align:center;padding:18px 12px;border-radius:26px;background:var(--card);border:3px solid var(--gold);min-height:180px;display:flex;flex-direction:column;justify-content:center;gap:8px;position:relative;box-shadow:var(--shadow)}
.readbox .ar{text-align:center}
.blurred .memline .ar{filter:blur(10px);user-select:none}
.peek{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.2rem}
.counter{display:flex;gap:8px;justify-content:center}
.counter i{width:30px;height:30px;border-radius:50%;background:var(--bg2);border:2px solid var(--line);font-style:normal;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.9rem}
.counter i.on{background:var(--gold);border-color:var(--gold2);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.memtrack{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.memtrack i{width:18px;height:8px;border-radius:6px;background:var(--bg2)}
.memtrack i.on{background:var(--green)} .memtrack i.cur{background:var(--gold);width:28px}
.wgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.wcard{display:flex;flex-direction:column;align-items:center;padding:6px 12px;border-radius:16px;border:2px solid var(--line);background:var(--card2);box-shadow:0 3px 0 var(--line);transition:transform .15s}
.wcard:hover{border-color:var(--teal)}
.wcard .ar{font-size:calc(var(--ar-size)*.85);line-height:1.6}
.wtl{direction:ltr;font-weight:800;color:var(--teal);font-size:.82rem}
.wen{direction:ltr;color:var(--muted);font-size:.72rem}
.pulse1{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.toolbar.left{justify-content:flex-start}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:.88rem}
.tg.on{border-color:var(--teal);color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,var(--card))}
.inp.mini{min-height:32px;padding:2px 8px;width:auto;border-radius:10px}
.notice{padding:12px 14px;border-radius:18px;background:var(--warnbg);color:var(--ink);border:2px solid color-mix(in srgb,var(--warn) 35%,transparent);font-size:.94rem}
.notice.info{background:color-mix(in srgb,var(--sky) 14%,var(--card));border-color:color-mix(in srgb,var(--sky) 40%,transparent)}
.notice.ok{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}

/* Quiz */
.q{display:flex;flex-direction:column;gap:12px}
.qcard{border-width:3px}
.dotsbar{display:flex;gap:5px}
.dotsbar i{flex:1;height:8px;border-radius:6px;background:var(--bg2)}
.dotsbar i.ok{background:var(--green)} .dotsbar i.no{background:var(--rose)} .dotsbar i.cur{background:var(--gold);animation:pulseBtn 1.2s infinite}
.qprompt{padding:14px;border-radius:20px;background:var(--card2);border:2px dashed var(--line);text-align:center}
.qprompt .ar{text-align:center}
.blank{display:inline-block;min-width:2.4em;border-bottom:4px solid var(--gold);color:var(--gold);animation:pulseBtn 1.4s infinite}
.opts{display:grid;gap:10px}
.opts.grid3{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.opt{position:relative;width:100%;text-align:right;padding:10px 14px 10px 44px;border-radius:18px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);transition:transform .1s,border-color .2s,background .2s}
.opt.ltr{text-align:left;padding-left:14px} .opt.center{text-align:center;padding:10px;display:flex;flex-direction:column;align-items:center}
.opt .tl{text-align:left;font-size:.9rem}
.optn{position:absolute;left:10px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.8rem;color:var(--ink2)}
.opt:hover{border-color:var(--teal)} .opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--ok);background:var(--okbg);animation:pop .4s}
.opt.right .optn{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--err);background:var(--errbg);animation:shake .4s}
.row-opt{display:flex;align-items:center;gap:10px}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes pop{from{transform:scale(.6);opacity:.4}to{transform:none;opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.chip{display:inline-flex;flex-direction:column;align-items:center;padding:4px 12px;border-radius:16px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);transition:transform .15s,opacity .2s}
.chip.used{opacity:.2;pointer-events:none;transform:scale(.9)}
.chip.ok{border-color:var(--ok);background:var(--okbg)}
.chip .ar{font-size:calc(var(--ar-size)*.72);line-height:1.6}
.slots{min-height:76px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;direction:rtl;padding:10px;border-radius:18px;border:3px dashed var(--teal);background:color-mix(in srgb,var(--teal) 6%,var(--card))}
.slots .chip{animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
.slots.vert{flex-direction:column;direction:ltr;align-items:stretch}
.feedback{min-height:28px;text-align:center;font-weight:900;font-size:1.05rem}
.feedback.good{color:var(--ok)} .feedback.bad{color:var(--err)} .feedback.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.qcount{font-weight:900;color:var(--muted);font-size:.86rem}
.combo{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;background:linear-gradient(90deg,var(--orange),var(--rose));color:#fff;font-weight:900;font-size:.85rem;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.score-ring{--p:0;width:130px;height:130px;margin:8px auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--bg2) 0);position:relative;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.score-ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--card)}
.score-ring b{position:relative;font-size:2rem;font-weight:900}

/* Games */
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.mcard{aspect-ratio:3/4;perspective:800px;border:0;background:none;padding:0}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.mcard.flip .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;border:3px solid var(--line);font-weight:800;font-size:.86rem}
.mcard .f{background:linear-gradient(135deg,var(--teal),var(--violet));border-color:#fff;box-shadow:var(--shadow)}
.mcard .b{background:var(--card2);transform:rotateY(180deg)}
.mcard .b .mean{font-size:1rem;color:var(--ink)}
.mcard.done .b{border-color:var(--ok);background:var(--okbg);animation:pop .4s}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{padding:8px 10px;border-radius:16px;border:2px solid var(--line);background:var(--card);min-height:70px;text-align:center;box-shadow:0 4px 0 var(--line)}
.mt.sel{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--card));transform:scale(1.02)}
.mt.done{border-color:var(--ok);background:var(--okbg);opacity:.75}
.mt.wrong{border-color:var(--err);animation:shake .4s}
.mt .ar{font-size:calc(var(--ar-size)*.62);line-height:1.7}
.mt .tl{font-size:.82rem}
.path{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0 12px}
.path i{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:2px solid var(--line);font-style:normal;font-size:.9rem;color:#fff}
.path i.on{background:var(--gold);border-color:var(--gold2)}
.path i.me{width:48px;height:48px;background:var(--card);border-color:var(--teal);overflow:visible}
.path i.me svg{width:44px;height:48px}
.path i.goal{background:linear-gradient(135deg,#FFD04D,var(--gold));color:#3a2a00}
.bubble-top .bslots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:rtl;margin-top:10px}
.bslot{min-width:56px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 8px;border-radius:14px;border:2px dashed var(--line);color:var(--muted);font-weight:900}
.bslot.on{border-style:solid;border-color:var(--ok);background:var(--okbg);color:var(--ink);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.bslot .ar{font-size:calc(var(--ar-size)*.62);line-height:1.5}
.arena{position:relative;height:380px;margin-top:12px;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#8FD8F5,#3FA8D8);border:3px solid #fff;box-shadow:var(--shadow2)}
:root[data-theme="dark"] .arena{background:linear-gradient(180deg,#1C4F7A,#0E2A4A)}
.bub{position:absolute;bottom:-110px;width:auto;min-width:92px;padding:12px 14px;border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,.9);
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95),rgba(255,255,255,.55) 35%,rgba(173,232,255,.45) 70%);color:#16324A;box-shadow:inset -6px -8px 14px rgba(0,80,140,.18),0 6px 14px rgba(0,0,0,.12);animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite}
.bub .ar{font-size:calc(var(--ar-size)*.68);line-height:1.4}
.bub .wtl{color:#0B5E7A}
.bub:hover{filter:brightness(1.05)}
.bub.wrong{animation-play-state:paused;border-color:var(--err)}
.bub.popped{animation:popB .3s forwards!important}
.bub.gone{display:none}
@keyframes rise{0%{transform:translateY(0) translateX(0)}25%{transform:translateY(-130px) translateX(12px)}50%{transform:translateY(-260px) translateX(-10px)}75%{transform:translateY(-390px) translateX(10px)}100%{transform:translateY(-520px) translateX(0)}}
@keyframes popB{to{transform:scale(1.6);opacity:0}}

/* Rewards */
.pointscard{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 22%,var(--card)),var(--card))}
.big-pts{display:flex;align-items:center;gap:6px;font-size:2.6rem;font-weight:900;line-height:1.1}
.big-pts svg{width:40px;height:40px;color:var(--gold)}
details summary{cursor:pointer;font-weight:800;color:var(--teal)}
.comps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:100%}
.comp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px;border-radius:22px;border:3px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);transition:transform .15s}
.comp:hover{transform:translateY(-3px)}
.comp.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--card))}
.comp.locked{opacity:.55;filter:grayscale(.85)}
.comp small{color:var(--muted);font-weight:700;display:flex;align-items:center;gap:4px}
.plus{color:var(--ok)}

/* Lists, achievements, charts */
.ach{display:flex;gap:12px;align-items:center}
.ach .medal{width:64px;height:64px;flex:none}
.ach.locked .medal{filter:grayscale(1);opacity:.35}
.ach.locked h3{color:var(--muted)}
.pring{width:150px;height:150px}
.chart{display:flex;align-items:flex-end;gap:8px;height:130px;padding:8px 4px 0;border-bottom:2px solid var(--line)}
.chart .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:.7rem;color:var(--muted);font-weight:800}
.chart .b i{display:block;width:100%;max-width:34px;border-radius:10px 10px 3px 3px;background:linear-gradient(180deg,var(--gold),var(--teal));min-height:3px;transition:height .9s}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--card2);border:2px solid var(--line)}
.li.wrap{flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t td,table.t th{padding:8px;border-bottom:1px solid var(--line);text-align:left}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.field label{font-weight:800;font-size:.9rem}
.inp{min-height:48px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card2);font-size:1rem;width:100%}
.inp:focus{border-color:var(--teal);outline:none}
.pin{letter-spacing:.6em;text-align:center;font-size:1.5rem;font-weight:900}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch input{width:52px;height:30px;appearance:none;-webkit-appearance:none;background:var(--bg2);border:2px solid var(--line);border-radius:999px;position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch input:checked{background:var(--teal);border-color:var(--teal)}
.switch input:checked::after{left:24px}
.route{padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.route li{list-style:none}

/* Celebration & FX */
.celebrate{text-align:center;display:flex;flex-direction:column;align-items:center}
.stars3{display:flex;justify-content:center;gap:6px}
.stars3 svg{width:56px;height:56px}
.stars3 svg.off{opacity:.2;filter:grayscale(1)}
.stars3 svg:nth-child(1){animation:pop .5s .2s both}.stars3 svg:nth-child(2){animation:pop .5s .45s both}.stars3 svg:nth-child(3){animation:pop .5s .7s both}
.coin{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:18px;background:color-mix(in srgb,var(--gold) 25%,var(--card));border:3px solid var(--gold);font-weight:900;font-size:1.2rem;animation:pop .6s .3s cubic-bezier(.2,1.6,.4,1) both}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}
.toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:90;display:flex;gap:10px;align-items:center;max-width:92vw;padding:10px 16px;border-radius:20px;background:var(--card);border:3px solid var(--gold);box-shadow:var(--shadow2);font-weight:800;animation:toastIn .45s cubic-bezier(.2,1.4,.4,1)}
.toast svg{width:40px;height:40px;flex:none}
@keyframes toastIn{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.floatpts{position:fixed;z-index:95;pointer-events:none;font-weight:900;font-size:1.6rem;color:var(--gold2);text-shadow:0 2px 0 #fff,0 0 12px rgba(255,183,3,.6);transform:translate(-50%,-50%);transition:transform .8s cubic-bezier(.5,0,.75,0),opacity .8s;animation:floatIn .25s ease-out}
@keyframes floatIn{from{transform:translate(-50%,-10%) scale(.4)}}
.spark{position:fixed;z-index:94;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--gold);pointer-events:none;animation:spark .7s ease-out forwards}
.spark:nth-child(3n){background:var(--rose)} .spark:nth-child(3n+1){background:var(--teal)}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.lockscreen{max-width:420px;margin:30px auto;text-align:center}
.footer-note{margin-top:22px;text-align:center;color:var(--muted);font-size:.8rem}

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }
@media(max-width:560px){
  :root{--ar-size:28px} h1{font-size:1.4rem} .bt{display:none} .hud{height:34px;padding:0 8px;font-size:.85rem} .hud.ring{width:34px;height:34px} .tb-btn{min-width:34px;height:34px;padding:0 5px} .tb-btn svg{width:18px;height:18px}
  main{padding:12px 10px 110px} .hero{flex-direction:column;text-align:center} .hero .lvlline{align-items:center} .bubble.say::before{display:none} .mascot.big{width:110px;height:121px}
  .tiles{grid-template-columns:1fr 1fr} .tile{min-height:118px} .match{grid-template-columns:1fr} .arena{height:340px} .bub{min-width:80px;padding:8px}
}
.lvlline .bar{width:100%;min-width:160px}

/* ---------- v2.1: игры по порядку, контекст, призы ---------- */
.ctx{margin:8px 0;padding:8px 12px;border-radius:14px;border:2px dashed var(--line);background:var(--card2);opacity:.85}
.ctx.start{padding:4px 12px;border-style:solid;text-align:center;font-weight:900;color:var(--teal)}
.ctx .ar{font-size:calc(var(--ar,34px)*.55)}
.chip.fixed{opacity:.55;border-style:dashed;pointer-events:none}
.chip.ghostc{opacity:.5;border-style:dashed;pointer-events:none;font-weight:900}
.bguide{margin:8px 0 4px;line-height:2;font-weight:800;font-size:1.05rem;text-align:center}
.gw{display:inline-block;padding:0 6px;border-radius:8px;transition:background .25s,color .25s}
.gw.done{color:var(--green)} .gw.todo{color:var(--ink2)} .gw.later{color:var(--muted);opacity:.55}
.gw.next{background:var(--gold);color:#3A2A00;box-shadow:0 2px 0 var(--gold2);animation:gwpulse 1.1s ease-in-out infinite}
@keyframes gwpulse{50%{transform:scale(1.08)}}
.bprev{opacity:.7;text-align:center;margin:6px 0}
.bslot.nextslot{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent);font-weight:900;color:var(--gold2)}
.bslot.fixed{opacity:.5}
.gift{width:84px;height:84px;display:block;margin:0 auto}
.gift.big{width:150px;height:150px}
.gift.gift-s{width:44px;height:44px;margin:0;flex:none;display:inline-block;vertical-align:middle}
.gift.open .glid{animation:giftlid 1.6s ease-in-out infinite;transform-origin:40px 34px}
.gift.open .gglow{animation:giftglow 1.6s ease-in-out infinite;transform-origin:40px 38px}
@keyframes giftlid{0%,60%,100%{transform:translateY(0) rotate(0)}70%{transform:translateY(-8px) rotate(-6deg)}80%{transform:translateY(-4px) rotate(4deg)}}
@keyframes giftglow{50%{transform:scale(1.12);opacity:.7}}
.prizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:10px 0 18px}
.prize{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:stretch;box-shadow:var(--shadow)}
.prize.open{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card))}
.prize.given{border-color:var(--green)}

ves"]],[["waḥuṣṣila","And is made apparent"],["mā","what"],["fī","(is) in"],["l-ṣudūri","the breasts"]],[["inna","Indeed"],["rabbahum","their Lord"],["bihim","about them"],["yawma-idhin","that Day"],["lakhabīrun","(is) surely All-Aware"]]],"uzl":["Harsillab chopuvchi otlar bilan qasam.","Oʻt chaqnatib chopuvchi otlar bilan qasam.","Tong chogʻida gʻorat qiluvchi otlar bilan qasam.","Oʻsha ila chang qoʻzgʻatdilar.","Va u ila jamoa oʻrtasiga (yorib) kirdilar.","Albatta, inson oʻz Robbiga noshukrdir.","Va albatta, u ana shunga oʻzi guvohdir.","Albatta, u mol-dunyoga haddan tashqari oʻchdir.","U bilmasmi?! Qabrdagilar qoʻzgʻatilganda.","Va koʻkraklaridagi oshkor boʻlganda.","Oʻsha kunda Robbilari ulardan xabardor ekanini?!"],"t":[["Вал-ъадияти зобҳа","Вал-ъадияти зобҳа","Val-ʼadiyati zobha"],["Фал-мурияти қодҳа","Фал-мурияти қодҳа","Fal-muriyati qodha"],["Фал-муғийроти субҳа","Фал-муғийроти субҳа","Fal-mugʻiyroti subha"],["Фа-асарна биҳи нақъа","Фа-асарна биҳи нақъа","Fa-asarna bihi naqʼa"],["Фавасатна биҳи жамъа","Фавасатна биҳи жамъа","Favasatna bihi jamʼa"],["Иннал-инсана лироббиҳи лакануд","Иннал-инсана лироббиҳи лакануд","Innal-insana lirobbihi lakanud"],["Ва-иннаҳу ъала залика лашаҳийд","Ва-иннаҳу ъала залика лашаҳийд","Va-innahu ʼala zalika lashahiyd"],["Ва-иннаҳу лиҳуббил-хойри лашадийд","Ва-иннаҳу лиҳуббил-хойри лашадийд","Va-innahu lihubbil-xoyri lashadiyd"],["Афала яъламу иза буъсиро ма фил-қубур","Афала яъламу иза буъсиро ма фил-қубур","Afala yaʼlamu iza buʼsiro ma fil-qubur"],["Ваҳуссила ма фис-судур","Ваҳуссила ма фис-судур","Vahussila ma fis-sudur"],["Инна роббаҳум биҳим явмаъизин лахобийр","Инна роббаҳум биҳим явмаъизин лахобийр","Inna robbahum bihim yavmaʼizin laxobiyr"]],"wt":[[["вал-ъадияти","вал-ъадияти","val-ʼadiyati"],["зобҳан","зобҳан","zobhan"]],[["фал-мурияти","фал-мурияти","fal-muriyati"],["қодҳан","қодҳан","qodhan"]],[["фал-муғийроти","фал-муғийроти","fal-mugʻiyroti"],["субҳан","субҳан","subhan"]],[["фа-асарна","фа-асарна","fa-asarna"],["биҳи", ill be like wool, fluffed up.","а горы будут подобны расчесанной шерсти.","Ва тоғлар титилган жунга ўхшаб қолар."],["فَأَمَّا مَن ثَقُلَتْ مَوَٰزِينُهُۥ","Fa-amma man thaqulat mawa zeenuh","Then as for one whose scales are heavy [with good deeds],","Тогда тот, чья чаша Весов окажется тяжелой,","Кимнинг торозуси оғир келса..."],["فَهُوَ فِى عِيشَةٍۢ رَّاضِيَةٍۢ","Fahuwa fee 'ishatir raadiyah","He will be in a pleasant life.","обретет приятную жизнь.","Бас, у розилик ҳаётидадир."],["وَأَمَّا مَنْ خَفَّتْ مَوَٰزِينُهُۥ","Wa amma man khaffat mawa zeenuh","But as for one whose scales are light,","Для того же, чья чаша Весов окажется легкой,","Ва аммо кимнинг тарозуси енгил келса..."],["فَأُمُّهُۥ هَاوِيَةٌۭ","Fa-ummuhu haawiyah","His refuge will be an abyss.","матерью станет Пропасть (грешники будут искать убежище в Аду, подобно тому, как ребенок ищет убежище у своей матери; или грешники будут падать в Адскую Пропасть вниз головой).","Бас, унинг онаси дўзахдир."],["وَمَآ أَدْرَىٰكَ مَا هِيَهْ","Wa maa adraaka maa hiyah","And what can make you know what that is?","Откуда ты мог знать, что это такое?","У қандоқ нарса эканлигини сенга нима билдирди?"],["نَارٌ حَامِيَةٌۢ","Naarun hamiyah","It is a Fire, intensely hot.","Это - жаркий Огонь!","У қаттиқ қизиган ўтдир."]],"b":1,"type":"Meccan","w":[[["al-qāriʿatu","The Striking Calamity"]],[["mā","What"],["l-qāriʿatu","(is) the Striking Calamity"]],[["wamā","And what"],["adrāka","will make you know"],["mā","what"],["l-qāriʿatu","(is) the Striking Calamity"]],[["yawma","(The) Day"],["yakūnu","will be"],["l-nāsu","the mankind"],["kal-farāshi","like moths"],["l-mabthūthi","scattered"]],[["watakūnu","And will be"],["l-jibālu","the mountains"],["kal-ʿih'ni","like wool"],["l-manfūshi","fluffed up"]],[["fa-ammā","Then as for"],["man","(him) whose"],["thaqulat","(are) heavy"],["mawāzīnuhu","his scales"]],[["fahuwa","Then he"],["fī","(will be) in"],["ʿīshatin","a life"],["rāḍiyatin","pleasant"]],[["wa-ammā","But as for"],["man","(him) whose"],["khaffat","(are) light"],["mawāzīnuhu","his scales"]],[["fa-ummuhu","His abode"],["hāwiyatun","(will be the) Pit"]],[["wamā","And what"],["adrāka","will make you know"],["mā","what"],["hiyah","it is"]],[["nārun","A Fire"],["ḥāmiyatun","intensely hot"]]],"uzl":["Al-Qori'a.","Al-Qori'a nima?","Al-Qori'a qandoq narsa ekanligini senga nima bildirdi?","U kunda odamlar toʻzib ketgan kapalakka oʻxshab qolarlar.","Va togʻlar titilgan junga oʻxshab qolarlar.","Kimning tarozusi ogʻir kelsa...","Bas, u rozilik hayotidadir.","Va ammo kimning tarozusi yengil kelsa...","Bas, uning onasi haaviya (doʻzax)dir.","U (Haaviya) qandoq narsa ekanligini senga nima bildirdi?","U qattiq qizigan oʻtdir."],"t":[["Ал-қориъа","Ал-қориъа","Al-qoriʼa"],["Мал-қориъа","Мал-қориъа","Mal-qoriʼa"],["Вама адрока мал-қориъа","Вама адрока мал-қориъа","Vama adroka mal-qoriʼa"],["Явма якунун-насу кал-фарошил-мабсус","Явма якунун-насу кал-фарошил-мабсус","Yavma yakunun-nasu kal-faroshil-mabsus"],["Ватакунул-жибалу кал-ъиҳнил-манфуш","Ватакунул-жибалу кал-ъиҳнил-манфуш","Vatakunul-jibalu kal-ʼihnil-manfush"],["Фа-амма ман сақулат мавазийнуҳ","Фа-амма ман сақулат мавазийнуҳ","Fa-amma man saqulat mavaziynuh"],["Фаҳува фий ъийшатин розия","Фаҳува фий ъийшатин розия","Fahuva fiy ʼiyshatin roziya"],["Ва-амма ман хоффат мавазийнуҳ","Ва-амма ман хоффат мавазийнуҳ","Va-amma man xoffat mavaziynuh"],["Фа-уммуҳу ҳавия","Фа-уммуҳу ҳавия","Fa-ummuhu haviya"],["Вама адрока ма ҳияҳ","Вама адрока ма ҳияҳ","Vama adroka ma hiyah"],["Нарун ҳамия","Нарун ҳамия","Narun hamiya"]],"wt":[[["ал-қориъату","ал-қориъату","al-qoriʼatu"]],[["ма","ма","ma"],["ал-қориъату","ал-қориъату","al-qoriʼatu"]],[["вама","вама","vama"],["адрока","адрока","adroka"],["ма","ма","ma"],["ал-қориъату","ал-қориъату","al-qoriʼatu"]],[["явма","явма","yavma"],["якуну","якуну","yakunu"],["ан-насу","ан-насу","an-nasu"],["кал-фароши","кал-фароши","kal-faroshi"],["ал-мабсуси","ал-мабсуси","al-mabsusi"]],[["ватакуну","ватакуну","vatakunu"],["ал-жибалу","ал َهَا عَيْنَ ٱلْيَقِينِ","Thumma latara wunnaha 'ainal yaqeen","Then you will surely see it with the eye of certainty.","Вы увидите его глазами убежденными.","Ва яна, албатта, уни ишонч кўзи билан кўрасизлар."],["ثُمَّ لَتُسْـَٔلُنَّ يَوْمَئِذٍ عَنِ ٱلنَّعِيمِ","Thumma latus alunna yauma-izin 'anin na'eem","Then you will surely be asked that Day about pleasure.","В тот день вы будете спрошены о благах.","Сўнгра ўша кунда, албатта, берилган неъматлардан сўраласизлар."]],"b":1,"type":"Meccan","w":[[["alhākumu","Diverts you"],["l-takāthuru","the competition to increase"]],[["ḥattā","Until"],["zur'tumu","you visit"],["l-maqābira","the graves"]],[["kallā","Nay"],["sawfa","Soon"],["taʿlamūna","you will know"]],[["thumma","Then"],["kallā","nay"],["sawfa","Soon"],["taʿlamūna","you will know"]],[["kallā","Nay"],["law","If"],["taʿlamūna","you know"],["ʿil'ma","(with) a knowledge"],["l-yaqīni","(of) certainty"]],[["latarawunna","Surely you will see"],["l-jaḥīma","the Hellfire"]],[["thumma","Then"],["latarawunnahā","surely you will see it"],["ʿayna","(with the) eye"],["l-yaqīni","(of) certainty"]],[["thumma","Then"],["latus'alunna","surely you will be asked"],["yawma-idhin","that Day"],["ʿani","about"],["l-naʿīmi","the pleasures"]]],"uzl":["«Kimniki koʻp» sizni mashgʻul qildi.","To qabrlarni ziyorat qilguningizcha.","Yoʻq! Sizlar tezda bilasiz.","Yana yoʻq! Sizlar tezda bilasiz.","Yoʻq! Agar Siz aniq ilm ila bilganingizda edi.","Albatta, jahannamni koʻrasiz.","Va yana, albatta, uni ishonch koʻzi bilan koʻrasiz.","Soʻngra, oʻsha kunda, albatta, berilgan ne'matlardan soʻralasiz."],"t":[["Алҳакумут-такасур","Алҳакумут-такасур","Alhakumut-takasur"],["Ҳатта зуртумул-мақобир","Ҳатта зуртумул-мақобир","Hatta zurtumul-maqobir"],["Калла савфа таъламун","Калла савфа таъламун","Kalla savfa taʼlamun"],["Сумма калла савфа таъламун","Сумма калла савфа таъламун","Summa kalla savfa taʼlamun"],["Калла лав таъламуна ъилмал-яқийн","Калла лав таъламуна ъилмал-яқийн","Kalla lav taʼlamuna ʼilmal-yaqi َدَّدَهُۥ","Al-lazi jama'a maalaw wa'addadah","Who collects wealth and [continuously] counts it.","который копит состояние и пересчитывает его,","У мол жамлади ва уни санаб турди."],["يَحْسَبُ أَنَّ مَالَهُۥٓ أَخْلَدَهُۥ","Yahsabu anna maalahu akhladah","He thinks that his wealth will make him immortal.","думая, что богатство увековечит его.","У, албатта, уни абадий қолдирур, деб ҳисоблар."],["كَلَّا ۖ لَيُنۢبَذَنَّ فِى ٱلْحُطَمَةِ","Kalla layum ba zanna fil hutamah","No! He will surely be thrown into the Crusher.","Но нет! Его непременно ввергнут в Огонь сокрушающий.","Йўқ! Албатта у «ҳутома»га хор-зор этиб ташланар."],["وَمَآ أَدْرَىٰكَ مَا ٱلْحُطَمَةُ","Wa maa adraaka mal-hutamah","And what can make you know what is the Crusher?","Откуда ты мог знать, что такое Огонь сокрушающий?","«Ҳутома» қандоқ нарса эканини сенга нима билдирар?"],["نَارُ ٱللَّهِ ٱلْمُوقَدَةُ","Narul laahil-mooqada","It is the fire of Allah, [eternally] fueled,","Это - разожженный Огонь Аллаха,","У Аллоҳнинг шиддатли, ўчмас оловидир."],["ٱلَّتِى تَطَّلِعُ عَلَى ٱلْأَفْـِٔدَةِ","Al latee tat tali'u 'alalafidah","Which mounts directed at the hearts.","который вздымается над сердцами.","Қалбгача етиб борадир."],["إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌۭ","Innaha 'alaihim mu'sada","Indeed, Hellfire will be closed down upon them","Воистину, он сомкнется над ними","Албатта, у уларни устидан қоплангандир."],["فِى عَمَدٍۢ مُّمَدَّدَةٍۭ","Fee 'amadim-mu mad dadah","In extended columns.","высокими столбами (мученики будут прикованы к этим столбам или врата Ада будут заперты и закреплены этими столбами).","Узун-узун устунларга боғлангандирлар."]],"b":1,"type":"Meccan","w":[[["waylun","Woe"],["likulli","to every"],["humazatin","slanderer"],["lumazatin","backbiter"]],[["alladhī","The one who"],["jamaʿa","collects"],["mālan","wealth"],["waʿaddadahu","and counts it"]],[["yaḥsabu","Thinking"],["anna","that"],["mālahu","his wealth"],["akhladahu","will make him immortal"]],[["kallā","Nay"],["layunbadhanna","Surely he w  ahad","Does he think that never will anyone overcome him?","Неужели он полагает, что никто не справится с ним?","У инсон унга ҳеч кимнинг кучи етмайди, деб ҳисоблайдими?"],["يَقُولُ أَهْلَكْتُ مَالًۭا لُّبَدًا","Yaqoolu ahlaktu maalal lubadaa","He says, \"I have spent wealth in abundance.\"","Он говорит: «Я погубил богатство несметное!».","У, кўплаб мол-дунё нафақа қилдим, дейдир."],["أَيَحْسَبُ أَن لَّمْ يَرَهُۥٓ أَحَدٌ","Ayahsabu al lam yarahooo ahad","Does he think that no one has seen him?","Неужели он полагает, что никто не видел его?","У инсон уни биров кўрмади, деб ўйлайдими?"],["أَلَمْ نَجْعَل لَّهُۥ عَيْنَيْنِ","Alam naj'al lahoo 'aynayn","Have We not made for him two eyes?","Разве Мы не наделили его двумя глазами,","Биз унга икки кўзни бермадикми?"],["وَلِسَانًۭا وَشَفَتَيْنِ","Wa lisaananw wa shafatayn","And a tongue and two lips?","языком и двумя устами?","Ва тилни ва икки лабни (бермадикми?)"],["وَهَدَيْنَٰهُ ٱلنَّجْدَيْنِ","Wa hadaynaahun najdayn","And have shown him the two ways?","Разве Мы не указали ему на две восходящие тропы?","Ва Биз уни икки: (яхши ва ёмон) йўлга йўллаб қўйдик."],["فَلَا ٱقْتَحَمَ ٱلْعَقَبَةَ","Falaq tahamal-'aqabah","But he has not broken through the difficult pass.","Но он не стал преодолевать крутую тропу.","Бас, у довон ошиб ўтмади."],["وَمَآ أَدْرَىٰكَ مَا ٱلْعَقَبَةُ","Wa maaa adraaka mal'aqabah","And what can make you know what is [breaking through] the difficult pass?","Откуда ты мог знать, что такое крутая тропа?","Довон қандоқ нарса эканини сенга нима билдирди?"],["فَكُّ رَقَبَةٍ","Fakku raqabah","It is the freeing of a slave","Это - освобождение раба","У қул озод қилишдир."],["أَوْ إِطْعَٰمٌۭ فِى يَوْمٍۢ ذِى مَسْغَبَةٍۢ","Aw it'aamun fee yawmin zee masghabah","Or feeding on a day of severe hunger","или кормление в голодный день","Ёки очарчилик кунида таом беришдир."],["يَتِيمًۭا ذَا مَقْرَبَةٍ","Yateeman zaa maqrabah","An orphan of near relationship","сироту из числа родственников","Қариндош етимларга."],["أَوْ مِسْكِينًۭا ذَا مَتْرَبَةٍۢ","Aw miskeenan zaa matrabah","Or a needy person in misery","или приникшего к земле бедняка.","Ёки тупроққа қориган мискинларга."],["ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُوا۟ وَتَوَاصَوْا۟ بِٱلصَّبْرِ وَتَوَاصَوْا۟ بِٱلْمَرْحَمَةِ","Summa kaana minal lazeena aamanoo wa tawaasaw bissabri wa tawaasaw bilmarhamah","And then being among those who believed and advised one another to patience and advised one another to compassion.","А после этого надо быть одним из тех, которые уверовали и заповедали друг другу терпение и заповедали друг другу милосердие.","Сўнгра иймон келтирганлар ва бир-бирини сабрга, меҳр-шафқатга чақирганлар бўлса."],["أُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلْمَيْمَنَةِ","Ulaaa'ika As-haabul maimanah","Those are the companions of the right.","Таковы люди правой стороны.","Ана ўшалар ўнг томон эгаларидир."],["وَٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِنَا هُمْ أَصْحَٰبُ ٱلْمَشْـَٔمَةِ","Wallazeena kafaroo bi aayaatinaa hum as-haabul Mash'amah","But they who disbelieved in Our signs - those are the companions of the left.","Те же, которые не уверовали в Наши знамения, являются людьми левой стороны,","Оятларимизга куфр келтирганлар, улар, чап томон эгаларидир."],["عَلَيْهِمْ نَارٌۭ مُّؤْصَدَةٌۢ","Alaihim naarum mu'sadah","Over them will be fire closed in.","над которыми сомкнется Огонь.","Уларни чиқиб бўлмайдиган ўт-олов ўраб олгандир."]],"b":1,"type":"Meccan","w":[[["lā","Nay"],["uq'simu","I swear"],["bihādhā","by this"],["l-baladi","city"]],[["wa-anta","And you"],["ḥillun","(are) free (to dwell)"],["bihādhā","in this"],["l-baladi","city"]],[["wawālidin","And the begetter"],["wamā","and what"],["walada","he begot"]],[["laqad","Certainly"],["khalaqnā","We have created"],["l-insāna","man"],["fī","(to be) in"],["kabadin","hardship"]],[["ayaḥsabu","Does he think"],["an","that"],["lan","not"],["yaqdira","has power"],["ʿalayhi","over him"],["aḥadun","anyone"]],[["yaqūlu","He will say"],["ahlaktu","I have squandered"],["mālan","wealth"],["lubadan","abundant"]],[["a sh yetimga.","Yoki tuproqqa qorilgan miskinga.","Soʻngra, iymon keltirganlar va bir-birini sabrga, mehr-shafqatga chaqirganlar boʻlsa...","Ana oʻshalar oʻng tomon egalaridir.","Oyatlarimizga kufr keltirganlar chap tomon egalaridir.","Ularni chiqib boʻlmaydigan oʻt-olov oʻrab olgandir."],"t":[["Ла уқсиму биҳазал-балад","Ла уқсиму биҳазал-балад","La uqsimu bihazal-balad"],["Ва-анта ҳиллун биҳазал-балад","Ва-анта ҳиллун биҳазал-балад","Va-anta hillun bihazal-balad"],["Вавалидин вама валад","Вавалидин вама валад","Vavalidin vama valad"],["Лақод холақнал-инсана фий кабад","Лақод холақнал-инсана фий кабад","Laqod xolaqnal-insana fiy kabad"],["Аяҳсабу ан лан яқдиро ъалайҳи аҳад","Аяҳсабу ан лан яқдиро ъалайҳи аҳад","Ayahsabu an lan yaqdiro ʼalayhi ahad"],["Яқулу аҳлакту малан лубада","Яқулу аҳлакту малан лубада","Yaqulu ahlaktu malan lubada"],["Аяҳсабу ан лам яроҳу аҳад","Аяҳсабу ан лам яроҳу аҳад","Ayahsabu an lam yarohu ahad"],["Алам нажъал лаҳу ъайнайн","Алам нажъал лаҳу ъайнайн","Alam najʼal lahu ʼaynayn"],["Валисанан вашафатайн","Валисанан вашафатайн","Valisanan vashafatayn"],["Ваҳадайнаҳун-наждайн","Ваҳадайнаҳун-наждайн","Vahadaynahun-najdayn"],["Фала иқтаҳамал-ъақоба","Фала иқтаҳамал-ъақоба","Fala iqtahamal-ʼaqoba"],["Вама адрока мал-ъақоба","Вама адрока мал-ъақоба","Vama adroka mal-ʼaqoba"],["Факку роқоба","Факку роқоба","Fakku roqoba"],["Ав итъамун фий явмин зий масғоба","Ав итъамун фий явмин зий масғоба","Av itʼamun fiy yavmin ziy masgʻoba"],["Ятийман за мақроба","Ятийман за мақроба","Yatiyman za maqroba"],["Ав мискийнан за матроба","Ав мискийнан за матроба","Av miskiynan za matroba"],["Сумма кана минал-лазийна аману ватавасов бис-собри ватавасов бил-марҳама","Сумма кана минал-лазийна аману ватавасов бис-собри ватавасов бил-марҳама","Summa kana minal-laziyna amanu vatavasov bis-sobri vatavasov bil-marhama"],["Улаъика асҳабул-маймана","Улаъика асҳабул-маймана","Ulaʼika ashabul-maymana"],["Ва-аллазийна кафару биъаятина ҳум асҳабул-машама","Ва-аллазийна кафару биъая сумма","сумма","summa"],["кана","кана","kana"],["мина","мина","mina"],["аллазийна","аллазийна","allaziyna"],["аману","аману","amanu"],["ватавасов","ватавасов","vatavasov"],["бис-собри","бис-собри","bis-sobri"],["ватавасов","ватавасов","vatavasov"],["бил-марҳамати","бил-марҳамати","bil-marhamati"]],[["улаъика","улаъика","ulaʼika"],["асҳабу","асҳабу","ashabu"],["ал-майманати","ал-майманати","al-maymanati"]],[["ва-аллазийна","ва-аллазийна","va-allaziyna"],["кафару","кафару","kafaru"],["биъаятина","биъаятина","biʼayatina"],["ҳум","ҳум","hum"],["асҳабу","асҳабу","ashabu"],["ал-машамати","ал-машамати","al-mashamati"]],[["ъалайҳим","ъалайҳим","ʼalayhim"],["нарун","нарун","narun"],["мусодатун","мусодатун","musodatun"]]]},"91":{"n":91,"ar":"سُورَةُ الشَّمْسِ","en":"Ash-Shams","enT":"The Sun","c":15,"a":[["وَٱلشَّمْسِ وَضُحَىٰهَا","Wash shamsi wa duhaa haa","By the sun and its brightness","Клянусь солнцем и его утренним сиянием!","Қуёш билан ва унинг зиёси билан қасам."],["وَٱلْقَمَرِ إِذَا تَلَىٰهَا","Wal qamari izaa talaa haa","And [by] the moon when it follows it","Клянусь луной, когда она следует за ним!","Унинг ортидан келадиган Ой билан қасам."],["وَٱلنَّهَارِ إِذَا جَلَّىٰهَا","Wannahaari izaa jallaa haa","And [by] the day when it displays it","Клянусь днем, когда он делает его (солнце) ясным!","Ва у(қуёш)ни равшан кўрсатган наҳор билан қасам."],["وَٱلَّيْلِ إِذَا يَغْشَىٰهَا","Wallaili izaa yaghshaa haa","And [by] the night when it covers it","Клянусь ночью, когда она скрывает его (солнце)!","Ва у(қуёш)ни қоплаган тун билан қасам."],["وَٱلسَّمَآءِ وَمَا بَنَىٰهَا","Wassamaaa'i wa maa banaahaa","And [by] the sky and He who constructed it","Клянусь небом и Тем, Кто его воздвиг (или тем, как Он воздвиг его)!","Ва осмон билан ва унинг бино қилиниши билан қасам."],["وَٱلْأَرْضِ وَمَا طَحَىٰهَا","Wal ardi wa maa tahaahaa","And [by] the earth and He who spread it","Клянусь землей и Тем, Кто ее распростер (или тем, как Он распростер ее)!","Ва ер билан ва унинг тўшалиши билан қасам."],["وَنَفْسٍۢ وَمَا سَوَّىٰهَا","Wa nafsinw wa maa sawwaahaa","And [by] the soul and He who proportioned it","Клянусь душой и Тем, Кто придал ей совершенный облик (или тем, как Он сделал ее облик совершенным)","Ва нафс билан ва унинг бекам-кўст қилиб яратилиши билан қасам."],["فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَىٰهَا","Fa-alhamahaa fujoorahaa wa taqwaahaa","And inspired it [with discernment of] its wickedness and its righteousness,","и внушил ей порочность ее и богобоязненность!","Бас, у(нафс)га фужурини ва тақвосини билдирди."],["قَدْ أَفْلَحَ مَن زَكَّىٰهَا","Qad aflaha man zakkaahaa","He has succeeded who purifies it,","Преуспел тот, кто очистил ее,","Батаҳқиқ, ким у(нафс)ни покласа, ютуққа эришади."],["وَقَدْ خَابَ مَن دَسَّىٰهَا","Wa qad khaaba man dassaahaa","And he has failed who instills it [with corruption].","и понес урон тот, кто скрыл ее (опорочил, облек в несправедливость).","Ва батаҳқиқ, ким у(нафс)ни кирласа, ноумид бўлади."],["كَذَّبَتْ ثَمُودُ بِطَغْوَىٰهَآ","Kazzabat Samoodu bi taghwaahaaa","Thamud denied [their prophet] by reason of their transgression,","Самудяне сочли лжецом пророка Салиха из-за своего беззакония,","Самуд қавми ўз туғёни ила ( Пай ғамбарини) ёлғонга чиқарди."],["إِذِ ٱنۢبَعَثَ أَشْقَىٰهَا","Izim ba'asa ashqaahaa","When the most wretched of them was sent forth.","и тогда самый несчастный из них вызвался убить верблюдицу.","Вақтики, (ундаги) энг бадбахт шахс шошилиб турди."],["فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا","Faqaala lahum Rasoolul laahi naaqatal laahi wa suqiyaahaa","And the messenger of Allah [Salih] said to them, \"[Do not harm] the she-camel of Allah or [prevent her from] her drink.\"","Посланник Аллаха (Салих) сказал им: «Берегите верблюдицу и питье ее!».","Бас, уларга Аллоҳнинг Расули «Аллоҳнинг туясига ва унинг сувига тегманглар», деди."],["فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا","Fakazzaboohu fa'aqaroohaa fadamdama 'alaihim Rabbuhum bizambihim fasaw waahaa","But they denied him and hamstrung her. So their Lord brought down upon them destruction for their sin and made it equal [upon all of them].","Они сочли его лжецом и подрезали ей поджилки, и за этот грех Господь их подверг их наказанию, которое было одинаковым для всех (или сровнял над ними землю).","Бас, уни ёлғончига чиқаришди ва ул(туяни) сўйишди."],["وَلَا يَخَافُ عُقْبَٰهَا","Wa laa yakhaafu'uqbaahaa","And He does not fear the consequence thereof.","И не опасался Он последствий этого.","Ва У зот бу ишнинг оқибатидан қўрқмайди."]],"b":1,"type":"Meccan","w":[[["wal-shamsi","By the sun"],["waḍuḥāhā","and its brightness"]],[["wal-qamari","And the moon"],["idhā","when"],["talāhā","it follows it"]],[["wal-nahāri","And the day"],["idhā","when"],["jallāhā","it displays it"]],[["wa-al-layli","And the night"],["idhā","when"],["yaghshāhā","it covers it"]],[["wal-samāi","And the heaven"],["wamā","and (He) Who"],["banāhā","constructed it"]],[["wal-arḍi","And the earth"],["wamā","and by (He) Who"],["ṭaḥāhā","spread it"]],[["wanafsin","And (the) soul"],["wamā","and (He) Who"],["sawwāhā","proportioned it"]],[["fa-alhamahā","And He inspired it"],["fujūrahā","(to distinguish) its wickedness"],["wataqwāhā","and its righteousness"]],[["qad","Indeed"],["aflaḥa","he succeeds"],["man","who"],["zakkāhā","purifies it"]],[["waqad","And indeed"],["khāba","he fails"],["man","who"],["dassāhā","buries it"]],[["kadhabat","Denied"],["thamūdu","Thamud"],["biṭaghwāhā","by their transgression"]],[["idhi","When"],["inbaʿatha","(was) sent forth"],["ashqāhā","(the) most wicked of them"]],[["faqāla","But said"],["lahum","to them"],["rasūlu","(the) Messenger"],["l-lahi","(of) Allah"],["nāqata","(It is the) she-camel"],["l-lahi","(of) Allah"],["wasuq'yāhā","and her drink"]],[["fakadhabūhu","But they denied him"],["faʿaqarūhā","and they hamstrung her"],["fadamdama","So destroyed"],["ʿalayhim","them"],["rabbuhum","their Lord"],["bidhanbihim","for their sin"],["fasawwāhā","and leveled them"]],[["walā","And not"],["yakhāfu","He fears"],["ʿuq'bāhā","its consequences"]]],"uzl":["Quyosh bilan va uning ziyosi bilan qasam.","Uning ortidan kelgan oy bilan qasam.","Va u(quyosh)ni ravshan koʻrsatgan nahor bilan qasam.","Va u(quyosh)ni qoplagan tun bilan qasam.","Va osmon bilan va uning bino qilinishi bilan qasam.","Va yer bilan va uning toʻshalishi bilan qasam.","Va nafs bilan va uning mukammal qilinishi bilan qasam.","Bas, unga fujurini va taqvosini bildirdi.","Batahqiq, kim u(nafs)ni poklasa, yutuqqa erishdi.","Va batahqiq, kim u(nafs)ni kirlasa, noumid boʻldi.","Samud qavmi oʻz tugʻyoni ila yolgʻonga chiqardi.","Vaqtiki, uning eng badbaxti shoshilib turdi.","Bas, ularga Allohning Rasuli: «Allohning tuyasiga va uning suviga tegmanglar», dedi.","Bas, (uni) yolgʻonchiga chiqarishdi va (tuyani) soʻyishdi. Bas, Robblari ularni gunohlari sababli yoʻq qilib yubordi va bunda barchani barobar qildi.","Va U zot bu(ish)ning oqibatidan qoʻrqmas."],"t":[["Ваш-шамси вазуҳаҳа","Ваш-шамси вазуҳаҳа","Vash-shamsi vazuhaha"],["Вал-қомари иза талаҳа","Вал-қомари иза талаҳа","Val-qomari iza talaha"],["Ван-наҳари иза жаллаҳа","Ван-наҳари иза жаллаҳа","Van-nahari iza jallaha"],["Вал-лайли иза яғшаҳа","Вал-лайли иза яғшаҳа","Val-layli iza yagʻshaha"],["Вас-самаъи вама банаҳа","Вас-самаъи вама банаҳа","Vas-samaʼi vama banaha"],["Вал-арзи вама тоҳаҳа","Вал-арзи вама тоҳаҳа","Val-arzi vama tohaha"],["Ванафсин вама савваҳа","Ванафсин вама савваҳа","Vanafsin vama savvaha"],["Фа-алҳамаҳа фужуроҳа ватақваҳа","Фа-алҳамаҳа фужуроҳа ватақваҳа","Fa-alhamaha fujuroha vataqvaha"],["Қод афлаҳа ман заккаҳа","Қод афлаҳа ман заккаҳа","Qod aflaha man zakkaha"],["Вақод хоба ман дассаҳа","Вақод хоба ман дассаҳа","Vaqod xoba man dassaha"],["Казабат самуду битоғваҳа","Казабат самуду битоғваҳа","Kazabat samudu bitogʻvaha"],["Изи инбаъаса ашқоҳа","Изи инбаъаса ашқоҳа","Izi inbaʼasa ashqoha"],["Фақола лаҳум росулуллоҳи нақоталлоҳи васуқяҳа","Фақола лаҳум росулуллоҳи нақоталлоҳи васуқяҳа","Faqola lahum ros "yaxofu"],["ъуқбаҳа","ъуқбаҳа","ʼuqbaha"]]]},"92":{"n":92,"ar":"سُورَةُ اللَّيْلِ","en":"Al-Lail","enT":"The Night","c":21,"a":[["وَٱلَّيْلِ إِذَا يَغْشَىٰ","Wallaili izaa yaghshaa","By the night when it covers","Клянусь ночью, когда она покрывает землю!","Туннинг қоплаб келаётган пайти билан қасам."],["وَٱلنَّهَارِ إِذَا تَجَلَّىٰ","Wannahaari izaa tajalla","And [by] the day when it appears","Клянусь днем, когда он проясняется!","Наҳорнинг тажалли пайти билан қасам."],["وَمَا خَلَقَ ٱلذَّكَرَ وَٱلْأُنثَىٰٓ","Wa maa khalaqaz zakara wal unthaa","And [by] He who created the male and female,","Клянусь Тем, Кто создал мужчину и женщину!","Эркак ва урғочининг яратилиши билан қасам."],["إِنَّ سَعْيَكُمْ لَشَتَّىٰ","Inna sa'yakum lashattaa","Indeed, your efforts are diverse.","Ваши стремления различны.","Албатта, сизларнинг ишларингиз турличадур."],["فَأَمَّا مَنْ أَعْطَىٰ وَٱتَّقَىٰ","Fa ammaa man a'taa wattaqaa","As for he who gives and fears Allah","Тому, кто отдавал должное (или раздавал милостыню) и был богобоязнен,","Аммо кимки (ато) берса ва тақво қилса."],["وَصَدَّقَ بِٱلْحُسْنَىٰ","Wa saddaqa bil husnaa","And believes in the best [reward],","кто признавал наилучшее (свидетельство единобожия или Рай),","Ва гўзал(сўз)ни тасдиқ қилса."],["فَسَنُيَسِّرُهُۥ لِلْيُسْرَىٰ","Fasanu yassiruhoo lilyusraa","We will ease him toward ease.","Мы облегчим путь к легчайшему (к праведным деяниям).","Бас, Биз уни осонга муяссар қиламиз."],["وَأَمَّا مَنۢ بَخِلَ وَٱسْتَغْنَىٰ","Wa ammaa mam bakhila wastaghnaa","But as for he who withholds and considers himself free of need","А тому, кто был скуп и полагал, что ни в чем не нуждается,","Аммо кимки бахиллик ва истиғно қилса."],["وَكَذَّبَ بِٱلْحُسْنَىٰ","Wa kazzaba bil husnaa","And denies the best [reward],","кто счел ложью наилучшее (свидетельство единобожия или Рай),","Ва гўзал(сўз)ни ёлғонга чиқарса."],["فَسَنُيَسِّرُهُۥ لِلْعُسْرَىٰ","Fasanu yassiruhoo lil'usraa","We will ease him toward difficulty.","Мы облегчим путь к тягчайшему (к злу и наказанию).","Бас, Биз уни қийинга муяссар қиламиз."],["وَمَا يُغْنِى عَنْهُ مَالُهُۥٓ إِذَا تَرَدَّىٰٓ","Wa maa yughnee 'anhu maaluhooo izaa taraddaa","And what will his wealth avail him when he falls?","Не спасет его достояние, когда он падет (в Геенну или погибнет).","У қулаган вақтда унга мол-мулки фойда бермас."],["إِنَّ عَلَيْنَا لَلْهُدَىٰ","Inna 'alainaa lal hudaa","Indeed, [incumbent] upon Us is guidance.","Воистину, Нам надлежит вести прямым путем.","Албатта, ҳидоятга бошлаш Бизнинг зиммамиздадир."],["وَإِنَّ لَنَا لَلْءَاخِرَةَ وَٱلْأُولَىٰ","Wa inna lanaa lal Aakhirata wal oolaa","And indeed, to Us belongs the Hereafter and the first [life].","Нам же принадлежат жизнь Последняя и первая.","Албатта, ҳам охират ва ҳам бу дунё Бизникидир."],["فَأَنذَرْتُكُمْ نَارًۭا تَلَظَّىٰ","Fa anzartukum naaran talazzaa","So I have warned you of a Fire which is blazing.","Я предостерег вас от пылающего Огня.","Бас, Мен сизларни (алангаси авж олиб турган) ўтдан огоҳлантирдим."],["لَا يَصْلَىٰهَآ إِلَّا ٱلْأَشْقَى","Laa yaslaahaaa illal ashqaa","None will [enter to] burn therein except the most wretched one.","Войдет в него только самый несчастный,","У(ўт)га бадбахтдан бошқа ҳеч ким кирмас."],["ٱلَّذِى كَذَّبَ وَتَوَلَّىٰ","Allazee kazzaba wa tawallaa","Who had denied and turned away.","который считает истину ложью и отворачивается.","Ўша ёлғонга чиқарган ва юз ўгирган эди."],["وَسَيُجَنَّبُهَا ٱلْأَتْقَى","Wa sa yujannnabuhal atqaa","But the righteous one will avoid it -","Отдален от него будет самый богобоязненный,","Ва албатта, ундан тақводор банда четда қолади."],["ٱلَّذِى يُؤْتِى مَالَهُۥ يَتَزَكَّىٰ","Allazee yu'tee maalahoo yatazakkaa","[He] who gives [from] his wealth to purify himself","который раздает свое имущество, очищаясь,","У бойлигини сарфлайди ва ўзини поклайди."],["وَمَا لِأَحَدٍ عِندَهُۥ مِن نِّعْمَةٍۢ تُجْزَىٰٓ","Wa maa li ahadin 'indahoo min ni'matin tujzaaa","And not [giving] for anyone who has [done him] a favor to be rewarded","и всякую милость возмещает сполна","Унда бирор кишининг қайтарилиши лозим яхшилиги йўқ эди."],["إِلَّا ٱبْتِغَآءَ وَجْهِ رَبِّهِ ٱلْأَعْلَىٰ","Illab tighaaa'a wajhi rabbihil a 'laa","But only seeking the countenance of his Lord, Most High.","только из стремления к Лику своего Всевышнего Господа.","Фақатгина олий мақом Роббисининг розилигини сўраб қилади."],["وَلَسَوْفَ يَرْضَىٰ","Wa lasawfa yardaa","And he is going to be satisfied.","И он непременно будет удовлетворен.","Ва у албатта тезда рози бўлади."]],"b":1,"type":"Meccan","w":[[["wa-al-layli","By the night"],["idhā","when"],["yaghshā","it covers"]],[["wal-nahāri","And the day"],["idhā","when"],["tajallā","it shines in brightness"]],[["wamā","And He Who"],["khalaqa","created"],["l-dhakara","the male"],["wal-unthā","and the female"]],[["inna","Indeed"],["saʿyakum","your efforts"],["lashattā","(are) surely diverse"]],[["fa-ammā","Then as for"],["man","(him) who"],["aʿṭā","gives"],["wa-ittaqā","and fears"]],[["waṣaddaqa","And believes"],["bil-ḥus'nā","in the best"]],[["fasanuyassiruhu","Then We will ease him"],["lil'yus'rā","towards [the] ease"]],[["wa-ammā","But as for"],["man","(him) who"],["bakhila","withholds"],["wa-is'taghnā","and considers himself free from need"]],[["wakadhaba","And denies"],["bil-ḥus'nā","the best"]],[["fasanuyassiruhu","Then We will ease him"],["lil'ʿus'rā","towards [the] difficulty"]],[["wamā","And not"],["yugh'nī","will avail"],["ʿanhu","him"],["māluhu","his wealth"],["idhā","when"],["taraddā","he falls"]],[["inna","Indeed"],["ʿalaynā","upon Us"],["lalhudā","(is) the guidance"]],[["wa-inna","And indeed"],["lanā","for Us"],["lalākhirata","(is) the Hereafter"],["wal-ūlā","and the first (life)"]],[["fa-andhartukum","So I warn you"],["nāran","(of) a Fire"],["talaẓẓā","blazing"]],[["lā","Not"],["yaṣlāhā","will burn (in) it"],["illā","except"],["l-ashqā","the most wretched"]],[["alladhī","The one who"],["kadhaba","denied"],["watawallā","and turned away"]],[["wasayujannabuhā","But will be removed from it"],["l-atqā","the righteous"]],[["alladhī","The one who"],["yu'tī","gives"],["mālahu","his wealth"],["yatazakkā","(to) purify himself"]],[["wamā","And not"],["li-aḥadin","for anyone"],["ʿindahu","with him"],["min","any"],["niʿ'matin","favor"],["tuj'zā","to be recompensed"]],[["illā","Except"],["ib'tighāa","seeking"],["wajhi","(the) Countenance"],["rabbihi","(of) his Lord"],["l-aʿlā","the Most High"]],[["walasawfa","And soon, surely"],["yarḍā","he will be pleased"]]],"uzl":["Tunning qoplab kelayotgan payti bilan qasam.","Nahorning tajalli payti bilan qasam.","Erkak va urgʻochining yaratilishi bilan qasam.","Albatta, sizlarning ishlaringiz turlichadur.","Ammo kimki (ato) bersa va taqvo qilsa...","Va goʻzalni tasdiq qilsa...","Bas, Biz uni osonga muyassar qilamiz.","Va ammo, kimki baxillik va istigʻno qilsa...","Va goʻzalni yolgʻonga chiqarsa...","Bas, Biz uni qiyinga muyassar qilamiz.","U qulagan vaqtda unga mol-mulki foyda bermas.","Albatta, hidoyatga boshlash Bizning zimmamizdadir.","Albatta, ham oxirat va ham bu dunyo Biznikidir.","Bas, Men sizlarni lovullagan oʻtdan ogohlantirdim.","Unga badbaxtdan boshqa kirmas.","Oʻsha yolgʻonga chiqargan va yuz oʻgirgan edi.","Va albatta, undan taqvodor banda chetda qoladir.","U, boyligini sarflaydir va oʻzini poklaydir.","Biror kishining unda qaytarilishi lozim yaxshiligi yoʻq edi.","Faqat, oʻzining oliy maqom Robbining roziligini soʻrab qiladir.","Va albatta, tezda rozi boʻladir."],"t":[["Вал-лайли иза яғша","Вал-лайли иза яғша","Val-layli iza yagʻsha"],["Ван-наҳари иза тажалла","Ван-наҳари иза тажалла","Van-nahari iza tajalla"],["Вама холақоз-закаро вал-унса","Вама холақоз-закаро вал-унса","Vama xolaqoz-zakaro val-unsa"],["Инна саъякум лашатта","Инна саъякум лашатта","Inna saʼyakum lashatta"],["Фа-амма ман аъто ва-иттақо","Фа-амма ман аъто ва-иттақо","Fa-amma man aʼto va-ittaqo"],["Васоддақо бил-ҳусна","Васоддақо бил-ҳусна","Vasoddaqo bil-husna"],["Фасануяссируҳу лилюсро","Фасануяссируҳу лилюсро","Fasanuyassiruhu lilyusro"], aa","Your Lord has not taken leave of you, [O Muhammad], nor has He detested [you].","Не покинул тебя твой Господь и не возненавидел.","Роббинг сени тарк қилмади ва ғазаб ҳам қилмади."],["وَلَلْءَاخِرَةُ خَيْرٌۭ لَّكَ مِنَ ٱلْأُولَىٰ","Walal-aakhiratu khairul laka minal-oola","And the Hereafter is better for you than the first [life].","Воистину, будущее для тебя лучше, чем настоящее.","Ва, албатта, охират сен учун бу дунёдан яхшидир."],["وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰٓ","Wa la sawfa y'uteeka rabbuka fatarda","And your Lord is going to give you, and you will be satisfied.","Господь твой непременно одарит тебя, и ты будешь удовлетворен.","Ва тезда Роббинг сенга ато қиладир ва сен рози бўлурсан."],["أَلَمْ يَجِدْكَ يَتِيمًۭا فَـَٔاوَىٰ","Alam ya jidka yateeman fa aawaa","Did He not find you an orphan and give [you] refuge?","Разве Он не нашел тебя сиротой и не дал тебе приют?","У сени етим топиб, жойлаб қўймадими?"],["وَوَجَدَكَ ضَآلًّۭا فَهَدَىٰ","Wa wa jadaka daal lan fahada","And He found you lost and guided [you],","Он нашел тебя заблудшим и повел прямым путем.","Ва У сени ҳайрон топиб, ҳидоятга бошламадими?"],["وَوَجَدَكَ عَآئِلًۭا فَأَغْنَىٰ","Wa wa jadaka 'aa-ilan fa aghnaa","And He found you poor and made [you] self-sufficient.","Он нашел тебя бедным и обогатил.","Ва У сени камбағал топиб, бой қилмадими?"],["فَأَمَّا ٱلْيَتِيمَ فَلَا تَقْهَرْ","Fa am mal yateema fala taqhar","So as for the orphan, do not oppress [him].","Посему не притесняй сироту!","Аммо етимга қаҳр қилма."],["وَأَمَّا ٱلسَّآئِلَ فَلَا تَنْهَرْ","Wa am mas saa-ila fala tanhar","And as for the petitioner, do not repel [him].","И не гони просящего!","Ва, аммо, «соил»га зажр қилма."],["وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ","Wa amma bi ni'mati rabbika fahad dith","But as for the favor of your Lord, report [it].","И возвещай о милости своего Господа.","Ва, аммо, Роббингнинг берган неъмати ҳақида сўзла."]],"b":1,"type":"Meccan","w":[[["wal-ḍuḥā","By the morning brightness"]],[["wa-al-layli","And the night"],["idhā","when"],["sajā","it covers with darkness"]],[["mā","Not"],["waddaʿaka","has forsaken you"],["rabbuka","your Lord"],["wamā","and not"],["qalā","He is displeased"]],[["walalākhiratu","And surely the Hereafter"],["khayrun","(is) better"],["laka","for you"],["mina","than"],["l-ūlā","the first"]],[["walasawfa","And soon"],["yuʿ'ṭīka","will give you"],["rabbuka","your Lord"],["fatarḍā","then you will be satisfied"]],[["alam","Did not"],["yajid'ka","He find you"],["yatīman","an orphan"],["faāwā","and give shelter"]],[["wawajadaka","And He found you"],["ḍāllan","lost"],["fahadā","so He guided"]],[["wawajadaka","And He found you"],["ʿāilan","in need"],["fa-aghnā","so He made self-sufficient"]],[["fa-ammā","So as for"],["l-yatīma","the orphan"],["falā","then (do) not"],["taqhar","oppress"]],[["wa-ammā","And as for"],["l-sāila","one who asks"],["falā","then (do) not"],["tanhar","repel"]],[["wa-ammā","But as for"],["biniʿ'mati","(the) Favor"],["rabbika","(of) your Lord"],["faḥaddith","narrate"]]],"uzl":["Choshtgoh bilan qasam.","Sukunatga choʻmgan tun bilan qasam.","Robbing seni tark qilgani yoʻq, senga gʻazab ham qilgani yoʻq.","Va albatta, oxirat sen uchun bu dunyodan yaxshidir.","Va tezda Robbing senga ato qilur va sen rozi boʻlursan.","U seni yetim topib, joylab qoʻymadimi?","Va U seni hayron holda topib, hidoyatga boshlamadimi?","Va U seni kambagʻal holda topib, boy qilmadimi?","Ammo yetimga qahr qilmagin.","Va ammo, «soil»ga zajr qilma.","Va ammo Robbingning bergan ne'mati haqida soʻzla."],"t":[["Ваз-зуҳа","Ваз-зуҳа","Vaz-zuha"],["Вал-лайли иза сажа","Вал-лайли иза сажа","Val-layli iza saja"],["Ма ваддаъака роббука вама қола","Ма ваддаъака роббука вама қола","Ma vaddaʼaka robbuka vama qola"],["Валалахироту хойрун лака минал-ула","Валалахироту хойрун лака минал-ула","Valalaxirotu xoyrun laka minal-ula"],["Валасавфа юътийка роббука фатарзо","Валасавфа юътийка роббука фатарзо","Valasavfa yuʼtiyka robbuka fatarzo"],["Алам яжидка ятийман фаъава", ur breast?","Разве Мы не раскрыли для тебя грудь твою?","Сенинг кўксингни кенг қилиб қўймадикми?"],["وَوَضَعْنَا عَنكَ وِزْرَكَ","Wa wa d'ana 'anka wizrak","And We removed from you your burden","и не сняли с тебя ношу,","Ва сенинг юкингни енгиллатмадикми?"],["ٱلَّذِىٓ أَنقَضَ ظَهْرَكَ","Allazee anqada zahrak","Which had weighed upon your back","которая отягощала твою спину?","У сенинг елкангни босиб турган эди."],["وَرَفَعْنَا لَكَ ذِكْرَكَ","Wa raf 'ana laka zikrak","And raised high for you your repute.","Разве Мы не возвеличили для тебя славу твою?","Ва сенинг зикрингни юқори кўтардик."],["فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا","Fa inna ma'al usri yusra","For indeed, with hardship [will be] ease.","Воистину, за каждой тягостью наступает облегчение.","Бас, албатта, бир қийинчилик билан осончилик бордир."],["إِنَّ مَعَ ٱلْعُسْرِ يُسْرًۭا","Inna ma'al 'usri yusra","Indeed, with hardship [will be] ease.","За каждой тягостью наступает облегчение.","Албатта, бир қийинчилик билан осончилик бордир."],["فَإِذَا فَرَغْتَ فَٱنصَبْ","Fa iza faragh ta fansab","So when you have finished [your duties], then stand up [for worship].","Посему, как только освободишься, будь деятелен (как только освободишься от мирских дел, усердно поклоняйся Аллаху, или как только завершишь намаз, усердно взывай к Аллаху с молитвами)","Фориғ бўлсанг, ибодатига урингин."],["وَإِلَىٰ رَبِّكَ فَٱرْغَب","Wa ilaa rabbika far ghab","And to your Lord direct [your] longing.","и устремись к своему Господу.","Ва фақат Роббингга рағбат қил."]],"b":1,"type":"Meccan","w":[[["alam","Have not"],["nashraḥ","We expanded"],["laka","for you"],["ṣadraka","your breast"]],[["wawaḍaʿnā","And We removed"],["ʿanka","from you"],["wiz'raka","your burden"]],[["alladhī","Which"],["anqaḍa","weighed upon"],["ẓahraka","your back"]],[["warafaʿnā","And We raised high"],["laka","for you"],["dhik'raka","your reputation"]],[["fa-inna","So indeed"],["maʿa","with"],["l-ʿus'ri","the hardship"],["yus'ran","(is) ease"]],[["inna","Indeed"],["maʿa",
