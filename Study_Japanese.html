<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Study Japanese by Nasirova Samina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Mochiy+Pop+One&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: travel-poster game — sticky header, map-first home with a journey sidebar; each city opens as a stage page (scene band + four steps: explore, learn, game, exam). */
:root{
  --bg:#EAF0F7; --surface:#FFFFFF; --surface-2:#F4F7FC; --ink:#1A2142; --muted:#5A6388; --line:#D6DDEB;
  --red:#DE4236; --red-soft:#FBE2DF; --gold:#F2A93B; --gold-soft:#FDF0D8; --matcha:#4A9757; --matcha-soft:#E0F1E1; --sakura:#F393B6; --sakura-soft:#FDE6EF;
  --sea:#CFE2F2; --sea-line:#B2CFE8; --land:#E7F1D8; --land-edge:#83A96F;
  --sky-top:#BCDDF5; --sky-bot:#FCEDF3; --sil:#2E3866; --sil-2:#7F8FC2; --snow:#FFFFFF; --deer:#C88A50; --sand:#F4E1B0; --sauce:#6A3A22; --fuji:#5B7EC2; --broth:#F7D9A0;
  --on-accent:#FFFFFF; --on-gold:#1A2142; --mochi-ink:#1A2142;
  --shadow:0 1px 0 rgba(26,33,66,.05),0 10px 26px -14px rgba(26,33,66,.28);
  --f-display:"Unbounded","M PLUS Rounded 1c",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-kana:"Mochiy Pop One","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1230; --surface:#171E46; --surface-2:#1F2855; --ink:#EEF1FF; --muted:#A3AAD2; --line:#2C366F;
  --red:#FF6A5C; --red-soft:#43243F; --gold:#FFC04F; --gold-soft:#3B3338; --matcha:#77C57E; --matcha-soft:#1C3B3C; --sakura:#FF9DC2; --sakura-soft:#3C2553;
  --sea:#13204F; --sea-line:#1E2E69; --land:#244539; --land-edge:#4F8A6E;
  --sky-top:#18266A; --sky-bot:#3D2C66; --sil:#0B1030; --sil-2:#34408A; --snow:#DCE2FF; --deer:#B87C47; --sand:#6E5E46; --sauce:#3E2214; --fuji:#3A5598; --broth:#B9955A;
  --on-accent:#FFFFFF; --on-gold:#1A2142; --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1230; --surface:#171E46; --surface-2:#1F2855; --ink:#EEF1FF; --muted:#A3AAD2; --line:#2C366F;
  --red:#FF6A5C; --red-soft:#43243F; --gold:#FFC04F; --gold-soft:#3B3338; --matcha:#77C57E; --matcha-soft:#1C3B3C; --sakura:#FF9DC2; --sakura-soft:#3C2553;
  --sea:#13204F; --sea-line:#1E2E69; --land:#244539; --land-edge:#4F8A6E;
  --sky-top:#18266A; --sky-bot:#3D2C66; --sil:#0B1030; --sil-2:#34408A; --snow:#DCE2FF; --deer:#B87C47; --sand:#6E5E46; --sauce:#3E2214; --fuji:#3A5598; --broth:#B9955A;
  --on-accent:#FFFFFF; --on-gold:#1A2142; --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 28px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;background:none;border:0;padding:0;text-align:left}
.logo{width:44px;height:44px;flex:none;display:block}
.brand-txt{min-width:0}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:16px;line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
.brand-by{display:block;font-size:12px;color:var(--red);font-weight:700;white-space:nowrap;letter-spacing:.02em}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:8px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.nav button svg{width:18px;height:18px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--surface)}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;font-weight:800;font-size:12px;padding:5px 9px;border-radius:999px;color:var(--muted);cursor:pointer;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--on-accent)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:19px;height:19px}
.bottomnav{display:none}
@media (max-width:900px){
  .topbar .nav{display:none}
  .tools{margin-left:auto}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
  .bottomnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 2px;border-radius:12px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
  .bottomnav button svg{width:22px;height:22px}
  .bottomnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bottomnav button[aria-current="page"]{color:var(--red);background:var(--red-soft)}
  main{padding-bottom:84px}
}
@media (max-width:420px){.brand-name{font-size:13px}.brand-by{font-size:11px}.logo{width:38px;height:38px}.seg button{padding:5px 7px}}

/* shared */
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.h1{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3.4vw,32px);line-height:1.15;letter-spacing:-.02em}
.h2{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.25;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:6px;max-width:62ch}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;background:var(--red);color:var(--on-accent);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 55%,#000);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--red) 55%,#000)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.gold{background:var(--gold);color:var(--on-gold);box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:12px}
.back:hover{color:var(--ink)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:16px;height:16px;fill:var(--line)}
.stars svg.on{fill:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
@media (max-width:900px){.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
#petals{position:fixed;inset:0;pointer-events:none;z-index:55;width:100%;height:100%}

/* mascot */
.mochi-box{display:flex;gap:12px;align-items:flex-end}
.mochi{width:86px;height:auto;flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:500;box-shadow:var(--shadow);min-width:0;flex:1}
.bubble::before{content:"";position:absolute;left:-8px;bottom:18px;width:14px;height:14px;background:var(--surface);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble b{color:var(--red)}
.mochi .m-body{fill:var(--snow);stroke:var(--mochi-ink);stroke-width:2.5}
.mochi .m-ink{fill:var(--mochi-ink)}
.mochi .m-line{fill:none;stroke:var(--mochi-ink);stroke-width:2.2;stroke-linecap:round}

/* scene classes */
.c-red{fill:var(--red)}.c-gold{fill:var(--gold)}.c-sil{fill:var(--sil)}.c-sil2{fill:var(--sil-2)}.c-mat{fill:var(--matcha)}.c-sak{fill:var(--sakura)}.c-sea{fill:var(--sea-line)}.c-snow{fill:var(--snow)}.c-deer{fill:var(--deer)}.c-sand{fill:var(--sand)}.c-surf{fill:var(--surface)}.c-ink{fill:var(--mochi-ink)}.c-sauce{fill:var(--sauce)}.c-fuji{fill:var(--fuji)}.c-broth{fill:var(--broth)}
.st-sil{stroke:var(--sil);fill:none}.st-snow{stroke:var(--snow);fill:none}.st-gold{stroke:var(--gold);fill:none}.st-deer{stroke:var(--deer);fill:none}.st-sak{stroke:var(--sakura);fill:none}.st-muted{stroke:var(--muted);fill:none}
.scene{display:block;width:100%;height:auto;max-width:100%}

/* home / map */
.home{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.home{grid-template-columns:minmax(0,1fr)}}
.map-card{padding:20px;overflow:hidden}
.map-svg{display:block;width:100%;height:auto;margin-top:12px;border-radius:16px}
.m-sea{fill:var(--sea)}
.m-wave{fill:none;stroke:var(--sea-line);stroke-width:1.3}
.m-land{fill:var(--land);stroke:var(--land-edge);stroke-width:2;stroke-linejoin:round}
.m-isl{font-family:var(--f-kana);font-size:15px;fill:var(--land-edge)}
.m-sealbl{font-size:12px;font-weight:700;fill:var(--muted);letter-spacing:.18em;text-transform:uppercase}
.m-inset{fill:var(--sea);stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 5}
.m-insetlbl{font-size:11px;font-weight:700;fill:var(--muted)}
.m-route{fill:none;stroke:var(--muted);stroke-width:2.6;stroke-dasharray:1 8;stroke-linecap:round;opacity:.8}
.m-route.done{stroke:var(--red);stroke-dasharray:10 6;opacity:1}
.m-leader{stroke:var(--muted);stroke-width:1.2}
.m-dot{fill:var(--ink)}
.m-compass text{font:800 13px var(--f-display);fill:var(--muted)}
.pin{cursor:pointer;outline:none}
.pin .b{stroke:var(--surface);stroke-width:3}
.pin.done .b{fill:var(--red)}
.pin.cur .b{fill:var(--gold)}
.pin.lock .b{fill:var(--surface-2);stroke:var(--muted);stroke-width:2;stroke-dasharray:3 3}
.pin .n{font:800 13px var(--f-display);fill:var(--on-accent);text-anchor:middle;dominant-baseline:central}
.pin.cur .n{fill:var(--on-gold)}
.pin.lock .n{fill:var(--muted)}
.pin .lbl{font-weight:800;font-size:13px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4;stroke-linejoin:round}
.pin:hover .b,.pin:focus-visible .b{stroke:var(--ink)}
.pin .ring{fill:none;stroke:var(--gold);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(2);opacity:0}}
.pin .fujiic{fill:var(--on-accent)}
.pin.lock .fujiic{fill:var(--muted)}
.journey{display:grid;gap:16px;min-width:0}
.prog{padding:16px 18px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700}
.prog-top b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:999px}
.next{display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden}
.next .scene{border-bottom:1px solid var(--line)}
.next-body{padding:14px 18px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.next-name{font-family:var(--f-display);font-weight:800;font-size:20px}
.next-jp{font-family:var(--f-kana);color:var(--red);font-size:18px;margin-left:6px}
.route-list{list-style:none;margin:0;padding:6px;display:grid;gap:2px}
.route-list button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;background:none;border:0;border-radius:14px;padding:8px 10px;cursor:pointer;text-align:left}
.route-list button:hover{background:var(--surface-2)}
.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--f-display);background:var(--surface-2);color:var(--muted);border:2px dashed var(--line)}
.badge.done{background:var(--red);color:var(--on-accent);border:2px solid var(--red)}
.badge.cur{background:var(--gold);color:var(--on-gold);border:2px solid var(--gold)}
.rl-name{font-weight:800}
.rl-name small{font-family:var(--f-kana);font-weight:400;color:var(--muted);margin-left:6px;font-size:13px}
.rl-topic{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lockic{width:18px;height:18px;color:var(--muted)}

/* city */
.city-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);overflow:hidden}
.city-hero .scene{height:100%;object-fit:cover}
.city-id{padding:24px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.city-jp{font-family:var(--f-kana);font-size:clamp(44px,7vw,68px);color:var(--red);line-height:1.05}
.city-name{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.6vw,34px);line-height:1.1}
.topic{font-weight:700;color:var(--muted)}
.namemean{margin-top:8px;font-size:14px;background:var(--surface-2);border-radius:12px;padding:10px 12px;border:1px dashed var(--line)}
@media (max-width:760px){.city-hero{grid-template-columns:minmax(0,1fr)}}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-block:16px}
.step{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;font-size:14px;min-width:0}
.step span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--surface-2);color:var(--muted);flex:none;border:1px solid var(--line)}
.step.done .ck{background:var(--matcha);color:#fff;border-color:var(--matcha)}
.step[aria-current="step"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
@media (max-width:520px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.section{margin-top:22px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.facts{grid-template-columns:minmax(0,1fr)}}
.fact{padding:18px;display:grid;gap:10px;align-content:start}
.fact-tag{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.08em}
.fact-tag .jpt{font-family:var(--f-kana);color:var(--red);font-size:14px;letter-spacing:0}
.fact p{font-size:16px;font-weight:500}
.tipcard{margin-top:18px;padding:16px}
.kgrid-learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.kcard{aspect-ratio:1;max-width:100%;display:grid;place-items:center;align-content:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:16px;cursor:pointer;box-shadow:0 3px 0 var(--line);transition:transform .12s}
.kcard:hover{transform:translateY(-2px)}
.kcard .k{font-family:var(--f-kana);font-size:40px;line-height:1.1}
.kcard .r{font-weight:800;color:var(--red);font-size:14px;letter-spacing:.04em}
.kcard .m{font-size:11px;color:var(--muted)}
.pop{animation:popk .35s}
@keyframes popk{40%{transform:scale(1.1)}}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.wcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.wcard .e{font-size:32px;grid-row:span 3;line-height:1}
.wcard .w{font-family:var(--f-kana);font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.wcard .wr{font-size:13px;color:var(--red);font-weight:800}
.wcard .wm{font-size:14px;font-weight:700;color:var(--muted)}
.hint{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:6px}
.hint svg{width:16px;height:16px}

/* memory game */
.game{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
@media (max-width:760px){.game{grid-template-columns:minmax(0,1fr)}}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:540px}
.mc{position:relative;aspect-ratio:1;max-width:100%;border:0;background:none;padding:0;cursor:pointer;perspective:700px}
.mc .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mc.open .in,.mc.match .in{transform:rotateY(180deg)}
.mc .fc,.mc .bk{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.mc .bk{background:radial-gradient(circle at 50% 50%,var(--snow) 0 17%,transparent 18%),var(--red);box-shadow:0 3px 0 color-mix(in srgb,var(--red) 55%,#000)}
.mc .fc{transform:rotateY(180deg);background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:20px}
.mc .fc.k{font-family:var(--f-kana);font-weight:400;font-size:clamp(28px,6vw,40px)}
.mc.match .fc{background:var(--matcha-soft);border-color:var(--matcha)}
.gside{padding:18px;display:grid;gap:12px}
.gstat{display:flex;justify-content:space-between;font-weight:700}
.gstat b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.win{padding:14px;border-radius:14px;background:var(--matcha-soft);border:1px solid var(--matcha);font-weight:800}
.win.lose{background:var(--red-soft);border-color:var(--red)}
.btn.small{padding:7px 14px;font-size:13px}
/* games hub */

let AC=null;
function tone(ok){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const now=AC.currentTime;const notes=ok?[660,880]:[220,180];notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?"sine":"triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.11);g.gain.exponentialRampToValueAtTime(.18,now+i*.11+.02);g.gain.exponentialRampToValueAtTime(.0001,now+i*.11+.22);o.connect(g).connect(AC.destination);o.start(now+i*.11);o.stop(now+i*.11+.25)})}catch(e){}}
let toastT=0;function toast(m){const el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400)}
function petals(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cv=document.getElementById("petals");cv.hidden=false;const W=cv.width=innerWidth,H=cv.height=innerHeight,ctx=cv.getContext("2d");const cs=getComputedStyle(document.documentElement);const cols=[cs.getPropertyValue("--sakura"),cs.getPropertyValue("--red"),cs.getPropertyValue("--gold")];
 const P=Array.from({length:70},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,r:5+Math.random()*6,vy:1.5+Math.random()*2.5,vx:-1+Math.random()*2,a:Math.random()*6,va:-.1+Math.random()*.2,c:pick(cols)}));let f=0;
 (function step(){ctx.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx+Math.sin((f+p.a*20)/20);p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*.6,0,0,Math.PI*2);ctx.fill();ctx.restore()});f++;if(f<200)requestAnimationFrame(step);else{ctx.clearRect(0,0,W,H);cv.hidden=true}})()}

/* sakura catch */
function newCatch(c){const pool=itemsOf(c).filter(x=>x.t==="c");CG={city:c.id,pool,target:pick(pool),items:[],score:0,lives:3,over:false,won:false,started:false,next:0,id:0,last:0}}
function livesHTML(n){return "❤️".repeat(n)+"🤍".repeat(3-n)}
function catchHTML(){const g=CG;
 return `<p class="sub" style="margin-bottom:12px">${t("c_goal")}</p><div class="chud card"><span>${t("c_find")} <b class="ctarget" id="ctarget">${g.target.r}</b></span><span>${t("score")}: <b id="cscore">${g.score}</b> / 10</span><span id="clives" aria-label="${esc(t("lives"))}">${livesHTML(g.lives)}</span></div>
 <div class="carea" id="carea">${!g.started||g.over?`<div class="cover">${g.over?winBox(g.won?t("c_win"):t("c_lose"),!g.won):`<div style="font-size:56px">🌸</div>`}${g.won?"":`<button class="btn" style="margin-top:12px" data-a="cStart">${g.over?t("try_again"):t("start")}</button>`}</div>`:""}</div>`}
function startCatch(){cancelAnimationFrame(CRAF);CG.items=[];CG.last=performance.now();CG.next=0;CRAF=requestAnimationFrame(catchLoop)}
function catchLoop(now){const g=CG,area=document.getElementById("carea");if(!g||!area||g.over||!g.started)return;
 const dt=Math.min(.05,(now-g.last)/1000);g.last=now;const Hh=area.clientHeight;
 g.next-=dt;
 if(g.next<=0){g.next=Math.max(.5,1-g.score*.04);const it=(Math.random()<.4||!g.items.some(o=>o.it===g.target))?g.target:pick(g.pool);
  const el=document.createElement("button");el.className="petal";el.dataset.a="cHit";el.dataset.arg=++g.id;el.innerHTML=`<span lang="ja">${it.c}</span>`;el.style.left=(3+Math.random()*78)+"%";area.appendChild(el);
  g.items.push({id:g.id,it,y:-72,v:60+g.score*7+Math.random()*30,el,rot:Math.random()*40-20})}
 g.items=g.items.filter(o=>{o.y+=o.v*dt;if(o.y>Hh){o.el.remove();return false}o.el.style.transform=`translateY(${o.y.toFixed(1)}px) rotate(${o.rot}deg)`;return true});
 CRAF=requestAnimationFrame(catchLoop)}
function catchHit(id){const g=CG;if(!g||g.over)return;const o=g.items.find(x=>x.id===+id);if(!o)return;
 if(o.it===g.target){g.score++;tone(true);o.el.remove();g.items=g.items.filter(x=>x!==o);speak(o.it.say);
  const others=g.pool.filter(x=>x!==g.target);g.target=pick(others.length?others:g.pool);
  if(g.score>=10){g.over=g.won=true;stopGames();markGame(g.city,"catch");ghost("catch");return}
  document.getElementById("ctarget").textContent=g.target.r;document.getElementById("cscore").textContent=g.score}
 else{g.lives--;tone(false);o.el.classList.add("miss");setTimeout(()=>{o.el.remove()},250);g.items=g.items.filter(x=>x!==o);
  if(g.lives<=0){g.over=true;stopGames();ghost("catch");return}
  document.getElementById("clives").textContent=livesHTML(g.lives)}}

/* word builder */
function newBuild(c){const pool=[...new Set(c.words.flatMap(w=>[...w[0]]))];BG={city:c.id,words:shuffle(c.words).slice(0,5),i:0,pool,won:false};setupBuild()}
function setupBuild(){const ch=[...BG.words[BG.i][0]];const extra=shuffle(BG.pool.filter(x=>!ch.includes(x))).slice(0,Math.max(2,Math.min(3,7-ch.length)));BG.tiles=shuffle([...ch,...extra]).map(x=>({ch:x,used:false}));BG.slots=ch.map(()=>null);BG.state="play";BG.hint=false}
function buildHTML(){const g=BG;if(g.won)return `<div class="card build">${mochi()}${winBox(t("b_win"))}</div>`;
 const w=g.words[g.i];
 return `<p class="sub" style="margin-bottom:12px">${t("g_build_d")}</p><div class="card build ${g.state}"><div class="qbar" style="width:100%">${g.words.map((_,j)=>`<i class="${j<g.i?"ok":j===g.i?"cur":""}"></i>`).join("")}</div><div class="qcount">${t("b_word")} ${g.i+1} / ${g.words.length}</div><div class="bemoji">${w[5]}</div><div class="qtext">${esc(tr([w[2],w[3],w[4]]))}</div>
 ${g.hint?`<div class="qrom">${w[1]}</div>`:`<button class="btn ghost small" data-a="bHint">💡 ${t("b_hint")}</button>`}
 <div class="slots">${g.slots.map((s,i)=>`<button class="slot ${s!==null?"full":""}" data-a="bSlot" data-arg="${i}" lang="ja">${s!==null?g.tiles[s].ch:""}</button>`).join("")}</div>
 <div class="fbline">${g.state==="ok"?`<span class="fb ok">${t("correct")} ${w[0]} · ${w[1]}</span>`:g.state==="bad"?`<span class="fb bad">${t("b_wrong")}</span>`:""}</div>
 <div class="tiles">${g.tiles.map((x,i)=>`<button class="tile" data-a="bTile" data-arg="${i}" lang="ja" ${x.used||g.state!=="play"?"disabled":""}>${x.ch}</button>`).join("")}</div></div>`}
function bTile(i){const g=BG;if(!g||g.state!=="play"||g.tiles[i].used)return;const e=g.slots.indexOf(null);if(e<0)return;g.slots[e]=i;g.tiles[i].used=true;
 if(!g.slots.includes(null)){const w=g.words[g.i];if(g.slots.map(s=>g.tiles[s].ch).join("")===w[0]){g.state="ok";speak(w[0]);tone(true);
   setTimeout(()=>{if(BG!==g)return;g.i++;if(g.i>=g.words.length){g.won=true;markGame(g.city,"build")}else setupBuild();ghost("build")},1300)}
  else{g.state="bad";tone(false);setTimeout(()=>{if(BG!==g)return;g.slots=g.slots.map(()=>null);g.tiles.forEach(x=>x.used=false);g.state="play";ghost("build")},900)}}
 ghost("build")}

/* ninja speed */
function newNinja(c){NG={city:c.id,pool:itemsOf(c),time:30,score:0,run:false,over:false,won:false}}
function ninjaRound(){const g=NG,it=pick(g.pool);let r=it.r;if(Math.random()<.5){const o=shuffle(g.pool.filter(x=>x.t===it.t&&x.r!==it.r));if(o.length)r=o[0].r}g.cur={it,r,ok:r===it.r}}
function nPairHTML(){const c=NG.cur;return `<span class="nk ${[...c.it.c].length>2?"sm":""}" lang="ja">${c.it.c}</span><span class="neq">=</span><span class="nr">${c.r}</span>`}
function ninjaHTML(){const g=NG,best=st(g.city).nb||0;
 if(!g.run)return `<div class="card build"><div style="font-size:64px;line-height:1">🥷</div><p class="sub" style="margin:0 auto">${t("n_goal")}</p>${g.over?winBox(g.won?t("n_win",{n:g.score}):t("n_lose",{n:g.score}),!g.won):""}${best?`<p class="hint">${t("best")}: <b>${best}</b></p>`:""}${g.won?"":`<button class="btn gold" data-a="nStart">${g.over?t("try_again"):t("start")}</button>`}</div>`;
 return `<div class="card ninja"><div class="nhud"><span>${t("score")}: <b id="nscore">${g.score}</b> / 10</span><span>${t("n_time")}: <b id="ntime">${Math.ceil(g.time)}</b></span></div><div class="bar"><i id="nbar" style="width:${g.time/30*100}%"></i></div><div class="npair" id="npair">${nPairHTML()}</div><div class="nbtns"><button class="btn nyes" data-a="nAns" data-arg="1">✓ ${t("n_yes")}</button><button class="btn nno" data-a="nAns" data-arg="0">✗ ${t("n_no")}</button></div><p class="hint" style="justify-content:center">⌨ ← ✓ · ✗ →</p></div>`}
function startNinja(){clearInterval(NT);let last=performance.now();NT=setInterval(()=>{const g=NG,tm=document.getElementById("ntime");if(!g||!g.run||!tm){clearInterval(NT);return}const now=performance.now();g.time-=(now-last)/1000;last=now;if(g.time<=0){g.time=0;endNinja();return}tm.textContent=Math.ceil(g.time);document.getElementById("nbar").style.width=(g.time/30*100)+"%"},100)}
function endNinja(){const g=NG;clearInterval(NT);g.run=false;g.over=true;g.won=g.score>=10;const s=st(g.city);s.nb=Math.max(s.nb||0,g.score);save();if(g.won)markGame(g.city,"ninja");else tone(false);ghost("ninja")}
function nAns(yes){const g=NG;if(!g||!g.run)return;const right=yes===g.cur.ok;const box=document.getElementById("npair");
 if(right){g.score++;tone(true)}else{g.time=Math.max(0,g.time-3);tone(false)}
 ninjaRound();if(box){box.innerHTML=nPairHTML();box.classList.remove("ok","bad");void box.offsetWidth;box.classList.add(right?"ok":"bad")}
 const sc=document.getElementById("nscore");if(sc)sc.textContent=g.score}

/* exam */
function makeQ(it,pool){
 const same=()=>{let p=pool.filter(x=>x.t===it.t&&x!==it);if(p.length<3)p=ALL.filter(x=>x.t===it.t&&x!==it);return p};
 const kinds=it.t==="c"?["read","find"]:["mean","word"];if(canListen())kinds.push("listen");
 const k=pick(kinds);
 const keyOf={read:x=>x.r,find:x=>x.c,mean:x=>tr(x.m),word:x=>x.c,listen:x=>x.c}[k];
 const seen=new Set([keyOf(it)]),d=[];for(const x of shuffle(same())){const kk=keyOf(x);if(!seen.has(kk)){seen.add(kk);d.push(x)}if(d.length===3)break}
 const opts=shuffle([it,...d]).map(x=>({txt:esc(keyOf(x)),kana:k!=="read"&&k!=="mean",ok:x===it}));
 return {k,it,opts,ask:t({read:"q_read",find:"q_find",mean:"q_mean",word:"q_word",listen:"q_listen"}[k])};
}
function makeQs(pool,n){const ch=pool.filter(x=>x.t==="c"),wd=pool.filter(x=>x.t==="w");const nc=Math.min(ch.length,Math.ceil(n/2)),nw=Math.min(wd.length,n-nc);let p=[...shuffle(ch).slice(0,nc),...shuffle(wd).slice(0,nw)];if(p.length<n)p=p.concat(shuffle(pool).slice(0,n-p.length));return shuffle(p).map(it=>makeQ(it,pool))}
function startExam(scope,id){const pool=scope==="final"?ALL:itemsOf(CITY[id]);EX={scope,id,qs:makeQs(pool,scope==="final"?20:10),i:0,correct:0,picked:null,res:[],done:false};autoListen()}
function autoListen(){const q=EX&&EX.qs[EX.i];if(q&&q.k==="listen")setTimeout(()=>speak(q.it.say),250)}
function examHTML(){const E=EX;if(E.done)return resultHTML();const q=E.qs[E.i],n=E.qs.length;
 const bar=`<div class="qbar" aria-hidden="true">${E.qs.map((_,j)=>`<i class="${j<E.res.length?(E.res[j]?"ok":"bad"):j===E.i?"cur":""}"></i>`).join("")}</div>`;
 let pr="";
 if(q.k==="read")pr=`<div class="qbig kana" lang="ja">${q.it.c}</div>`;
 if(q.k==="find")pr=`<div class="qbig latin">${q.it.r}</div>`;
 if(q.k==="mean")pr=`<div><div class="qbig kana ${[...q.it.c].length>3?"sm":""}" lang="ja">${q.it.c}</div><div class="qrom">${q.it.r}</div></div>`;
 if(q.k==="word")pr=`<div><div class="qemoji">${q.it.e}</div><div class="qtext">${esc(tr(q.it.m))}</div></div>`;
 if(q.k==="listen")pr=`<button class="listen-big" data-a="say" data-arg="${q.it.say}">${I.sound}<span>${t("listen")}</span></button>`;
 const ans=E.picked!==null;
 const opts=q.opts.map((o,j)=>{let cl="opt"+(o.kana?" k":"");if(ans){if(o.ok)cl+=" ok";else if(j===E.picked)cl+=" bad";else cl+=" dim"}return `<button class="${cl}" data-a="ans" data-arg="${j}" ${ans?"disabled":""}>${o.txt}</button>`}).join("");
 const right=q.opts.find(o=>o.ok);
 const fb=ans?`<div class="fb ${q.opts[E.picked].ok?"ok":"bad"}">${q.opts[E.picked].ok?t("correct"):t("wrong")+" <b>"+right.txt+"</b>"}${q.k!=="find"&&q.k!=="read"?` <span style="color:var(--muted)">· ${q.it.r}</span>`:""}</div><button class="btn" data-a="next">${E.i===n-1?t("finish"):t("next")} →</button>`:"";
 return `<div class="card exam">${bar}<div class="qcount">${E.i+1} / ${n}</div><p class="qask">${q.ask}</p><div class="qprompt">${pr}</div><div class="opts">${opts}</div><div class="qfoot">${fb}</div></div>`}
function resultHTML(){const E=EX,pct=Math.round(E.correct/E.qs.length*100),pass=pct>=70,sn=pct===100?3:pct>=85?2:pct>=70?1:0,fin=E.scope==="final";
 const c=fin?null:CITY[E.id],nxt=c&&CITIES[c.i+1];
 const msg=pass?(fin?t("final_pass"):t("pass_msg",{city:tr(c.name)})):t("fail_msg");
 const btns=pass?(fin?`<button class="btn gold" data-a="nav" data-arg="cert">${t("open_cert")}</button>`:(nxt?`<button class="btn" data-a="city" data-arg="${nxt.id}">${t("next_city")}: ${tr(nxt.name)} →</button>`:`<button class="btn gold" data-a="nav" data-arg="final">${tr(FUJI.name)} →</button>`)+`<button class="btn ghost" data-a="nav" data-arg="map">${t("back_map")}</button>`)
  :`<button class="btn" data-a="${fin?"finalStart":"examStart"}">${t("try_again")}</button>${fin?"":`<button class="btn ghost" data-a="step" data-arg="learn">${t("s_learn")}</button>`}`;
 return `<div class="card exam result">${pass?`<div class="hanko anim" lang="ja">${fin?"合格":c.jp}</div>`:mochi()}<div class="pct">${pct}%</div>${stars(sn)}<p class="qask" style="max-width:40ch">${msg}</p><p class="hint">${E.correct} / ${E.qs.length}</p><div class="row" style="justify-content:center">${btns}</div></div>`}
function finishExam(){const E=EX;E.done=true;const pct=Math.round(E.correct/E.qs.length*100),sn=pct===100?3:pct>=85?2:pct>=70?1:0;
 if(E.scope==="city"){const s=st(E.id);s.att++;s.best=Math.max(s.best,pct);s.stars=Math.max(s.stars,sn);if(pct>=70){s.pass=1}}
 else{S.fin.att++;S.fin.best=Math.max(S.fin.best,pct);if(pct>=70)S.fin.passed=1}
 save();if(pct>=70){petals();tone(true)}}

function vFinal(){
 const np=nPassed(),open=np===10;
 let inner;
 if(!open)inner=`<div class="card intro">${mochi()}<p class="qask">${t("final_locked",{n:np})}</p><div class="bar" style="width:100%"><i style="width:${np*10}%"></i></div><button class="btn ghost" data-a="nav" data-arg="map">${t("back_map")}</button></div>`;
 else if(EX&&EX.scope==="final")inner=examHTML();
 else inner=`<div class="card intro"><p class="sub" style="margin:0">${t("final_sub")}</p>${S.fin.att?`<p class="hint">${t("best")}: <b>${S.fin.best}%</b></p>`:""}<div class="row"><button class="btn gold" data-a="finalStart">${t("start")}</button>${S.fin.passed?`<button class="btn ghost" data-a="nav" data-arg="cert">${t("open_cert")}</button>`:""}</div></div>`;
 return `<header class="card city-hero">${scene("fuji",tr(FUJI.name))}<div class="city-id"><span class="eyebrow">${t("nav_final")}</span><div class="city-jp" lang="ja">${FUJI.jp}</div><h1 class="city-name">${t("final_title")}</h1><div class="namemean"><b>${t("name_means")}:</b> ${tr(FUJI.nm)}</div></div></header>
 <div class="section facts">${FUJI.facts.map(f=>`<article class="card fact"><div class="fact-tag"><span class="jpt">豆知識</span>${t("fact")}</div><p>${tr(f)}</p></article>`).join("")}</div>
 <div class="section" id="exam-host">${inner}</div>`}

function vCert(){
 if(!S.fin.passed)return vFinal();
 const d=new Date().toLocaleDateString(S.lang==="uz"?"uz-Latn":S.lang);
 return `<button class="back" data-a="nav" data-arg="final">${I.back}${tr(FUJI.name)}</button>
 <div class="cert">${LOGO.replace('class="logo"','class="logo" style="width:64px;height:64px"')}<div class="ttl">${t("cert")}</div><div class="ttl-jp" lang="ja">修了証書</div>
 ${S.name?`<div class="who">${esc(S.name)}</div>`:`<div class="namefield"><input id="nm" type="text" maxlength="40" placeholder="${esc(t("your_name"))}" aria-label="${esc(t("your_name"))}"><button class="btn" data-a="setName">${t("save")}</button></div>`}
 <p class="sub" style="margin:0 auto">${t("cert_text")}</p><div class="course">Study Japanese by Nasirova Samina</div>
 <div class="meta"><span>${t("score")}: ${S.fin.best}%</span><span>${t("date")}: ${d}</span><span>${tr(U.lv)[4]}</span></div>
 <div class="hanko" lang="ja">合格</div>${S.name?`<button class="btn ghost" data-a="editName">${t("your_name")} ✎</button>`:""}</div>`}

function vAbc(){
 const H=AB.tab==="h",rows=H?HR:KR,vrows=H?HV:KV;
 const cell=(ch,r)=>{if(ch==="_")return `<span class="kcell kblank"></span>`;const cid=CHAR_CITY[ch],lr=cid&&passed(cid);return `<button class="kcell ${lr?"learned":""} ${AB.sel===ch?"sel":""}" data-a="abc" data-arg="${ch}"><span class="k">${ch}</span><span class="r">${r}</span></button>`};
 const grid=(rs,rm)=>`<div class="kgrid"><span></span>${["a","i","u","e","o"].map(v=>`<span class="hd">${v}</span>`).join("")}${rs.map((row,i)=>{const r=rm[i].split(" ");const cons=r[0]==="a"?"·":r[0]==="n"?"n":r.find(x=>x!=="_").replace(/[aiueo]$/,"");return `<span class="hd">${cons}</span>`+[...row].map((ch,j)=>cell(ch,r[j])).join("")}).join("")}</div>`;
 const sel=AB.sel,cid=CHAR_CITY[sel];
 return `<h1 class="h1">${t("abc_title")}</h1><p class="sub">${t("abc_sub")}</p>
 <div class="tabs" role="tablist"><button role="tab" aria-selected="${H}" data-a="abcTab" data-arg="h">${t("hira")}<span class="jp">ひらがな</span></button><button role="tab" aria-selected="${!H}" data-a="abcTab" data-arg="k">${t("kata")}<span class="jp">カタカナ</span></button></div>
 <div class="abc"><div class="card ktable"><h2 class="h2" style="margin-bottom:12px">${t("basic")}</h2>${grid(rows,RR)}<h2 class="h2" style="margin:22px 0 12px">${t("voiced")}</h2>${grid(vrows,RV)}<div class="legend"><span><i></i>${t("legend_learned")}</span></div></div>
 <aside class="card detail"><div class="big" lang="ja">${sel}</div><div class="rom">${R[sel]}</div><button class="btn gold" data-a="say" data-arg="${sel}">${I.sound.replace("<svg",'<svg width="20" height="20"')}${t("listen")}</button><div class="pair">${t("pair_of")}<span lang="ja">${PAIR[sel]||""}</span></div><p class="hint" style="justify-content:center">${cid?`${t("learned_in")}: <b>${tr(CITY[cid].name)}</b>`:t("not_in_course")}</p></aside></div>`}

function glossRows(){
 const q=GF.q.trim().toLowerCase();
 const rows=CITIES.flatMap(c=>c.words.map(w=>({c,w}))).filter(({c,w})=>(GF.city==="all"||c.id===GF.city)&&(!q||[w[0],w[1],w[2],w[3],w[4]].some(s=>s.toLowerCase().includes(q))));
 if(!rows.length)return `<div class="empty">${t("no_res")}</div>`;
 return rows.map(({c,w})=>`<div class="grow"><span class="e">${w[5]}</span><span class="w" lang="ja">${w[0]}<small>${w[1]}</small></span><span class="m">${esc(tr([w[2],w[3],w[4]]))}</span><span class="c">${tr(c.name)}</span><button class="icon-btn say" data-a="say" data-arg="${w[0]}" aria-label="${esc(t("listen"))}">${I.sound}</button></div>`).join("")}
function vGloss(){const total=CITIES.reduce((s,c)=>s+c.words.length,0);
 return `<h1 class="h1">${t("nav_gloss")}</h1><p class="sub">${t("gloss_sub")} ${t("words_count",{n:total})}.</p>
 <div class="gtools"><input class="search" id="gq" type="search" value="${esc(GF.q)}" placeholder="${esc(t("search"))}" aria-label="${esc(t("search"))}"><div class="chips">${[["all",t("all")],...CITIES.map(c=>[c.id,tr(c.name)])].map(x=>`<button class="chip" data-a="gcity" data-arg="${x[0]}" aria-pressed="${GF.city===x[0]}">${x[1]}</button>`).join("")}</div></div>
 <div class="card glist" id="glist">${glossRows()}</div>`}

function vStats(){
 const np=nPassed(),pc=CITIES.filter(c=>passed(c.id));
 const signs=pc.reduce((s,c)=>s+c.chars.length,0),words=pc.reduce((s,c)=>s+c.words.length,0),totS=CITIES.reduce((s,c)=>s+c.chars.length,0),totW=CITIES.reduce((s,c)=>s+c.words.length,0);
 const starsN=CITIES.reduce((s,c)=>s+(S.st[c.id]?S.st[c.id].stars:0),0);
 const acc=S.ans.t?Math.round(S.ans.c/S.ans.t*100)+"%":"—";
 const lvl=S.fin.passed?4:np>=8?3:np>=5?2:np>=2?1:0,names=tr(U.lv);
 const prog=Math.round((np+(S.fin.passed?1:0))/11*100),C=2*Math.PI*50;
 const bars=CITIES.map(c=>{const b=S.st[c.id]?S.st[c.id].best:0;return `<div class="brow"><span class="nm">${tr(c.name)}</span><span class="track"><i class="${b<70?"low":""}" style="width:${b}%"></i><span class="pass"></span></span><span class="val">${S.st[c.id]&&S.st[c.id].att?b+"%":"—"}</span></div>`}).join("");
 const pass=CITIES.concat([FUJI]).map(c=>{const on=c.id==="fuji"?S.fin.passed:passed(c.id);return `<div class="pstamp"><div class="hanko ${on?"":"off"}" lang="ja">${on?c.jp:"?"}</div>${tr(c.name)}</div>`}).join("");
 return `<h1 class="h1">${t("nav_stats")}</h1><div class="stats">
 <div class="card lvl"><svg class="ring" viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="50"/><circle class="pr" cx="60" cy="60" r="50" stroke-dasharray="${(C*prog/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 60 60)"/><text x="60" y="60">${prog}%</text></svg><div><div class="eyebrow">${t("level")}</div><div class="lvl-name">${names[lvl]}</div><div class="lvl-steps">${names.map((n,i)=>`<span class="${i<=lvl?"on":""}">${n}</span>`).join("")}</div></div></div>
 <div class="tiles"><div class="card tile"><div class="v">${np}<small> / 10</small></div><div class="l">${t("st_cities")}</div></div><div class="card tile"><div class="v">${signs}<small> / ${totS}</small></div><div class="l">${t("st_signs")}</div></div><div class="card tile"><div class="v">${words}<small> / ${totW}</small></div><div class="l">${t("st_words")}</div></div><div class="card tile"><div class="v">${acc}</div><div class="l">${t("st_acc")} · ${S.ans.t} ${t("answers")}</div></div></div>
 <div class="two"><div class="card panel"><div class="section-head" style="margin:0"><h2 class="h2">${t("chart")}</h2><span class="hint">${t("chart_note")}</span></div><div class="bars">${bars}</div><p class="hint" style="margin-top:12px">★ ${starsN} / 30 ${t("stars")}</p></div>
 <div class="card panel"><h2 class="h2">${t("passport")}</h2><p class="hint">${t("passport_sub")}</p><div class="passport">${pass}</div></div></div>
 <div class="card settings"><span style="font-weight:800">${t("sound")}</span><div class="seg"><button data-a="sound" data-arg="1" aria-pressed="${!!S.sound}">${t("on")}</button><button data-a="sound" data-arg="0" aria-pressed="${!S.sound}">${t("off")}</button></div></div>
 <div class="card settings">${RC?`<div class="confirm"><span>${t("reset_q")}</span><button class="btn" data-a="resetYes">${t("yes_reset")}</button><button class="btn ghost" data-a="resetNo">${t("cancel")}</button></div>`:`<span class="hint">${t("reset")}</span><button class="btn ghost" data-a="reset">${t("reset")}</button>`}</div></div>`}

/* ---------- render ---------- */
function effTheme(){return S.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}
function applyTheme(){if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme")}
function render(){document.documentElement.lang=S.lang;applyTheme();
 document.getElementById("top").innerHTML=header();document.getElementById("bnav").innerHTML=bottomnav();
 const m=document.getElementById("main");m.innerHTML=({map:vMap,city:vCity,abc:vAbc,gloss:vGloss,stats:vStats,final:vFinal,cert:vCert}[V.v]||vMap)();
 if(V.v==="city"&&V.step==="game"){if(V.game==="catch"&&CG&&CG.started&&!CG.over)startCatch();if(V.game==="ninja"&&NG&&NG.run)startNinja()}}
function go(v,x){stopGames();V=Object.assign({v},x||{});RC=false;render();try{window.scrollTo({top:0})}catch(e){}}
function rerenderExam(){const h=document.getElementById("exam-host");if(!h)return render();if(V.v==="final")render();else h.innerHTML=examHTML()}

const H={
 nav:a=>{if(a!=="final"&&a!=="cert"&&EX&&EX.scope==="final"&&!EX.done)EX=null;go(a)},
 city:a=>{const c=CITY[a];if(!unlocked(c.i)){toast(t("locked_msg"));return}if(EX&&!(EX.scope==="city"&&EX.id===a))EX=null;go("city",{id:a,step:"explore"})},
 game:a=>{stopGames();V.game=a||null;if(a==="mem")G=null;if(a==="catch")CG=null;if(a==="build")BG=null;if(a==="ninja")NG=null;render();try{document.querySelector(".steps").scrollIntoView({block:"start",behavior:"smooth"})}catch(e){}},
 cStart:()=>{newCatch(CITY[V.id]);CG.started=true;ghost("catch");startCatch()},
 cHit:a=>catchHit(a),
 bTile:a=>bTile(+a),
 bSlot:a=>{const g=BG,i=+a;if(!g||g.state!=="play"||g.slots[i]===null)return;g.tiles[g.slots[i]].used=false;g.slots[i]=null;ghost("build")},
 bHint:()=>{BG.hint=true;ghost("build")},
 nStart:()=>{newNinja(CITY[V.id]);NG.run=true;ninjaRound();ghost("ninja");startNinja()},
 nAns:a=>nAns(a==="1"),
 step:a=>{stopGames();if(a==="game")V.game=null;if(a!=="exam"&&EX&&EX.done)EX=null;V.step=a;render();try{document.querySelector(".steps").scrollIntoView({block:"start",behavior:"smooth"})}catch(e){}},
 lang:a=>{S.lang=a;save();if(EX&&!EX.done){EX.qs.forEach(q=>{q.ask=t({read:"q_read",find:"q_find",mean:"q_mean",word:"q_word",listen:"q_listen"}[q.k])})}render()},
 theme:()=>{S.theme=effTheme()==="dark"?"light":"dark";save();render()},
 sound:a=>{S.sound=a==="1";save();render()},
 say:(a,el)=>{speak(a);if(el){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}},
 learned:()=>{st(V.id).le=1;save();V.step="game";render()},
 flip:a=>{const i=+a;if(G.lock||G.won||G.matched.includes(i)||G.open.includes(i))return;G.open.push(i);if(G.cards[i].k)speak(G.cards[i].say);
  if(G.open.length===2){G.moves++;const[x,y]=G.open;if(G.cards[x].p===G.cards[y].p){G.matched.push(x,y);G.open=[];tone(true);if(G.matched.length===12){G.won=true;markGame(G.city,"mem");setTimeout(()=>ghost("mem"),700)}}else{G.lock=true;setTimeout(()=>{G.open=[];G.lock=false;updGame()},850)}}updGame()},
 gameReset:()=>{newGame(CITY[G.city]);render()},
 examStart:()=>{startExam("city",V.id);rerenderExam()},
 finalStart:()=>{startExam("final");render()},
 ans:a=>{const E=EX;if(E.picked!==null)return;E.picked=+a;const ok=E.qs[E.i].opts[E.picked].ok;E.res.push(ok);if(ok)E.correct++;S.ans.t++;if(ok)S.ans.c++;save();tone(ok);rerenderExam()},
 next:()=>{const E=EX;if(E.i===E.qs.length-1){finishExam();render()}else{E.i++;E.picked=null;rerenderExam();autoListen()}},
 abcTab:a=>{AB.tab=a;AB.sel=PAIR[AB.sel]&&((a==="k")!==/[ァ-ヶ]/.test(AB.sel))?PAIR[AB.sel]:AB.sel;render()},
 abc:a=>{AB.sel=a;speak(a);render()},
 gcity:a=>{GF.city=a;render()},
 reset:()=>{RC=true;render()},resetNo:()=>{RC=false;render()},
 resetYes:()=>{const keep={lang:S.lang,theme:S.theme,sound:S.sound};S=Object.assign(fresh(),keep);EX=null;G=null;RC=false;save();toast(t("reset_done"));render()},
 setName:()=>{const v=(document.getElementById("nm").value||"").trim();if(!v)return;S.name=v;save();render()},
 editName:()=>{S.name="";save();render()}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const f=H[el.dataset.a];if(f){e.preventDefault();f(el.dataset.arg,el)}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("g[data-a]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
 if(e.key==="Enter"&&e.target.id==="nm")H.setName();
 if(V.game==="ninja"&&NG&&NG.run&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){e.preventDefault();nAns(e.key==="ArrowLeft")}});
document.addEventListener("input",e=>{if(e.target.id==="gq"){GF.q=e.target.value;const l=document.getElementById("glist");if(l)l.innerHTML=glossRows()}});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(!S.theme)render()})}catch(e){}
render();
})();
</script>

</body></html>
